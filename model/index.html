<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鳶來港・3D 模型預覽</title>
<!-- Meshy 匯出的 GLB 預覽（測試用，不對外）：?src=模型網址，或按「選擇 GLB」用手機／電腦裡的檔案 -->
<style>
:root{--ink:#10293D;--sea1:#36B3CC;--sea2:#0E3E5C}
html,body{margin:0;height:100%;background:var(--sea2);color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
#v{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
.top h1{margin:0 auto 0 0;font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.b{min-height:38px;padding:0 14px;border-radius:999px;border:2px solid #fff;background:rgba(10,34,54,.6);color:#fff;font:inherit;font-weight:800;font-size:14px;display:inline-flex;align-items:center;cursor:pointer}
.b[aria-pressed=true]{background:#4FBF88;color:var(--ink);border-color:#4FBF88}
.info{position:fixed;left:12px;right:12px;bottom:12px;z-index:2;background:rgba(10,34,54,.75);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.6}
.info b{font-size:14px}.ok{color:#7DFFB0}.warn{color:#FFD66B}.bad{color:#FF8A7A}
.drop[hidden]{display:none}.drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:16px;font-weight:700;pointer-events:none;opacity:.85}
</style>
<script type="importmap">{ "imports": { "three": "../shared/vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="v"></canvas>
<div class="top"><h1>🦈 3D 模型預覽</h1>
  <label class="b">📂 選擇 GLB<input type="file" id="f" accept=".glb,.gltf,model/gltf-binary" hidden></label>
  <button class="b" id="swim" type="button" aria-pressed="true">游動</button>
  <button class="b" id="spin" type="button" aria-pressed="true">自動轉</button>
  <button class="b" id="bg" type="button">換背景</button>
</div>
<div class="drop" id="drop">按右上「選擇 GLB」<br>選 Meshy 匯出的 .glb 檔<br><small style="font-weight:400">（只在這支手機／電腦上看，不會上傳）</small></div>
<div class="info" id="info" hidden></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../shared/vendor/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from '../shared/vendor/jsm/controls/OrbitControls.js';
const $ = (id) => document.getElementById(id), cv = $('v');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
const S = new THREE.Scene(), BG = ['#1E6E8E', '#0E3E5C', '#F2EEE4'], cam = new THREE.PerspectiveCamera(40, 1, 0.01, 100); let bgi = 0; S.background = new THREE.Color(BG[0]);
S.add(new THREE.HemisphereLight('#CFF3FF', '#3A5A6A', 1.6)); const sun = new THREE.DirectionalLight('#ffffff', 1.8); sun.position.set(2, 4, 3); S.add(sun);
const ctl = new OrbitControls(cam, cv); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 1.2;
let root = null, mats = [], swim = true, t0 = performance.now();
const uT = { value: 0 }, uAmp = { value: 1 }, uLen = { value: 1 }, uMin = { value: -0.5 };
/* 游動：不用骨架，沿身體長軸做左右波動（頭幾乎不動、尾巴擺最大）。模型頭朝 +X 或 −X 都行，按長軸自動判斷 */
function addSwim(m, axis) {
  m.onBeforeCompile = (sh) => { Object.assign(sh.uniforms, { uT, uAmp, uLen, uMin });
    sh.vertexShader = 'uniform float uT,uAmp,uLen,uMin;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      float a = ${axis === 'x' ? 'position.x' : 'position.z'}; float u = clamp((a - uMin) / uLen, 0.0, 1.0); float w = pow(1.0 - u, 2.0) * uAmp;
      ${axis === 'x' ? 'transformed.z' : 'transformed.x'} += sin(uT * 5.0 - u * 6.0) * w * uLen * 0.06;`); };
  m.needsUpdate = true;
}
function fmt(n) { return n.toLocaleString(); }
async function load(url, bytes, name) {
  $('drop').hidden = true; $('info').hidden = false; $('info').innerHTML = '讀取中…';
  if (root) { S.remove(root); root = null; }
  try {
    const g = await new GLTFLoader().loadAsync(url); root = g.scene;
    let tri = 0, mesh = 0, tex = new Map();
    root.traverse((o) => { if (o.isMesh) { mesh++; const gi = o.geometry; tri += (gi.index ? gi.index.count : gi.attributes.position.count) / 3; [].concat(o.material).forEach((m) => { ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'].forEach((k) => { if (m[k] && m[k].image) tex.set(m[k].uuid, m[k].image.width + '×' + m[k].image.height); }); }); } });
    const box = new THREE.Box3().setFromObject(root), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3()), k = 2 / Math.max(sz.x, sz.y, sz.z);
    root.position.sub(c).multiplyScalar(k); root.scale.setScalar(k); const wrap = new THREE.Group(); wrap.add(root); S.add(wrap); root = wrap;
    const axis = sz.x >= sz.z ? 'x' : 'z', len = axis === 'x' ? sz.x : sz.z, mn = axis === 'x' ? box.min.x : box.min.z;
    uLen.value = len; uMin.value = mn;
    root.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => addSwim(m, axis)); });
    const d = 1.25 / (Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * Math.min(1, cam.aspect)); cam.position.set(0, d * 0.25, d); ctl.target.set(0, -0.45, 0); ctl.update();      // 下方有資訊框，模型往上放
    const mb = bytes ? bytes / 1048576 : null, triC = tri <= 30000 ? 'ok' : tri <= 80000 ? 'warn' : 'bad', mbC = mb == null ? '' : mb <= 5 ? 'ok' : mb <= 12 ? 'warn' : 'bad';
    $('info').innerHTML = '<b>' + (name || '模型') + '</b><br>三角面 <span class="' + triC + '">' + fmt(Math.round(tri)) + '</span>（手機建議 3 萬以內）・網格 ' + mesh + ' 個' + (mb != null ? '・檔案 <span class="' + mbC + '">' + mb.toFixed(1) + ' MB</span>（建議 5 MB 內）' : '') + '<br>貼圖 ' + (tex.size ? [...tex.values()].join('、') : '沒有') + '・長寬高比 ' + [sz.x, sz.y, sz.z].map((v) => (v * k).toFixed(2)).join('：') + '・身體長軸 ' + axis.toUpperCase() + (g.animations.length ? '・內建動畫 ' + g.animations.length + ' 段' : '') + '<br><small>拖曳旋轉、兩指縮放；「游動」是程式做的擺尾（遊戲裡也會用同一種方式）</small>';
  } catch (e) { $('info').innerHTML = '<span class="bad">讀不到這個檔案：' + (e && e.message || e) + '</span><br>請確認是 Meshy 匯出的 .glb'; }
}
$('f').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const u = URL.createObjectURL(f); load(u, f.size, f.name).finally(() => setTimeout(() => URL.revokeObjectURL(u), 5000)); };
$('swim').onclick = function () { swim = !swim; this.setAttribute('aria-pressed', swim); };
$('spin').onclick = function () { ctl.autoRotate = !ctl.autoRotate; this.setAttribute('aria-pressed', ctl.autoRotate); };
$('bg').onclick = () => { bgi = (bgi + 1) % BG.length; S.background = new THREE.Color(BG[bgi]); };
const src = new URLSearchParams(location.search).get('src');
if (src) fetch(src).then((r) => r.blob()).then((b) => load(URL.createObjectURL(b), b.size, src.split('/').pop())).catch(() => load(src, 0, src.split('/').pop()));
function size() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); } addEventListener('resize', size); size();
R.setAnimationLoop(() => { const t = (performance.now() - t0) / 1000; uT.value = t; uAmp.value += ((swim ? 1 : 0) - uAmp.value) * 0.08; ctl.update(); R.render(S, cam); });
window.__model = { load };
</script>
</body>
</html>
