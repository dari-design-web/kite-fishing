<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鳶去旅行</title>
<style>
:root{--paper:#F4EFE6;--card:#FFFDF8;--ink:#4A3426;--muted:#8A7565;--teal:#2F7F86;--teal2:#D9ECEA;--gold:#E8B879;--line:#E2D6C6;--red:#C9473A;--display:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2A1E16;color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--paper);position:relative;overflow:hidden}
/* v0.6：整支手機一個畫面。每個畫面佔滿高度；選單類畫面在自己裡面捲動 */
.screen{position:absolute;inset:0;z-index:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.screen header{position:sticky;top:0;z-index:3;background:var(--paper);padding-top:calc(14px + env(safe-area-inset-top,0px))}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
header h1{font-size:20px;margin:0;flex:1}
.back{border:0;background:none;font-size:15px;color:var(--teal);padding:6px 4px;font-weight:700}
.chip{display:block;margin:4px 16px 10px;padding:8px 12px;border-radius:12px;background:var(--teal2);color:#21585D;font-size:14px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:700;background:var(--teal);color:#fff;font-family:inherit}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.gold{background:var(--gold);color:var(--ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pad{padding:0 16px}
.muted{color:var(--muted);font-size:13px}
.screen{display:none}
.screen.on{display:block}
#home.on{display:flex}
/* 小屋 */
.roomview{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:#3E2B1D}
.roomview::-webkit-scrollbar{display:none}
/* v0.14：小屋放大（Dari 00:31）。舞台高度由 fitRoom() 算，寬度跟著底圖比例；比手機寬時可以左右滑，鏡頭會跟著小鳶 */
.room{position:relative;width:100%;aspect-ratio:1080/1350;overflow:hidden;margin:0 auto;background:#EADFCB url(assets/room_living.jpg) center/100% 100% no-repeat}
.room.ph{background:var(--ph-bg)}
/* v0.18（C-87）：換房間淡入、房間裡飄著小光點（臥室是星星），讓畫面不要太死 */
.room.swap{animation:roomin .3s ease-out both}
@keyframes roomin{from{opacity:.55}}      /* C-91：換房只做短淡入，不再整房變亮放大（避免和小鳶跳一下疊在一起） */
.motes{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.motes i{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,246,214,.85);box-shadow:0 0 6px 2px rgba(255,236,170,.55);animation:mote linear infinite;opacity:0}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.7}100%{transform:translate(var(--dx),-90px);opacity:0}}
.motes.star i{width:7px;height:7px;border-radius:0;background:none;box-shadow:none;animation:twinkle ease-in-out infinite}
.motes.star i::before{content:'✦';position:absolute;left:-3px;top:-6px;font-size:13px;font-style:normal;color:#FFF4C2;text-shadow:0 0 6px #FFE9A0}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.room.swap,.motes i{animation:none}}
.room .props{position:absolute;inset:0;pointer-events:none}
.room .props i{position:absolute;font-style:normal;line-height:1;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.room .phtag{position:absolute;right:8px;bottom:8px;z-index:140;font-size:11px;color:#fff;background:rgba(43,58,64,.7);border-radius:999px;padding:2px 9px;pointer-events:none}
.bird .acc{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.scenes{display:flex;gap:6px}
.scenes button{flex:1;min-width:0;border:0;border-radius:12px;padding:5px 0 4px;background:rgba(255,247,234,.16);color:#FFF4E2;font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.scenes button span{font-size:19px;line-height:1.1}
.scenes button[aria-pressed="true"]{background:#FFF7EA;color:var(--ink);box-shadow:0 3px 0 #C9A57E}
.swipehint{position:absolute;top:50%;z-index:140;transform:translateY(-50%);width:26px;height:44px;border-radius:13px;background:rgba(43,58,64,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .4s}
.swipehint.l{left:6px}.swipehint.r{right:6px}
.swipehint.off{opacity:0}
/* 位置照 ChatGPT 小屋置入位置_v1.json（1080×990 底圖換算成百分比）；底圖的空掛位、空架只是背景，實際收藏由玩家資料放上去 */
.wallhit{position:absolute;left:45.8%;top:24%;width:37.2%;height:6.7%;cursor:pointer}      /* v0.15：位置照 G-47 房間置入位置_G47_v1.json（1080×1350，百分比） */
.wallcards span{position:absolute;top:25.5%;width:9.4%;height:4.4%;border-radius:2px;background-size:cover;background-position:center;box-shadow:0 1px 3px rgba(0,0,0,.3);border:1.5px solid #FFFDF8;transform:rotate(-3deg)}
.wallcards span:nth-child(2){transform:rotate(2deg)}
.shelfhit{position:absolute;left:1.4%;top:45%;width:30%;height:18.5%;cursor:pointer}
.shelfitems img{position:absolute;width:5.93%;height:4.74%;object-fit:contain;transform:translate(-50%,-50%)}      /* 三格改成左邊上下排（G-47） */
.bird{position:absolute;left:35.2%;top:55.6%;width:34%;aspect-ratio:1;background:center/contain no-repeat;cursor:pointer;z-index:2;transform-origin:50% 92%;will-change:left,top,transform}
/* v0.7：小鳶在屋裡生活。位置與動作由程式（PET）每一格更新 */
.emote{position:absolute;width:10.5%;aspect-ratio:1;z-index:120;pointer-events:none;transform:translate(-50%,-100%);animation:pop .35s ease-out}
.emote svg{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
@keyframes pop{0%{transform:translate(-50%,-60%) scale(.3);opacity:0}70%{transform:translate(-50%,-105%) scale(1.15);opacity:1}100%{transform:translate(-50%,-100%) scale(1)}}
.emote.float{animation:pop .35s ease-out,drift 1.6s ease-in .35s forwards}
@keyframes drift{to{transform:translate(-50%,-180%);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
.room.night::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 18%,rgba(255,200,120,.28),rgba(255,200,120,0) 38%),linear-gradient(rgba(16,22,58,.22),rgba(16,22,58,.3))}
.getfish{display:block;margin-top:6px;padding:10px 12px;border-radius:14px;border:2px dashed #3F8FB8;background:#EAF5FA;color:#1D4E66;text-decoration:none;font-size:14px;line-height:1.5}
.getfish b{color:#1D6A88}.getfish small{display:block;font-size:12px;color:#4F6F80}
.note .trip{display:block;margin-top:6px;font-size:12.5px;color:#6B5434}
.note .trip i{display:block;position:relative;height:8px;margin:4px 0 2px;border-radius:99px;background:repeating-linear-gradient(90deg,#E5D49B 0 6px,transparent 6px 10px)}
.note .trip i b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#F0A35E}
.note .trip i em{position:absolute;top:50%;width:24px;height:24px;margin:-14px 0 0 -12px;background:url(assets/kite_pack.png) center/contain no-repeat}
.note{z-index:3;position:absolute;left:50%;bottom:9%;transform:translateX(-50%) rotate(-3deg);width:56%;padding:10px 12px;background:#FFF8D9;border:1.5px solid #E5D49B;box-shadow:0 3px 8px rgba(0,0,0,.12);font-size:14px;line-height:1.5}
.envelope{position:absolute;z-index:100;left:69.4%;top:76.8%;width:22.2%;height:16.2%;background:url(assets/letter_seal.png) center/contain no-repeat,url(assets/letter_env.png) center/contain no-repeat;animation:bob 1.6s infinite;cursor:pointer}
.say{position:absolute;width:62%;text-align:center;pointer-events:none;z-index:130;transform:translate(-50%,-100%);transition:opacity .25s}
.say.off{opacity:0}
.say .bubble{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.say .bubble::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
#home{flex-direction:column;overflow:hidden;padding:0;background:linear-gradient(#5A3F2A,#3E2B1D)}
.hud{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;color:#FFF4E2}
.hud h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.hud h1 small{font-size:12px;font-weight:400;opacity:.7;margin-left:6px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,248,236,.14);border:1px solid rgba(255,248,236,.25);border-radius:999px;padding:3px 9px 3px 4px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill img{width:20px;height:20px;object-fit:contain}
.gear{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:28px;border:1px solid rgba(255,248,236,.35);background:rgba(255,248,236,.1);color:#FFF4E2;border-radius:999px;font:inherit;font-size:12px;padding:4px 10px}
.roomwrap{position:relative;flex:none;isolation:isolate}      /* v0.8：小鳶、對話、圖示的層級只在小屋裡比，不會蓋過拆信畫面 */
.roomwrap .chip{position:absolute;left:10px;right:10px;top:8px;margin:0;z-index:3;background:rgba(255,253,248,.92);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px;text-align:center}
.floor{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#9C6B45,#7A5134);box-shadow:inset 0 6px 10px rgba(0,0,0,.25)}
.floor>*{flex:none}
.floor .btn{box-shadow:0 4px 0 #1F5A5F;font-size:17px;padding:12px}
.floor .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1F5A5F}
.weekly{display:flex;align-items:center;gap:8px;background:rgba(255,247,234,.14);border:1px dashed rgba(255,247,234,.45);border-radius:12px;padding:5px 9px;color:#FFF4E2;font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden}
.weekly span{overflow:hidden;text-overflow:ellipsis}
.weekly img{width:42px;height:27px;object-fit:cover;border-radius:4px;border:2px solid #FFF7EA;flex:none}
.weekly b{color:#FFE2A8}
.weekly[hidden]{display:none}
.iconrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ibtn{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;border-radius:14px;padding:6px 4px 5px;background:#FFF7EA;color:var(--ink);font:inherit;font-size:13px;font-weight:700;box-shadow:0 3px 0 #C9A57E}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #C9A57E}
.ibtn img{width:32px;height:32px;object-fit:contain}
.ibtn small{font-size:12px;font-weight:400;color:var(--muted)}
.quickback{position:absolute;right:10px;bottom:10px;z-index:150;border:0;border-radius:999px;background:#2B3A40;color:#fff;font:inherit;font-size:12px;padding:6px 12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.devsheet{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(30,40,44,.55);z-index:45;display:flex;align-items:flex-end}
.devsheet .dev{margin:0;width:100%;background:var(--paper);border:0;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:70%;overflow:auto}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px}
.stats{display:flex;gap:8px;margin:10px 16px 0;flex-wrap:wrap}
.stats span{font-size:12px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px}
/* 打包 */
.slots{display:flex;gap:10px;margin:6px 16px 12px}
.slot.pop{animation:slotpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes slotpop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:none}}      /* v0.31（C-182） */
.slot{flex:1;height:96px;border:2px dashed var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;text-align:center;padding:4px}
.slot.filled{border-style:solid;border-color:var(--teal)}
.slot b{font-size:12px;color:var(--muted);font-weight:400}
h3{font-size:15px;margin:14px 16px 6px}
.list{display:flex;flex-direction:column;gap:8px;margin:0 16px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;font-family:inherit;color:inherit;width:100%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#EEF7F6}
.opt:disabled{opacity:.5}
.opt .ic{width:44px;height:44px;flex:none}
.opt .tx{flex:1;font-size:14px;line-height:1.4}
.opt .tx small{display:block;color:var(--muted);font-size:12px}
.opt .n{font-weight:700;font-size:14px}
.gobar{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(244,239,230,0),var(--paper) 30%);margin-top:6px}
.dest{margin:10px 16px;padding:10px 12px;border-radius:12px;background:#FFF8D9;font-size:13px;line-height:1.55}
/* 出門 */
.depart{position:fixed;inset:0;max-width:430px;margin:0 auto;background:linear-gradient(180deg,#BFE6F2 0,#E7F5F4 58%,#8CCFD6 59%,#4FA9B8 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:30;overflow:hidden;animation:dfade .25s ease-out both}
.depart.out{animation:dout .25s ease-in forwards}
@keyframes dfade{from{opacity:0}}
@keyframes dout{to{opacity:0}}
/* v0.20（C-97，C-88 ③）：出門＝先回頭揮手，再背包飛走、留下一串小虛線；回家＝從遠方飛回來落地、拿著信 */
.depart .cl{position:absolute;height:16px;border-radius:999px;background:#fff;opacity:.9;animation:dcl 3s linear infinite}
.depart .cl::before{content:'';position:absolute;left:22%;top:-9px;width:46%;height:20px;border-radius:999px;background:#fff}
@keyframes dcl{from{transform:translateX(120px)}to{transform:translateX(-180px)}}
.depart .bird2{width:170px;height:170px;background:url(assets/kite_wave.png) center/contain no-repeat;animation:wavehi .5s ease-in-out 2}
.depart .bird2.go{background-image:url(assets/kite_pack.png);animation:fly 1.3s ease-in forwards}
.depart .bird2.come{background-image:url(assets/kite_back.png);animation:land 1.4s cubic-bezier(.25,.8,.35,1) both}
.depart .trail{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -10px;pointer-events:none;opacity:0}
.depart .trail path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12}
.depart .bird2.go ~ .trail{animation:trail 1.3s ease-out .15s forwards}
.depart p{position:relative;z-index:1}
@keyframes wavehi{50%{transform:rotate(-6deg) translateY(-4px)}}
@keyframes fly{0%{transform:translate(0,0) scale(1)}25%{transform:translate(-10px,6px) scale(1.04)}100%{transform:translate(260px,-300px) scale(.35);opacity:0}}
@keyframes land{0%{transform:translate(240px,-320px) scale(.35);opacity:0}20%{opacity:1}80%{transform:translate(0,6px) scale(1.04)}100%{transform:none}}
@keyframes trail{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.depart,.depart .bird2,.depart .cl,.depart .trail{animation:none!important}}
/* 拆信 */
.letter{position:fixed;inset:0;max-width:430px;margin:0 auto;background:#2B3A40;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.letter .skip{position:absolute;right:14px;top:14px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-family:inherit}
.env{width:min(300px,80vw);aspect-ratio:3/2;position:relative;cursor:pointer;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.env img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .16s,transform .35s}
.env .seal{transform:translateY(1.25%);transform-origin:50% 68%}      /* 蠟封往下約 6px（720 寬時），正壓信封尖端 */
.env .opened{opacity:0}
.env.open .seal{transform:translateY(1.25%) scale(.6);opacity:0}
.env.open .closed{opacity:0;transition-delay:.4s}      /* 先讓打開的信封淡入，再收掉閉合的，避免中間變透明 */
.env.open .opened{opacity:1;transition-delay:.25s}
.tapme{color:#fff;margin-top:16px;font-size:15px}
.pc{width:min(340px,86vw);aspect-ratio:8/5;perspective:900px;margin-top:6px}
.pc .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.pc.flip .in{transform:rotateY(180deg)}
.pc .front,.pc .backside{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:6px solid #FFFDF8;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.pc .backside{transform:rotateY(180deg);background:#FFFDF8;padding:14px 16px;font-size:14px;line-height:1.7;color:var(--ink)}
.pc .backside .stampbox{position:absolute;right:12px;top:10px;width:46px;height:54px;border:2px dashed #D9C9B2;border-radius:4px;background:url(assets/kite_home.png) center/90% no-repeat}
.pc .backside .to{position:absolute;left:16px;bottom:12px;right:16px;border-top:1.5px solid #E2D6C6;padding-top:6px;font-size:12px;color:var(--muted)}
.slideup{animation:slideup .7s ease-out}
/* D103：路上撿到的點數、券的翻出動畫 */
.gift{position:relative;width:min(320px,84vw);margin:0 auto;padding:26px 16px 20px;border-radius:22px;background:#FFFDF8;color:#2B3A40;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:giftin .8s cubic-bezier(.2,1.4,.4,1) both;overflow:hidden}
.gift b{display:block;font-size:22px;margin-top:8px}.gift small{display:block;font-size:13px;color:#6B7F86;margin-top:6px;line-height:1.5}
.gift.gpts img,.gift .coinf{width:110px;height:110px;display:block;margin:0 auto;font-size:90px;line-height:110px;animation:coinspin 1.2s ease-out .2s both}
.gift.gpts b{font-size:54px;color:#E2702A;display:inline-block;margin-right:4px}.gift.gpts span{font-size:20px;font-weight:800}
.gift .gface{display:flex;justify-content:center;animation:cpflip .9s ease-out .15s both;transform-origin:center}
.gift .burst{position:absolute;inset:-40%;background:conic-gradient(from 0deg,rgba(255,206,84,.0),rgba(255,206,84,.35),rgba(255,206,84,0) 20%,rgba(255,206,84,.35) 30%,rgba(255,206,84,0) 40%,rgba(255,206,84,.35) 55%,rgba(255,206,84,0) 65%,rgba(255,206,84,.35) 80%,rgba(255,206,84,0));animation:burst 8s linear infinite;z-index:-1}
.gift>*:not(.burst){position:relative}
@keyframes giftin{from{transform:translateY(80px) scale(.6);opacity:0}}
@keyframes coinspin{from{transform:rotateY(720deg) scale(.3)}}
@keyframes cpflip{from{transform:rotateX(90deg) scale(.6);opacity:0}}
@keyframes burst{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gift,.gift *{animation:none!important}}
@keyframes slideup{from{transform:translateY(60px);opacity:0}}
.letter .cap{color:#fff;text-align:center;margin:14px 0 10px;font-size:16px;font-weight:700}
.letter .row{width:min(340px,86vw)}
.extra{color:#FFE6A8;font-size:14px;margin-top:8px;text-align:center;line-height:1.6}
/* 明信片畫面（佔位） */
.scene{width:100%;height:100%;position:relative;background-size:cover;background-position:center}
.scene .ttl{position:absolute;left:10px;top:8px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.scene .tmp{position:absolute;right:8px;top:8px;font-size:10px;background:rgba(255,255,255,.8);border-radius:999px;padding:1px 7px;color:var(--ink)}
.scene .kb{position:absolute;bottom:4%;width:15%;aspect-ratio:1;background:url(assets/kite_home.png) center/contain no-repeat}      /* 只給還沒有正式圖的本週限定；正式明信片已含小鳶，不另疊 */
.scene .fr{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 8px}
/* 收藏冊 */
.tabs{display:flex;gap:6px;margin:0 16px 10px;overflow-x:auto}
.tabs button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-family:inherit;font-size:13px;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.loc{margin:0 16px 14px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px}
.loc h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.loc h4 small{font-weight:400;color:var(--muted);font-size:12px}
.loc.full{border-color:#E0B54A;background:linear-gradient(180deg,#FFF6DC,var(--card) 60%)}.loc.full h4 small{color:#9A6A12;font-weight:700}      /* v0.28（C-164）：一個地點 3 張都拿到＝集滿，框變金色 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cardth{aspect-ratio:8/5;border-radius:6px;overflow:hidden;border:2px solid #E9DFCF;background:#EFE7DA;position:relative;padding:0;font-family:inherit}
.cardth .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--muted);padding:3px;line-height:1.3}
.cardth .ttl,.cardth .tmp,.cardth .fr{display:none}
.cardth .kb{width:22%}
.cardth .new{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.modal{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(30,40,44,.92);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.sheet2{background:var(--paper);border-radius:18px;padding:18px 16px;width:min(340px,88vw);font-size:14px;line-height:1.7}
.sheet2 p{margin:0 0 6px}
/* 紀念品櫃 */
.shelfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px}
.sv{aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;font-family:inherit;color:var(--ink)}
.sv img{width:56px;height:56px;object-fit:contain}
.sv.no img{filter:grayscale(1) brightness(1.6);opacity:.35}
.opt img.ic,.slot img.ic{object-fit:contain}
.slot img.ic{width:52px;height:52px}
.sv.no{opacity:.45}
/* 第一次 */
.intro{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(30,40,44,.6);z-index:25;display:flex;align-items:flex-end}
.intro .sheet{background:var(--paper);width:100%;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.intro p{font-size:16px;line-height:1.6;margin:0 0 14px}
/* 測試面板 */
.dev{margin:0;padding:10px;border:2px dashed #C9B8A4;border-radius:12px;font-size:12px}
.dev button{margin:3px 2px;border:1.5px solid #C9B8A4;background:#fff;border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2B3A40;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;z-index:50;display:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* C-124：短螢幕按鈕至少約 36～40 點高，手指好按 */
#bgmBtn.gear{min-height:44px;min-width:44px}

/* UX 走查（10/17）：可以點的地方至少 44px、字至少 12px */
[hidden]{display:none!important}
#wallHit{min-height:44px}

</style>

<script src="../shared/kite_lb.js"></script>
<script src="../shared/kite_board.js?v=2"></script>
<style>/* QA 10/21：小按鈕至少 44 點高，手指好按 */
header .back,.letter .skip{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
</style>

<style>#kiteWait{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#F6F0E5;opacity:0;pointer-events:none;animation:kwShow .25s ease-out .35s forwards;transition:opacity .2s}
#kiteWait.done{opacity:0!important;animation:none}
#kiteWait .kw-in{text-align:center;font:700 15px/1.4 'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color:#5B4A3A}
#kiteWait img{width:96px;height:auto;display:block;margin:0 auto 8px;animation:kwBreath 1.6s ease-in-out infinite;transform-origin:50% 90%}
#kiteWait span{animation:kwDot 1.2s infinite}#kiteWait span:nth-child(2){animation-delay:.2s}#kiteWait span:nth-child(3){animation-delay:.4s}
@keyframes kwShow{to{opacity:1;pointer-events:auto}}@keyframes kwBreath{50%{transform:scale(1.05,.97) translateY(-3px)}}@keyframes kwDot{0%,60%,100%{opacity:.2}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){#kiteWait img,#kiteWait span{animation:none}}</style>

/* 拆信：信封 → 破封 → 正面 → 翻背 → 收進收藏冊。跳過或關掉也照樣入冊 */
function pushTravelStat() { try { if (window.KiteCore && KiteCore.setTravelStat) KiteCore.setTravelStat({ cards: ownedCount(), sv: Object.keys(S.souvenirs || {}).length, trips: S.trips || 0 }); } catch (e) {} }      // D104：旅行排行用的收藏數
function commitTrip() {
  const tr = S.trip; if (!tr || S.state !== 'back') return [];
  const l = LOCS.find((x) => x.id === tr.dest), now = Date.now(), news = [];
  for (const i of tr.got) { const id = cardId(l, i); if (!S.cards[id]) { S.cards[id] = now; news.push(id); } }
  S.stamps += tr.stamps || 0;
  if (tr.limited) S.limited[tr.limited] = now;
  if (tr.souvenir) S.souvenirs[tr.souvenir] = now;
  if (!tr.walk) { S.trips++; if (!tr.first && CFG.farEvery) { S.farAcc++; if (S.farAcc >= CFG.farEvery) { S.farAcc = 0; S.bento.far++; tr.gotFar = true; } } }      // 第一次也算一次旅行；散步不算
  S.titles = calcTitles(); S.trip = null; S.state = 'home'; save(); pushTravelStat(); return news;
}
/* D98：便當價格跟著後台（KiteCore）走，不寫死在說明裡 */
function bentoNote(k, note) { try { const bb = (window.KiteCore ? KiteCore.cfg().bentos || [] : []).find((x) => x.id === k); return bb ? note.replace('港口換禮', '港口換禮 ' + bb.points + ' 點') : note; } catch (e) { return note; } }
function calcTitles() {
  const t = {}; for (const l of LOCS) if (l.cards.every((c, i) => S.cards[cardId(l, i)])) t['loc-' + l.id] = l.name + '常客';
  const non9 = LOCS.filter((l) => l.id !== 'jiufen').every((l) => l.cards.every((c, i) => S.cards[cardId(l, i)])); if (non9) t.traveler = '港灣旅行家';
  if (ownedCount() >= 24) t.friend = '小鳶的好朋友'; return t;
}
function sceneHTML(l, i, friend, lim) {
  const c = lim ? null : l.cards[i], img = c && c[2];
  return '<div class="scene" style="background:' + (img ? 'url(assets/' + img + ') center/100% 100%' : 'linear-gradient(' + (160 + i * 70) + 'deg,' + l.tone[i % 2] + ',' + l.tone[(i + 1) % 2] + ')') + '">' + (img ? '' : '<svg viewBox="0 0 160 100" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;opacity:.35"><path d="M0 70 Q40 55 80 68 T160 62 V100 H0Z" fill="#fff"/><path d="M0 82 Q50 72 100 80 T160 78 V100 H0Z" fill="#fff"/></svg>') + '<span class="ttl">' + l.name + '｜' + (lim ? lim.title : c[0]) + '</span><span class="tmp">暫用</span>' + (img ? '' : '<span class="kb" style="' + (i % 2 ? 'left' : 'right') + ':5%"></span>') + (friend ? '<span class="fr">遇到了 ' + friend + '</span>' : '') + '</div>';
}

  return '<div class="pc' + (opts && opts.anim ? ' slideup' : '') + '" id="pc"><div class="in"><div class="front">' + sceneHTML(l, i, opts && opts.friend, lim) + '</div><div class="backside"><div class="stampbox"></div><div style="padding-right:56px">' + (lim ? lim.note : c[1]) + '</div><div class="to">' + l.name + '　小鳶寄</div></div></div></div>';
}
/* v0.24（C-126）：信的最後提到現場的港口朋友（讀首頁／港口朋友頁存的 kiteFriends1，只讀不改） */
const PAL_WORDS = { 1: ['探頭小鳶', '還在牆後面偷看港口，說等你回來一起數船'], 2: ['打盹小鳶', '又睡著了，夢話是你的名字'], 3: ['剛到港口的小鳶', '說牠背包裡也有一張要寄給你'], 4: ['鯨鯊', '游過來問你什麼時候再去'], 5: ['海龜', '說港口的垃圾變少了，謝謝你'], 6: ['小卷', '晚上發光的時候想起你'] };
function palLine() { let fr = {}; try { fr = JSON.parse(localStorage.getItem('kiteFriends1') || '{}') || {}; } catch (e) {} const ids = Object.keys(fr).filter((k) => PAL_WORDS[k]); if (!ids.length) return Math.random() < 0.5 ? '聽說東三東四館內住了好多大大的港口朋友，下次一起去找牠們！' : ''; const w = PAL_WORDS[ids[Math.floor(Math.random() * ids.length)]]; return '回家路上經過東三東四，' + w[0] + w[1] + '！'; }
function openLetter() {
  if (S.state !== 'back' || !S.trip) return;
  const tr = S.trip, l = LOCS.find((x) => x.id === tr.dest);
  /* D98：回家時抽一次伴手禮（點數、券），記在這趟旅行上，重開頁面不會重抽；散步與第一趟不抽 */
  if (!tr.gift && window.KiteCore && !tr.walk && !tr.first && !/^hb_/.test(tr.bento || '')) {      /* D164：手作便當不抽點數／券 */ try { tr.gift = KiteCore.travelGift(tr.bento, 'TR-' + tr.start); } catch (e) { tr.gift = { pts: 0 }; } save(); }

  L.innerHTML = '<button class="skip" id="skipL">略過 ››</button><div class="env" id="envL"><img class="closed" src="assets/letter_env.png" alt=""><img class="opened" src="assets/letter_open.png" alt=""><img class="seal" src="assets/letter_seal.png" alt=""></div><p class="tapme" id="tapme">點一下打開信封</p>';
  document.body.appendChild(L);
  const queue = tr.got.map((i) => ({ i })).concat(tr.limited ? [{ lim: LIMITED.find((x) => x.id === tr.limited) }] : []);
  /* D103（Dari 10/17）：點數、券也跟明信片一樣一張一張翻出來，有動畫 */
  if (tr.gift && tr.gift.pts) queue.push({ gpts: tr.gift.pts }); if (tr.gift && tr.gift.coupon) queue.push({ gcp: tr.gift.coupon });
  /* v0.30（C-177）：信的最後多一句「這是小鳶寄給你的第 N 封信」，第 5、10、20、30 封加一句特別的話（只記封數 S.letters；文字是建議） */
  const nL = (S.letters || 0) + 1, LM = { 5: '已經第 5 封了，謝謝你一直幫我準備便當！', 10: '第 10 封！你的收藏冊越來越厚了～', 20: '第 20 封！我們一起去過好多地方喔！', 30: '第 30 封！你是小鳶最好的旅伴！' };
  const extras = ['💌 這是小鳶寄給你的第 ' + nL + ' 封信' + (LM[nL] ? '——' + LM[nL] : '')]; if (tr.stamps) extras.push('重複的明信片換成 ' + tr.stamps + ' 枚小鳶郵票'); if (tr.souvenir) extras.push('還帶回了紀念品：' + l.souvenir); if (tr.friend) extras.push('在' + l.name + '遇到了 ' + tr.friend + '！'); const pl = palLine(); if (pl) extras.push(pl);
  if (window.HOME) { const hx = HOME.letterExtra(tr); if (hx) extras.push(hx); }      // D162：配菜料理小記
  const finish = () => { S.letters = nL; const news = commitTrip(); L.remove(); if (S.titles && Object.keys(S.titles).length) {} go('home'); toast(news.length ? '收進收藏冊了！' : '小鳶回來了'); };
  $('skipL').onclick = finish;
  let step = 0;

    if (q.gpts || q.gcp) {

      L.innerHTML = '<button class="skip" id="skipL2">略過 ››</button><div class="cap">' + (q.gpts ? '小鳶在路上撿到點數！' : '小鳶帶回一張券！') + '</div>' +
        (q.gpts ? '<div class="gift gpts"><div class="burst"></div><img src="assets/coin_big.png" alt="" onerror="this.outerHTML=\'<span class=coinf>🪙</span>\'"><b id="gnum">+0</b><span>點</span><small>已經存進官方 LINE 的點數</small></div>'
          : '<div class="gift gcp"><div class="burst"></div><div class="gface">' + (window.KiteCore && KiteCore.couponFaceHTML ? KiteCore.couponFaceHTML(q.gcp, 150) : '') + '</div><b>' + esc(q.gcp.name) + '</b><small>放在官方 LINE「我的兌換 → 我的折價券」，結帳時出示 QR</small></div>') +
        '<div class="row" style="margin-top:14px"><button class="btn gold" id="nextL">' + (last ? '好' : '下一個') + '</button></div>';
      $('skipL2').onclick = finish; $('nextL').onclick = () => { step++; showCard(); };
      if (q.gpts) { let n = 0; const tgt = q.gpts, t0 = performance.now(); const tick = (t) => { n = Math.min(tgt, Math.round((t - t0) / 600 * tgt)); const e = $('gnum'); if (!e) return; e.textContent = '+' + n; if (n < tgt) requestAnimationFrame(tick); }; setTimeout(() => requestAnimationFrame(tick), 450); }
      return;

<script>

  function measure(name, sec) {
    const T = TR[name], S = song_(name), sr = 22050, c = new OfflineAudioContext(1, sr * sec, sr), e = 60 / T.bpm / 2;
    const g = c.createGain(); g.gain.value = 1; g.connect(c.destination);
    for (let i = 0, t = 0.05; t < sec; i++, t += e) schedule(c, g, T, S, i, t + (i % 2 ? (T.swing || 0) * e : 0), e);
    return c.startRendering().then((b) => { const x = b.getChannelData(0); let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * x[i]; return Math.sqrt(s / x.length); });
  }
  return { play, stop, sfx, measure, tracks: Object.keys(TR), TR, get on() { return !!(timer || audio); }, get cur() { return cur; } };
})();
/* 音樂與暫停圖示（C-81）：開＝音符、關＝音符加圓圈斜線；暫停＝紅色正方形，暫停中＝綠色播放箭頭 */
const SND_ICON = (() => {
  const note = '<path d="M9.5 17.2a2.9 2.9 0 1 1-1.9-2.7V5.4l10.3-2.3v11.3a2.9 2.9 0 1 1-1.9-2.7V7l-6.5 1.5z" fill="currentColor"/>';
  return {
    on: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">' + note + '</svg>',
    off: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g transform="translate(3.6 3.6) scale(.7)" opacity=".75">' + note + '</g><circle cx="12" cy="12" r="10" fill="none" stroke="#C9473A" stroke-width="2.2"/><path d="M5 5l14 14" stroke="#C9473A" stroke-width="2.2" stroke-linecap="round"/></svg>',
    stop: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="#D9342B"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 4.8l11.5 7.2L8 19.2z" fill="#2FA84F" stroke="#2FA84F" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    get saved() { try { return localStorage.getItem('kiteBgm') !== '0'; } catch (e) { return true; } },
    save(on) { try { localStorage.setItem('kiteBgm', on ? '1' : '0'); } catch (e) {} }
  };
