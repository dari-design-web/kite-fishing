<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鳶去旅行原型</title>
<style>
:root{--paper:#F4EFE6;--card:#FFFDF8;--ink:#4A3426;--muted:#8A7565;--teal:#2F7F86;--teal2:#D9ECEA;--gold:#E8B879;--line:#E2D6C6;--red:#C9473A;--display:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2A1E16;color:var(--ink);font-family:var(--display);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--paper);position:relative;overflow:hidden}
/* v0.6：整支手機一個畫面。每個畫面佔滿高度；選單類畫面在自己裡面捲動 */
.screen{position:absolute;inset:0;z-index:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.screen header{position:sticky;top:0;z-index:3;background:var(--paper);padding-top:calc(14px + env(safe-area-inset-top,0px))}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
header h1{font-size:20px;margin:0;flex:1}
.back{border:0;background:none;font-size:15px;color:var(--teal);padding:6px 4px;font-weight:700}
.chip{display:block;margin:4px 16px 10px;padding:8px 12px;border-radius:12px;background:var(--teal2);color:#21585D;font-size:14px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:700;background:var(--teal);color:#fff;font-family:inherit}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.gold{background:var(--gold);color:var(--ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pad{padding:0 16px}
.muted{color:var(--muted);font-size:13px}
.screen{display:none}
.screen.on{display:block}
#home.on{display:flex}
/* 小屋 */
.room{position:relative;width:100%;aspect-ratio:1080/990;overflow:hidden;background:#EADFCB url(assets/room_bg.jpg) center/100% 100% no-repeat}
/* 位置照 ChatGPT 小屋置入位置_v1.json（1080×990 底圖換算成百分比）；底圖的空掛位、空架只是背景，實際收藏由玩家資料放上去 */
.wallhit{position:absolute;left:50%;top:14.6%;width:32.9%;height:9.9%;cursor:pointer}
.wallcards span{position:absolute;top:16.8%;width:8.5%;height:6.4%;border-radius:2px;background-size:100% 100%;box-shadow:0 1px 3px rgba(0,0,0,.3);border:1.5px solid #FFFDF8;transform:rotate(-3deg)}
.wallcards span:nth-child(2){transform:rotate(2deg)}
.shelfhit{position:absolute;left:0;top:43.7%;width:28.7%;height:23.8%;cursor:pointer}
.shelfitems img{position:absolute;top:49.4%;width:5.93%;height:6.46%;object-fit:contain}
.bird{position:absolute;left:35.2%;top:55.6%;width:34%;aspect-ratio:1;background:center/contain no-repeat;cursor:pointer;z-index:2;transform-origin:50% 92%;will-change:left,top,transform}
/* v0.7：小鳶在屋裡生活。位置與動作由程式（PET）每一格更新 */
.emote{position:absolute;width:10.5%;aspect-ratio:1;z-index:120;pointer-events:none;transform:translate(-50%,-100%);animation:pop .35s ease-out}
.emote svg{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
@keyframes pop{0%{transform:translate(-50%,-60%) scale(.3);opacity:0}70%{transform:translate(-50%,-105%) scale(1.15);opacity:1}100%{transform:translate(-50%,-100%) scale(1)}}
.emote.float{animation:pop .35s ease-out,drift 1.6s ease-in .35s forwards}
@keyframes drift{to{transform:translate(-50%,-180%);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
.note{position:absolute;left:50%;bottom:9%;transform:translateX(-50%) rotate(-3deg);width:56%;padding:10px 12px;background:#FFF8D9;border:1.5px solid #E5D49B;box-shadow:0 3px 8px rgba(0,0,0,.12);font-size:14px;line-height:1.5}
.envelope{position:absolute;z-index:100;left:69.4%;top:76.8%;width:22.2%;height:16.2%;background:url(assets/letter_seal.png) center/contain no-repeat,url(assets/letter_env.png) center/contain no-repeat;animation:bob 1.6s infinite;cursor:pointer}
.say{position:absolute;width:62%;text-align:center;pointer-events:none;z-index:130;transform:translate(-50%,-100%);transition:opacity .25s}
.say.off{opacity:0}
.say .bubble{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.say .bubble::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
#home{flex-direction:column;overflow:hidden;padding:0;background:linear-gradient(#5A3F2A,#3E2B1D)}
.hud{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;color:#FFF4E2}
.hud h1{font-size:17px;margin:0;flex:1;white-space:nowrap;letter-spacing:.04em}
.hud h1 small{font-size:11px;font-weight:400;opacity:.7;margin-left:6px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,248,236,.14);border:1px solid rgba(255,248,236,.25);border-radius:999px;padding:3px 9px 3px 4px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill img{width:20px;height:20px;object-fit:contain}
.gear{border:1px solid rgba(255,248,236,.35);background:rgba(255,248,236,.1);color:#FFF4E2;border-radius:999px;font:inherit;font-size:12px;padding:4px 10px}
.roomwrap{position:relative;flex:none;isolation:isolate}      /* v0.8：小鳶、對話、圖示的層級只在小屋裡比，不會蓋過拆信畫面 */
.roomwrap .chip{position:absolute;left:10px;right:10px;top:8px;margin:0;z-index:3;background:rgba(255,253,248,.92);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px;text-align:center}
.floor{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(#9C6B45,#7A5134);box-shadow:inset 0 6px 10px rgba(0,0,0,.25)}
.floor .btn{box-shadow:0 4px 0 #1F5A5F;font-size:17px;padding:14px}
.floor .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1F5A5F}
.weekly{display:flex;align-items:center;gap:10px;background:rgba(255,247,234,.14);border:1px dashed rgba(255,247,234,.45);border-radius:14px;padding:8px 10px;color:#FFF4E2;font-size:13px;line-height:1.45}
.weekly img{width:64px;height:40px;object-fit:cover;border-radius:4px;border:2px solid #FFF7EA;flex:none}
.weekly b{color:#FFE2A8}
@media (max-height:640px){.weekly{display:none}}
.iconrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ibtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:14px;padding:8px 4px 7px;background:#FFF7EA;color:var(--ink);font:inherit;font-size:13px;font-weight:700;box-shadow:0 3px 0 #C9A57E}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #C9A57E}
.ibtn img{width:38px;height:38px;object-fit:contain}
.ibtn small{font-size:11px;font-weight:400;color:var(--muted)}
.quickback{position:absolute;right:10px;bottom:10px;z-index:150;border:0;border-radius:999px;background:#2B3A40;color:#fff;font:inherit;font-size:12px;padding:6px 12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.devsheet{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(30,40,44,.55);z-index:45;display:flex;align-items:flex-end}
.devsheet .dev{margin:0;width:100%;background:var(--paper);border:0;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:70%;overflow:auto}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px}
.stats{display:flex;gap:8px;margin:10px 16px 0;flex-wrap:wrap}
.stats span{font-size:12px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px}
/* 打包 */
.slots{display:flex;gap:10px;margin:6px 16px 12px}
.slot{flex:1;height:96px;border:2px dashed var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;text-align:center;padding:4px}
.slot.filled{border-style:solid;border-color:var(--teal)}
.slot b{font-size:12px;color:var(--muted);font-weight:400}
h3{font-size:15px;margin:14px 16px 6px}
.list{display:flex;flex-direction:column;gap:8px;margin:0 16px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;font-family:inherit;color:inherit;width:100%}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#EEF7F6}
.opt:disabled{opacity:.5}
.opt .ic{width:44px;height:44px;flex:none}
.opt .tx{flex:1;font-size:14px;line-height:1.4}
.opt .tx small{display:block;color:var(--muted);font-size:12px}
.opt .n{font-weight:700;font-size:14px}
.gobar{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(244,239,230,0),var(--paper) 30%);margin-top:6px}
.dest{margin:10px 16px;padding:10px 12px;border-radius:12px;background:#FFF8D9;font-size:13px;line-height:1.55}
/* 出門 */
.depart{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(244,239,230,.97);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20}
.depart .bird2{width:170px;height:170px;background:url(assets/kite_pack.png) center/contain no-repeat;animation:fly 2s ease-in forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1)}40%{transform:translate(0,-10px) scale(1.05)}100%{transform:translate(260px,-260px) scale(.4);opacity:0}}
/* 拆信 */
.letter{position:fixed;inset:0;max-width:430px;margin:0 auto;background:#2B3A40;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.letter .skip{position:absolute;right:14px;top:14px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-family:inherit}
.env{width:min(300px,80vw);aspect-ratio:3/2;position:relative;cursor:pointer;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.env img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .16s,transform .35s}
.env .seal{transform:translateY(1.25%);transform-origin:50% 68%}      /* 蠟封往下約 6px（720 寬時），正壓信封尖端 */
.env .opened{opacity:0}
.env.open .seal{transform:translateY(1.25%) scale(.6);opacity:0}
.env.open .closed{opacity:0;transition-delay:.4s}      /* 先讓打開的信封淡入，再收掉閉合的，避免中間變透明 */
.env.open .opened{opacity:1;transition-delay:.25s}
.tapme{color:#fff;margin-top:16px;font-size:15px}
.pc{width:min(340px,86vw);aspect-ratio:8/5;perspective:900px;margin-top:6px}
.pc .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.pc.flip .in{transform:rotateY(180deg)}
.pc .front,.pc .backside{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:6px solid #FFFDF8;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.pc .backside{transform:rotateY(180deg);background:#FFFDF8;padding:14px 16px;font-size:14px;line-height:1.7;color:var(--ink)}
.pc .backside .stampbox{position:absolute;right:12px;top:10px;width:46px;height:54px;border:2px dashed #D9C9B2;border-radius:4px;background:url(assets/kite_home.png) center/90% no-repeat}
.pc .backside .to{position:absolute;left:16px;bottom:12px;right:16px;border-top:1.5px solid #E2D6C6;padding-top:6px;font-size:12px;color:var(--muted)}
.slideup{animation:slideup .7s ease-out}
@keyframes slideup{from{transform:translateY(60px);opacity:0}}
.letter .cap{color:#fff;text-align:center;margin:14px 0 10px;font-size:16px;font-weight:700}
.letter .row{width:min(340px,86vw)}
.extra{color:#FFE6A8;font-size:14px;margin-top:8px;text-align:center;line-height:1.6}
/* 明信片畫面（佔位） */
.scene{width:100%;height:100%;position:relative;background-size:cover;background-position:center}
.scene .ttl{position:absolute;left:10px;top:8px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.scene .tmp{position:absolute;right:8px;top:8px;font-size:10px;background:rgba(255,255,255,.8);border-radius:999px;padding:1px 7px;color:var(--ink)}
.scene .kb{position:absolute;bottom:4%;width:15%;aspect-ratio:1;background:url(assets/kite_home.png) center/contain no-repeat}      /* 只給還沒有正式圖的本週限定；正式明信片已含小鳶，不另疊 */
.scene .fr{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 8px}
/* 收藏冊 */
.tabs{display:flex;gap:6px;margin:0 16px 10px;overflow-x:auto}
.tabs button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-family:inherit;font-size:13px;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.loc{margin:0 16px 14px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px}
.loc h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.loc h4 small{font-weight:400;color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cardth{aspect-ratio:8/5;border-radius:6px;overflow:hidden;border:2px solid #E9DFCF;background:#EFE7DA;position:relative;padding:0;font-family:inherit}
.cardth .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--muted);padding:3px;line-height:1.3}
.cardth .ttl,.cardth .tmp,.cardth .fr{display:none}
.cardth .kb{width:22%}
.cardth .new{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.modal{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(30,40,44,.92);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.sheet2{background:var(--paper);border-radius:18px;padding:18px 16px;width:min(340px,88vw);font-size:14px;line-height:1.7}
.sheet2 p{margin:0 0 6px}
/* 紀念品櫃 */
.shelfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px}
.sv{aspect-ratio:1;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;font-family:inherit;color:var(--ink)}
.sv img{width:56px;height:56px;object-fit:contain}
.sv.no img{filter:grayscale(1) brightness(1.6);opacity:.35}
.opt img.ic,.slot img.ic{object-fit:contain}
.slot img.ic{width:52px;height:52px}
.sv.no{opacity:.45}
/* 第一次 */
.intro{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(30,40,44,.6);z-index:25;display:flex;align-items:flex-end}
.intro .sheet{background:var(--paper);width:100%;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.intro p{font-size:16px;line-height:1.6;margin:0 0 14px}
/* 測試面板 */
.dev{margin:0;padding:10px;border:2px dashed #C9B8A4;border-radius:12px;font-size:12px}
.dev button{margin:3px 2px;border:1.5px solid #C9B8A4;background:#fff;border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2B3A40;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;z-index:50;display:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <!-- 小屋 -->
  <section class="screen" id="home">
    <div class="hud">
      <h1>小鳶的小屋<small id="ver"></small></h1>
      <span class="pill" title="明信片"><img src="assets/pc_home_a_v2.jpg" alt="" style="border-radius:3px;height:14px;width:22px;object-fit:cover"><span id="hCards">0/24</span></span>
      <span class="pill" title="便當"><img src="assets/bento_rice.png" alt=""><span id="hBento">0</span></span>
      <button class="gear" id="gearBtn" type="button">測試</button>
    </div>
    <div class="roomwrap">
      <div class="chip" id="chip"></div>
      <div class="room" id="room">
        <div class="wallcards" id="wall"></div>
        <div class="wallhit" id="wallHit" role="button" aria-label="明信片牆，打開收藏冊"></div>
        <div class="shelfitems" id="miniShelf"></div>
        <div class="shelfhit" id="shelfHit" role="button" aria-label="紀念品架，打開紀念品櫃"></div>
        <div class="bird" id="bird"></div>
        <div class="say off" id="sayBox"><span class="bubble" id="say"></span></div>
        <div class="emote" id="emote" hidden></div>
        <div class="note" id="note" hidden></div>
        <div class="envelope" id="envIcon" hidden></div>
        <button class="quickback" id="quickBack" type="button" hidden>⏩ 馬上回來（測試）</button>
      </div>
    </div>
    <div class="floor">
      <div class="weekly" id="weekly"></div>
      <button class="btn" id="mainBtn"></button>
      <div class="iconrow">
        <button class="ibtn" id="albumBtn" type="button"><img src="assets/pc_zhengbin_a_v2.jpg" alt="" style="width:46px;height:30px;object-fit:cover;border-radius:3px;margin:4px 0;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)">收藏冊<small id="iCards">0 / 24</small></button>
        <button class="ibtn" id="shelfBtn" type="button"><img src="assets/sv_home.png" alt="">紀念品櫃<small id="iSv">0 / 8</small></button>
        <button class="ibtn" id="infoBtn" type="button"><img src="assets/item_camera.png" alt="">旅行紀錄<small id="iTrips">0 次</small></button>
      </div>
    </div>
    <div id="dev" hidden></div>
  </section>

  <!-- 打包 -->
  <section class="screen" id="pack">
    <header><button class="back" data-go="home">‹ 小屋</button><h1>打包出門</h1></header>
    <div class="slots">
      <div class="slot" id="slot0"><b>便當必帶</b><span>選一個便當</span></div>
      <div class="slot" id="slot1"><b>道具可不帶</b><span>空</span></div>
      <div class="slot" id="slot2"><b>道具可不帶</b><span>空</span></div>
    </div>
    <h3>便當</h3>
    <div class="list" id="bentoList"></div>
    <h3>道具</h3>
    <div class="list" id="itemList"></div>
    <div id="stampBox"></div>
    <div class="dest" id="destInfo">先選一個便當，這裡會告訴你這趟可能去哪裡、大約幾點回來。</div>
    <div class="gobar"><button class="btn" id="goBtn" disabled>出發</button></div>
  </section>

  <!-- 收藏冊 -->
  <section class="screen" id="album">
    <header><button class="back" data-go="home">‹ 小屋</button><h1>收藏冊</h1><span class="muted" id="albumCount"></span></header>
    <div class="tabs" id="tabs"></div>
    <div id="albumBody"></div>
  </section>

  <!-- 紀念品櫃 -->
  <section class="screen" id="shelf">
    <header><button class="back" data-go="home">‹ 小屋</button><h1>紀念品櫃</h1></header>
    <p class="pad muted">小鳶從各地帶回來的小東西。點一下看小鳶說什麼。</p>
    <div class="shelfgrid" id="shelfGrid"></div>
    <h3>稱號</h3>
    <div class="pad" id="titles"></div>
  </section>
</div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* 小鳶去旅行 原型 v0.8（工作單 11 v4 P1）。規則與數值全部是建議，等 Dari（U-29）；改這裡的設定即可 */
const CFG = {
  version: '0.10',
  fast: /[?&]fast=1/.test(location.search),      // 測試用：一小時變 10 秒
  dev: /[?&](fast|dev)=1/.test(location.search),

  const tr = S.trip; if (!tr || S.state !== 'back') return [];
  const l = LOCS.find((x) => x.id === tr.dest), now = Date.now(), news = [];
  for (const i of tr.got) { const id = cardId(l, i); if (!S.cards[id]) { S.cards[id] = now; news.push(id); } }
  S.stamps += tr.stamps || 0;
  if (tr.limited) S.limited[tr.limited] = now;
  if (tr.souvenir) S.souvenirs[tr.souvenir] = now;
  if (!tr.walk) { S.trips++; if (!tr.first) { S.farAcc++; if (S.farAcc >= CFG.farEvery) { S.farAcc = 0; S.bento.far++; tr.gotFar = true; } } }      // 第一次也算一次旅行；散步不算
  S.titles = calcTitles(); S.trip = null; S.state = 'home'; save(); return news;
}
function calcTitles() {
  const t = {}; for (const l of LOCS) if (l.cards.every((c, i) => S.cards[cardId(l, i)])) t['loc-' + l.id] = l.name + '常客';
  const non9 = LOCS.filter((l) => l.id !== 'jiufen').every((l) => l.cards.every((c, i) => S.cards[cardId(l, i)])); if (non9) t.traveler = '港灣旅行家';
  if (ownedCount() >= 24) t.friend = '小鳶的好朋友'; return t;
}
function sceneHTML(l, i, friend, lim) {
  const c = lim ? null : l.cards[i], img = c && c[2];
  return '<div class="scene" style="background:' + (img ? 'url(assets/' + img + ') center/100% 100%' : 'linear-gradient(' + (160 + i * 70) + 'deg,' + l.tone[i % 2] + ',' + l.tone[(i + 1) % 2] + ')') + '">' + (img ? '' : '<svg viewBox="0 0 160 100" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0;opacity:.35"><path d="M0 70 Q40 55 80 68 T160 62 V100 H0Z" fill="#fff"/><path d="M0 82 Q50 72 100 80 T160 78 V100 H0Z" fill="#fff"/></svg>') + '<span class="ttl">' + l.name + '｜' + (lim ? lim.title : c[0]) + '</span><span class="tmp">暫用</span>' + (img ? '' : '<span class="kb" style="' + (i % 2 ? 'left' : 'right') + ':5%"></span>') + (friend ? '<span class="fr">遇到了 ' + friend + '</span>' : '') + '</div>';
}
function cardHTML(l, i, opts) {
  const c = l.cards[i], lim = opts && opts.lim;
  return '<div class="pc' + (opts && opts.anim ? ' slideup' : '') + '" id="pc"><div class="in"><div class="front">' + sceneHTML(l, i, opts && opts.friend, lim) + '</div><div class="backside"><div class="stampbox"></div><div style="padding-right:56px">' + (lim ? lim.note : c[1]) + '</div><div class="to">' + l.name + '　小鳶寄</div></div></div></div>';
}
function openLetter() {
  if (S.state !== 'back' || !S.trip) return;
  const tr = S.trip, l = LOCS.find((x) => x.id === tr.dest);
  PET.hide(); const L = document.createElement('div'); L.className = 'letter';
  L.innerHTML = '<button class="skip" id="skipL">略過 ››</button><div class="env" id="envL"><img class="closed" src="assets/letter_env.png" alt=""><img class="opened" src="assets/letter_open.png" alt=""><img class="seal" src="assets/letter_seal.png" alt=""></div><p class="tapme" id="tapme">點一下打開信封</p>';
  document.body.appendChild(L);
  const queue = tr.got.map((i) => ({ i })).concat(tr.limited ? [{ lim: LIMITED.find((x) => x.id === tr.limited) }] : []);
  const extras = []; if (tr.stamps) extras.push('重複的明信片換成 ' + tr.stamps + ' 枚小鳶郵票'); if (tr.souvenir) extras.push('還帶回了紀念品：' + l.souvenir); if (tr.friend) extras.push('在' + l.name + '遇到了 ' + tr.friend + '！');
  const finish = () => { const news = commitTrip(); L.remove(); if (S.titles && Object.keys(S.titles).length) {} go('home'); toast(news.length ? '收進收藏冊了！' : '小鳶回來了'); };
  $('skipL').onclick = finish;
  let step = 0;
  const showCard = () => {
    const q = queue[step];
    if (!q) { L.innerHTML = '<div class="cap">' + (tr.walk ? '小鳶散步回來了' : '這趟去了' + l.name) + '</div><p class="extra">' + (extras.join('<br>') || '下次再出門看看吧！') + (tr.gotFar !== undefined ? '' : '') + '</p><div class="row" style="margin-top:14px"><button class="btn gold" id="doneL">收進收藏冊</button></div>'; $('doneL').onclick = finish; return; }
    L.innerHTML = '<button class="skip" id="skipL2">略過 ››</button><div class="cap">' + (q.lim ? '本週限定！' : (queue.length > 1 ? '第 ' + (step + 1) + ' 張・' : '') + l.name) + '</div>' + cardHTML(l, q.i || 0, { anim: true, friend: step === 0 ? tr.friend : '', lim: q.lim }) + '<div class="row" style="margin-top:14px"><button class="btn ghost" id="flipL" style="color:#fff;border-color:#fff">看背面</button><button class="btn gold" id="nextL">' + (step + 1 < queue.length ? '下一張' : '好') + '</button></div>';
    $('skipL2').onclick = finish; $('flipL').onclick = () => { const p = $('pc'); p.classList.toggle('flip'); $('flipL').textContent = p.classList.contains('flip') ? '看正面' : '看背面'; };
    $('nextL').onclick = () => { step++; showCard(); };
  };
  $('envL').onclick = () => { $('envL').classList.add('open'); $('tapme').textContent = ''; setTimeout(showCard, 750); };
}

/* 收藏冊：常設 24 張、每週限定、港灣護照、合照（本機） */
let tab = 'main';
function renderAlbum() {
  $('albumCount').textContent = ownedCount() + ' / 24';
  const tabs = [['main', '常設'], ['lim', '本週限定'], ['pass', '港灣護照'], ['photo', '合照（本機）']];
  $('tabs').innerHTML = tabs.map((t) => '<button data-t="' + t[0] + '" aria-pressed="' + (tab === t[0]) + '">' + t[1] + '</button>').join('');
  $('tabs').querySelectorAll('button').forEach((b) => (b.onclick = () => { tab = b.dataset.t; renderAlbum(); }));
  const body = $('albumBody'); body.innerHTML = '';
  if (tab === 'main') for (const l of LOCS) {
    const open = locOpen(l), n = l.cards.filter((c, i) => S.cards[cardId(l, i)]).length;
    const d = document.createElement('div'); d.className = 'loc';
    d.innerHTML = '<h4>' + l.name + ' <small>' + n + ' / 3' + (open ? '' : '｜' + openHow(l)) + (l.id === weekLoc().id ? '｜★本週' : '') + '</small></h4><div class="cards"></div>';
    const cs = d.querySelector('.cards');
    l.cards.forEach((c, i) => {
      const id = cardId(l, i), own = S.cards[id], b = document.createElement('button'); b.className = 'cardth'; b.type = 'button';
      b.innerHTML = own ? sceneHTML(l, i) : '<span class="lock">' + ['認得出的全景', '生活的片刻', '心情或細節'][i] + '<br>還沒拿到</span>';
      if (own && !S.seen[id]) b.insertAdjacentHTML('beforeend', '<span class="new"></span>');
      b.onclick = () => { if (!own) { toast('小鳶還沒寄這張回來'); return; } S.seen[id] = 1; save(); showCardModal(l, i); renderAlbum(); };
      cs.appendChild(b);
    });
    body.appendChild(d);
  }
  else if (tab === 'lim') {
    const wk = weekLoc(); body.innerHTML = '<p class="pad muted">每週一換一個小鳶特別想去的地方，去了就有機會拿到限定明信片。限定卡不算在 24 張裡。本週：<b>' + wk.name + '</b></p>';
    const d = document.createElement('div'); d.className = 'loc'; d.innerHTML = '<div class="cards"></div>'; const cs = d.querySelector('.cards');
    for (const lim of LIMITED) { const l = LOCS.find((x) => x.id === lim.loc), own = S.limited[lim.id], b = document.createElement('button'); b.className = 'cardth'; b.innerHTML = own ? sceneHTML(l, 0, '', lim) : '<span class="lock">' + l.name + '<br>限定</span>'; b.onclick = () => { if (own) showCardModal(l, 0, lim); }; cs.appendChild(b); }
    body.appendChild(d);
  }
  else if (tab === 'pass') body.innerHTML = '<p class="pad muted">港灣蓋章散步（P3）集滿 6 個章拿到的明信片會放在這裡。蓋章原型還沒做。</p>';
  else body.innerHTML = '<p class="pad muted">合照館（P2）拍的照片只存在這支手機，換手機就沒有。合照館原型還沒做。</p>';
}
function showCardModal(l, i, lim) {
  const m = $('modal'); m.innerHTML = cardHTML(l, i, { lim }) + '<div class="row" style="width:min(340px,86vw);margin-top:14px"><button class="btn ghost" id="mf" style="color:#fff;border-color:#fff">看背面</button><button class="btn gold" id="mc">回收藏冊</button></div>'; m.classList.add('on');
  $('mf').onclick = () => { const p = $('pc'); p.classList.toggle('flip'); $('mf').textContent = p.classList.contains('flip') ? '看正面' : '看背面'; };
  $('mc').onclick = () => m.classList.remove('on');
}
function renderShelf() {
  const g = $('shelfGrid'); g.innerHTML = '';
  for (const l of LOCS) { const own = S.souvenirs[l.id], b = document.createElement('button'); b.className = 'sv' + (own ? '' : ' no'); b.type = 'button'; b.innerHTML = '<img src="assets/sv_' + l.id + '.png" alt="">' + (own ? l.souvenir : '？？'); b.onclick = () => toast(own ? '「' + l.sv + '」' : '去' + l.name + '有機會帶回來'); g.appendChild(b); }
  const t = Object.values(calcTitles()); $('titles').innerHTML = t.length ? t.map((x) => '<span class="chip" style="display:inline-block;margin:0 6px 6px 0">' + x + '</span>').join('') : '<p class="muted">集滿一個地點的 3 張，就會得到稱號。九份以外 21 張「港灣旅行家」、全部 24 張「小鳶的好朋友」。</p>';
}

/* 測試面板（網址加 ?dev=1 或 ?fast=1） */
function renderDev() {
  const d = $('dev'); if (!CFG.dev || !d.parentElement || !d.parentElement.classList.contains('devsheet')) return;
  d.innerHTML = '<b>測試面板</b>（原型用；網址加 ?fast=1 時一小時變 10 秒）<br>' +
    ['far', 'squid', 'hair', 'special'].map((k) => '<button data-b="' + k + '">+1 ' + CFG.bentos[k].name + '</button>').join('') +
    '<button data-x="rice">飯糰重置</button><br>' + ['camera', 'telescope', 'umbrella'].map((k) => '<button data-i="' + k + '">' + (S.testItems[k] ? '收回' : '給') + CFG.items[k].name + '</button>').join('') +
    '<br><button data-x="all">拿到全部 24 張</button><button data-x="now">馬上回來</button><button data-x="trips">旅行次數 +5</button><button data-x="stamps">郵票 +5</button><button data-x="reset">全部清除</button>' +
    '<br>現在：飛行過關 ' + (flyAnyCleared() ? '有' : '無') + '、第 4 關 ' + (flyCleared(4) ? '已過' : '未過') + '、捕魚圖鑑 ' + dexCount() + ' 種';
  d.querySelectorAll('[data-b]').forEach((b) => (b.onclick = () => { S.bento[b.dataset.b]++; save(); renderHome(); renderDev(); }));
  d.querySelectorAll('[data-i]').forEach((b) => (b.onclick = () => { S.testItems[b.dataset.i] = !S.testItems[b.dataset.i]; save(); renderHome(); renderDev(); }));
  d.querySelectorAll('[data-x]').forEach((b) => (b.onclick = () => { const x = b.dataset.x; if (x === 'rice') S.riceDay = ''; if (x === 'now' && S.trip) S.trip.end = Date.now(); if (x === 'trips') S.trips += 5; if (x === 'stamps') S.stamps += 5; if (x === 'all') { let n = Date.now(); for (const l of LOCS) for (let i = 0; i < 3; i++) if (!S.cards[l.id + '-' + i]) S.cards[l.id + '-' + i] = n--; } if (x === 'reset') { S = fresh(); } save(); renderHome(); renderDev(); }));
}
window.__travel = { S: () => S, CFG, LOCS, rollTrip, setRnd: (f) => { rnd = f; }, go, commitTrip, depart: (k, items, pick) => { pk = { bento: k, items: items || [], pick: pick || '' }; depart(); }, finishNow: () => { if (S.trip) S.trip.end = Date.now(); tick(); }, open: openLetter };
go('home');
if (S.fishGift) { const n = S.fishGift; S.fishGift = 0; save(); setTimeout(() => toast('捕魚做的便當送到了（' + n + ' 份），打包時可以選'), 600); }      // v0.2：捕魚 v0.7 結算直接給便當
</script>
</body>
</html>
