<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>小鳶飛行冒險原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap">
<style>
/* Layout: one 9:16 stage centred on a deep-harbour ground. The canvas is the world; the HUD and panels are DOM on top of it. */
:root{
  --ground:#10293D; --ink:#17324A; --paper:#FFF8EA; --gold:#F4BB42; --coral:#E8674A; --sea:#2F7FA8; --muted:#5B7285; --line:#D9CDB4;
  --display:'LXGW WenKai TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:360px;height:640px;background:#BFE3F0;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 12px;pointer-events:none}
.kg{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kg.pop{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.time{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.time span{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(23,50,74,.18);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);border-radius:999px;transform-origin:left center}
.bar i.low{background:var(--coral)}
.icon{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:13px;font-weight:700;padding:0;flex:none}

.banner{position:absolute;left:12px;right:12px;top:52px;text-align:center;background:var(--gold);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-family:var(--display);font-weight:700;font-size:16px;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 0 rgba(16,41,61,.6);pointer-events:none}

.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(16,41,61,.55)}
.card{width:100%;max-width:300px;max-height:100%;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.card h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.card h2{font-family:var(--display);font-size:24px;line-height:1.2;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:14px}
.how li{display:flex;gap:8px;align-items:baseline}
.how b{flex:none;min-width:3.6em;color:var(--ink)}
.btn{border:2px solid var(--ink);border-radius:999px;background:var(--gold);padding:10px 16px;font-weight:700;font-size:16px}
.btn.quiet{background:transparent;font-size:14px;padding:8px 14px}
.total{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:18px}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;font-variant-numeric:tabular-nums}
.rows span:nth-child(even){text-align:right;font-weight:700}
.new{color:var(--coral);font-weight:700;font-size:12px;margin-left:4px}
.ask{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px}
.ask div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yn{display:flex;gap:4px;flex:none}
.yn button{border:1.5px solid var(--ink);border-radius:999px;background:transparent;padding:2px 10px;font-size:13px}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#log{width:100%;height:70px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
.note{font-size:12px;color:var(--muted)}
.kg.x2{background:var(--gold)}
.kg.x2::after{content:" ×2";font-size:14px}
.banner{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.035);box-shadow:0 0 0 4px rgba(244,187,66,.35)}}
.rank{align-self:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:0 14px}
.fact{font-size:13px;text-align:left;background:#fff;border:1px dashed var(--muted);border-radius:10px;padding:6px 9px;color:var(--ink)}
.headline{display:flex;align-items:center;justify-content:center;gap:10px}
.seal{align-self:center;font-size:12px;font-weight:700;color:var(--coral);border:2px solid var(--coral);border-radius:8px;padding:0 8px;transform:rotate(-3deg)}
.dex{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.dex button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:1px 8px;font-size:12px}
.dex button.fresh{background:var(--gold)}
.dex button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dex button:disabled{border-style:dashed;opacity:.55;cursor:default}
.card.result{gap:8px;padding:14px 16px;max-width:312px}
.card.result h2{font-size:18px}
.card.result .total{font-size:40px}
.card.result .rows{font-size:13px;gap:2px 12px;padding:6px 0}
@media (prefers-reduced-motion:reduce){.kg.pop,.banner{animation:none}}
.ult{position:absolute;right:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:80px;height:90px;padding:0;border:0;background:none;display:block;-webkit-tap-highlight-color:transparent}
.ult .ring{position:absolute;left:3px;top:0;width:74px;height:74px;border-radius:50%;border:2.5px solid var(--ink);background:conic-gradient(var(--gold) var(--fill,0%),#17324A 0);box-shadow:0 3px 0 rgba(16,41,61,.4)}
.ult .disc{position:absolute;left:11.5px;top:8.5px;width:57px;height:57px;border-radius:50%;border:2.5px solid var(--ink);background:radial-gradient(circle at 34% 26%,#EAF6FA,#A9D5E4 78%);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ult .disc img,.ult .disc svg{width:54px;height:54px;flex:none;transform:rotate(24deg);opacity:.62;filter:grayscale(.55);transition:opacity .2s,filter .2s}
.ult .disc img+svg{display:none}
.ult .tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);min-width:52px;padding:1px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;line-height:1.35;white-space:nowrap}
.ult:disabled{cursor:default}
.ult.ready .disc{background:radial-gradient(circle at 34% 26%,#FFF6CF,#F4BB42 78%)}
.ult.ready .disc img,.ult.ready .disc svg{opacity:1;filter:none}
.ult.ready .tag{background:var(--gold)}
.ult.ready .ring{animation:ultPulse 1.1s ease-in-out infinite}
.ult.ready:active .disc{transform:scale(.94)}
@keyframes ultPulse{0%,100%{box-shadow:0 3px 0 rgba(16,41,61,.4),0 0 0 0 rgba(244,187,66,.8)}50%{box-shadow:0 3px 0 rgba(16,41,61,.4),0 0 0 11px rgba(244,187,66,0)}}
.map{padding:0;background:#10293D;display:block}
.map .mapbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.map .mapfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.maptitle{position:absolute;left:3%;right:3%;top:1.6%;margin:0;padding:8px 12px;border-radius:14px;background:rgba(16,41,61,.82);border:2px solid #E8B879;color:var(--paper);font-family:var(--display);font-size:26px;line-height:1.2;text-align:center}
#stageButtons{position:absolute;inset:0;pointer-events:none}
.stage{pointer-events:auto;position:absolute;width:39.8%;min-height:9.4%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 10px;border-radius:12px;border:2px solid #E8B879;background:rgba(16,41,61,.86);color:var(--paper);text-align:left;font-size:12px;line-height:1.35;box-shadow:0 3px 0 rgba(8,20,32,.45)}
.stage b{font-family:var(--display);font-size:14px;font-weight:700}
.stage span{color:#F4D9A8;font-variant-numeric:tabular-nums}
.stage.locked{opacity:.72;border-color:#8FA3B3}
.stage.locked span{color:#C9D4DC}
.mapnote{position:absolute;left:3%;bottom:1.2%;width:55%;margin:0;padding:4px 8px;border-radius:8px;background:rgba(16,41,61,.7);color:#DCE6EC;font-size:11px;line-height:1.35}
#stageTitle{font-size:24px;line-height:1.25}
.unlock{margin:0;padding:6px 10px;border-radius:10px;background:var(--gold);border:2px solid var(--ink);font-weight:700;text-align:center}
.pick{display:flex;gap:6px;justify-content:center}
.pick button{flex:1;border:2px solid var(--ink);border-radius:999px;background:transparent;padding:5px 8px;font-size:13px;font-weight:700}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#hearts{font-family:var(--body);font-size:15px;letter-spacing:1px;color:var(--coral);padding:4px 10px}
@media (prefers-reduced-motion:reduce){.ult.ready .ring{animation:none}}
</style>

</head>
<body>
<div id="stage">
  <canvas id="world" aria-label="小鳶飛行冒險遊戲畫面"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="kg" id="hearts" aria-label="體力"></div>
    <div class="time"><span id="stageText">東岸碼頭</span><div class="bar"><i id="stageBar"></i></div></div>
    <button class="icon" id="soundBtn" aria-label="音效開關">音</button>
    <button class="icon" id="pauseBtn" aria-label="暫停">停</button>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="hint" id="hint" hidden>拖曳小鳶，風之羽會自動發射</div>
  <button class="ult" id="ultBtn" hidden disabled aria-label="呼叫鯨鯊"><span class="ring"></span><span class="disc"><img src="assets/whaleshark_top.png" alt="" onerror="this.remove()"><svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="#402B20" stroke-width="2" stroke-linejoin="round"><path d="M21 23C13 25 8 31 6 38c7-1 13-3 18-6z" fill="#4E7FA0"/><path d="M43 23c8 2 13 8 15 15-7-1-13-3-18-6z" fill="#4E7FA0"/><path d="M32 49c-3 4-7 8-11 11 5 0 8-1 11-3 3 2 6 3 11 3-4-3-8-7-11-11z" fill="#4E7FA0"/><path d="M32 5c8 0 12 5 12 12 0 11-5 23-10 33l-2 4-2-4C25 40 20 28 20 17 20 10 24 5 32 5z" fill="#5E90B2"/></g><path d="M26 10.5h12" stroke="#402B20" stroke-width="1.6" stroke-linecap="round" fill="none"/><g fill="#402B20"><circle cx="23.6" cy="14.5" r="1.3"/><circle cx="40.4" cy="14.5" r="1.3"/></g><g fill="#F5FBFD"><circle cx="27" cy="18" r="1.4"/><circle cx="32" cy="16.5" r="1.4"/><circle cx="37" cy="18" r="1.4"/><circle cx="25" cy="24" r="1.3"/><circle cx="29.6" cy="23" r="1.4"/><circle cx="34.4" cy="23" r="1.4"/><circle cx="39" cy="24" r="1.3"/><circle cx="27" cy="30" r="1.3"/><circle cx="32" cy="29" r="1.4"/><circle cx="37" cy="30" r="1.3"/><circle cx="28.6" cy="36" r="1.2"/><circle cx="33" cy="35" r="1.3"/><circle cx="36.4" cy="37" r="1.1"/><circle cx="31" cy="41.5" r="1.1"/><circle cx="33.8" cy="43.5" r="1"/><circle cx="13" cy="33" r="1.1"/><circle cx="17.5" cy="29.5" r="1.1"/><circle cx="51" cy="33" r="1.1"/><circle cx="46.5" cy="29.5" r="1.1"/></g></svg></span><span class="tag" id="ultTag">鯨鯊</span></button>

  <div class="panel map" id="mapPanel">
    <img class="mapbg" id="mapImg" src="assets/stage_map.jpg" alt="">
    <canvas class="mapfx" id="mapFx" aria-hidden="true"></canvas>
    <h1 class="maptitle">小鳶飛行冒險</h1>
    <div id="stageButtons"></div>
    <p class="mapnote">原型 v0.16：暫用圖、不發點數。測試期間四關都開放</p>
  </div>

  <div class="panel" id="startPanel" hidden>
    <div class="card">
      <h1 id="stageTitle">小鳶飛行冒險</h1>
      <p id="stageIntro">第 1 關　東三四旅客服務中心：把漂進港口的垃圾清乾淨。</p>
      <ul class="how">
        <li><b>拖曳</b><span>按住畫面拖動小鳶，風之羽自動發射</span></li>
        <li><b>要閃的</b><span id="howDodge">漂流木打不掉；看到紅色區域就整隻離開</span></li>
        <li><b id="howBarrelK">油桶</b><span id="howBarrel">打爆會炸掉旁邊的垃圾，自己別靠太近</span></li>
        <li id="howFriend"><b>救朋友</b><span id="howFriendT">清掉纏住牠們的垃圾。小卷會來幫忙，海龜送你護盾</span></li>
        <li><b id="howUltK">鯨鯊</b><span id="howUlt">右下角集滿後按一下，全畫面大掃除</span></li>
      </ul>
      <div class="pick" id="modePick" role="group" aria-label="拖曳方式">
        <button type="button" data-mode="relative" aria-pressed="true">滑動帶著走</button>
        <button type="button" data-mode="follow" aria-pressed="false">跟著手指</button>
      </div>
      <div class="pick" id="levelPick" role="group" aria-label="難度">
        <button type="button" data-level="easy" aria-pressed="false">輕鬆 ♥7</button>
        <button type="button" data-level="normal" aria-pressed="true">標準 ♥5</button>
        <button type="button" data-level="hard" aria-pressed="false">挑戰 ♥3</button>
      </div>
      <button class="btn" id="startBtn">開始</button>
      <button class="btn quiet" id="mapBtn">回關卡地圖</button>
      <p class="note">原型 v0.16：暫用圖、不發點數</p>
    </div>
  </div>

  <div class="panel" id="pausePanel" hidden>
    <div class="card">
      <h2>暫停中</h2>
      <button class="btn" id="resumeBtn">繼續</button>
      <button class="btn quiet" id="restartBtn">重新開始</button>
    </div>
  </div>

  <div class="panel" id="resultPanel" hidden>
    <div class="card result">
      <div class="headline"><h2 id="resTitle">過關</h2><div class="rank" id="rank"></div></div>
      <div class="total"><span id="cleanPct">0</span> <small>% 乾淨</small></div>
      <div class="rows" id="rows"></div>
      <div class="ask" id="ask">
        <div><span>一看就知道怎麼玩</span><span class="yn" data-q="easy"><button aria-pressed="false">是</button><button aria-pressed="false">否</button></span></div>
        <div><span>拖曳小鳶很順手</span><span class="yn" data-q="control"><button aria-pressed="false">是</button><button aria-pressed="false">否</button></span></div>
        <div><span>難度剛好</span><span class="yn" data-q="level"><button aria-pressed="false">是</button><button aria-pressed="false">否</button></span></div>
        <div><span>還想再玩一局</span><span class="yn" data-q="again"><button aria-pressed="false">是</button><button aria-pressed="false">否</button></span></div>
      </div>
      <p class="unlock" id="unlockNote" hidden></p>
      <button class="btn" id="againBtn">再玩一局</button>
      <button class="btn quiet" id="resMapBtn">回關卡地圖</button>
      <button class="btn quiet" id="copyBtn">複製測試紀錄</button>
      <textarea id="log" readonly hidden aria-label="測試紀錄"></textarea>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ====== 可調數值：改這裡就能調整手感、碰撞與難度（對應說明文件的事件表） ====== */
const CONFIG = {
  version: '0.16',
  openAll: true,      // 測試期間四關都開放，不用一關一關過（Dari 10/8 22:33）。正式上線前再決定要不要改回
  W: 360, H: 640,
  scroll: 70,                    // 原本程式底圖的捲動速度（每秒邏輯像素）；ChatGPT 整張底圖不在時才用
  bg: { harbor: 24, market: 45, pier: 40, rail: 50, blend: 90, closeAt: 60 },   // 整張手繪底圖：第 1 關、第 2 關每秒捲多少、兩張圖交疊淡接的高度、第 2 關幾秒後換收攤街段
  kite: { hearts: 5, r: 12, safe: 1.6, followLift: 64, followSpeed: 16, minY: 130, maxY: 600 },   // r 是小鳶的碰撞半徑
  feather: { every: 0.18, speed: 540, r: 6, powerTime: 9, galeTime: 6 },                          // 風之羽：發射間隔、速度、碰撞半徑、強化與疾風的持續秒數
  combo: { window: 1.6, bonusFrom: 5 },                                                           // 連清：幾秒內沒再清掉就中斷；連到第幾件起，鯨鯊多集 1 分
  ult: { need: 90, bossDamage: 50 },                                                              // 鯨鯊：集滿需要幾分、對大垃圾團的清除量
  pal: { time: 10, every: 0.45, max: 2 },
  side: { warn: 1.15, speed: 205 },
  levels: { easy: { hearts: 7, warn: 1.5 }, normal: { hearts: 5, warn: 1.15 }, hard: { hearts: 3, warn: 0.9, speed: 1.2, bossHp: 1.3, bossTime: 1.3, bossRate: 1.25, jerky: 0.6 } },      // 挑戰另外有：垃圾與橫衝速度倍率、大垃圾團血量與出招頻率倍率、魚乾掉落倍率
                     // 難度：體力格數、側邊橫衝的警示秒數                                                               // 從側邊橫衝過來的垃圾：先在邊緣警示幾秒、橫衝速度                                                         // 小卷跟班：幫忙幾秒、每幾秒噴一次墨、最多幾隻
  // 垃圾與污染：hp 要打幾下、r 碰撞半徑、speed 下漂速度、score 清掉得幾分；其餘是特殊能力
  types: {
    bottle:  { name: '寶特瓶',   hp: 1, r: 13, speed: [80, 105], score: 1 },
    can:     { name: '鐵罐',     hp: 1, r: 11, speed: [105, 135], score: 1 },
    bag:     { name: '塑膠袋',   hp: 2, r: 14, speed: [65, 85], sway: 46, score: 1 },                 // 左右飄
    butt:    { name: '煙蒂',     hp: 1, r: 8,  speed: [125, 125], snake: 62, score: 1 },             // 排成一條蛇形前進
    foam:    { name: '保麗龍箱', hp: 2, r: 17, speed: [60, 75], shatter: 3, score: 1 },              // 打破會散成 3 塊碎片
    chip:    { name: '保麗龍碎片', hp: 1, r: 8, speed: [115, 145], score: 1 },
    barrel:  { name: '油桶',     hp: 3, r: 17, speed: [55, 70], blast: 78, blastDamage: 4, score: 2 }, // 打爆會爆炸，炸掉半徑內的垃圾，也會傷到小鳶
    tire:    { name: '廢輪胎',   hp: 7, r: 20, speed: [45, 55], score: 2 },                          // 很耐打，會擋住羽毛
    oil:     { name: '油污',     hp: 5, r: 24, speed: [45, 60], split: 2, score: 2 },                // 清掉會分裂成 2 個小油滴
    drop:    { name: '小油滴',   hp: 1, r: 10, speed: [90, 120], score: 1 },
    goo:     { name: '污水泡',   hp: 2, r: 14, speed: [72, 72], home: 58, score: 2 },                // 會慢慢追著小鳶
    battery: { name: '廢電池',   hp: 3, r: 13, speed: [50, 60], zapEvery: 2.3, zapR: 60, score: 2 }, // 每隔幾秒放電一圈

function update(dt) {

  if (control === 'follow' && kite.drag) { const k = Math.min(1, K.followSpeed * slow * real); kite.x += (kite.tx - kite.x) * k; kite.y += (kite.ty - kite.y) * k; }

  if (kite.safe > 0) kite.safe -= dt;

  if (kite.powerT > 0) { kite.powerT -= dt; if (kite.powerT <= 0 && kite.power > 1) { kite.power--; kite.powerT = kite.power > 1 ? CONFIG.feather.powerTime : 0; } }
  if (stats.comboT > 0) { stats.comboT -= dt; if (stats.comboT <= 0) stats.combo = 0; }
