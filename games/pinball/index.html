<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小鳶彈珠港</title>

   一局 2 盤、每盤 4 顆球（GPT 原案 3 顆，灰盒放寬一顆好上手）；清光橘色就提早過盤。同一顆球連撞越多音越高、最後一個目標慢動作。結算看用了幾顆球。不存檔、不回報點數。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  <div class="row"><button type="button" id="go">開始</button></div>
</div></div>
<div class="card" id="done" hidden><div>
  <img src="../assets/board/mini_kite_glide.webp" alt="">

  <div class="row"><button type="button" class="alt" id="out">回小鳶樂園</button></div>
</div></div>
<script>

  { t: [[180, 300], [70, 250], [292, 420], [120, 470], [240, 230]], b: [[180, 240], [150, 200], [210, 200], [205, 175], [100, 360], [260, 340], [60, 430], [300, 520], [180, 520], [180, 380]] },

  if (!left) { tone(523, 0.14, 'triangle', 0.1); setTimeout(() => tone(659, 0.14, 'triangle', 0.1), 110); setTimeout(() => tone(784, 0.24, 'triangle', 0.11), 220); if (bi + 1 < BOARDS.length) { floats.push({ x: LW / 2, y: 300, s: '這盤清乾淨了！', t: 0, c: '#FFFFFF', big: true }); setTimeout(() => { bi++; load(); tip('第 2 盤：中間被擋住了，想想從哪邊借牆', 2600); }, calm ? 400 : 1200); } else setTimeout(finish, calm ? 300 : 900); }
