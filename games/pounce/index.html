<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小鳶撲擊海漂</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* D531：小鳶撲擊海漂（灰盒試作，不計分）。Dari 11/16 01:59 要「打得爽、看得懂、跟小鳶互動」；GPT 0210 研究首推。11/16 11:58 Dari：「方向可以」。
   D532：換上 GPT 1200 美術——小鳶動作 v2 動畫（撲擊 6 格、滑行 4 格、待機 4 格、勝利 4 格、受擊 3 格，每格對齊同一基準點）、
   6 種海漂（小木箱、大木箱完整／裂開、寶特瓶、漁網、保麗龍、漂流木）＋各自 4 片碎片、基隆外海背景、正式圖示；
   加 GPT C 首批三項：連續撲擊（1.4 秒內接著撲中就連擊，滿 3 連撲有大回饋）、破箱追擊（大箱第一下被撞退換裂箱，第二下才碎）、洋流漂帶（先出箭頭預告，一排海漂橫著漂過）。
   玩法：按住拖，小鳶跟著手指滑行；靠近海漂時那一個亮框，放手就撲過去撞開。5 段約 2 分鐘。不存檔、不回報點數。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0F3442;font-family:'Zen Maru Gothic',system-ui,sans-serif;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

.sp{flex:1}
.top button{border:0;border-radius:999px;background:rgba(255,255,255,.92);font:inherit;font-weight:900;font-size:14px;padding:6px 12px;min-height:36px;color:#24343A}

#combo span{color:#fff;font-weight:900;font-size:13px;text-shadow:0 2px 0 rgba(0,0,0,.4);margin-left:4px}

.card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(10,30,40,.55);padding:20px}
.card[hidden]{display:none}
.card>div{width:min(340px,92vw);background:#FFFDF6;border-radius:22px;padding:20px 18px 16px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.3,1.5,.5,1);color:#24343A}
.card h2{margin:4px 0 6px;font-size:23px}
.card p{margin:6px 0;line-height:1.6;font-size:15px}
.card img{width:130px;height:130px;object-fit:contain}
.card .row{display:flex;gap:10px;margin-top:12px}

@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card>div{animation:none}}
</style></head><body>
<canvas id="cv" aria-label="海面：按住拖動小鳶，靠近海漂放手撲擊"></canvas>
<div class="top"><h1>撲擊海漂</h1><span class="pill" id="st">第 1／5 段</span><span class="pill" id="sc">🧹 0</span><span class="sp"></span><button id="snd" type="button" aria-pressed="true" aria-label="音效開關">🔊</button><button id="back" type="button">離開</button></div>
<div id="combo" aria-hidden="true"><i></i><i></i><i></i><span id="cbt"></span></div>
<div id="tip" class="off"></div>
<div class="card" id="intro"><div>
  <img src="assets/kite_hit_one.webp" alt="">
  <h2>小鳶撲擊海漂</h2>
  <p><b>按住拖</b>，小鳶跟著你的手指飛。<br>靠近海漂、看到它<b style="color:#E8674A">亮框</b>時，<b>放手</b>就撲過去！</p>
  <p>撞開一個後趕快撲下一個，能接成<b>連撲</b>。</p>
  <p class="muted">灰盒試作：不計分、不存檔。</p>
  <div class="row"><button type="button" id="go">出發</button></div>
</div></div>
<div class="card" id="done" hidden><div>
  <img src="assets/kite_win_one.webp" alt="">
  <h2>海面乾淨了！</h2>
  <p id="sum"></p>
  <p class="muted">灰盒試作：不計分、不存檔。</p>
  <div class="row"><button type="button" id="again">再玩一次</button><button type="button" class="alt" id="out">回小鳶樂園</button></div>
</div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('cv'), ctx = cv.getContext('2d');
const load = (s) => { const i = new Image(); i.src = 'assets/' + s; return i; };
/* 小鳶動畫：每格 192×192（原圖 384 縮半），對齊點 (96, 106.5)，頭朝右 */
const ANIM = { pounce: { img: load('kite_pounce.webp'), n: 6 }, glide: { img: load('kite_glide.webp'), n: 4, fps: 10, loop: true }, idle: { img: load('kite_idle.webp'), n: 4, fps: 7, loop: true }, win: { img: load('kite_win.webp'), n: 4, fps: 8 }, hurt: { img: load('kite_hurt.webp'), n: 3, fps: 8 } };
const OBJ = { crate: { r: 30, frag: 'crate' }, big: { r: 44, frag: 'crate_large', hp: 2 }, bottles: { r: 28, frag: 'bottles' }, net: { r: 32, frag: 'net' }, foam: { r: 28, frag: 'foam' }, wood: { r: 30, frag: 'driftwood' } };
const OIMG = { crate: load('obj_crate.webp'), big: load('obj_crate_large.webp'), bigc: load('obj_crate_large_cracked.webp'), bottles: load('obj_bottles.webp'), net: load('obj_net.webp'), foam: load('obj_foam.webp'), wood: load('obj_driftwood.webp') };
const FRAG = {}; for (const f of ['crate', 'crate_large', 'bottles', 'net', 'foam', 'driftwood']) FRAG[f] = [0, 1, 2, 3].map((i) => load('frag_' + f + '_' + i + '.webp'));
const BG = load('bg_sea.webp');
/* D540：打擊感特效（GPT 1505）：撞擊爆圈 4 格（基準 128,128）、大水花 4 格（基準 128,184）、速度線（基準 240,64 向左拉長） */
const FX = { impact: { img: load('fx_impact.webp'), n: 4, ax: 0.5, ay: 0.5 }, splash: { img: load('fx_splash_big.webp'), n: 4, ax: 0.5, ay: 184 / 256 } }, SPEED = load('fx_speedline.webp');
let fxs = [];
function fx(k, x, y, size, dur) { if (calm && k === 'impact') { size *= 0.7; } fxs.push({ k, x, y, size, dur, t: 0 }); }
const CFG = { glide: 300, range: 150, dash: 0.15, kiteH: 118, hitStop: 0.1, comboWin: 1.4 };      /* D540：命中停頓 0.08→0.1 秒 */
/* 每段：x,y 為畫面比例；vx,vy 每秒漂多少畫面比例；belt：洋流漂帶（先預告 1.2 秒，一排從一側漂進來） */
const STAGES = [
  { tip: '按住往木箱拖，看到亮框就放手！', items: [{ k: 'crate', x: 0.5, y: 0.36 }] },
  { tip: '會漂的！追上去再放手', items: [{ k: 'bottles', x: 0.2, y: 0.3, vx: 0.09, vy: 0.02 }, { k: 'foam', x: 0.75, y: 0.5, vx: -0.05 }] },
  { tip: '三個靠很近——撞開一個馬上撲下一個，接成連撲！', items: [{ k: 'wood', x: 0.3, y: 0.34 }, { k: 'crate', x: 0.5, y: 0.3 }, { k: 'foam', x: 0.7, y: 0.36 }] },
  { tip: '大木箱要撲兩下：第一下撞裂，追上去再一下！', items: [{ k: 'big', x: 0.55, y: 0.36 }, { k: 'net', x: 0.22, y: 0.5, vx: 0.04 }, { k: 'bottles', x: 0.8, y: 0.25, vy: 0.03 }] },
  { tip: '看箭頭！洋流要帶一排海漂過來', belt: { dir: 1, y: 0.33, ks: ['crate', 'bottles', 'foam', 'wood', 'net'], speed: 0.09 }, items: [{ k: 'big', x: 0.5, y: 0.55 }] }
];
let flashT = 0, W = 0, H = 0, dpr = 1, si = 0, items = [], kite = null, touch = null, parts = [], rings = [], floats = [], shake = 0, stop = 0, sound = true, ac = null, playing = false, cleared = 0, pounces = 0, misses = 0, t0 = 0, combo = 0, comboT = 0, bestCombo = 0, belt = null, nid = 0, clearing = false;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
addEventListener('resize', fit); fit();
function tone(f, d, type, g, slide) { if (!sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), a = ac.createGain(), n = ac.currentTime; o.type = type || 'sine'; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + d); a.gain.setValueAtTime(g || 0.1, n); a.gain.exponentialRampToValueAtTime(0.001, n + d); o.connect(a); a.connect(ac.destination); o.start(n); o.stop(n + d); } catch (e) {} }
function noise(d, g) { if (!sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = ac.currentTime, len = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len); const s = ac.createBufferSource(), a = ac.createGain(); s.buffer = buf; a.gain.value = g || 0.15; s.connect(a); a.connect(ac.destination); s.start(n); } catch (e) {} }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let tipT = 0; function tip(t, ms) { const e = $('tip'); e.textContent = t; e.classList.remove('off'); clearTimeout(tipT); tipT = setTimeout(() => e.classList.add('off'), ms || 2600); }
function hud() { $('st').textContent = '第 ' + (si + 1) + '／' + STAGES.length + ' 段'; $('sc').textContent = '🧹 ' + cleared; const on = Math.min(3, combo); $('combo').querySelectorAll('i').forEach((e, i) => e.classList.toggle('on', i < on)); $('cbt').textContent = combo >= 2 ? '連撲 ×' + combo : ''; }
function mk(it) { const o = OBJ[it.k]; return { k: it.k, id: nid++, x: it.x, y: it.y, vx: it.vx || 0, vy: it.vy || 0, hp: o.hp || 1, max: o.hp || 1, r: o.r, rot: (Math.random() - 0.5) * 0.4, vr: 0, wob: Math.random() * 6, gone: false, flash: 0 }; }
function loadStage() { const S = STAGES[si]; items = S.items.map((it) => mk({ ...it, x: it.x * W, y: it.y * H + 40, vx: (it.vx || 0) * W, vy: (it.vy || 0) * H })); belt = S.belt ? { ...S.belt, t: 0, sent: 0 } : null; clearing = false; tip(S.tip, 3400); hud(); }
function start() { fxs = []; flashT = 0; si = 0; cleared = 0; pounces = 0; misses = 0; combo = 0; comboT = 0; bestCombo = 0; t0 = performance.now(); playing = true; $('intro').hidden = true; $('done').hidden = true; kite = { x: W / 2, y: H * 0.78, vx: 0, vy: 0, face: 1, anim: 'idle', at: 0, dash: null, tilt: 0 }; loadStage(); }
function setAnim(a) { if (kite.anim !== a) { kite.anim = a; kite.at = 0; } }
function nearest() { let best = null, bd = CFG.range; for (const it of items) { if (it.gone) continue; const d = Math.hypot(it.x - kite.x, it.y - kite.y) - it.r * 0.4; if (d < bd) { bd = d; best = it; } } return best; }

/* ---------- 輸入：按住拖 → 跟著手指；放手 → 撲擊範圍內最近的那個 ---------- */
cv.addEventListener('pointerdown', (e) => { if (!playing || kite.dash) return; touch = { x: e.clientX, y: e.clientY }; tone(300, 0.08, 'sine', 0.04, 420); });
cv.addEventListener('pointermove', (e) => { if (touch) { touch.x = e.clientX; touch.y = e.clientY; } });
addEventListener('pointerup', () => { if (!touch) return; touch = null; if (!playing || kite.dash) return; const t = nearest();
  if (t) { kite.dash = { t, from: { x: kite.x, y: kite.y }, k: -0.35 }; setAnim('pounce'); kite.face = t.x >= kite.x ? 1 : -1; pounces++; tone(520, 0.12, 'sawtooth', 0.05, 900); noise(0.12, 0.05); }
  else { misses++; combo = 0; hud(); kite.vx *= 0.3; kite.vy *= 0.3; floats.push({ x: kite.x, y: kite.y - 60, s: '呼…再靠近一點', t: 0, c: '#FFFFFF' }); } });
addEventListener('pointercancel', () => { touch = null; });

function hit(it) {
  it.hp--; it.flash = 1; const dx = it.x - kite.dash.from.x, dy = it.y - kite.dash.from.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
  combo = comboT > 0 ? combo + 1 : 1; comboT = CFG.comboWin; bestCombo = Math.max(bestCombo, combo);
  const big = combo >= 3;
  stop = calm ? 0 : CFG.hitStop + (big ? 0.05 : 0); shake = calm ? 0 : (it.max > 1 ? 12 : 8) + (big ? 6 : 0); buzz(it.hp > 0 ? 25 : big ? [30, 30, 50] : 40);
  rings.push({ x: it.x, y: it.y, t: 0, big }); fx('impact', it.x, it.y, big ? 230 : it.hp > 0 ? 150 : 180, 0.32); fx('splash', it.x, it.y + it.r * 0.5, it.hp > 0 ? 130 : 170, 0.5); if (big && !calm) flashT = 0.12;
  if (it.hp > 0) {      /* 大箱子第一下：被撞退、換裂箱，還要再撲一次 */
    it.vx += nx * 280; it.vy += ny * 280; it.vr = (Math.random() < 0.5 ? -1 : 1) * 5; tone(160, 0.18, 'square', 0.09, 90); noise(0.18, 0.18);
    floats.push({ x: it.x, y: it.y - 56, s: '裂開了！追上去！', t: 0, c: '#FFE17A', big: true }); burst(it.x, it.y, '#C9A06A', 8, nx, ny); splash(it.x, it.y, 6);
  } else {
    it.gone = true; cleared++; tone(240, 0.12, 'square', 0.1, 120); noise(0.25, 0.22); setTimeout(() => tone(880 + Math.min(combo, 6) * 110, 0.12, 'triangle', 0.08, 1320 + Math.min(combo, 6) * 110), 60);
    const fr = FRAG[OBJ[it.k].frag]; fr.forEach((im, i) => { const a = Math.atan2(ny, nx) + (i - 1.5) * 0.55 + (Math.random() - 0.5) * 0.3, v = 280 + Math.random() * 220; parts.push({ k: 'img', im, x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, t: 0, life: calm ? 0.4 : 0.9, s: it.r * 1.3 }); });
    burst(it.x, it.y, '#FFFFFF', calm ? 3 : 12, nx, ny); splash(it.x, it.y, calm ? 3 : 10);
    floats.push({ x: it.x, y: it.y - 46, s: big ? '三連撲！' + (combo > 3 ? '×' + combo : '') : combo === 2 ? '連撲！' : it.max > 1 ? '大箱子撞開！' : '撞開！', t: 0, c: big ? '#FFB27A' : '#FFE17A', big: true });
    if (big && !calm) for (let i = 0; i < 18; i++) { const a = Math.random() * 6.28; parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, t: 0, life: 0.6, c: '#FFD45E', r: 3 }); }
  }
  hud();
}
function burst(x, y, c, n, nx, ny) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 80 + Math.random() * 220; parts.push({ x, y, vx: Math.cos(a) * v + (nx || 0) * 160, vy: Math.sin(a) * v + (ny || 0) * 160, t: 0, life: 0.5 + Math.random() * 0.35, c, r: 2 + Math.random() * 4 }); } }
function splash(x, y, n) { for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, v = 140 + Math.random() * 160; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 520, t: 0, life: 0.7, c: 'rgba(220,245,255,.95)', r: 3 + Math.random() * 3 }); } }
function stageDone() { return items.every((i) => i.gone) && (!belt || belt.sent >= belt.ks.length); }
function stageClear() { if (clearing) return; clearing = true; setAnim('win'); kite.winT = 0.9; tone(523, 0.14, 'triangle', 0.1); setTimeout(() => tone(659, 0.14, 'triangle', 0.1), 110); setTimeout(() => tone(784, 0.24, 'triangle', 0.11), 220);
  if (si + 1 < STAGES.length) { setTimeout(() => { si++; loadStage(); }, calm ? 500 : 1100); } else { playing = false; setTimeout(finish, 1000); } }
function finish() { const sec = Math.round((performance.now() - t0) / 1000); $('sum').innerHTML = '撞開 <b>' + cleared + '</b> 件海漂，最多 <b>' + bestCombo + '</b> 連撲<br>撲了 ' + pounces + ' 次（放空 ' + misses + ' 次），用了 ' + sec + ' 秒'; $('done').hidden = false; }

/* ---------- 畫面 ---------- */
function drawKite(now) {
  const A = ANIM[kite.anim]; if (!A.img.complete || !A.img.naturalWidth) return;
  let f;
  if (kite.anim === 'pounce') { const k = kite.dash ? kite.dash.k : 1 + kite.at / 0.24; f = k < 0 ? 0 : k < 0.5 ? 1 : k < 1 ? 2 : kite.at < 0.1 ? 3 : kite.at < 0.2 ? 4 : 5; }      /* 蓄力→衝出×2→命中（停頓中）→收勢×2 */
  else f = A.loop ? Math.floor(kite.at * A.fps) % A.n : Math.min(A.n - 1, Math.floor(kite.at * A.fps));
  const fw = A.img.naturalWidth / A.n, fh = A.img.naturalHeight, s = CFG.kiteH / fh * (kite.dash && kite.dash.k > 0 ? 1.12 : 1), bob = calm || kite.dash ? 0 : Math.sin(now / 240) * 3;
  ctx.fillStyle = 'rgba(0,30,40,.22)'; ctx.beginPath(); ctx.ellipse(kite.x, kite.y + 52, 34, 7, 0, 0, 6.28); ctx.fill();
  if (kite.dash && kite.dash.k > 0 && !calm && SPEED.complete && SPEED.naturalWidth) { const D = kite.dash, dx = kite.x - D.from.x, dy = kite.y - D.from.y, L = Math.hypot(dx, dy); if (L > 20) { ctx.save(); ctx.translate(kite.x, kite.y); ctx.rotate(Math.atan2(dy, dx)); ctx.globalAlpha = 0.9; ctx.drawImage(SPEED, -(L + 30), -26, L + 40, 52); ctx.restore(); ctx.globalAlpha = 1; } }      /* D540：撲出時身後的速度線，長度＝已衝出的距離 */
  ctx.save(); ctx.translate(kite.x, kite.y + bob); ctx.rotate(kite.tilt); ctx.scale(kite.face * s, s); ctx.drawImage(A.img, f * fw, 0, fw, fh, -96, -106.5, fw, fh); ctx.restore();
}
function drawFx(k) { for (const e of fxs) { if (e.k !== k) continue; const F = FX[k]; if (!F.img.complete || !F.img.naturalWidth) continue; const fh = F.img.naturalHeight, f = Math.min(F.n - 1, Math.floor(e.t / e.dur * F.n)); ctx.drawImage(F.img, f * fh, 0, fh, fh, e.x - e.size * F.ax, e.y - e.size * F.ay, e.size, e.size); } }
function drawObj(it, now, hl) {
  const im = it.k === 'big' && it.hp < it.max ? OIMG.bigc : OIMG[it.k], bob = calm ? 0 : Math.sin(now / 400 + it.wob) * 4, s = it.r * 2.6;
  if (it.flash > 0) it.flash = Math.max(0, it.flash - 1 / 30);
