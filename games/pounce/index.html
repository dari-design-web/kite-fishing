<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小鳶撲擊海漂</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* D531：小鳶撲擊海漂（灰盒試作，不計分）。Dari 11/16 01:59「三款玩得不知所以然」→ 要「打得爽、看得懂、跟小鳶互動」，並參考兩個商店下載多評價高的類型。
   GPT 0210 研究首推這個方向（借《水果忍者》的一筆判讀、《英雄丹》與 Castle Busters 的接觸反應、Archero 的單指移動）；小鳶用 GPT 0210 動作設定稿的姿勢。
   玩法：按住拖，小鳶跟著手指滑行；靠近漂流垃圾時那一個亮框，放手就撲過去撞開。大箱子要撲兩下。
   第 1 段一個箱子在正前方，第 2 段一個會漂的箱子，第 3 段混在一起（共 3 段）。命中有停頓、震動、碎片、水花；放錯地方小鳶會減速、輕輕喘一口氣，不懲罰。不存檔、不回報點數。 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0F3442;font-family:'Zen Maru Gothic',system-ui,sans-serif;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}
.top h1{margin:0;font-size:16px;color:#fff;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;font-weight:900;font-size:14px;white-space:nowrap;color:#24343A}
.sp{flex:1}
.top button{border:0;border-radius:999px;background:rgba(255,255,255,.92);font:inherit;font-weight:900;font-size:14px;padding:6px 12px;min-height:36px;color:#24343A}
@media (max-width:400px){.top h1{font-size:15px}.pill{padding:3px 8px;font-size:13px}.top button{padding:5px 9px;font-size:13px}}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:3;background:#FFFDF6;border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:min(92vw,360px);text-align:center;transition:opacity .25s;pointer-events:none;color:#24343A}
#tip.off{opacity:0}
.card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(10,30,40,.55);padding:20px}
.card[hidden]{display:none}
.card>div{width:min(340px,92vw);background:#FFFDF6;border-radius:22px;padding:20px 18px 16px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.3,1.5,.5,1);color:#24343A}
.card h2{margin:4px 0 6px;font-size:23px}
.card p{margin:6px 0;line-height:1.6;font-size:15px}
.card img{width:110px;height:110px;object-fit:contain}
.card .row{display:flex;gap:10px;margin-top:12px}
.card button{flex:1;border:0;border-radius:999px;font:inherit;font-weight:900;font-size:16px;padding:12px 8px;min-height:48px;background:#F4BB42;color:#4A3426;box-shadow:0 4px 0 #C98A1A}
.card button.alt{background:#fff;border:2px solid #9FC9CC;box-shadow:none;color:#1F5A5F}
.muted{color:#6E8288;font-size:13px}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card>div{animation:none}}
</style></head><body>
<canvas id="cv" aria-label="海面：按住拖動小鳶，靠近垃圾放手撲擊"></canvas>
<div class="top"><h1>撲擊海漂</h1><span class="pill" id="st">第 1／3 段</span><span class="pill" id="sc">🧹 0</span><span class="sp"></span><button id="snd" type="button" aria-pressed="true" aria-label="音效開關">🔊</button><button id="back" type="button">離開</button></div>
<div id="tip" class="off"></div>
<div class="card" id="intro"><div>
  <img src="assets/kite_swipe.webp" alt="">
  <h2>小鳶撲擊海漂</h2>
  <p><b>按住拖</b>，小鳶跟著你的手指飛。<br>靠近漂流垃圾、看到它<b style="color:#E8674A">亮框</b>時，<b>放手</b>就撲過去！</p>
  <p class="muted">灰盒試作：不計分、不存檔。</p>
  <div class="row"><button type="button" id="go">出發</button></div>
</div></div>
<div class="card" id="done" hidden><div>
  <img src="assets/kite_win.webp" alt="">
  <h2>海面乾淨了！</h2>
  <p id="sum"></p>
  <p class="muted">灰盒試作：不計分、不存檔。</p>
  <div class="row"><button type="button" id="again">再玩一次</button><button type="button" class="alt" id="out">回小鳶樂園</button></div>
</div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('cv'), ctx = cv.getContext('2d');
const IMG = {}; for (const n of ['idle', 'takeoff', 'swipe', 'hurt', 'win', 'tired']) { IMG[n] = new Image(); IMG[n].src = 'assets/kite_' + n + '.webp'; }
const CFG = { glide: 300, range: 150, dash: 0.16, kiteW: 92, hitStop: 0.08 };
/* 每段的垃圾：x,y 用 0～1 的畫面比例；vx,vy 漂流（每秒佔畫面寬的比例）；hp 2＝大箱子 */
const STAGES = [
  { tip: '第一個：按住往箱子拖，看到亮框就放手！', items: [{ x: 0.5, y: 0.36, hp: 1 }] },
  { tip: '這個會漂！追上去再放手', items: [{ x: 0.2, y: 0.32, hp: 1, vx: 0.09, vy: 0.02 }] },
  { tip: '大箱子要撲兩下！', items: [{ x: 0.25, y: 0.3, hp: 1, vx: 0.05 }, { x: 0.72, y: 0.42, hp: 2 }, { x: 0.5, y: 0.22, hp: 1, vx: -0.06, vy: 0.03 }, { x: 0.35, y: 0.55, hp: 1, vx: 0.04, vy: -0.03 }] }
];
let W = 0, H = 0, dpr = 1, si = 0, items = [], kite = null, touch = null, parts = [], rings = [], floats = [], shake = 0, stop = 0, sound = true, ac = null, playing = false, cleared = 0, pounces = 0, misses = 0, t0 = 0, waves = 0;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
addEventListener('resize', fit); fit();
function tone(f, d, type, g, slide) { if (!sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), a = ac.createGain(), n = ac.currentTime; o.type = type || 'sine'; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + d); a.gain.setValueAtTime(g || 0.1, n); a.gain.exponentialRampToValueAtTime(0.001, n + d); o.connect(a); a.connect(ac.destination); o.start(n); o.stop(n + d); } catch (e) {} }
function noise(d, g) { if (!sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = ac.currentTime, len = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len); const s = ac.createBufferSource(), a = ac.createGain(); s.buffer = buf; a.gain.value = g || 0.15; s.connect(a); a.connect(ac.destination); s.start(n); } catch (e) {} }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let tipT = 0; function tip(t, ms) { const e = $('tip'); e.textContent = t; e.classList.remove('off'); clearTimeout(tipT); tipT = setTimeout(() => e.classList.add('off'), ms || 2600); }
function hud() { $('st').textContent = '第 ' + (si + 1) + '／' + STAGES.length + ' 段'; $('sc').textContent = '🧹 ' + cleared; }
function load() { const S = STAGES[si]; items = S.items.map((it, i) => ({ ...it, id: i, x: it.x * W, y: it.y * H + 40, vx: (it.vx || 0) * W, vy: (it.vy || 0) * H, max: it.hp, r: it.hp > 1 ? 44 : 30, rot: 0, vr: 0, kx: 0, ky: 0, wob: Math.random() * 6, gone: false, flash: 0 })); tip(S.tip, 3200); hud(); }
function start() { si = 0; cleared = 0; pounces = 0; misses = 0; t0 = performance.now(); playing = true; $('intro').hidden = true; $('done').hidden = true; kite = { x: W / 2, y: H * 0.78, vx: 0, vy: 0, face: 1, pose: 'idle', poseT: 0, dash: null, tilt: 0 }; load(); }
function nearest() { let best = null, bd = CFG.range; for (const it of items) { if (it.gone) continue; const d = Math.hypot(it.x - kite.x, it.y - kite.y) - it.r * 0.4; if (d < bd) { bd = d; best = it; } } return best; }

/* ---------- 輸入：按住拖 → 跟著手指；放手 → 撲擊範圍內最近的那個 ---------- */
cv.addEventListener('pointerdown', (e) => { if (!playing || kite.dash) return; touch = { x: e.clientX, y: e.clientY }; kite.pose = 'takeoff'; tone(300, 0.08, 'sine', 0.04, 420); });
cv.addEventListener('pointermove', (e) => { if (touch) { touch.x = e.clientX; touch.y = e.clientY; } });
addEventListener('pointerup', () => { if (!touch) return; touch = null; if (!playing || kite.dash) return; const t = nearest();
  if (t) { kite.dash = { t, from: { x: kite.x, y: kite.y }, k: 0 }; kite.pose = 'swipe'; kite.face = t.x >= kite.x ? 1 : -1; pounces++; tone(520, 0.12, 'sawtooth', 0.05, 900); noise(0.12, 0.05); }
  else { misses++; kite.pose = 'idle'; kite.vx *= 0.3; kite.vy *= 0.3; floats.push({ x: kite.x, y: kite.y - 50, s: '呼…再靠近一點', t: 0, c: '#FFFFFF' }); } });
addEventListener('pointercancel', () => { touch = null; });

function hit(it) {
  it.hp--; it.flash = 1; const dx = it.x - kite.dash.from.x, dy = it.y - kite.dash.from.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
  stop = calm ? 0 : CFG.hitStop; shake = calm ? 0 : (it.max > 1 ? 12 : 8); buzz(it.hp > 0 ? 25 : 40);
  rings.push({ x: it.x, y: it.y, t: 0 });
  if (it.hp > 0) {      /* 大箱子第一下：被撞得往後滑、裂開，還要再撲一次 */
    it.vx += nx * 260; it.vy += ny * 260; it.vr = (Math.random() < 0.5 ? -1 : 1) * 5; tone(160, 0.18, 'square', 0.09, 90); noise(0.18, 0.18);
    floats.push({ x: it.x, y: it.y - 50, s: '裂開了！再一下！', t: 0, c: '#FFE17A', big: true }); burst(it.x, it.y, '#C9A06A', 8, nx, ny);
  } else {
    it.gone = true; cleared++; tone(240, 0.12, 'square', 0.1, 120); noise(0.25, 0.22); setTimeout(() => tone(880, 0.12, 'triangle', 0.08, 1320), 60);
    burst(it.x, it.y, '#C9A06A', calm ? 4 : 16, nx, ny); burst(it.x, it.y, '#FFFFFF', calm ? 3 : 12, nx, ny);
    for (let i = 0; i < (calm ? 0 : 4); i++) parts.push({ k: 'plank', x: it.x, y: it.y, vx: nx * 300 + (Math.random() - 0.5) * 320, vy: ny * 300 + (Math.random() - 0.5) * 320, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 18, t: 0, life: 0.9 });
    floats.push({ x: it.x, y: it.y - 40, s: it.max > 1 ? '大箱子撞開！' : '撞開！', t: 0, c: '#FFE17A', big: true });
    hud();
  }
}
function burst(x, y, c, n, nx, ny) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 80 + Math.random() * 220; parts.push({ x, y, vx: Math.cos(a) * v + (nx || 0) * 160, vy: Math.sin(a) * v + (ny || 0) * 160, t: 0, life: 0.5 + Math.random() * 0.35, c, r: 2 + Math.random() * 4 }); } }
function stageClear() { kite.pose = 'win'; kite.poseT = 0.9; tone(523, 0.14, 'triangle', 0.1); setTimeout(() => tone(659, 0.14, 'triangle', 0.1), 110); setTimeout(() => tone(784, 0.24, 'triangle', 0.11), 220);
  if (si + 1 < STAGES.length) { setTimeout(() => { si++; load(); }, calm ? 500 : 1100); } else { playing = false; setTimeout(finish, 1000); } }
function finish() { const sec = Math.round((performance.now() - t0) / 1000); $('sum').innerHTML = '撞開 <b>' + cleared + '</b> 件海漂，撲了 <b>' + pounces + '</b> 次（放空 ' + misses + ' 次）<br>用了 <b>' + sec + '</b> 秒'; $('done').hidden = false; }

/* ---------- 畫面 ---------- */
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (stop > 0) { stop -= dt; dt = 0; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5BC0D4'); g.addColorStop(0.5, '#2C8FA6'); g.addColorStop(1, '#155B72'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake = Math.max(0, shake - dt * 50); }
  ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2; for (let i = 0; i < 22; i++) { const y = (i * 41 + (calm ? 0 : now * 0.018)) % (H + 30) - 15, x = (i * 89) % W; ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.quadraticCurveTo(x, y - 6, x + 20, y); ctx.stroke(); }
  if (kite) {
    /* 小鳶移動 */
    if (kite.dash) { const D = kite.dash; D.k += dt / CFG.dash; const k = Math.min(1, D.k), e = 1 - Math.pow(1 - k, 3); kite.x = D.from.x + (D.t.x - D.from.x) * e; kite.y = D.from.y + (D.t.y - D.from.y) * e;
      if (!calm && Math.random() < 0.9) parts.push({ x: kite.x - kite.face * 30, y: kite.y + (Math.random() - 0.5) * 20, vx: -kite.face * 60, vy: 0, t: 0, life: 0.25, c: 'rgba(255,255,255,.9)', r: 3 });
      if (k >= 1) { hit(D.t); kite.dash = null; kite.vx = -kite.face * 140; kite.vy = 60; kite.pose = 'swipe'; kite.poseT = 0.35; if (playing && items.every((i) => i.gone)) stageClear(); } }
    else if (touch) { const dx = touch.x - kite.x, dy = touch.y - 40 - kite.y, d = Math.hypot(dx, dy); const sp = Math.min(CFG.glide, d * 5); if (d > 2) { kite.vx += ((dx / d) * sp - kite.vx) * Math.min(1, dt * 8); kite.vy += ((dy / d) * sp - kite.vy) * Math.min(1, dt * 8); } if (Math.abs(kite.vx) > 20) kite.face = kite.vx > 0 ? 1 : -1; kite.pose = 'takeoff'; }
    else { kite.vx *= Math.pow(0.04, dt); kite.vy *= Math.pow(0.04, dt); if (kite.poseT > 0) kite.poseT -= dt; else kite.pose = Math.hypot(kite.vx, kite.vy) > 40 ? 'takeoff' : 'idle'; }
    if (!kite.dash) { kite.x = Math.max(40, Math.min(W - 40, kite.x + kite.vx * dt)); kite.y = Math.max(110, Math.min(H - 60, kite.y + kite.vy * dt)); }
    kite.tilt += ((kite.dash ? 0 : Math.max(-0.35, Math.min(0.35, kite.vx / 900))) - kite.tilt) * 0.2;
    /* 垃圾 */
    const tgt = !kite.dash && touch ? nearest() : null;
    for (const it of items) { if (it.gone) continue; it.x += it.vx * dt; it.y += it.vy * dt; it.vx *= it.max > 1 && it.hp < it.max ? Math.pow(0.3, dt) : 1; it.vy *= it.max > 1 && it.hp < it.max ? Math.pow(0.3, dt) : 1; it.rot += it.vr * dt; it.vr *= Math.pow(0.2, dt);
      if (it.x < it.r || it.x > W - it.r) it.vx = -it.vx; if (it.y < 120 || it.y > H * 0.7) it.vy = -it.vy; it.x = Math.max(it.r, Math.min(W - it.r, it.x)); it.y = Math.max(120, Math.min(H * 0.7, it.y));
      const bob = calm ? 0 : Math.sin(now / 400 + it.wob) * 4; if (it.flash > 0) it.flash = Math.max(0, it.flash - dt * 4);
      ctx.save(); ctx.translate(it.x, it.y + bob); ctx.rotate(it.rot + (calm ? 0 : Math.sin(now / 600 + it.wob) * 0.08));
      ctx.fillStyle = 'rgba(0,30,40,.25)'; ctx.beginPath(); ctx.ellipse(4, it.r * 0.7, it.r * 1.1, it.r * 0.35, 0, 0, 6.28); ctx.fill();
      const s = it.r * 1.5; ctx.fillStyle = it.flash > 0 ? '#FFF3D6' : (it.max > 1 ? '#B5835A' : '#C9A06A'); ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = '#6E4A2C'; ctx.lineWidth = 4; ctx.strokeRect(-s / 2, -s / 2, s, s); ctx.beginPath(); ctx.moveTo(-s / 2, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.moveTo(s / 2, -s / 2); ctx.lineTo(-s / 2, s / 2); ctx.stroke();
      if (it.max > 1 && it.hp < it.max) { ctx.strokeStyle = '#2A1A0E'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-s * 0.1, -s / 2); ctx.lineTo(s * 0.05, -s * 0.1); ctx.lineTo(-s * 0.15, s * 0.2); ctx.stroke(); }
      ctx.restore();
      if (it === tgt) { ctx.strokeStyle = 'rgba(232,103,74,' + (0.7 + 0.3 * Math.sin(now / 90)) + ')'; ctx.lineWidth = 5; ctx.setLineDash([10, 6]); ctx.beginPath(); ctx.arc(it.x, it.y + bob, it.r * 1.25, 0, 6.28); ctx.stroke(); ctx.setLineDash([]); }
    }
    /* 撲擊範圍（按住時淡淡顯示） */
    if (touch && !kite.dash) { ctx.strokeStyle = tgt ? 'rgba(255,225,140,.55)' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(kite.x, kite.y, CFG.range, 0, 6.28); ctx.stroke(); }
    /* 衝擊環、粒子、木板 */
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; if (r.t > 0.5) { rings.splice(i, 1); continue; } ctx.strokeStyle = 'rgba(255,255,255,' + (1 - r.t * 2) + ')'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(r.x, r.y, 20 + r.t * 160, 0, 6.28); ctx.stroke(); }
    for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.t += dt; if (q.t >= q.life) { parts.splice(i, 1); continue; } q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.93; q.vy *= 0.93; ctx.globalAlpha = 1 - q.t / q.life;
      if (q.k === 'plank') { q.rot += q.vr * dt; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = '#B5835A'; ctx.fillRect(-14, -4, 28, 8); ctx.restore(); } else { ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.28); ctx.fill(); } }
    ctx.globalAlpha = 1;
    /* 小鳶 */
    const im = IMG[kite.pose] || IMG.idle; if (im.complete && im.naturalWidth) { const w = CFG.kiteW * (kite.dash ? 1.15 : 1), h = w * im.naturalHeight / im.naturalWidth, bob = calm || kite.dash ? 0 : Math.sin(now / 220) * 3;
      ctx.fillStyle = 'rgba(0,30,40,.22)'; ctx.beginPath(); ctx.ellipse(kite.x, kite.y + h * 0.55, w * 0.35, 7, 0, 0, 6.28); ctx.fill();
      ctx.save(); ctx.translate(kite.x, kite.y + bob); ctx.rotate(kite.tilt); ctx.scale(kite.face, 1); ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore(); }
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; if (f.t > 1.1) { floats.splice(i, 1); continue; } ctx.globalAlpha = Math.min(1, (1.1 - f.t) * 2); ctx.font = '900 ' + (f.big ? 22 : 16) + 'px "Zen Maru Gothic",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,40,50,.85)'; const y = f.y - f.t * 30; ctx.strokeText(f.s, f.x, y); ctx.fillStyle = f.c; ctx.fillText(f.s, f.x, y); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$('go').onclick = start; $('again').onclick = start;
$('snd').onclick = () => { sound = !sound; $('snd').textContent = sound ? '🔊' : '🔇'; $('snd').setAttribute('aria-pressed', String(sound)); };
function leave() { if (history.length > 1) history.back(); else location.href = '../../line/index.html'; }
$('back').onclick = leave; $('out').onclick = () => (location.href = '../../line/index.html');
window.__pc = { get kite() { return kite; }, get items() { return items; }, get si() { return si; }, get cleared() { return cleared; }, get playing() { return playing; } };      /* 測試掛勾 */
</script>
</body></html>
