<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>鯨鯊快游</title>

<style>

   玩法改成「海底版神廟快跑」：三條水道，左右滑換水道、往上滑游高、往下滑潛低。
   起步慢、前 300 公尺是教學段（一次只出一種障礙＋大字提示）；漁網改亮黃粗繩＋紅白浮球＋遠方就看得到的警告牌。
   吃的：浮游生物、磷蝦、魚卵、小魚群；道具：泡泡盾、小鳶幫手（3D 小鳶來幫忙吸食物）、衝刺。
   模型在 shared/kite3d.js（程式算出來的 3D 鯨鯊、小鳶），three.js 在 shared/vendor（MIT）。只進排行榜，不換點數。 */

<script type="module">

const CFG = { lanes: [-2.4, 0, 2.4], yMid: 1.9, yUp: 3.6, yDown: 0.5, hold: 0.95, v0: 8, vMax: 21, vK: 1500, gap0: 34, gap1: 15, hearts: 3, inv: 1.4, spawnZ: -72, shield: 10, magnet: 8, dash: 4 };

/* ---------- 3D 場景 ---------- */
let R;

R.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const S = new THREE.Scene(), SEA = new THREE.Color('#1F7896'); S.background = SEA; S.fog = new THREE.Fog(SEA, 22, 78);
const cam = new THREE.PerspectiveCamera(58, 1, 0.1, 140); cam.position.set(0, 5.0, 8.2); cam.lookAt(0, 1.4, -10);
S.add(new THREE.HemisphereLight('#D6F7FF', '#0E3A4F', 1.7)); const sun = new THREE.DirectionalLight('#FFFFFF', 1.8); sun.position.set(3, 10, 6); S.add(sun);
const ramp = toonRamp(THREE), T = (c, o) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: ramp }, o || {}));
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

const shark = makeShark(THREE); shark.scale.setScalar(0.74); S.add(shark);
const kite = makeKite(THREE); kite.scale.setScalar(0.5); kite.visible = false; S.add(kite);
const helmet = new THREE.Mesh(new THREE.SphereGeometry(1.75, 24, 18), new THREE.MeshBasicMaterial({ color: '#BFF4FF', transparent: true, opacity: 0.22, depthWrite: false })); helmet.position.y = 0.6; kite.add(helmet);      // 小鳶戴泡泡頭盔下水
const shieldM = new THREE.Mesh(new THREE.SphereGeometry(2.1, 28, 20), new THREE.MeshBasicMaterial({ color: '#9CF0FF', transparent: true, opacity: 0.25, depthWrite: false })); shieldM.scale.set(0.75, 0.6, 1.2); shieldM.visible = false; S.add(shieldM);

/* 海底：沙地、岩石、海草、珊瑚、光柱、氣泡、遠方水面 */
const sandTex = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#CDB98E'; c.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.18)' : 'rgba(90,70,40,.18)'; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 3; for (let y = 10; y < h; y += 28) { c.beginPath(); for (let x = 0; x <= w; x += 8) c.lineTo(x, y + Math.sin(x * 0.06) * 5); c.stroke(); } });
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(6, 26);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(64, 150), new THREE.MeshLambertMaterial({ map: sandTex })); floor.rotation.x = -Math.PI / 2; floor.position.set(0, -0.7, -60); S.add(floor);
const laneTex = canvasTex(64, 256, (c, w, h) => { c.clearRect(0, 0, w, h); c.fillStyle = 'rgba(255,255,255,.18)'; for (let y = 0; y < h; y += 64) c.fillRect(w / 2 - 3, y, 6, 36); }); laneTex.wrapT = THREE.RepeatWrapping; laneTex.repeat.set(1, 30);
[-1.2, 1.2].forEach((x) => { const l = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 150), new THREE.MeshBasicMaterial({ map: laneTex, transparent: true, depthWrite: false })); l.rotation.x = -Math.PI / 2; l.position.set(x, -0.68, -60); S.add(l); });      // 沙地上淡淡的水道線
const deco = [], rockM = T('#2F5566', { flatShading: true }), weedM = T('#3E8A5A', { side: THREE.DoubleSide }), coralC = ['#F28C6B', '#F6C35B', '#C978D9', '#6FD3B8'];
function decoAt(z) {
  const side = Math.random() < 0.5 ? -1 : 1, x = side * rnd(4.6, 10), k = Math.random(), g = new THREE.Group(); g.position.set(x, -0.6, z);
  if (k < 0.35) { const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.7, 2), 0), rockM); r.scale.y = rnd(0.5, 1.1); g.add(r); }
  else if (k < 0.7) { for (let i = 0; i < 4; i++) { const w = new THREE.Mesh(new THREE.PlaneGeometry(0.35, rnd(1.4, 3), 1, 5), weedM); w.position.set(rnd(-0.5, 0.5), 1, rnd(-0.4, 0.4)); w.rotation.y = rnd(0, 3); w.userData.sway = rnd(0, 6); g.add(w); } }
  else { const m = T(pick(coralC)); for (let i = 0; i < 5; i++) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, rnd(0.6, 1.4), 6), m); b.position.set(rnd(-0.4, 0.4), 0.4, rnd(-0.4, 0.4)); b.rotation.set(rnd(-0.5, 0.5), 0, rnd(-0.5, 0.5)); g.add(b); const tip = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), m); tip.position.copy(b.position).add(new THREE.Vector3(0, 0.45, 0)); g.add(tip); } }
  S.add(g); deco.push(g);
}
for (let z = 6; z > -120; z -= 4.5) decoAt(z);
const rayM = new THREE.MeshBasicMaterial({ color: '#E8FBFF', transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
const rays = []; for (let i = 0; i < 7; i++) { const r = new THREE.Mesh(new THREE.PlaneGeometry(rnd(1, 2.4), 20), rayM); r.position.set(rnd(-9, 9), 8, rnd(-45, -4)); r.rotation.set(0, rnd(-0.4, 0.4), rnd(-0.35, -0.15)); S.add(r); rays.push(r); }
const surf = new THREE.Mesh(new THREE.PlaneGeometry(80, 160), new THREE.MeshBasicMaterial({ color: '#7FD6EA', transparent: true, opacity: 0.35, side: THREE.DoubleSide, fog: false })); surf.rotation.x = Math.PI / 2; surf.position.set(0, 9, -60); S.add(surf);
const dotTex = canvasTex(64, 64, (c) => { const gr = c.createRadialGradient(32, 32, 2, 32, 32, 30); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = gr; c.fillRect(0, 0, 64, 64); });
const NB = 150, bubbleG = new THREE.BufferGeometry(), bp = new Float32Array(NB * 3); for (let i = 0; i < NB; i++) { bp[i * 3] = rnd(-10, 10); bp[i * 3 + 1] = rnd(-0.5, 8); bp[i * 3 + 2] = rnd(-70, 8); }
bubbleG.setAttribute('position', new THREE.BufferAttribute(bp, 3)); S.add(new THREE.Points(bubbleG, new THREE.PointsMaterial({ map: dotTex, size: 0.16, transparent: true, opacity: 0.5, depthWrite: false })));

/* ---------- 東西 ---------- */
const objs = [];
function addObj(o, kind, extra) { S.add(o); const b = Object.assign({ o, kind }, extra || {}); objs.push(b); return b; }
/* 吃的：每種長得不一樣、分數不一樣 */
const FOOD = { plank: { pts: 5, name: '浮游生物' }, krill: { pts: 15, name: '磷蝦' }, roe: { pts: 20, name: '魚卵' }, fish: { pts: 30, name: '小魚群' } };
const plankM = new THREE.PointsMaterial({ map: dotTex, size: 0.5, color: '#FFE45C', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const krillM = T('#FF8FB8', { emissive: '#7A1F45' }), roeM = new THREE.MeshToonMaterial({ color: '#FF9A3C', gradientMap: ramp, emissive: '#7A3300', transparent: true, opacity: 0.9 }), fishM = T('#D9E6EE', { emissive: '#203040' });

  let o;

  else if (kind === 'roe') { o = new THREE.Group(); for (let i = 0; i < 9; i++) { const k = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), roeM); k.position.set(rnd(-0.22, 0.22), rnd(-0.18, 0.18), rnd(-0.22, 0.22)); o.add(k); } }
  else { o = new THREE.Group(); for (let i = 0; i < 6; i++) { const k = new THREE.Mesh(fishG, fishM); k.position.set(rnd(-0.4, 0.4), rnd(-0.25, 0.25), rnd(-0.3, 0.3)); k.userData.ph = rnd(0, 6); o.add(k); } }
  o.position.set(x, y, z); return addObj(o, 'food', { food: kind, r: 1.0, spin: kind === 'fish' ? 0 : rnd(-1.5, 1.5) });
}
/* 道具 */
const PW = { shield: { icon: '🫧', name: '泡泡盾', c: '#9CF0FF' }, magnet: { icon: '🪶', name: '小鳶幫手', c: '#FFD36B' }, dash: { icon: '⚡', name: '衝刺', c: '#FFF07A' } };
const iconTex = {}; function emojiTex(e, ring) { const k = e + ring; if (iconTex[k]) return iconTex[k]; return (iconTex[k] = canvasTex(128, 128, (c) => { c.fillStyle = ring; c.globalAlpha = 0.9; c.beginPath(); c.arc(64, 64, 58, 0, 7); c.fill(); c.globalAlpha = 1; c.lineWidth = 8; c.strokeStyle = '#10293D'; c.stroke(); c.font = '64px system-ui,"Apple Color Emoji","Segoe UI Emoji"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(e, 64, 70); })); }
function powerup(kind, x, y, z) { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(PW[kind].icon, PW[kind].c), fog: false })); sp.scale.setScalar(1.1); sp.position.set(x, y, z); return addObj(sp, 'pw', { pw: kind, r: 1.15 }); }
/* 障礙：漁網（亮黃粗繩＋紅白浮球＋警告牌）、垃圾、錨鍊 */
const netTex = canvasTex(128, 128, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = '#FFD84D'; c.lineWidth = 7; for (let k = -w; k <= w * 2; k += 32) { c.beginPath(); c.moveTo(k, 0); c.lineTo(k + h, h); c.stroke(); c.beginPath(); c.moveTo(k + h, 0); c.lineTo(k, h); c.stroke(); } c.fillStyle = '#FFE98A'; for (let x = 0; x <= w; x += 32) for (let y = 0; y <= h; y += 32) { c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill(); } });
