   - 會轉彎：整條海溝左右、上下彎（畫面空間彎曲，像地鐵跑酷）
   - 場景每 450 公尺換一種：珊瑚礁（小丑魚、海葵）→ 海草森林 → 沉船港區 → 深海發光，輪流；換場時有大型生物路過

   - 有趣的：金色加速圈、吃滿能量條「鯨鯊狂歡」（無敵、撞飛障礙、×3）、泡泡盾、小鳶幫手（2D 小鳶戴泡泡）、衝刺
   D139 效能：卡頓拆小步、預先編譯、釋放記憶體。

   素材 games/swim/assets（G99 縮小轉 webp）；場景與障礙在 games/swim/world.js。只進排行榜，不換點數。 */
