/* ---------- 圖檔（G86；沒有就用程式畫的） ---------- */
const IMG = {};
function want(key, src) { const im = new Image(); im.onload = () => { IMG[key] = im; }; im.src = src; }

/* ---------- 音效（短的合成音，不用音檔）與震動 ---------- */

}

function hud(score, mid, right) {

  if (right) { ctx.font = FONT(14); const w = ctx.measureText(right).width + 26; pill(W - 10 - w, 10, w, 32); text(right, W - 10 - w / 2, 26, 14, C.paper, 'center', 700, false); }
  if (mid) { ctx.font = FONT(13); const w = ctx.measureText(mid).width + 24, mx = mode === 'merge' ? W - 10 - w / 2 : W / 2; pill(mx - w / 2, 48, w, 26, 'rgba(16,41,61,.62)'); text(mid, mx, 61, 13, C.paper, 'center', 700, false); }      /* D226：連鎖小牌移到右上「第 N 關」下面，不再蓋住正中間的小鳶 */

/* ================= A. 合成港 ================= */
const SEAF = [      // 名字、半徑、顏色、分數、一句小知識（圖鑑用，寫法照 G77 統一用詞）

const BOX = { l: 20, r: 340, floor: 556, line: 158 };
let mdex = store.get('kiteMiniDex1', {}) || {};
function drawSeaFallback(lv, r) {
