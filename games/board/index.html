/* D454：港口大富翁 A「單機骰子短局」首版（Dari 11/11 選 A；GPT 港口大富翁A_規格_20261111_v2）。
   不寫任何存檔、不回報點數、不接卡冊。18 格、小鳶對兩位電腦、每人 6 回合、機會／命運各 12 張、章支援卡每人 2 張（骰前 +1 殼）。
   短挑戰格：三個主玩法短段還沒做隔離接點 → 依規格第 5 節鎖成 FALLBACK，這局所有人統一 1 星。
   D455：GPT 1735 五張美術、抽卡「卡背→翻面」。
   D473（v2 P1，Dari 11/12「畫面起碼全螢幕、動畫要好一點」；GPT 1705 回覆同意 P1 規則不改）：
   整個手機畫面就是棋盤（18 格改排成 4 欄×7 列的外環），骰子會滾會彈、棋子一格一格跳＋落地煙塵、
   星星貝殼飛進上方計分、蓋小站彈出、電腦回合加速＋快轉鈕、音效（可關）。規則、牌、電腦判斷完全沒動。
   D483（v2 P2 第一段，Dari 11/13「接下來集中做大富翁」）：
   ①目的地港口——第 1、3、5 輪各公布一個小站當目的地（插旗），正常擲骰走路時第一個走到或經過的人 ＋3⭐，旗子收走；
     兩輪內沒人走到就換下一個。卡片移位不算（跟「卡片移位不觸發格子」一致）。
   ②選骰子——每次擲 2 顆，自己選 1 顆走（按鈕直接寫會停在哪一格、會不會拿到旗子）；兩顆一樣就直接走。
     電腦用固定分數挑（先搶旗，再看停的格子）。
   D484（v2 P2 第二段；GPT 港口大富翁A岔路_1830設計＋1235 岔路取捨）：
   ①岔路——「看船前抓魚」(#3) 分岔：港邊照原路 #4→#5→#6→#7；山路走舞台左上的窄軌「山城階梯」(18，沒有事件)→「虎仔山看港」(19，停下 ＋1🐚)→#7，少走 1 格。
     走到 #3 還有步數才選路（正好停在 #3 下一回合再選）；選骰子時的落點、搶旗、電腦判斷都照實際路線算。卡片移位照舊只走外環。
     有人在山路上時，新目的地不選 #4（兩輪內走不到）。
   ②目的地旗子換成 GPT 1235 的 dest_flag.png（格子左上 24px、公布畫面 64px）。
   D485（v2 P2 第三段；GPT 1235 Q2 三人比較＋1345 Q2 捕魚切片數值）：
   ①短挑戰切片第一款「港口捕魚 8 秒」——不用 iframe，直接在這一頁重寫：7 條魚分三條泳道游過，點魚讓小鳶俯衝去抓；
     不管誰踩到短挑戰格（#3 看船前抓魚、#17 再玩一小段），都由真人玩一次，
     兩位電腦開始時各抽一個等級（0／1／2 級＝20%／60%／20%）再換成條數（0／1～3／4～7 條），三人比條數，抓最多而且不是 0 條的人 ＋2⭐（一樣多抽籤）。開始前可以略過，踩到的人照舊拿 1⭐。
     疊貨櫃（#6）、飛行（#12）兩款還沒做，照舊直接 1⭐。資料只存在這一局。
   ②山路兩格換成 GPT 1345 的圖示 icon_path.png／icon_view.png。
   ③骰點卡（GPT 1345 Q3）——每人整局 1 張：擲完 2 顆後，可以把其中一顆 −1 或 ＋1（限 1～6 步）；先看每個選項會停哪、拿不拿得到旗，確認才扣卡，

:root{--ink:#10293D;--paper:#FFF8EA;--sea:#7FC4D6;--deep:#0E2232;--leaf:#4FBF88;--sun:#F2B544;--coral:#E8795A;

/* 短挑戰共用設定：odds＝電腦抽 0／1／2 級的籤（捕魚 20／50／30＝GPT 1445 Q2；疊貨櫃 20／60／20），hi＝2 級的個數範圍 */
