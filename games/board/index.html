<style>
/* D454：港口大富翁 A「單機骰子短局」首版（Dari 11/11 選 A；GPT 港口大富翁A_規格_20261111_v2）。
   凍結中：沒有任何入口連到這頁，只能打網址試玩；不寫任何存檔、不回報點數、不接卡冊。
   18 格（6 欄×5 列外環）、小鳶對兩位電腦、每人 6 回合、機會／命運各 12 張、章支援卡每人 2 張（骰前 +1 殼）。

</style></head><body>
<div class="wrap">
  <div class="top"><h1>港口大富翁</h1><span class="rd" id="rd">準備</span><button id="back" type="button">離開</button></div>
  <div class="players" id="players"></div>
  <div class="board" id="board"><div class="center" id="center"></div><div class="pawns" id="pawns"></div></div>
  <div class="log" id="log" aria-live="polite"></div>
</div>
<script>
'use strict';
const VER = '0.4';
const A = '../assets/board/';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEST = /[?&]test=1/.test(location.search);
const SP = TEST ? 0.05 : 1;      /* 測試加速 */
/* 18 格（規格第 2 節）。r,c：在 6×5 外環的位置 */
const CELLS = [
  [0, '集合碼頭', 'start', 4, 0], [1, '新朋友角', 'land', 3, 0], [2, '入口好消息', 'chance', 2, 0], [3, '看船前抓魚', 'mini', 1, 0, 'fish12'], [4, '看船小站', 'land', 0, 0],
  [5, '碼頭小插曲', 'fate', 0, 1], [6, '幫忙落貨櫃', 'mini', 0, 2, 'stack15'], [7, '鯨鯊朋友角', 'land', 0, 3], [8, '鯨鯊好消息', 'chance', 0, 4], [9, '小吃休息站', 'rest', 0, 5],
  [10, '港邊小吃攤', 'land', 1, 5], [11, '小吃街插曲', 'fate', 2, 5], [12, '清出飛行路', 'mini', 3, 5, 'fly15'], [13, '躲雨小屋', 'land', 4, 5], [14, '雨都好消息', 'chance', 4, 4],
  [15, '回家小插曲', 'fate', 4, 3], [16, '再見小車站', 'land', 4, 2], [17, '再玩一小段', 'mini', 4, 1, 'pick']
].map(([id, name, type, r, c, mini]) => ({ id, name, type, r, c, mini }));
const BR = { 0: '集合|碼頭', 1: '新朋友|角', 2: '入口|好消息', 3: '看船前|抓魚', 4: '看船|小站', 5: '碼頭|小插曲', 6: '幫忙|落貨櫃', 7: '鯨鯊|朋友角', 8: '鯨鯊|好消息', 9: '小吃|休息站', 10: '港邊|小吃攤', 11: '小吃街|插曲', 12: '清出|飛行路', 13: '躲雨|小屋', 14: '雨都|好消息', 15: '回家|小插曲', 16: '再見|小車站', 17: '再玩|一小段' };
const ICON = { start: '⚓', land: '🏠', chance: '✨', fate: '🌊', mini: '🎮', rest: '🍵' };
const ICON_IMG = { start: 'icon_start.png', land: 'icon_landmark.png', chance: 'icon_chance.png', fate: 'icon_fate.png', mini: 'icon_challenge.png', rest: 'icon_rest.png' };      /* D456：GPT 1830 六類格子圖示取代 emoji（文字說明裡的 emoji 不動） */
const KIND = { land: '小站', chance: '機會', fate: '命運', mini: '短挑戰', rest: '休息', start: '起點' };
const CHANCE = [
  ['C01', '港邊導覽完成，拿1顆星。', { type: 'star', d: 1 }], ['C02', '補給船到了，拿2個貝殼。', { type: 'shell', d: 2 }],
  ['C03', '選1顆星，或拿2個貝殼。', { type: 'choose' }], ['C04', '想換星嗎？付2個貝殼拿1顆星。', { type: 'trade', payShell: 2, star: 1 }],
  ['C05', '想補材料嗎？付1顆星拿3個貝殼。', { type: 'trade', payStar: 1, shell: 3 }], ['C06', '一起補給，每人拿1個貝殼。', { type: 'allShell', d: 1 }],
  ['C07', '港口慶祝，每人拿1顆星。', { type: 'allStar', d: 1 }], ['C08', '找到小補給，拿1個貝殼。', { type: 'shell', d: 1 }],
  ['C09', '已有小站拿2貝殼，還沒蓋則拿1星。', { type: 'landBranch' }], ['C10', '下次蓋小站，少付1個貝殼。', { type: 'coupon' }],
  ['C11', '這次自己選，往前0、1或2格。', { type: 'chooseMove' }], ['C12', '留在這裡，或回起點休息。', { type: 'choosePos' }]
];
const FATE = [
  ['F01', '海風送來補給，拿1個貝殼。', { type: 'shell', d: 1 }], ['F02', '整理碼頭有收穫，拿2個貝殼。', { type: 'shell', d: 2 }],
  ['F03', '幫船指對路，拿1顆星。', { type: 'star', d: 1 }], ['F04', '整理小行囊，付1個貝殼。', { type: 'shell', d: -1 }],
  ['F05', '補好岸邊欄杆，付2個貝殼。', { type: 'shell', d: -2 }], ['F06', '星燈晚點亮，少1顆星。', { type: 'star', d: -1 }],
  ['F07', '天氣真舒服，每人拿1個貝殼。', { type: 'allShell', d: 1 }], ['F08', '一起整理港邊，每人付1個貝殼。', { type: 'allShell', d: -1 }],
  ['F09', '一起看港景，每人拿1顆星。', { type: 'allStar', d: 1 }], ['F10', '順著海風，往前走2格。', { type: 'move', d: 2 }],
  ['F11', '小浪輕推，往後走2格。', { type: 'move', d: -2 }], ['F12', '回到起點，安心休息一下。', { type: 'toStart' }]
];
/* 章支援卡：讀既有蓋章（只讀，開局快照）；效果全部一樣＝骰前 +1 殼，每人 2 張 */
const STAMP = { 1: ['kite', '港口新朋友'], 2: ['ship', '數船小達人'], 3: ['shark', '鯨鯊的好朋友'], 4: ['bowl', '港邊小吃家'], 5: ['chair', '躲雨小專家'], 6: ['car', '下次見大使'] };
function myStamps() { try { const q = JSON.parse(localStorage.getItem('kiteStamp1') || 'null'); return q && q.spots ? Object.keys(q.spots).map(Number).filter(k => STAMP[k]).sort() : []; } catch (e) { return []; } }
/* 短挑戰可用性：三個切片都還沒有隔離接點 → 開局即鎖 FALLBACK（規格第 5 節：統一 1 星，NPC 不抽） */
const MINI_READY = { fish12: false, stack15: false, fly15: false };
const MINI_NAME = { fish12: '捕魚 12 秒', stack15: '疊貨櫃 15 秒', fly15: '飛行清障 15 秒' };

const $ = id => document.getElementById(id);
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clampS = v => Math.max(0, Math.min(12, v));
const nw = (p, h, n) => wait(p.human ? h : n);      /* D455：電腦回合較短（GPT 1735 估時稿：一般約 2 秒、有摘要最多約 3 秒） */
async function wait(ms) { ms *= SP; const t0 = performance.now(); let left = ms; while (left > 0) { await new Promise(r => setTimeout(r, Math.min(left, 100))); if (!document.hidden) left = ms - (performance.now() - t0); else return wait(left / SP); } }

let G = null;
function newGame() {
  const st = myStamps();
  const faces = [st[0] || 0, st[1] || st[0] || 0];
  G = {
    id: Date.now(), round: 0, done: new Set(),
    P: [
      { id: 0, name: '小鳶', short: '你', img: 'pawn_player.png', col: 'var(--p0)', human: true, faces },
      { id: 1, name: '鯨鯊夥伴', short: '鯨鯊', img: 'pawn_cpu_1.png', col: 'var(--p1)', ai: 'shark' },
      { id: 2, name: '小卷夥伴', short: '小卷', img: 'pawn_cpu_2.png', col: 'var(--p2)', ai: 'squid' }
    ].map(p => Object.assign(p, { pos: 0, shell: 6, star: 0, evStar: 0, cards: 2, coupon: false, turn: 0, minis: 0, lands: [] })),
    owner: Array(18).fill(-1),
    deck: { C: shuffle(CHANCE.slice()), F: shuffle(FATE.slice()) }, disc: { C: [], F: [] },
    order: shuffle([0, 1, 2]), log: []
  };
  $('log').textContent = '';
  drawBoard(); drawPlayers();
}
function draw(k) { if (!G.deck[k].length) { G.deck[k] = shuffle(G.disc[k]); G.disc[k] = []; } const c = G.deck[k].shift(); G.disc[k].push(c); return c; }
function once(key) { if (G.done.has(key)) return false; G.done.add(key); return true; }      /* matchId+turnId+effectKey 封口 */
function log(s) { const p = document.createElement('p'); p.textContent = s; $('log').prepend(p); }
function toast(s) { if (TEST) return; const d = document.createElement('div'); d.className = 'toast'; d.textContent = s; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function bump(p) { const el = $('players').children[p.id]; if (!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function addShell(p, d) { const b = p.shell; p.shell = clampS(p.shell + d); drawPlayers(); if (p.shell !== b) bump(p); return p.shell - b; }
function addStar(p, d) { const b = p.star; p.star = Math.max(0, p.star + d); p.evStar = Math.max(0, p.evStar + (p.star - b)); drawPlayers(); if (p.star !== b) bump(p); return p.star - b; }
const price = p => p.coupon ? 2 : 3;
const reserve = p => p.ai === 'shark' && p.turn <= 4 ? 2 : 0;

/* ===== 畫面 ===== */
function drawBoard() {
  const b = $('board'); b.querySelectorAll('.tile').forEach(e => e.remove());
  for (const c of CELLS) {
    const t = document.createElement('div'); t.className = 'tile ' + c.type; t.id = 'tile' + c.id; t.style.gridRow = c.r + 1; t.style.gridColumn = c.c + 1;
    t.innerHTML = '<span class="no">' + c.id + '</span><span class="ic"><img alt="' + ICON[c.type] + '" src="' + A + ICON_IMG[c.type] + '"></span><span class="tn">' + (BR[c.id] || c.name).replace('|', '<br>') + '</span><span class="own"></span>';
    b.appendChild(t);
  }
  drawOwners(); drawPawns();
}
function drawOwners() {
  for (const c of CELLS) {
    const t = $('tile' + c.id); if (!t) continue; const o = G.owner[c.id], own = t.querySelector('.own'); let f = t.querySelector('.flag');
    if (o >= 0) { own.style.boxShadow = 'inset 0 0 0 3px ' + G.P[o].col; if (!f) { f = document.createElement('span'); f.className = 'flag'; t.appendChild(f); } f.style.background = G.P[o].col; f.textContent = G.P[o].short; }
    else { own.style.boxShadow = ''; if (f) f.remove(); }
  }
}
function drawPawns() {
  const layer = $('pawns'); if (!layer.children.length) for (const p of G.P) { const d = document.createElement('div'); d.className = 'pawn'; d.innerHTML = '<img alt="' + p.name + '" src="' + A + p.img + '">'; layer.appendChild(d); }
  const off = [[-.22, -.2], [.22, -.2], [0, -.14]];      /* D457：三顆棋子都靠上半（圖示那半），不蓋格名 */
  for (const p of G.P) { const c = CELLS[p.pos], d = layer.children[p.id]; d.style.left = ((c.c + .5 + off[p.id][0]) / 6 * 100 - 5.75) + '%'; d.style.top = ((c.r + .5 + off[p.id][1]) / 5 * 100 - 6.9) + '%'; }
}
function drawPlayers() {
  const box = $('players'); if (!box.children.length) for (const p of G.P) { const d = document.createElement('div'); d.className = 'pl'; d.style.borderColor = p.col; box.appendChild(d); }
  for (const p of G.P) box.children[p.id].innerHTML = '<span class="nm"><img alt="" src="' + A + p.img + '">' + p.name + '</span><span class="st"><span>⭐<b>' + p.star + '</b></span><span>🐚<b>' + p.shell + '</b></span><span>🏠<b>' + p.lands.length + '</b></span></span><span class="cd">章卡 ' + p.cards + (p.coupon ? '・折建券' : '') + '</span>';
}
function hl(id) { document.querySelectorAll('.tile.hl').forEach(e => e.classList.remove('hl')); if (id >= 0) $('tile' + id).classList.add('hl'); }
function center(html) { $('center').innerHTML = html; }
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function diceHtml(n) { return '<div class="dice" id="dice">' + Array.from({ length: 9 }, (_, i) => '<i style="visibility:' + (PIPS[n].includes(i) ? 'visible' : 'hidden') + '"></i>').join('') + '</div>'; }
/* D455：抽卡大圖——卡背飛進來→翻面→牌文（GPT 1735 卡背／正面；文字由程式疊在安全區） */
async function reveal(c, k, p) {
  const ov = document.createElement('div'); ov.className = 'cpop'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', (k === 'C' ? '機會' : '命運') + '卡：' + c[1]);
  ov.innerHTML = '<div class="cc in" style="background-image:url(' + A + (k === 'C' ? 'card_chance' : 'card_fate') + '.png)"><span class="ck" style="background:' + (k === 'C' ? '#C98A12' : '#2E7FA8') + '">' + (k === 'C' ? '✨ 機會' : '🌊 命運') + '</span><span class="ct">' + c[1] + '</span></div>';
  $('board').appendChild(ov); const cc = ov.firstChild;
  await wait(RM ? 120 : p.human ? 420 : 300);
  if (!RM) { cc.classList.add('half'); await wait(170); }
  cc.style.backgroundImage = 'url(' + A + 'card_face.png)'; cc.classList.remove('in'); cc.classList.add('face'); void cc.offsetWidth; cc.classList.remove('half');
  await wait(p.human ? 1250 : 700);
  ov.remove();
}
function cardHtml(c, k) { return '<div class="card"><span class="k" style="background:' + (k === 'C' ? '#2E8BC0' : '#7B5CC4') + '">' + (k === 'C' ? '機會' : '命運') + '</span><span class="t">' + c[1] + '</span></div>'; }
/* 人類做選擇：按鈕。auto（測試）時照小卷規則自動選 */
function ask(msg, opts, extra) {
  return new Promise(res => {
    center((extra || '') + '<div class="msg">' + msg + '</div><div class="btns">' + opts.map((o, i) => '<button type="button" data-i="' + i + '"' + (o.alt ? ' class="alt"' : '') + (o.off ? ' disabled' : '') + '>' + o.t + '</button>').join('') + '</div>');
    $('center').querySelectorAll('button').forEach(b => b.onclick = () => { $('center').querySelectorAll('button').forEach(x => x.disabled = true); res(opts[+b.dataset.i].v); });
    if (window.__autoHuman) setTimeout(() => res(window.__autoHuman(msg, opts)), 5);
  });
}

/* ===== 回合 ===== */
async function playTurn(p) {
  p.turn++; const tk = G.id + ':' + G.round + ':' + p.id;
  document.querySelectorAll('.pl').forEach((e, i) => e.classList.toggle('on', i === p.id)); hl(p.pos);
  /* 章支援卡：骰前用 1 張 +1 殼 */
  if (p.cards > 0) {
    let use;
    if (p.human) use = await ask('第 ' + p.turn + ' 回合，你的回合！', [{ t: '用章卡 ＋1🐚（剩 ' + p.cards + '）', v: true, alt: true }, { t: '🎲 擲骰', v: false }], supportHtml(p));
    else use = p.turn <= 2;
    if (use && once(tk + ':card')) { p.cards--; addShell(p, 1); log(p.name + ' 用了章支援卡，＋1🐚'); toast('＋1🐚'); if (!p.human) { center('<div class="msg">' + p.name + ' 用了章支援卡</div><div class="sub">＋1🐚</div>'); await wait(450); } }
    if (use && p.human) await ask('要擲骰了！', [{ t: '🎲 擲骰', v: 1 }]);
  } else if (p.human) await ask('第 ' + p.turn + ' 回合，你的回合！', [{ t: '🎲 擲骰', v: 1 }]);
  else { center('<div class="msg">' + p.name + ' 的回合</div>'); await wait(250); }
  /* 擲骰：按下就定，只記一次 */
  if (!once(tk + ':roll')) return;
  const n = 1 + rnd(6);
  center(diceHtml(n) + '<div class="msg">' + (p.human ? '你' : p.name) + '擲出 ' + n + ' 點</div>');
  if (!RM) $('dice').classList.add('roll');
  await wait(RM ? 200 : p.human ? 600 : 450);
  for (let s = 0; s < n; s++) {
    p.pos = (p.pos + 1) % 18; drawPawns(); const pw = $('pawns').children[p.id]; pw.classList.remove('hop'); void pw.offsetWidth; pw.classList.add('hop'); hl(p.pos);
    if (p.pos === 0 && once(tk + ':pass')) { addShell(p, 2); log(p.name + ' 經過集合碼頭，＋2🐚'); toast('＋2🐚'); }
    await wait(RM ? 40 : p.human ? 150 : 100);
  }
  await land(p, tk);
  hl(-1);
}
function supportHtml(p) { return p.faces ? '<div class="supp">' + p.faces.slice(0, p.cards).map(k => k ? '<img alt="' + STAMP[k][1] + '卡" src="' + A + 'st_' + STAMP[k][0] + '.png">' : '<img alt="公版卡" src="' + A + 'st_kite.png" style="filter:grayscale(1) opacity(.7)">').join('') + '</div>' : ''; }

async function land(p, tk) {
  const c = CELLS[p.pos], who = p.human ? '你' : p.name;
  if (!once(tk + ':land')) return;
  if (c.type === 'start') { center('<div class="msg">' + who + '回到集合碼頭</div>'); await nw(p, 900, 600); return; }
  if (c.type === 'rest') { addShell(p, 1); log(p.name + ' 在小吃休息站，＋1🐚'); center('<div class="msg">🍵 ' + who + '在休息站喝口茶</div><div class="sub">＋1🐚，繼續前進</div>'); toast('＋1🐚'); await nw(p, 1300, 850); return; }
  if (c.type === 'land') return landTile(p, c);
  if (c.type === 'chance' || c.type === 'fate') return cardTile(p, c.type === 'chance' ? 'C' : 'F', tk);
  if (c.type === 'mini') return miniTile(p, c, tk);
}
async function landTile(p, c) {
  const o = G.owner[c.id], who = p.human ? '你' : p.name;
  if (o === p.id) { addShell(p, 1); log(p.name + ' 回到自己的「' + c.name + '」，＋1🐚'); center('<div class="msg">🏠 回到自己的小站</div><div class="sub">' + who + '＋1🐚</div>'); toast('＋1🐚'); await nw(p, 1300, 850); return; }
  if (o >= 0) {
    const ow = G.P[o], pay = Math.min(1, p.shell); p.shell -= pay; addShell(ow, 1);
    log(p.name + ' 拜訪' + ow.name + '的「' + c.name + '」' + (pay ? '，付 1🐚 給港口' : '') + '；' + ow.name + ' 由港口拿 1🐚');
    center('<div class="msg">👋 拜訪' + (ow.human ? '你' : ow.name) + '的小站</div><div class="sub">' + who + (pay ? '付 1🐚 給港口' : '沒有貝殼也沒關係') + '<br>' + (ow.human ? '你' : ow.name) + '從港口拿到 1🐚</div>'); drawPlayers(); await nw(p, 1600, 1150); return;
  }
  const pr = price(p), can = p.shell >= pr && p.lands.length < 2;
  let buy;
  if (p.human) buy = await ask('「' + c.name + '」還沒有人蓋', [{ t: '花 ' + pr + '🐚 蓋小站', v: true, off: !can }, { t: '先不要', v: false, alt: true }], '<div class="sub">蓋了結算時 ＋2⭐（最多 2 處）' + (p.lands.length >= 2 ? '<br>你已經有 2 處小站了' : p.shell < pr ? '<br>貝殼不夠' : '') + '</div>');
  else buy = can && p.shell - pr >= reserve(p);
  if (buy && can) {
    p.shell -= pr; if (p.coupon) p.coupon = false; p.lands.push(c.id); G.owner[c.id] = p.id; drawOwners(); drawPlayers(); bump(p);
    log(p.name + ' 花 ' + pr + '🐚 蓋了「' + c.name + '」（結算 ＋2⭐）'); center('<div class="msg">🏠 ' + who + '蓋了「' + c.name + '」</div><div class="sub">結算時 ＋2⭐</div>'); toast('🏠 蓋好了！'); await nw(p, 1400, 1050);
  } else if (!p.human) { center('<div class="msg">' + p.name + ' 先不蓋</div>'); await wait(650); }
}
async function cardTile(p, k, tk) {
  const c = draw(k), e = c[2], who = p.human ? '你' : p.name, show = cardHtml(c, k);
  log(p.name + ' 抽到' + (k === 'C' ? '機會' : '命運') + '：' + c[1]);
  center('<div class="msg">' + who + '抽' + (k === 'C' ? '機會' : '命運') + '卡…</div>'); await reveal(c, k, p);
  center(show + '<div class="sub">' + who + '抽到</div>'); await nw(p, 300, 150);
  if (!once(tk + ':card:' + c[0])) return;
  const T = e.type, ai = p.ai;
  if (T === 'star') addStar(p, e.d);
  else if (T === 'shell') addShell(p, e.d);
  else if (T === 'allShell') G.P.forEach(q => addShell(q, e.d));
  else if (T === 'allStar') G.P.forEach(q => addStar(q, e.d));
  else if (T === 'landBranch') { if (p.lands.length) addShell(p, 2); else addStar(p, 1); }
  else if (T === 'coupon') { if (p.coupon) addShell(p, 1); else { p.coupon = true; drawPlayers(); } }
  else if (T === 'choose') {
    const v = p.human ? await ask('選一個', [{ t: '⭐ 1 顆星', v: 's' }, { t: '🐚 2 個貝殼', v: 'h' }], show) : (p.lands.length < 2 && p.shell < price(p) + reserve(p) ? 'h' : 's');
    if (v === 'h') addShell(p, 2); else addStar(p, 1); if (!p.human) log(p.name + ' 選了' + (v === 'h' ? '2🐚' : '1⭐'));
  } else if (T === 'trade') {
    const can = e.payShell ? p.shell >= e.payShell : p.star >= e.payStar;
    let yes = false;
    if (can) yes = p.human ? await ask(e.payShell ? '付 2🐚 換 1⭐？' : '付 1⭐ 換 ' + (Math.min(12, p.shell + 3) - p.shell) + '🐚？', [{ t: '換', v: true }, { t: '不換', v: false, alt: true }], show)
      : e.payShell ? (p.lands.length >= 2 || p.turn >= 6) : (p.lands.length < 2 && p.turn <= 5 && p.shell < price(p));
    if (yes) { if (e.payShell) { p.shell -= e.payShell; addStar(p, e.star); } else { p.star -= e.payStar; p.evStar = Math.max(0, p.evStar - e.payStar); addShell(p, e.shell); } log(p.name + ' 換了'); }
    else log(p.name + (can ? ' 不換' : ' 不夠換'));
  } else if (T === 'chooseMove') {
    const v = p.human ? await ask('往前幾格？（不會觸發格子）', [0, 1, 2].map(s => ({ t: s + ' 格', v: s, alt: s === 0 })), show) : ai === 'shark' ? 0 : (p.turn <= 5 ? 2 : 0);
    if (v) { p.pos = (p.pos + v) % 18; drawPawns(); } log(p.name + ' 往前 ' + v + ' 格');
  } else if (T === 'choosePos') {
    const v = p.human ? await ask('留在這裡，還是回起點？', [{ t: '留在這裡', v: 'stay', alt: true }, { t: '回起點', v: 'start' }], show) : (ai === 'squid' && p.turn <= 5 ? 'start' : 'stay');
    if (v === 'start') { p.pos = 0; drawPawns(); } log(p.name + (v === 'start' ? ' 回到起點' : ' 留在原地'));
  } else if (T === 'move') { p.pos = (p.pos + e.d + 18) % 18; drawPawns(); }
  else if (T === 'toStart') { p.pos = 0; drawPawns(); }
  await nw(p, 500, 350);
}
async function miniTile(p, c, tk) {
  const who = p.human ? '你' : p.name;
  if (p.minis >= 3) { addShell(p, 1); log(p.name + ' 短挑戰已滿 3 次，改拿 1🐚'); center('<div class="msg">🎮 短挑戰已經玩滿 3 次</div><div class="sub">' + who + '改拿 1🐚</div>'); await nw(p, 1300, 850); return; }
  p.minis++;
  let kind = c.mini;
  if (kind === 'pick') kind = p.human ? 'pick' : (p.ai === 'shark' ? 'fish12' : 'stack15');
  const ready = kind !== 'pick' && MINI_READY[kind];
  if (p.human) {
    const nm = kind === 'pick' ? '三選一（捕魚／疊貨櫃／飛行）' : MINI_NAME[kind];
    await ask('🎮 ' + c.name, [{ t: '開始挑戰', v: 'go', off: !ready }, { t: '拿 1⭐', v: 'skip', alt: !ready }], '<div class="sub">' + nm + '<br>' + (ready ? '0／1／2⭐，也可以略過拿 1⭐' : '短挑戰還在準備中，這局大家都直接拿 1⭐') + '</div>');
  } else { center('<div class="msg">🎮 ' + p.name + '來到「' + c.name + '」</div>'); await wait(550); }
  if (!once(tk + ':mini')) return;
  addStar(p, 1); log(p.name + ' 在「' + c.name + '」拿到 1⭐'); toast('＋1⭐');
  center('<div class="msg">⭐ ' + who + '拿到 1 顆星</div><div class="sub">短挑戰第 ' + p.minis + '／3 次</div>'); await nw(p, 1100, 800);
}

async function intro() {
  const st = myStamps();
  return new Promise(res => {
    center('<div class="msg">港口大富翁</div><div class="sub">小鳶和鯨鯊、小卷一起<br>在港口走 6 回合，星星最多的贏！</div><div class="btns"><button type="button" id="go">開始一局</button><button type="button" class="alt" id="how">怎麼玩</button></div>');
    $('go').onclick = res;
    $('how').onclick = () => {
      center('<div class="intro" style="padding:4px 2px;background:none"><ul style="margin:0;text-align:left;font-size:12px">'
        + '<li>每人 6 回合，擲骰順時針走</li><li>🏠 花 3🐚 蓋小站（最多 2 處），結算每處 ＋2⭐</li><li>✨ 機會 🌊 命運 抽卡立刻生效</li><li>🎮 短挑戰拿星，⚓ 經過起點 ＋2🐚</li><li>章卡：骰前 ＋1🐚，每人 2 張' + (st.length ? '（用你蓋到的章當卡面）' : '') + '</li></ul></div><div class="btns"><button type="button" id="go2">開始一局</button></div>');
      $('go2').onclick = res;
    };
    if (window.__autoHuman) setTimeout(res, 5);
  });
}
async function game() {
  newGame(); $('rd').textContent = '準備';
  await intro();
  log('順序：' + G.order.map(i => G.P[i].name).join(' → '));
  for (let r = 0; r < 6; r++) {
    G.round = r + 1; $('rd').textContent = '第 ' + G.round + '／6 輪';
    const ord = G.order.slice(r % 3).concat(G.order.slice(0, r % 3));      /* 每輪左移一位，每人當第一位 2 次 */
    center('<div class="msg">第 ' + G.round + ' 輪</div><div class="sub">' + ord.map(i => G.P[i].human ? '你' : G.P[i].name).join(' → ') + '</div>'); await wait(900);
    for (const i of ord) await playTurn(G.P[i]);
  }
  settle();
}
function settle() {
  $('rd').textContent = '結算'; document.querySelectorAll('.pl').forEach(e => e.classList.remove('on'));
  const R = G.P.map(p => ({ p, ev: p.star, ld: p.lands.length * 2, tot: p.star + p.lands.length * 2 }));
  const top = Math.max(...R.map(r => r.tot)), win = R.filter(r => r.tot === top);
  window.__result = R.map(r => ({ name: r.p.name, star: r.ev, land: r.p.lands.length, total: r.tot, turns: r.p.turn, shell: r.p.shell, minis: r.p.minis }));
  const youWin = win.some(r => r.p.human);
  const ov = document.createElement('div'); ov.className = 'over'; ov.id = 'over'; $('board').appendChild(ov); center('');
  ov.innerHTML = ('<div class="msg">' + (win.length > 1 ? '🤝 ' + win.map(r => r.p.human ? '你' : r.p.name).join('和') + '一樣多！' : youWin ? '🎉 你贏了這一局！' : '🎉 ' + win[0].p.name + '贏了這一局') + '</div><div class="res">'
    + R.sort((a, b) => b.tot - a.tot).map(r => '<div class="row' + (r.tot === top ? ' win' : '') + '"><img alt="" src="' + A + r.p.img + '"><span>' + r.p.name + '<br><small>挑戰事件 ' + r.ev + '⭐＋小站 ' + r.ld + '⭐</small></span><span class="big">' + r.tot + '⭐</span></div>').join('')
    + '</div><div class="btns"><button type="button" id="again">再玩一局</button><button type="button" class="alt" id="out">離開</button></div>');
  log('結算：' + R.map(r => r.p.name + ' ' + r.tot + '⭐').join('、'));
  $('again').onclick = () => { ov.remove(); game(); }; $('out').onclick = leave;
}
function leave() { if (history.length > 1) history.back(); else location.href = '../../hub/'; }
$('back').onclick = () => { if (!G || !G.round || confirmLeave()) leave(); };
function confirmLeave() { return window.confirm ? confirm('離開就結束這一局（不會存檔），確定嗎？') : true; }
window.__board = { get G() { return G; }, VER };
game();
</script>
