<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小鳶疊貨櫃</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* D120（Dari 10/19「合成港跟疊貨櫃裡面都沒有設計，都還是示意的」）：兩個小遊戲改成正式版面——
   開場有標題畫面與玩法圖、結束有成績卡、合成港有圖鑑與新發現、疊貨櫃有港口背景與高度尺、音效與震動。
   圖檔放 games/assets/merge、games/assets/stack（G86 交付後接上），還沒有圖時用程式畫的版本。
   合成港與疊貨櫃是同一份程式，只有 tab 不同（改一份要同步另一份）。 */
:root{
  --ink:#10293D; --paper:#FFF8EA; --dusk:#F4B37A; --leaf:#4FBF88;
  --round:'Zen Maru Gothic','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#0E2232;color:var(--paper);font-family:var(--round);display:flex;flex-direction:column;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:8px;overflow:hidden}
.tabs{display:flex;gap:6px;width:100%;max-width:420px}
.tabs button{flex:1;min-width:0;font-family:var(--round);font-weight:700;font-size:13px;line-height:1.2;padding:8px 4px;border-radius:12px;border:2px solid #2B4A60;background:#16344A;color:#CFE3EC;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tabs[hidden]{display:none}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:420px;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:360/600;border-radius:18px;touch-action:none;display:block;background:#7FC4D6;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.how{width:100%;max-width:420px;font-size:13px;line-height:1.5;color:#CFE3EC;text-align:center;min-height:2.6em;margin:0;text-wrap:balance}
.how b{color:var(--dusk)}.how .hl{display:inline-block}
.how .ptMore{border:0;background:none;color:#CFE3EC;font:800 12.5px/1.3 var(--round);padding:4px 10px;min-height:28px;cursor:pointer}.how .ptLong{display:block;max-width:340px;margin:0 auto;font-size:12px;line-height:1.45;color:#CFE3EC}.how .ptLong[hidden]{display:none}
.dres{position:static;flex:0 0 auto;width:100%;max-width:420px;box-sizing:border-box;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#0E2A3D;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.3)}.dres.kdFold .kd-res{display:none}body.kdEnd{overflow-y:auto}body.kdEnd #how{display:none}#kdDown{display:block;margin:0 auto;border:0;background:none;color:#FFE45C;font:800 13px/20px inherit;font-family:inherit;padding:2px 14px;min-height:24px;cursor:pointer}#kdDown[hidden]{display:none}      /* D308（GPT 1430 B②）：疊貨櫃結算提示「往下看今日挑戰結果 ▾」，字級同合成港，間距照本款原樣 */      /* D305：今日挑戰結算時，面板已寫正式／練習與剩幾次，下面黃條不再重複 */      /* D265（GPT 2330 B③）：今日挑戰面板放在變身／水族館按鈕下面，跟頁面一起捲，不再浮蓋結算 */.dres[hidden]{display:none}.dres .dx{display:block;margin:0 auto 4px;border:0;background:none;color:#CFE3EC;font:inherit;font-size:13px;font-weight:800;min-height:32px}.dres .kd-res{margin:0}
.top{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;font-weight:900;font-size:17px}
.top .back{color:#CFE3EC;text-decoration:none;font-size:13px;font-weight:700;padding:6px 10px;border:2px solid #2B4A60;border-radius:12px;white-space:nowrap}
.top b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .snd{font-family:var(--round);font-size:13px;font-weight:700;color:#CFE3EC;background:none;border:2px solid #2B4A60;border-radius:12px;padding:5px 10px;cursor:pointer;min-height:34px}
.top .snd[aria-pressed="false"]{opacity:.6}
@media (max-width:359px){.top{gap:6px;font-size:15px}.top .back{padding:6px 7px;font-size:12px}.top .snd{padding:5px 7px}}  /* D250：320 寬標題不再縮成「小…」 */

<script>
(() => {
'use strict';
const W = 360, H = 600, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1); cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const FONT = (s, w) => (w || 700) + ' ' + s + "px 'Zen Maru Gothic','Noto Sans TC',system-ui,sans-serif";

/* G97 每日挑戰：?daily=official／practice → 掉落順序、風和事件用當天固定亂數 */
const DS = window.KiteDaily ? KiteDaily.session() : null; let gR = Math.random; const grnd = (a, b) => a + gR() * (b - a), gpick = (a) => a[Math.floor(gR() * a.length)];

function kdLock() { const st = document.querySelector('.stage'); if (st && !document.body.classList.contains('kdEnd')) { st.style.flex = '0 0 ' + st.offsetHeight + 'px'; document.body.classList.add('kdEnd'); } }      /* D265：遊戲畫面維持原大小，面板接在下面、整頁往下捲 */
function dailyTag(extra) { if (!DS) return; const h = document.getElementById('how'); h.innerHTML = '<span class="kd-banner">' + (DS.official ? '📅 今日挑戰・正式（今天還有 ' + KiteDaily.left() + ' 次）' : '📅 今日挑戰・練習（不計榜）') + '</span><br>' + DS.td.vary + (extra || ''); }
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOW = {
  merge: '<span class="hl"><b>左右滑</b>選位置，<b>放手</b>海鮮就掉下去。</span><span class="hl">一樣的海鮮碰在一起<b>合成</b>變大，堆過紅線就結束。</span>',      /* D403（GPT 1947 Q2=C）：兩句各自成行，與合成港同步 */
  stack: '<span class="hl"><b>點一下</b>放下貨櫃，對齊下面那個。</span><span class="hl">連續<b>完美</b>貨櫃會變寬，<b>金貨櫃</b>大加分！</span><span class="hl">11～20 層<b>單程吊運</b>：只經過一次，錯過會回送。</span>'
};      /* D434：說明加單程吊運一句 */
const store = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let best = store.get('kiteMiniBest1', {}) || {};
function saveBest(k, v) { if (v > (best[k] || 0)) { best[k] = v; store.set('kiteMiniBest1', best); return true; } return false; }

/* ---------- 圖檔（G86；沒有就用程式畫的） ---------- */
const IMG = {};
function want(key, src) { const im = new Image(); im.onload = () => { IMG[key] = im; }; im.src = src; }
function ready(k) { return IMG[k] && IMG[k].naturalWidth > 0 ? IMG[k] : null; }
/* D371（主動待辦①：最後一擊慶典——合成港）：這局第一次合出鯨鯊、或兩隻鯨鯊游回大海時，3 秒內煙火 7 發在上方天空（GPT 1830 白圖、程式上色）＋大字「完成！」在新發現卡下方彈出；
   只是畫面，不改分數、判定、掉落；減少動態只 3 發、大字不彈跳。素材共用 fly/assets/fest/ */
const FEST_COL = ['#FFC21A', '#FF5C93', '#FF8A1F', '#B05CFF', '#FFE14D', '#4CC9F0'], festTint = {};
let fests = [], festTxt = null, festAcc = 0, festLeft = 0;
function festLoad() { for (const k of ['fw_radial', 'fw_fan', 'fw_star']) if (!IMG[k]) want(k, '../../fly/assets/fest/' + k + '.png'); if (!IMG.txt_done) want('txt_done', '../../fly/assets/fest/txt_done.webp'); }
function festImg(k, col) { const key = k + col; if (festTint[key]) return festTint[key]; const src = ready(k); if (!src) return null; const c = document.createElement('canvas'); c.width = src.naturalWidth; c.height = src.naturalHeight; const x = c.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return festTint[key] = c; }
function festBurst(x, y, sc) { const kinds = ['fw_radial', 'fw_fan', 'fw_star']; fests.push({ x, y, t: 0, life: 1.3, k: kinds[(Math.random() * 3) | 0], col: FEST_COL[(Math.random() * FEST_COL.length) | 0], s: (sc || 0.75 + Math.random() * 0.4) * W * 0.5, rot: Math.random() * 0.6 - 0.3 }); }
function festStart(x, y, r, card) { festLoad(); festLeft = RM ? 2 : 6; festAcc = 0.18; festBurst(clamp(x, 80, W - 80), 130, 1.2); const ty = clamp(y - (r || 0) - 30, 336, 356); festTxt = { t: 0, y: ty, k: card && ty < 356 ? 0.50 : 0.55 }; }      /* D373（GPT 2100）：高位且新發現卡同時顯示時，「完成！」再縮到 50%，不再往上移 */      /* D372（GPT 1955 A）：「完成！」寬 62%→55%、中心 382→356（鯨鯊頭頂高時再往上讓，最高 336，不壓新發現卡），讓出鯨鯊頭頂 */
function festPF() { const t = festTxt ? festTxt.t : 9; return t < 0.2 ? 1 - 0.85 * t / 0.2 : t < 1.5 ? 0.15 : t < 1.8 ? 0.15 + 0.85 * (t - 1.5) / 0.3 : 1; }      /* D375（GPT 2248 A）：慶典前 1.5 秒把瞄準預覽層（虛線、落點影子、金圈）淡到 15%，結束後 0.3 秒恢復；正在掉的海鮮本體不動 */
function festTick(dt) {
  for (const f of fests) f.t += dt; fests = fests.filter((f) => f.t < f.life);
  if (festLeft > 0) { festAcc -= dt; if (festAcc <= 0) { festLeft--; festAcc = 0.25 + Math.random() * 0.15; festBurst(W * 0.15 + Math.random() * W * 0.7, 80 + Math.random() * 110); } }
  if (festTxt) { festTxt.t += dt; if (festTxt.t > 3) festTxt = null; }
}
function drawFest() {
  ctx.save();
  for (const f of fests) { const im = festImg(f.k, f.col); if (!im) continue; const k = f.t / f.life, e = 1 - Math.pow(1 - Math.min(1, k * 2.2), 3), sz = f.s * (0.35 + 0.65 * e); ctx.globalAlpha = k < 0.6 ? 1 : Math.max(0, 1 - (k - 0.6) / 0.4); ctx.save(); ctx.translate(f.x, f.y + k * 18); ctx.rotate(f.rot); ctx.drawImage(im, -sz / 2, -sz / 2, sz, sz); ctx.restore(); }
  const T = festTxt, im = T && ready('txt_done');
  if (im) { const a = T.t, pop = RM ? 1 : a < 0.18 ? a / 0.18 * 1.18 : a < 0.32 ? 1.18 - (a - 0.18) / 0.14 * 0.18 : 1, w = W * (T.k || 0.55) * pop, h = w / 2; ctx.globalAlpha = a > 2.5 ? Math.max(0, 1 - (a - 2.5) / 0.5) : 1; ctx.translate(W / 2, T.y || 356); ctx.rotate(-0.04); ctx.drawImage(im, -w / 2, -h / 2, w, h); }
  ctx.restore();
}

/* ---------- 音效（短的合成音，不用音檔）與震動 ---------- */
let snd = store.get('kiteMiniSnd1', true), AC = null;
const sndBtn = document.getElementById('sndBtn');
function sndUI() { sndBtn.setAttribute('aria-pressed', String(!!snd)); sndBtn.textContent = snd ? '音效 開' : '音效 關'; }
sndBtn.addEventListener('click', () => { snd = !snd; store.set('kiteMiniSnd1', snd); sndUI(); if (snd) beep(660, 0.08); }); sndUI();
function beep(f, d, type, vol, slide) {
  if (!snd) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime; o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), t0 + d);

}
function jingle(fs, gap) { fs.forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.07), i * (gap || 90))); }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- 共用畫圖 ---------- */
function ell(x, y, rx, ry, fill, stroke, lw) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, 6.2832); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); } }
function poly(pts, fill, stroke, lw) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); } }

/* 小鳶正面展翅、兩腳往下抓東西（不用嘴叼）；有 G86 的 kite 圖就用圖。KITE_FOOT＝腳尖在圖裡的高度比例（G86：kite_hold 腳尖約在 148/256，kite_carry 在最下緣） */
const KITE_FOOT = { kite_hold: 0.6, kite_carry: 0.98 };
function drawKiteCarry(x, y, s, flap, key, holding) {
  const im = ready(key);
  if (im) {      // 拍翅動畫：有 G87 的拍翅序列圖（key_fly，橫排 4 格）就輪播；沒有就用上下起伏＋翅膀伸縮模擬
    const sz = 84 * s, foot = KITE_FOOT[key] || 0.95, sh = ready(key + '_fly');
    if (sh) { const n = 4, fw = sh.naturalWidth / n, fi = Math.floor((flap / 1.6) % n); ctx.drawImage(sh, fi * fw, 0, fw, sh.naturalHeight, x - sz / 2, y - sz * foot, sz, sz); return; }
    const ph = Math.sin(flap), sx = 1 + ph * 0.07, sy = 1 - ph * 0.05, bob = -ph * 2.5;
    ctx.save(); ctx.translate(x, y + bob); ctx.scale(sx, sy); ctx.drawImage(im, -sz / 2, -sz * foot, sz, sz); ctx.restore(); return; }

  for (const sx of [-5, 5]) { ctx.beginPath(); ctx.moveTo(sx, 8); ctx.lineTo(sx * 1.6, 24); ctx.stroke(); ctx.beginPath(); ctx.moveTo(sx * 1.6 - 4, 27); ctx.lineTo(sx * 1.6, 24); ctx.lineTo(sx * 1.6 + 4, 27); ctx.stroke(); }
  ctx.lineCap = 'butt';

  ell(0, -17, 8, 7, C.kite, C.ink, 2); ell(-3, -18, 2, 2, '#fff'); ell(3, -18, 2, 2, '#fff'); ell(-3, -17.5, 1, 1, C.ink); ell(3, -17.5, 1, 1, C.ink);

  ctx.restore();

function bubble(s, x, y) {      /* D254：泡泡可以兩行（\n 換行），尾巴跟著下緣 */
  ctx.font = FONT(13); const L = String(s).split('\n'), w = Math.max.apply(null, L.map((t) => ctx.measureText(t).width)) + 18, hh = 14 + (L.length - 1) * 8; x = clamp(x, w / 2 + 6, W - w / 2 - 6);
  rrect(x - w / 2, y - hh, w, hh * 2, 14, C.paper, C.ink, 2); poly([x - 6, y + hh - 1, x + 6, y + hh - 1, x, y + hh + 7], C.paper); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 6, y + hh); ctx.lineTo(x, y + hh + 7); ctx.lineTo(x + 6, y + hh); ctx.stroke();
