<style>
/* 版面：上面四個試玩分頁、中間直式遊戲畫面、下面一行怎麼玩。港灣黃昏配色，固定一套，不跟系統深淺色切換 */
:root{

</style>

<script>
(() => {
'use strict';
const W = 360, H = 600, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1); cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
const C = { ink: '#10293D', paper: '#FFF8EA', sea: '#1E6F86', dusk: '#F4B37A', kite: '#8A5A3A', belly: '#F2DDB8', leaf: '#4FBF88', warn: '#E8674A', gold: '#FFD66B' };
const FONT = (s, w) => (w || 700) + ' ' + s + "px 'Zen Maru Gothic','Noto Sans TC',system-ui,sans-serif";
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), pick = (a) => a[Math.floor(Math.random() * a.length)];
const HOW = {
  merge: '海鮮<b>自己往下掉</b>，手指<b>左右滑</b>決定落點，<b>點一下</b>直接丟到底。一樣的碰在一起就合成更大的；碰到別人就停住。<b>關卡越後面掉越快</b>，堆過紅線就結束。',
  stack: '<b>點一下</b>放下貨櫃。連 2 個完美貨櫃<b>變寬</b>，連 5 個<b>專注模式</b>變慢；<b>金貨櫃</b>大加分又補寬；每 10 層<b>裝滿一艘船</b>。12 層後會隨機出現<b>起風、趕船、起霧、折返</b>；沒放到有<b>一次</b>小鳶幫你接回來。'
};
let best = {}; try { best = JSON.parse(localStorage.getItem('kiteMiniBest1') || '{}') || {}; } catch (e) {}
function saveBest(k, v) { if (v > (best[k] || 0)) { best[k] = v; try { localStorage.setItem('kiteMiniBest1', JSON.stringify(best)); } catch (e) {} return true; } return false; }

/* ---------- 共用畫圖 ---------- */
function ell(x, y, rx, ry, fill, stroke, lw) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, 6.2832); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); } }
function poly(pts, fill, stroke, lw) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); } }
function rrect(x, y, w, h, r, fill, stroke, lw) { r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); } }
function text(s, x, y, size, color, align, w, outline) { ctx.font = FONT(size, w); ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; if (outline !== false) { ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); } ctx.fillStyle = color || C.paper; ctx.fillText(s, x, y); }
/* 小鳶（俯視偏側面、朝下叼東西）：簡化成展翅的黑鳶，魚尾形分叉尾巴 */
function drawKiteTop(x, y, s, flap) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const f = Math.sin(flap || 0) * 0.25;
  poly([-4, -14, -10, -26, 0, -20, 10, -26, 4, -14], C.kite, C.ink, 2);      // 分叉尾巴（上方）
  ctx.save(); ctx.rotate(-f); poly([-6, -4, -40, -12 - 8 * f, -36, 2, -8, 6], '#6E4529', C.ink, 2); ctx.restore();
  ctx.save(); ctx.rotate(f); poly([6, -4, 40, -12 - 8 * f, 36, 2, 8, 6], '#6E4529', C.ink, 2); ctx.restore();
  ell(0, 0, 10, 16, C.kite, C.ink, 2); ell(0, 3, 6, 9, C.belly);
  ell(0, 14, 8, 7, C.kite, C.ink, 2); ell(-3, 13, 2, 2, '#fff'); ell(3, 13, 2, 2, '#fff'); ell(-3, 13.5, 1, 1, C.ink); ell(3, 13.5, 1, 1, C.ink);
  poly([-3, 19, 3, 19, 0, 24], '#F2C14E', C.ink, 1.4);
  ctx.restore();
}
function bubble(s, x, y) { ctx.font = FONT(13); const w = ctx.measureText(s).width + 16; x = clamp(x, w / 2 + 4, W - w / 2 - 4); rrect(x - w / 2, y - 14, w, 26, 12, C.paper, C.ink, 2); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y - 1); }
let floats = []; function pop(s, x, y, col, big) { floats.push({ s, x, y, col: col || C.paper, life: 1, big: !!big }); }
function drawFloats(dt) { for (const f of floats) { f.life -= dt * 0.9; f.y -= 30 * dt; ctx.globalAlpha = clamp(f.life * 1.6, 0, 1); text(f.s, f.x, f.y, f.big ? 24 : 16, f.col); } ctx.globalAlpha = 1; floats = floats.filter((f) => f.life > 0); }
let parts = []; function burst(x, y, n, col) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), v = rnd(60, 220); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: col || C.gold, r: rnd(2, 4.5) }); } }
function drawParts(dt) { for (const p of parts) { p.life -= dt * 1.5; p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = clamp(p.life, 0, 1); ell(p.x, p.y, p.r, p.r, p.col); } ctx.globalAlpha = 1; parts = parts.filter((p) => p.life > 0); }
function hud(score, mid, right) {
  rrect(10, 10, 116, 30, 15, 'rgba(16,41,61,.75)'); text('分數 ' + Math.round(score), 68, 25, 15, C.paper, 'center', 700, false);
  if (right) { ctx.font = FONT(14); const w = ctx.measureText(right).width + 24; rrect(W - 10 - w, 10, w, 30, 15, 'rgba(16,41,61,.75)'); text(right, W - 10 - w / 2, 25, 14, C.paper, 'center', 700, false); }
  if (mid) { ctx.font = FONT(13); const w = ctx.measureText(mid).width + 22; rrect(W / 2 - w / 2, 46, w, 26, 13, 'rgba(16,41,61,.6)'); text(mid, W / 2, 59, 13, C.paper, 'center', 700, false); }
}
function card(title, lines, btn) {
  ctx.fillStyle = 'rgba(14,34,50,.55)'; ctx.fillRect(0, 0, W, H);
  const h = 124 + lines.length * 26; rrect(30, H / 2 - h / 2, W - 60, h, 22, C.paper, C.ink, 3);
  text(title, W / 2, H / 2 - h / 2 + 36, 26, C.ink, 'center', 900, false);
  lines.forEach((l, i) => { ctx.font = FONT(15, 500); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.fillText(l, W / 2, H / 2 - h / 2 + 78 + i * 26); });
  rrect(W / 2 - 80, H / 2 + h / 2 - 56, 160, 42, 21, C.leaf, C.ink, 2.5); text(btn, W / 2, H / 2 + h / 2 - 35, 17, C.paper, 'center', 900);
}

/* ================= A. 合成港（合成大西瓜類） ================= */
const SEAF = [      // 名字、半徑、顏色、分數
  ['小卷', 14, '#F7C9D6', 1], ['小丑魚', 18, '#FF9B4A', 3], ['河豚', 23, '#F2D36B', 6], ['螃蟹', 28, '#E2563E', 10], ['章魚', 34, '#C77DCC', 15],
  ['海龜', 41, '#6DBE7A', 21], ['鬼頭刀', 48, '#4FC1C9', 28], ['海豚', 56, '#7FA8D8', 36], ['翻車魚', 65, '#B8C4CC', 45], ['鯨鯊', 76, '#3A6E9E', 55]
];
const BOX = { l: 16, r: 344, floor: 572, line: 150 };
function drawSea(lv, x, y, r, rot) {
  const d = SEAF[lv]; ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  if (lv === 9) { ell(0, 0, r, r, d[2], C.ink, 2.5); for (let i = 0; i < 14; i++) { const a = i * 2.4, rr = r * 0.25 + (i * 37 % 10) / 10 * r * 0.6; ell(Math.cos(a) * rr, Math.sin(a) * rr, r * 0.06, r * 0.06, '#E6F2FA'); } }
  else ell(0, 0, r, r, d[2], C.ink, 2);
  if (lv === 3) for (const s of [-1, 1]) ell(s * r * 0.85, -r * 0.55, r * 0.28, r * 0.22, d[2], C.ink, 2);
  if (lv === 2) for (let i = 0; i < 8; i++) { const a = i * 0.785; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); ctx.lineTo(Math.cos(a) * (r + 4), Math.sin(a) * (r + 4)); ctx.stroke(); }
  if (lv === 1) { ctx.fillStyle = '#fff'; ctx.fillRect(-r * 0.15, -r, r * 0.3, r * 2); }
  if (lv === 5) { ctx.strokeStyle = '#3F8A4C'; ctx.lineWidth = 2; for (const k of [-0.4, 0, 0.4]) { ctx.beginPath(); ctx.arc(k * r, 0, r * 0.35, 0, 6.28); ctx.stroke(); } }
  const e = Math.max(2, r * 0.14); ell(-r * 0.32, -r * 0.1, e, e, '#fff'); ell(r * 0.32, -r * 0.1, e, e, '#fff'); ell(-r * 0.3, -r * 0.08, e * 0.55, e * 0.55, C.ink); ell(r * 0.34, -r * 0.08, e * 0.55, e * 0.55, C.ink);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.18, 0.3, 2.84); ctx.stroke();
  if (r >= 34) { ctx.font = FONT(Math.round(r * 0.32)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(16,41,61,.75)'; ctx.fillText(d[0], 0, r * 0.58); }
  ctx.restore();
}
/* 掉落版（D115）：東西自己往下掉，手指左右滑決定落點、點一下丟到底；碰到別人或船底就停住變成會滾的。
   每合成一定次數升一關，掉落速度變快；可連鎖加分。 */
const MF = { spd0: 60, spdUp: 36, spdMax: 380, steer: 600, fast: 1000, needBase: 3, needStep: 1 };  // D116：升關更快、加速更明顯
function makeMerge() {
  const g = { balls: [], fall: null, q: [], score: 0, done: false, over: 0, say: '', sayT: 0, top: 0, t: 0, lv: 1, merges: 0, need: MF.needBase + MF.needStep, chain: 0, chainT: 0, tx: W / 2, wait: 0.3, banner: '', bannerT: 0, tap: null };
  const gen = () => Math.floor(rnd(0, g.lv >= 4 ? 4 : 3) + (g.lv >= 7 && Math.random() < 0.25 ? 1 : 0));
  g.q = [gen(), gen()];
  g.spd = () => Math.min(MF.spdMax, MF.spd0 + (g.lv - 1) * MF.spdUp);
  g.spawn = () => {
    const lv = g.q.shift(); g.q.push(gen()); const r = SEAF[lv][1], x = clamp(g.tx, BOX.l + r, BOX.r - r);
    if (g.balls.some((b) => Math.hypot(b.x - x, b.y - 96) < b.r + r - 4)) { g.done = true; g.say = '船艙塞滿了！'; g.sayT = 2; return; }
    g.fall = { lv, x, y: 96, r, fast: false };
  };
  g.lock = (f) => { g.balls.push({ lv: f.lv, x: f.x, y: f.y, vx: 0, vy: f.fast ? 260 : g.spd(), r: f.r, age: 0, rot: 0 }); g.fall = null; g.wait = 0.18; };
  g.update = (dt) => {
    g.t += dt; if (g.sayT > 0) g.sayT -= dt; if (g.bannerT > 0) g.bannerT -= dt;
    if (g.chainT > 0) { g.chainT -= dt; if (g.chainT <= 0) g.chain = 0; }
    if (!g.fall && !g.done) { g.wait -= dt; if (g.wait <= 0) g.spawn(); }
    const f = g.fall;
    if (f) {
      const r = f.r, want = clamp(g.tx, BOX.l + r, BOX.r - r), mv = MF.steer * dt; f.x += clamp(want - f.x, -mv, mv);
      const steps = f.fast ? 4 : 1;
      for (let i = 0; i < steps && g.fall; i++) {
        f.y += (f.fast ? MF.fast : g.spd()) * dt / steps;
        if (f.y >= BOX.floor - r) { f.y = BOX.floor - r; g.lock(f); break; }
        const hit = g.balls.find((b) => Math.hypot(b.x - f.x, b.y - f.y) < b.r + r - 1);
        if (hit) { g.lock(f); break; }
      }
    }
    const sub = 3, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const b of g.balls) { b.vy += 1100 * h; b.x += b.vx * h; b.y += b.vy * h; b.rot += b.vx * h / b.r; b.age += h; }
      for (let it = 0; it < 4; it++) {
        for (let i = 0; i < g.balls.length; i++) {
          const a = g.balls[i];
          if (a.x < BOX.l + a.r) { a.x = BOX.l + a.r; a.vx *= -0.2; } if (a.x > BOX.r - a.r) { a.x = BOX.r - a.r; a.vx *= -0.2; }
          if (a.y > BOX.floor - a.r) { a.y = BOX.floor - a.r; a.vy *= -0.15; a.vx *= 0.96; }
          for (let j = i + 1; j < g.balls.length; j++) {
            const b = g.balls[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, ov = a.r + b.r - d;
            if (ov > 0) {
              if (a.lv === b.lv && !a.dead && !b.dead) { a.dead = b.dead = true; g.merge(a, b); continue; }
              const nx = dx / d, ny = dy / d, ma = a.r * a.r, mb = b.r * b.r, t = ma + mb;
              a.x -= nx * ov * mb / t; a.y -= ny * ov * mb / t; b.x += nx * ov * ma / t; b.y += ny * ov * ma / t;
              const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv < 0) { const imp = -1.15 * rv / t; a.vx -= imp * mb * nx; a.vy -= imp * mb * ny; b.vx += imp * ma * nx; b.vy += imp * ma * ny; }
            }
          }
        }
        g.balls = g.balls.filter((b) => !b.dead);
      }
      for (const b of g.balls) { b.vx *= 0.995; }
    }
    const high = g.balls.some((b) => b.age > 1.2 && b.y - b.r < BOX.line && Math.abs(b.vy) < 80);
    g.over = high ? g.over + dt : Math.max(0, g.over - dt * 2); if (g.over > 1.6) g.done = true;
  };
  g.merge = (a, b) => {
    const lv = a.lv + 1, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    g.chain = g.chainT > 0 ? g.chain + 1 : 1; g.chainT = 1.3; const mul = g.chain >= 2 ? g.chain : 1;
    burst(x, y, 10 + lv * 2, SEAF[Math.min(9, lv)][2]);
    if (lv > 9) { g.score += 200 * mul; pop('兩隻鯨鯊游回大海 +' + 200 * mul, W / 2, 220, C.gold, true); g.say = '哇——鯨鯊回家了！'; g.sayT = 2; }
    else {
      const pts = SEAF[lv][3] * mul; g.score += pts; pop((mul > 1 ? '連鎖×' + mul + ' ' : '') + '+' + pts, x, y - 20, mul > 1 || lv >= 5 ? C.gold : C.paper, mul > 1 || lv >= 5);
      g.balls.push({ lv, x, y, vx: 0, vy: -80, r: SEAF[lv][1], age: 0.5, rot: 0 });
      if (lv > g.top) { g.top = lv; if (lv >= 4) { g.say = ['', '', '', '', '章魚出現了！', '海龜來了！', '鬼頭刀好帥！', '是海豚耶！', '翻車魚！快到了！', '鯨鯊！！我們合出鯨鯊了！'][lv]; g.sayT = 2; } }
    }
    if (mul === 3) { g.say = '連鎖三次！'; g.sayT = 1.4; }
    g.merges++; if (g.merges >= g.need) { g.lv++; g.merges = 0; g.need = MF.needBase + MF.needStep * g.lv; g.score += 10 * g.lv; g.banner = '第 ' + g.lv + ' 關！更快了'; g.bannerT = 1.3; }
  };
  // 操作：手指位置決定落點（左右）；點一下或往下滑＝丟到底
  g.down = (x, y) => { g.tx = x; g.tap = { x, y, t: g.t }; };
  g.move = (x, y) => { g.tx = x; if (g.tap && y - g.tap.y > 45 && g.fall) { g.fall.fast = true; g.tap = null; } };
  g.up = () => { if (g.tap && g.t - g.tap.t < 0.25 && g.fall) g.fall.fast = true; g.tap = null; };
  g.draw = (tt) => {
    const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#8FD0E0'); gr.addColorStop(0.3, '#F6D2A8'); gr.addColorStop(1, '#2C7F96'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    rrect(BOX.l - 8, BOX.line - 10, BOX.r - BOX.l + 16, BOX.floor - BOX.line + 22, 14, 'rgba(255,255,255,.18)');
    ctx.fillStyle = '#B9814E'; ctx.fillRect(BOX.l - 8, BOX.floor, BOX.r - BOX.l + 16, 14); ctx.fillRect(BOX.l - 10, BOX.line - 10, 8, BOX.floor - BOX.line + 24); ctx.fillRect(BOX.r + 2, BOX.line - 10, 8, BOX.floor - BOX.line + 24);
    ctx.strokeStyle = g.over > 0 ? 'rgba(232,103,74,' + (0.6 + 0.4 * Math.sin(tt * 20)) + ')' : 'rgba(232,103,74,.6)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.moveTo(BOX.l, BOX.line); ctx.lineTo(BOX.r, BOX.line); ctx.stroke(); ctx.setLineDash([]);
    for (const b of g.balls) drawSea(b.lv, b.x, b.y, b.r, b.rot * 0.3);
    const f = g.fall;
    if (f) {
      // 落點預告：往下找第一個會碰到的位置，畫淡淡的影子
      let gy = BOX.floor - f.r; for (const b of g.balls) { const dx = Math.abs(b.x - f.x), rr = b.r + f.r - 1; if (dx < rr && b.y > f.y) { const yy = b.y - Math.sqrt(rr * rr - dx * dx); if (yy < gy) gy = yy; } }

    drawSea(g.q[0], W - 42, 108, Math.min(16, SEAF[g.q[0]][1]), 0); ctx.globalAlpha = 0.6; drawSea(g.q[1], W - 42, 140, Math.min(11, SEAF[g.q[1]][1]), 0); ctx.globalAlpha = 1;
    for (let i = 0; i < 10; i++) { const x = 22 + i * 21, y = 590; ctx.globalAlpha = i <= g.top ? 1 : 0.35; drawSea(i, x, y - 6, 8, 0); } ctx.globalAlpha = 1;

    if (g.bannerT > 0) { const k = clamp(g.bannerT * 1.5, 0, 1); ctx.globalAlpha = k; text(g.banner, W / 2, 250 - (1 - k) * 30, 26, C.gold, 'center', 900); ctx.globalAlpha = 1; }

  return g;
}

/* ================= B. 疊貨櫃（Stack 類） ================= */
const BOXC = ['#D6604A', '#3F7FBF', '#4FA36A', '#E8A33A', '#8A6AC0', '#2F9BA6'];
/* D115：疊貨櫃加料——金貨櫃（切齊大加分＋補寬）、每 10 層裝滿一艘船出港、12 層後偶爾起風（速度忽快忽慢）、

  goldEvery: 5, goldBonus: 30, goldGrow: 24, goldGrowOk: 10, shipEvery: 10, shipBonus: 50, evFrom: 12, evChance: 0.4, rushN: 5, rushK: 1.3, rushBonus: 15,      // D118：12 層後隨機狀況：起風(12+)、趕船(16+)、起霧(22+)、折返(28+)
  focusAt: 5, focusN: 3, focusK: 0.55, saves: 1 };
/* 小鳶正面展翅、兩腳往下抓住貨櫃頂（D117：不用嘴叼） */

  ctx.save(); ctx.rotate(f); poly([6, -6, 44, -18 + 10 * f, 40, 0, 9, 4], '#6E4529', C.ink, 2); ctx.restore();

function makeStack() {
  const base = { x: 80, w: 200 }, g = { blocks: [{ x: base.x, w: base.w, c: 0 }], mv: null, speed: 150, dir: 1, combo: 0, score: 0, done: false, cut: [], cam: 0, say: '', sayT: 0, ships: 0, shake: 0, t: 0, ship: null, flash: 0, focus: 0, saves: ST.saves };

    const n = g.blocks.length, top = g.blocks[n - 1], fromL = n % 2 === 0;
    let ev = null;

    g.dir = fromL ? 1 : -1; g.speed = Math.min(ST.spdMax, ST.spd0 + n * ST.spdUp) * (g.focus > 0 ? ST.focusK : 1) * (g.mv.rush ? ST.rushK : 1);
    if (g.focus > 0) g.focus--;
    if (g.mv.wind) { g.say = '起風了！速度忽快忽慢'; g.sayT = 1.2; }
    else if (g.mv.fog) { g.say = '起霧了！中間看不清楚'; g.sayT = 1.3; }
    else if (g.mv.rev) { g.say = '小心，小鳶會突然折返！'; g.sayT = 1.3; }
    else if (top.w < 40 && g.sayT <= 0) { g.say = '只剩一點點了，穩住！'; g.sayT = 1.4; }
  };
  g.spawn();
  g.tap = () => {
    if (!g.mv || g.done) return; const top = g.blocks[g.blocks.length - 1], m = g.mv;
    const l = Math.max(m.x, top.x), r = Math.min(m.x + m.w, top.x + top.w);
    if (r - l <= 0) {
      g.cut.push({ x: m.x, w: m.w, y: Y0 - g.blocks.length * BH, vy: 0, c: m.c, gold: m.gold }); g.shake = 0.5; g.combo = 0;

      g.mv = null; g.done = true; g.say = '咦——沒放到！'; g.sayT = 2; return;
    }
    const yTop = Y0 - g.blocks.length * BH - g.cam, tol = g.blocks.length <= ST.easyN ? ST.perfectEasy : ST.perfect;
    if (Math.abs(m.x - top.x) < tol) {

      const nw = Math.min(base.w, top.w + add); g.blocks.push({ x: clamp(top.x - (nw - top.w) / 2, 0, W - nw), w: nw, c: m.c, gold: m.gold });
      const pts = ST.layerPts + ST.perfectPts + g.combo * ST.comboPts + (m.gold ? ST.goldBonus : 0) + (m.rush ? ST.rushBonus : 0); g.score += pts; g.flash = 0.25;
      pop((m.gold ? '金貨櫃切齊！' : '完美 ×' + g.combo + (add > 0 ? '　變寬！' : '')) + ' +' + pts, W / 2, yTop - 30, C.gold, true);
      burst(W / 2, yTop + BH, m.gold ? 30 : 14, C.gold);
      if (g.combo === ST.focusAt) { g.focus = ST.focusN; g.say = '連 ' + ST.focusAt + ' 個完美！專注模式：接下來變慢'; g.sayT = 1.8; }
      else if (m.gold) { g.say = '金貨櫃！貨櫃變寬了'; g.sayT = 1.5; } else if (g.combo === 3) { g.say = '連三個完美！'; g.sayT = 1.5; }
    } else {

      if (m.gold) { const w2 = Math.min(base.w, nw + ST.goldGrowOk); nx = clamp(nx - (w2 - nw) / 2, 0, W - w2); nw = w2; pop('金貨櫃！還是變寬一點 +' + (ST.layerPts + 10), W / 2, yTop - 30, C.gold); g.score += 10; }
      g.blocks.push({ x: nx, w: nw, c: m.c, gold: m.gold }); g.score += ST.layerPts; g.shake = 0.18;
      const cx = m.x < l ? m.x : r, cw = m.x < l ? l - m.x : m.x + m.w - r; g.cut.push({ x: cx, w: cw, y: Y0 - g.blocks.length * BH + BH, vy: 0, c: m.c, gold: m.gold, vr: m.x < l ? -2 : 2, rot: 0 });
    }
    const n = g.blocks.length - 1;
    if (n % ST.shipEvery === 0 && n > 0) { g.ships++; g.score += ST.shipBonus; g.ship = { x: 40, t: 0 }; pop('第 ' + g.ships + ' 艘船裝滿出港！+' + ST.shipBonus, W / 2, 150, C.gold, true); g.say = '嗚——船出港囉！'; g.sayT = 1.8; }
    else if ([15, 25, 35, 45].includes(n)) { g.say = { 15: '看得到基隆嶼了！', 25: '雲在腳下耶～', 35: '好高好高！', 45: '快碰到星星了！' }[n]; g.sayT = 2; }
    g.spawn();
  };
  g.down = () => g.tap(); g.move = () => {}; g.up = () => {};
  g.update = (dt) => {
    g.t += dt; if (g.sayT > 0) g.sayT -= dt; if (g.shake > 0) g.shake -= dt; if (g.flash > 0) g.flash -= dt;
    if (g.mv) {
      const k = g.mv.wind ? 1 + 0.55 * Math.sin(g.t * 3.2 + g.mv.ph) : 1;
      g.mv.x += g.dir * g.speed * k * dt;
      if (g.mv.rev && !g.mv.flipped) { const c = g.mv.x + g.mv.w / 2; if ((g.dir > 0 && c > g.mv.flipAt) || (g.dir < 0 && c < g.mv.flipAt)) { g.mv.flipped = true; g.dir = -g.dir; } }
      if (g.mv.x > W - g.mv.w * 0.2 && g.dir > 0) g.dir = -1; if (g.mv.x < -g.mv.w * 0.8 && g.dir < 0) g.dir = 1;
    }
    if (g.ship) { g.ship.t += dt; g.ship.x += 70 * dt; if (g.ship.x > W + 120) g.ship = null; }
    for (const c of g.cut) { c.vy += 900 * dt; c.y += c.vy * dt; c.rot = (c.rot || 0) + (c.vr || 0) * dt; }
    g.cut = g.cut.filter((c) => c.y - g.cam < H + 80);

  };
  function crate(x, y, w, c, gold) {
    rrect(x, y, w, BH - 2, 3, gold ? '#F2C14E' : BOXC[c], C.ink, 2); ctx.strokeStyle = gold ? 'rgba(140,90,0,.35)' : 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
    for (let xx = x + 8; xx < x + w - 4; xx += 9) { ctx.beginPath(); ctx.moveTo(xx, y + 4); ctx.lineTo(xx, y + BH - 6); ctx.stroke(); }
    if (gold && w > 26) text('★', x + w / 2, y + BH / 2 - 1, 15, '#FFF4C2', 'center', 900);
  }
  function drawShip(x, y) { poly([x - 50, y, x + 50, y, x + 38, y + 18, x - 40, y + 18], '#C0473A', C.ink, 2); rrect(x - 30, y - 18, 22, 18, 2, BOXC[1], C.ink, 1.5); rrect(x - 6, y - 18, 22, 18, 2, BOXC[3], C.ink, 1.5); rrect(x + 18, y - 14, 16, 14, 2, '#FFF8EA', C.ink, 1.5); }
  g.draw = (tt) => {
    const hgt = g.blocks.length, k = clamp(hgt / 50, 0, 1);
    const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, k > 0.7 ? '#1A2450' : '#6FB6D0'); gr.addColorStop(1, k > 0.7 ? '#3A4A80' : '#F6C99A'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    if (k > 0.6) for (let i = 0; i < 30; i++) ell((i * 97) % W, (i * 53 + g.cam * 0.2) % H, 1.4, 1.4, 'rgba(255,255,255,' + (k - 0.5) + ')');
    ctx.save(); if (g.shake > 0) ctx.translate(rnd(-1, 1) * g.shake * 14, rnd(-1, 1) * g.shake * 8); ctx.translate(0, g.cam);
    ctx.fillStyle = '#2C7F96'; ctx.fillRect(0, Y0 + BH, W, 400); ctx.fillStyle = '#9C8B76'; ctx.fillRect(0, Y0 + BH - 2, W, 14);
    drawShip(g.ship ? g.ship.x : 40, Y0 + BH + 22);
    ctx.strokeStyle = '#C0473A'; ctx.lineWidth = 5; for (const cx of [30, 330]) { ctx.beginPath(); ctx.moveTo(cx, Y0 + BH); ctx.lineTo(cx, Y0 - 210); ctx.lineTo(cx + (cx < 100 ? 70 : -70), Y0 - 210); ctx.stroke(); }

    for (let i = 0; i < 5; i++) ell(((i * 130 + tt * 8) % (W + 100)) - 50, Y0 - 800 - i * 60, 40, 14, 'rgba(255,255,255,.7)');

      ctx.globalAlpha = fa; crate(g.mv.x, y, g.mv.w, g.mv.c, g.mv.gold); drawKiteCarry(mx, y - 20, 0.8, tt * (g.mv.wind || g.mv.rush ? 16 : 9)); ctx.globalAlpha = 1;
      if (g.mv.fog) for (let i = 0; i < 6; i++) ell(W / 2 + (i - 2.5) * 34 + Math.sin(tt + i) * 6, y - 4 + (i % 2) * 14, 44, 20, 'rgba(240,246,250,.5)');

/* ---------- 主迴圈 ---------- */
let mode = 'merge', G = null, state = 'ready', down = false, last = performance.now(), clock = 0, endInfo = null;
const TITLES = { merge: ['小鳶合成港', '自己會掉，左右滑選位置', '越後面掉越快，撐越久越高分'], stack: ['小鳶疊貨櫃', '點一下放下，切齊有連擊', '金貨櫃・裝滿船・小心起風'] };
function newGame() { floats = []; parts = []; G = { merge: makeMerge, stack: makeStack }[mode](); }
function setMode(m) { mode = m; document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.m === m))); document.getElementById('how').innerHTML = HOW[m]; state = 'ready'; newGame();  }
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.m)));
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (er) {} const p = pos(e);
  if (state === 'ready') { state = 'play'; if (mode === 'merge') { down = true; G.down(p.x, p.y); } return; }
  if (state === 'end') { if (endInfo && endInfo.t > 0.4) { newGame(); state = 'play'; if (mode === 'merge') { down = true; G.down(p.x, p.y); G.tap = null; } } return; }
  down = true; G.down(p.x, p.y);
});
cv.addEventListener('pointermove', (e) => { if (state !== 'play') return; const p = pos(e); if (down || mode === 'merge') G.move(p.x, p.y); });

cv.addEventListener('pointerup', upH); cv.addEventListener('pointercancel', upH);
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; clock += dt;
  if (state === 'play') { G.update(dt); if (G.done) { const s = Math.round(G.score), nb = saveBest(mode, s); endInfo = { s, nb, t: 0, lines: mode === 'merge' ? ['撐到第 ' + G.lv + ' 關，最大合到' + SEAF[G.top][0]] : ['疊了 ' + (G.blocks.length - 1) + ' 層，裝滿 ' + G.ships + ' 艘船'] }; state = 'end'; } }
  G.draw(clock);
  
  drawParts(dt); drawFloats(dt);
  if (state === 'ready') { const T = TITLES[mode]; card(T[0], [T[1], T[2], best[mode] ? '最佳 ' + best[mode] + ' 分' : '　'], '點一下開始'); }
  if (state === 'end') { endInfo.t += dt; card(endInfo.nb ? '新紀錄！' : '結束', [endInfo.s + ' 分'].concat(endInfo.lines, ['最佳 ' + (best[mode] || endInfo.s) + ' 分']), '再玩一次'); }
  requestAnimationFrame(frame);
}
let tab = 'stack';      // D119：放進遊戲大廳的單一遊戲版（不計分・隨時玩）
setMode(HOW[tab] ? tab : 'merge'); requestAnimationFrame(frame);
window.__mini = { get G() { return G; }, get state() { return state; }, setMode };
})();
