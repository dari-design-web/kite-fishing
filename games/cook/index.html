<style>
/* D527：廟口備餐盤（灰盒試作，不計分）。Dari 11/15 23:32「港口放行中規中矩，多花時間蒐集討論」→ Claude＋GPT 三回合討論定案（Claude產出\有意思的遊戲_回合3_定案_20261116_v1.md），三個灰盒的第一個。
   參考 Dicey Dungeons：手上的火候牌（小🔥／中🔥🔥／大🔥🔥🔥）各只能用一次，放進菜的格子；同一張大火給了湯，就沒得烤小卷。
   一局 3 波。每波：必做的菜（一定做得完）＋可選加點＋下一波預告。剩下的牌可以「留一張」到下一波（只多活一波）。
   第 1 局是固定教學局（GPT 回合 2 紙上原型），之後隨機出題；每題都先算出「最多能做幾道加點」，結算時跟你比。不存檔、不回報點數。 */
:root{--ink:#3B2A1E;--paper:#FFF8EC;--red:#D9453B;--gold:#F4BB42;--teal:#2F7F86;--line:#E5D4BA}

body{background:radial-gradient(120% 70% at 50% 0%,#7A2E22 0%,#4A1C16 55%,#2A100C 100%)}

.lantern::after{content:'';position:absolute;left:50%;bottom:-8px;width:2px;height:10px;background:#F4BB42;transform:translateX(-50%)}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);gap:10px;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;color:#fff}
.top h1{margin:0;font-size:16px;white-space:nowrap}
@media (max-width:400px){.top{gap:5px}.top h1{font-size:15px}.pill{padding:3px 8px;font-size:13px}.top button{padding:5px 9px;font-size:13px}}

.bar{display:flex;gap:10px}

.card .row{display:flex;gap:10px;margin-top:12px}
.card button{flex:1;border:0;border-radius:999px;font:inherit;font-weight:900;font-size:16px;padding:12px 8px;min-height:48px;background:var(--gold);color:#4A3426;box-shadow:0 4px 0 #C98A1A}
.card button.alt{background:#fff;border:2px solid #E5D4BA;box-shadow:none}
.muted{color:#7A6A5E;font-size:13px}
.howto{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;margin:10px 0;font-size:14px}
.howto b{font-size:20px}

@keyframes served{40%{transform:scale(1.08) rotate(-2deg)}100%{transform:none}}

@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dish.can .slot,.keep.can .slot,.dish.done,.card>div{animation:none}.chip.sel{transform:none}}
</style></head><body>

<div class="wrap">
  <div class="top"><h1>廟口備餐盤</h1><span class="pill" id="wv">第 1／3 波</span><span class="pill" id="sc">加點 0</span><span class="sp"></span><button id="snd" type="button" aria-pressed="true" aria-label="音效開關">🔊</button><button id="back" type="button">離開</button></div>

  <div class="board">

  </div>

</div>

<div class="card" id="intro"><div>
  <h2>🏮 廟口備餐盤</h2>
  <p>廟口夜市開張！手上的火候牌<b>每張只能用一次</b>，<br>放進菜的格子就會開始煮。</p>
  <div class="howto"><b>🔥</b><span>小火・🔥🔥 中火・🔥🔥🔥 大火<br>每道菜只吃標示的火候</span><b>⭐</b><span>黃框必做，做完才能出餐；灰底是加點，多做多賺</span><b>🫙</b><span>剩下的火可以留一張給下一波（看上面預告再決定）</span></div>
  <p class="muted">灰盒試作：不計分、不存檔。</p>
  <div class="row"><button type="button" id="go">開張！</button></div>
</div></div>
<div class="card" id="done" hidden><div>
  <h2>收攤囉！</h2>
  <div class="stars" id="stars"></div>
  <p id="sum"></p>
  <p class="muted">灰盒試作：不計分、不存檔。</p>
  <div class="row"><button type="button" id="same">同一題再試</button><button type="button" id="again">換一題</button></div>
  <div class="row"><button type="button" class="alt" id="out">回小鳶樂園</button></div>
</div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HEAT = { 1: '🔥', 2: '🔥🔥', 3: '🔥🔥🔥' }, HN = { 1: '小火', 2: '中火', 3: '大火' };
const MENU = {      /* acc：吃哪些火候 */
  tea: { em: '🍵', nm: '熱茶', acc: [1] },
  soup: { em: '🍲', nm: '魚丸湯', acc: [2, 3] },
  squid: { em: '🦑', nm: '烤小卷', acc: [3] },
  veg: { em: '🥬', nm: '炒青菜', acc: [1, 2] },
  tempura: { em: '🍤', nm: '天婦羅', acc: [2, 3] },
  dbc: { em: '🍜', nm: '鼎邊趖', acc: [2] },
  rice: { em: '🍚', nm: '滷肉飯', acc: [1] },
  crab: { em: '🦀', nm: '蒸螃蟹', acc: [3] }
};
/* 教學局（依 GPT 回合 2 紙上原型改）：第 1 波大火沒菜可用→留到第 2 波蒸螃蟹；不留最多 2 道、留了 3 道。 */
const TUTOR = [
  { chips: [1, 2, 3], must: ['tea', 'dbc'], opt: ['rice'] },      /* 大火這波用不到 → 教「留起來」 */
  { chips: [1, 2, 2], must: ['tea', 'soup'], opt: ['veg', 'crab'] },      /* 留的大火正好蒸螃蟹 */
  { chips: [1, 2, 3], must: ['tea', 'soup'], opt: ['squid'] }
];
let busy = false, seed = 1, tutor = true, waves = [], wi = 0, chips = [], kept = null, keepNext = null, sel = -1, place = {}, keepPick = -1, score = 0, sound = true, ac = null, hist = [], gameSeed = 1;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* ---------- 出題＋驗算 ---------- */
function fits(k, h) { return MENU[k].acc.includes(h); }
/* 一波能不能做完必做：把 chips 分給 must（每張一次） */
function assign(chs, dishes) {      /* 回傳所有「必做全滿」的分配（dish->chip index），chs 小陣列直接窮舉 */
  const out = []; const n = chs.length;
  function rec(i, used, m) { if (i === dishes.length) { out.push(m.slice()); return; } for (let j = 0; j < n; j++) if (!(used & (1 << j)) && fits(dishes[i], chs[j])) { m.push(j); rec(i + 1, used | (1 << j), m); m.pop(); } }
  rec(0, 0, []); return out;
}
/* 整局最多加點數：DP over 每波帶進來的留牌 */
function best(ws) {
  let states = new Map([[0, 0]]);      /* kept heat(0=none) -> best opt so far */
  for (const w of ws) {
    const nx = new Map();
    for (const [kh, sc] of states) {
      const chs = w.chips.concat(kh ? [kh] : []), n = chs.length;
      const all = [...w.must, ...w.opt];
      /* 窮舉每張牌去哪：must 必須滿 */
      const dest = Array(n).fill(-1);
      (function rec(j) {
        if (j === n) {
          const fill = {}; let ok = true, keepH = 0, optN = 0, keeps = 0;
          for (let a = 0; a < n; a++) { const d = dest[a]; if (d === -1) continue; if (d === -2) { keeps++; keepH = chs[a]; continue; } if (fill[d] !== undefined || !fits(all[d], chs[a])) { ok = false; break; } fill[d] = a; }
          if (!ok || keeps > 1) return; for (let m = 0; m < w.must.length; m++) if (fill[m] === undefined) return;
          for (let o = w.must.length; o < all.length; o++) if (fill[o] !== undefined) optN++;
          if (kh && dest[n - 1] === -2) return;      /* 帶進來的那張不能再留 */
          const v = sc + optN; if (!nx.has(keepH) || nx.get(keepH) < v) nx.set(keepH, v); return;
        }
        for (const d of [-1, -2, ...all.map((_, i) => i)]) { dest[j] = d; rec(j + 1); }
      })(0);
    }
    states = nx;
  }
  return Math.max(...states.values());
}
function bestNoKeep(ws) { return ws.reduce((s, w) => s + best([w]), 0); }
function makeGame() {
  for (let t = 0; t < 3000; t++) {
    const ws = [];
    for (let i = 0; i < 3; i++) {
      const n = rnd() < 0.5 ? 3 : 4, chips = Array.from({ length: n }, () => 1 + Math.floor(rnd() * 3));
      const keys = Object.keys(MENU); const must = [pick(keys), pick(keys)]; const opt = [pick(keys)]; if (rnd() < 0.6) opt.push(pick(keys));
      if (new Set([...must, ...opt]).size < must.length + opt.length) { i--; continue; }
      if (!assign(chips, must).length) { i--; continue; }      /* 必做一定能用當波的牌做完 */
      ws.push({ chips: chips.sort(), must, opt });
    }
    const b = best(ws), b0 = bestNoKeep(ws);
    if (b >= 3 && b > b0) return ws;      /* 要「留牌才拿得到滿分」，留牌這個決定才有意義 */
  }
  return TUTOR;
}

/* ---------- 畫面 ---------- */
function tone(f, d, type, g, slide) { if (!sound) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), a = ac.createGain(), n = ac.currentTime; o.type = type || 'sine'; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + d); a.gain.setValueAtTime(g || 0.1, n); a.gain.exponentialRampToValueAtTime(0.001, n + d); o.connect(a); a.connect(ac.destination); o.start(n); o.stop(n + d); } catch (e) {} }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let tipT = 0; function tip(t, ms) { const e = $('tip'); e.textContent = t; e.classList.remove('off'); clearTimeout(tipT); tipT = setTimeout(() => e.classList.add('off'), ms || 2400); }
function fx(el, txt) { const r = el.getBoundingClientRect(), d = document.createElement('div'); d.className = 'fx'; d.textContent = txt; d.style.left = (r.left + r.width / 2 - 30) + 'px'; d.style.top = (r.top + 8) + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
  if (!calm) for (let i = 0; i < 6; i++) { const s = document.createElement('div'); s.className = 'steam'; s.style.left = (r.left + r.width / 2 + (Math.random() - 0.5) * 40) + 'px'; s.style.top = (r.top + 30) + 'px'; s.style.setProperty('--dx', ((Math.random() - 0.5) * 30) + 'px'); document.body.appendChild(s); setTimeout(() => s.remove(), 900); } }
function wave() { return waves[wi]; }
function allDishes() { const w = wave(); return [...w.must.map((k) => ({ k, must: true })), ...w.opt.map((k) => ({ k, must: false }))]; }
function render() {
  const w = wave();
  $('wv').textContent = '第 ' + (wi + 1) + '／3 波'; $('sc').textContent = '加點 ' + score;
  const nw = waves[wi + 1];
  $('next').innerHTML = nw ? '<span>下一波預告：</span>' + nw.opt.map((k) => '<span class="mini">' + MENU[k].em + ' ' + MENU[k].nm + ' <small>' + MENU[k].acc.map((h) => HEAT[h]).join('／') + '</small></span>').join(' ') + '<span class="muted" style="color:#E9CFAE">（加點）</span>' : '<b>最後一波！</b>留的火到這裡就用掉';
  const ds = allDishes();
  $('dishes').innerHTML = ds.map((d, i) => { const m = MENU[d.k], c = place[i]; const can = sel >= 0 && c === undefined && fits(d.k, chips[sel].h); return '<div class="dish ' + (d.must ? 'must' : 'opt') + (c !== undefined ? ' filled' : '') + (sel >= 0 ? (can ? ' can' : ' no') : '') + '" data-i="' + i + '" role="button" aria-label="' + m.nm + (d.must ? '（必做）' : '（加點）') + '，吃' + m.acc.map((h) => HN[h]).join('或') + '"><span class="tag">' + (d.must ? '必做' : '加點') + '</span><div class="em">' + m.em + '</div><div class="nm">' + m.nm + '</div><div class="acc">' + m.acc.map((h) => '<span>' + HEAT[h] + '</span>').join('') + '</div><div class="slot">' + (c !== undefined ? HEAT[chips[c].h] : '') + '</div></div>'; }).join('');
  const last = wi === 2;
  $('keep').style.display = last ? 'none' : '';
  $('keep').classList.toggle('can', sel >= 0 && keepPick < 0 && !chips[sel].carried);
  $('keepSlot').textContent = keepPick >= 0 ? HEAT[chips[keepPick].h] : '　';
  $('hand').innerHTML = chips.map((c, i) => { const used = Object.values(place).includes(i) || keepPick === i; return '<button type="button" class="chip' + (c.carried ? ' kept' : '') + (sel === i ? ' sel' : '') + (used ? ' used' : '') + '" data-c="' + i + '" aria-label="' + HN[c.h] + (c.carried ? '（上一波留的）' : '') + '">' + HEAT[c.h] + '<small>' + (c.carried ? '留的' : HN[c.h]) + '</small></button>'; }).join('');
  const mustOk = ds.every((d, i) => !d.must || place[i] !== undefined);
  $('serve').disabled = !mustOk || busy;
  $('serve').textContent = mustOk ? '出餐！' : '必做還沒做完';
  $('hand').querySelectorAll('.chip').forEach((b) => (b.onclick = () => { if (busy) return; const i = +b.dataset.c; sel = sel === i ? -1 : i; tone(520, 0.05, 'triangle', 0.05); render(); }));
  $('dishes').querySelectorAll('.dish').forEach((b) => (b.onclick = () => putDish(+b.dataset.i, b)));
}
function putDish(i, el) {
  if (busy) return;
  if (sel < 0) { if (place[i] !== undefined) { hist.push({ k: 'dish', i, c: place[i] }); delete place[i]; tone(300, 0.08, 'sine', 0.05); render(); } else tip('先點下面一張火候牌，再點菜'); return; }
