<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>小鳶捕魚</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap">
<style>
/* Layout: one 9:16 stage centred on a deep-harbour ground. The canvas is the world; the HUD and panels are DOM on top of it. */
:root{
  --ground:#10293D; --ink:#17324A; --paper:#FFF8EA; --gold:#F4BB42; --coral:#E8674A; --sea:#2F7FA8; --muted:#5B7285; --line:#D9CDB4;
  --display:'LXGW WenKai TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:360px;height:640px;background:#BFE3F0;overflow:hidden}
/* D118：鯨鯊絕招鍵（和飛行冒險同一款）；釣魚累積能量，滿了才按得下去 */
.ult{position:absolute;z-index:7;right:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:80px;height:90px;padding:0;border:0;background:none;display:block;-webkit-tap-highlight-color:transparent}
.ult .ring{position:absolute;left:3px;top:0;width:74px;height:74px;border-radius:50%;border:2.5px solid var(--ink);background:conic-gradient(var(--gold) var(--fill,0%),#17324A 0);box-shadow:0 3px 0 rgba(16,41,61,.4)}
.ult .disc{position:absolute;left:11.5px;top:8.5px;width:57px;height:57px;border-radius:50%;border:2.5px solid var(--ink);background:radial-gradient(circle at 34% 26%,#EAF6FA,#A9D5E4 78%);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ult .disc img,.ult .disc svg{width:54px;height:54px;flex:none;transform:rotate(24deg);opacity:.62;filter:grayscale(.55);transition:opacity .2s,filter .2s}
.ult .disc img+svg{display:none}
.ult .tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);min-width:52px;padding:1px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;line-height:1.35;white-space:nowrap}
.ult:disabled{cursor:default}
.ult.ready .disc{background:radial-gradient(circle at 34% 26%,#FFF6CF,#F4BB42 78%)}
.ult.ready .disc img,.ult.ready .disc svg{opacity:1;filter:none}
.ult.ready .tag{background:var(--gold)}
.ult.ready .ring{animation:ultPulse 1.1s ease-in-out infinite}
.ult.ready:active .disc{transform:scale(.94)}
@keyframes ultPulse{0%,100%{box-shadow:0 3px 0 rgba(16,41,61,.4),0 0 0 0 rgba(244,187,66,.8)}50%{box-shadow:0 3px 0 rgba(16,41,61,.4),0 0 0 11px rgba(244,187,66,0)}}
@media (prefers-reduced-motion:reduce){.ult.ready .ring{animation:none}}
.ult[hidden]{display:none}
#sessionPick{display:grid!important;grid-template-columns:1fr 1fr;gap:6px}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.hud{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 12px;pointer-events:none}
.kg{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kg.pop{animation:pop .25s ease-out}
/* v0.16（C-94）：連抓徽章，數字更新就好，不每條都撒滿字 */
.combo{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);background:#BFF0D0;color:#10293D;border:2px solid #10293D;border-radius:999px;padding:0 9px;font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none}
.combo[hidden]{display:none}
.combo.bump{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.time{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.time span{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(23,50,74,.18);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);border-radius:999px;transform-origin:left center}
.bar i.low{background:var(--coral)}
.icon{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:13px;font-weight:700;padding:0;flex:none}

.banner{position:absolute;left:12px;right:12px;top:52px;text-align:center;background:var(--gold);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-family:var(--display);font-weight:700;font-size:16px;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 0 rgba(16,41,61,.6);pointer-events:none}

.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(16,41,61,.55)}
.card{width:100%;max-width:300px;max-height:100%;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;text-align:center}
.panel:not([hidden]) .card{animation:cardin .4s cubic-bezier(.2,1.3,.5,1) both}      /* v0.14（C-87）：開始／結算卡片彈出 */
@keyframes cardin{from{transform:translateY(24px) scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel:not([hidden]) .card{animation:none}}      /* C-91：選擇器要跟上面一樣才蓋得過（ChatGPT C-87 複查） */
.card h1{font-family:var(--display);font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.card h2{font-family:var(--display);font-size:24px;line-height:1.2;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 0 2px}.chips>div{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:6px;align-items:center;text-align:left;background:#F3EAD8;border-radius:12px;padding:7px 9px}.chips i{grid-row:1/3;font-style:normal;font-size:22px;line-height:1}.chips i img{display:block;width:36px;height:36px}.chips i img.big{width:44px;height:44px;margin:-4px}.chips b{font-size:14px}.chips span{font-size:11.5px;color:#5B6B78;line-height:1.3}.chips>div:not(#howRule){grid-template-columns:1fr;text-align:center;justify-items:center;padding:6px 4px}.chips>div:not(#howRule) i{grid-row:auto}#howRule{grid-column:1/-1}
.more{text-align:left;font-size:13px;margin:2px 0}.more summary{cursor:pointer;color:#2F7F86;font-weight:700;list-style:none;text-align:center;padding:4px}.more summary::after{content:' ▾'}.more[open] summary::after{content:' ▴'}.more .how{margin-top:6px}
.rows .xr{display:none}.rows.open .xr{display:block}.moreRows{display:block;margin:4px auto 0;border:0;background:none;color:#2F7F86;font:700 13px/1.4 inherit;font-family:inherit;cursor:pointer;padding:4px 10px}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;font-size:14px}
.how li{display:flex;gap:8px;align-items:baseline}
.how b{flex:none;min-width:3.6em;color:var(--ink)}
.btn{border:2px solid var(--ink);border-radius:999px;background:var(--gold);padding:10px 16px;font-weight:700;font-size:16px}
.btn.quiet{background:transparent;font-size:14px;padding:8px 14px}
.total{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:18px}
.rows{display:grid;grid-template-columns:minmax(45%,1fr) auto;gap:4px 12px;text-align:left;font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;font-variant-numeric:tabular-nums}
.rows span:nth-child(even){text-align:right;font-weight:700}
.new{color:var(--coral);font-weight:700;font-size:12px;margin-left:4px;white-space:nowrap;display:inline-block}
.ask{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px}
.ask div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yn{display:flex;gap:4px;flex:none}
.yn button{border:1.5px solid var(--ink);border-radius:999px;background:transparent;padding:2px 10px;font-size:13px}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#log{width:100%;height:70px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;color:var(--ink);resize:none;-webkit-user-select:text;user-select:text}
.note{font-size:12px;color:var(--muted)}
.kg.x2{background:var(--gold)}
.kg.x2::after{content:" ×2";font-size:14px}
.banner{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.035);box-shadow:0 0 0 4px rgba(244,187,66,.35)}}
.rank{align-self:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:0 14px}
.fact{font-size:13px;text-align:left;background:#fff;border:1px dashed var(--muted);border-radius:10px;padding:6px 9px;color:var(--ink)}
.headline{display:flex;align-items:center;justify-content:center;gap:10px}
.seal{align-self:center;font-size:12px;font-weight:700;color:var(--coral);border:2px solid var(--coral);border-radius:8px;padding:0 8px;transform:rotate(-3deg)}
.dex{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.dex button{border:1.5px solid var(--ink);border-radius:12px;background:#fff;padding:3px 3px 2px;font-size:11.5px;display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:44px}.dex button img{height:20px;max-width:40px;object-fit:contain}.dex button img.sil{filter:brightness(0);opacity:.35}
.dex button.fresh{background:var(--gold)}
#stage.dark .time span{color:#F5F8FA;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#stage.dark .bar i{background:#FFE08A}#stage.dark .bar i.low{background:var(--coral)}
.pick{display:flex;gap:6px;justify-content:center}
.pick button{flex:1;border:2px solid var(--ink);border-radius:12px;background:transparent;padding:5px 4px;font-size:13px;font-weight:700;line-height:1.3}
.pick button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pick button[aria-pressed="true"] small{color:#DCE6EC}
.pick button:disabled{opacity:.5}
.lucky{margin:0;padding:5px 10px;border-radius:999px;background:#FFF1C9;border:1.5px solid #E8C25A;font-size:13px;font-weight:700;color:#7A5410;text-align:center}
.dexline{font-size:13px;text-align:left;border:1.5px dashed var(--line);border-radius:10px;padding:6px 8px;color:var(--ink)}
.dexline .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.dexline .chips span{border:1.5px solid var(--ink);border-radius:999px;padding:0 6px;font-size:11px;background:#fff}
.dexline .chips span.no{border-style:dashed;color:var(--muted);background:transparent}
.bentoGot{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:#fff7e0;border:2px solid var(--ink);font-size:14px;font-weight:700}.bentoGot img{width:40px;height:40px;object-fit:contain}.bentoGot a{margin-left:auto;color:var(--ink);white-space:nowrap}
.nightTip{background:#25335F;border-color:#7C8BC4;color:#FFF4E2}
.bentoGot.near{background:#EAF5FA;border:2px dashed #3F8FB8;font-weight:500;font-size:13px;color:#1D4E66}
.recNote{margin:0;padding:6px 10px;border-radius:10px;background:#FFE9D6;border:2px dashed #E2702A;font-weight:700;text-align:center;font-size:14px;color:#8A3B12}
.recNote.win{background:var(--gold);border:2px solid var(--ink);color:inherit;animation:recPop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes recPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.unlock{margin:0;padding:6px 10px;border-radius:10px;background:var(--gold);border:2px solid var(--ink);font-weight:700;text-align:center;font-size:14px}
.dex button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dex button:disabled{border-style:dashed;opacity:.55;cursor:default}
.card.result{gap:8px;padding:14px 16px;max-width:312px}
.card.result h2{font-size:18px}
.card.result .total{font-size:40px}
.card.result .rows{font-size:13px;gap:2px 12px;padding:6px 0}
@media (prefers-reduced-motion:reduce){.kg.pop,.banner{animation:none}}

/* UX 走查（10/17）：可以點的地方至少 44px、字至少 12px */
#menuSnd{width:44px!important;height:44px!important}#sessionPick button,.pick button{min-height:44px!important}
.ptnote a{display:inline-block;padding:14px 4px;margin:-14px -4px}
/* D120（Dari 10/19「捕魚四關首頁一樣要做成關卡地圖，不要只是按鍵」）：和飛行一樣的關卡地圖；地圖圖檔 assets/stage_map_fish.jpg（720×1280，按鈕在右半邊） */
.fmap{padding:0;display:block;background:#2F7FA8}
.fmap .mapbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fmap .maptitle{position:absolute;left:3%;right:3%;top:1.6%;margin:0;padding:8px 12px;border-radius:14px;background:rgba(16,41,61,.82);border:2px solid #E8B879;color:var(--paper);font-family:var(--display);font-size:26px;line-height:1.2;text-align:center}
.fmap .maptitle small{display:block;font-family:inherit;font-size:13px;font-weight:700;color:#FFD58A;margin-top:2px}
.fmap #lbSlot{position:absolute;right:5%;top:2.6%;z-index:5}
.fmap .fst{position:absolute;left:52%;width:44%;min-height:9.4%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 10px;border-radius:12px;border:2px solid #E8B879;background:rgba(16,41,61,.86);color:var(--paper);text-align:left;font-size:12px;line-height:1.35;box-shadow:0 3px 0 rgba(8,20,32,.45);animation:stin .45s cubic-bezier(.2,1.4,.5,1) both;cursor:pointer}
.fmap .fst b{font-family:var(--display);font-size:15px}
.fmap .fst span{color:#F4D9A8;font-variant-numeric:tabular-nums}
.fmap .fst:nth-of-type(2){animation-delay:.08s}.fmap .fst:nth-of-type(3){animation-delay:.16s}.fmap .fst:nth-of-type(4){animation-delay:.24s}
.fmap .fst.next{border-color:#FFD36B;animation:stin .45s cubic-bezier(.2,1.4,.5,1) both,nextglow 1.8s ease-in-out .6s infinite}
.fmap .fst .go{position:absolute;left:-14px;top:-12px;padding:2px 8px;border-radius:999px;background:#C9473A;color:#fff;font-size:12px;font-weight:700;font-style:normal;border:2px solid #FFF4E2}
@keyframes stin{from{transform:translateY(14px) scale(.9);opacity:0}}
@keyframes nextglow{50%{box-shadow:0 3px 0 rgba(8,20,32,.45),0 0 0 4px rgba(255,211,107,.55),0 0 18px rgba(255,211,107,.6)}}
@media (prefers-reduced-motion:reduce){.fmap .fst,.fmap .fst.next{animation:none}}
.fmap .mapnote{position:absolute;left:12px;right:66px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-height:44px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;margin:0;padding:5px 10px;border-radius:10px;background:rgba(16,41,61,.8);color:#DCE6EC;font-size:12px;line-height:1.35}
.fmap .mapfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fmap .mapnote a{color:inherit;font-weight:800}
#sessionPick[hidden]{display:none}
.card .stgTitle{font-family:var(--display);font-size:15px;color:var(--muted);margin:-6px 0 0}h1 #lbSlot .klb-btn{min-height:44px!important}
.dexline .chips span{font-size:12px}
</style>

<style>/* QA 10/21：問卷與測試紀錄只在 ?test=1 顯示；開始／再玩一局釘在卡片底部，小手機也看得到 */
body:not(.qa) #ask, body:not(.qa) #copyBtn{display:none!important}
#startBtn,#againBtn{position:sticky;bottom:0;z-index:3;box-shadow:0 -8px 12px rgba(255,248,236,.9)}
</style>
</head>
<body>
<script>if (/[?&](test|qa)=1/.test(location.search)) document.body.classList.add('qa');</script>

function beep(f, d, type, g, slide) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain(), n = ac.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), n + d);
    a.gain.setValueAtTime(g || 0.07, n); a.gain.exponentialRampToValueAtTime(0.001, n + d);
    o.connect(a); a.connect(ac.destination); o.start(n); o.stop(n + d);
  } catch (e) {}
}

function phaseAt(time) { const P = LVL().phases || CONFIG.phases; return P.find((p) => time >= p.from && time < p.to) || P[P.length - 1]; }
function addFish(type, dir, speed, y, back, ph) {

}
function spawn(p0, forced) {
  const S = SES(), bo = S.boost || {}, w = {}; for (const k in p0.w) w[k] = p0.w[k] * (bo[k] === undefined ? 1 : bo[k]);
  const p = Object.assign({}, p0, { w, speedMul: p0.speedMul * (S.speedMul || 1) });      // 這一場的權重與速度
  const keys = Object.keys(p.w); let roll = Math.random() * keys.reduce((s, k) => s + p.w[k], 0), type = keys[0];
  for (const k of keys) { roll -= p.w[k]; if (roll <= 0) { type = k; break; } }
  if (forced) type = forced;
  const dir = Math.random() < 0.5 ? 1 : -1;
  if (type === 'trash') { const d = CONFIG.trash; things.push({ type, x: dir > 0 ? -30 : W + 30, y: rand(d.depth[0], d.depth[1]), vx: dir * rand(d.speed[0], d.speed[1]) * p.speedMul, r: d.r, ph: rand(0, 6.28), move: '' }); return; }
  const def = CONFIG.fish[type], sp = rand(def.speed[0], def.speed[1]) * p.speedMul, y = rand(def.depth[0], def.depth[1]);
  const n0 = things.length;
  if (def.school) {            // 小卷：一次來一群，同步一縮一放地前進
    const n = Math.round(rand(def.school[0], def.school[1])), ph = rand(0, 6.28);
    for (let i = 0; i < n; i++) addFish(type, dir, sp, Math.max(def.depth[0], Math.min(def.depth[1], y + rand(-18, 18))), i * 26 + rand(-4, 4), ph + rand(0, 0.5));
  } else addFish(type, dir, sp, y);
  if (RULE() === 'reef' && !def.rare && Math.random() < LVL().fromReef) {      // D119 第 3 關：大多數魚從礁石後面游出來
    const rf = LVL().reefs[Math.floor(Math.random() * LVL().reefs.length)], d2 = rf.x < W * 0.35 ? 1 : rf.x > W * 0.65 ? -1 : (Math.random() < 0.5 ? 1 : -1), ry = rf.y + rand(-rf.ry * 0.35, rf.ry * 0.35);

  }
  if (def.rare) { say('大物！' + def.name, dir > 0 ? 70 : W - 70, y - 26, '#FFE08A', true); jingle([392, 523, 784], 70); }
}
