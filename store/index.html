<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鳶來港・店家集點／服務台兌換</title>
<link rel="stylesheet" href="../shared/sys.css">
<style>
.net{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#DDF5E5;color:#167A3E}.net.off{background:#F8DCD6;color:var(--red)}
.amt{font-size:42px;font-weight:900;text-align:right;padding:10px 6px;border-bottom:2px solid var(--line);min-height:68px}
.amt small{font-size:16px;color:var(--muted);margin-right:4px}
.gets{text-align:right;color:var(--teal);font-weight:800;margin:6px 4px 10px;min-height:22px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:58px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:24px;font-weight:800}
.pad button:active{background:#E9F2F1}
.pad .c{color:var(--red);font-size:18px}
.qrCard{text-align:center}.qrCard .big{margin:6px 0 0}
.count{font-weight:800;color:var(--orange)}
.choose a{margin:0 0 12px}
.res{border:2px solid var(--teal)}.res.bad{border-color:var(--red)}
.res .pz{display:flex;gap:12px;align-items:center;margin-bottom:8px}.res .pz img{width:84px;height:84px;border-radius:12px;object-fit:contain;background:#F4EEE2;border:1px solid var(--line);flex:none}
.res .pz h2{margin:0;font-size:20px}.res .who{font-size:16px;font-weight:800;margin:2px 0}
.rcIn{display:flex;gap:8px;margin-top:10px}.rcIn input{flex:1;min-width:0;font-size:22px;font-weight:800;letter-spacing:4px;text-transform:uppercase;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px}
.ok{border:2px solid #2E9E5B;text-align:center;background:#F1FBF4}.ok .big{font-size:44px;line-height:1}.ok h2{margin:6px 0 2px;font-size:22px}.ok img{width:96px;height:96px;border-radius:14px;object-fit:contain;background:#fff;border:1px solid var(--line);margin:8px auto 0;display:block}
.wl li{cursor:pointer}
.shortCode{margin:10px auto 2px;display:inline-block;padding:6px 14px;border-radius:12px;background:#FFF1CC;color:#7A5A00;font-size:14px}.shortCode b{font-size:24px;letter-spacing:4px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:6px}
</style>
</head>
<body>
<header class="top"><a href="../portal/">‹ 主頁</a><h1 id="title">店家集點／贈品兌換</h1><span class="net" id="net">有網路</span></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="../shared/vendor/qrcode.js"></script>
<script src="../shared/vendor/jsQR.js"></script>
<script src="../shared/kite_core.js"></script>
<script src="../shared/kite_scan.js"></script>
<script>
/* 店家消費集點＋服務台贈品兌換（工作單 23，D71）。同一個入口，進來選要做哪一個。
   店家沒網路也能用：QR 在這台裝置上算好（含防偽簽章、一次性編號、10 分鐘有效），客人手機自己驗證入點；有網路時再補上傳（待接雲端）。 */
(function () {
  var $ = function (id) { return document.getElementById(id); }, app = $('app'), K = KiteCore;
  var mode = new URLSearchParams(location.search).get('m') || '', SK = 'kiteStoreSession1', scanner = null, timer = 0;
  function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 2200); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function net() { var n = $('net'); n.textContent = navigator.onLine ? '有網路' : '離線中（照樣可以集點）'; n.classList.toggle('off', !navigator.onLine); }
  addEventListener('online', net); addEventListener('offline', net); net();
  function sess() { try { return JSON.parse(sessionStorage.getItem(SK) || 'null'); } catch (e) { return null; } }
  function setSess(o) { try { sessionStorage.setItem(SK, JSON.stringify(o)); } catch (e) {} }
  function stopAll() { clearInterval(timer); if (scanner) { scanner.stop(); scanner = null; } }
  function t2(t) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function choose() {
    stopAll(); $('title').textContent = '店家集點／贈品兌換';
    app.innerHTML = '<div class="choose"><a class="btn full" href="?m=store" style="min-height:64px;font-size:18px">🧾 店家消費集點</a><a class="btn warn full" href="?m=desk" style="min-height:64px;font-size:18px">🎁 服務台贈品兌換</a></div>' +
      '<p class="note">建議：每家店用一支手機或平板，打開這個網頁、加到主畫面就能用，不用另外裝 App。</p>';
  }

  /* ====== 店家 ====== */
  function storeLogin() {
    stopAll(); $('title').textContent = '店家消費集點'; var c = K.cfg();
    app.innerHTML = '<div class="card"><h2>店家登入</h2><label class="f">店家<select id="st">' + c.stores.filter(function (s) { return s.on !== false; }).map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="f">店家密碼（4 碼）<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label><button class="btn full" id="go">登入</button>' +
      '<p class="note">測試用密碼：一樓咖啡 1111、港邊小吃 2222、文創選物 3333（後台可改）。</p></div>';
    $('go').onclick = function () { var s = K.storeById($('st').value); if (s && $('pin').value === s.pin) { setSess({ store: s.id }); storeHome(); } else toast('密碼不對'); };
  }
  var amount = '';
  function storeHome() {
    stopAll(); var se = sess(), s = se && K.storeById(se.store); if (!s) return storeLogin(); $('title').textContent = s.name; amount = '';
    var c = K.cfg();
    app.innerHTML = '<div class="card"><div class="muted">輸入消費金額（每 ' + c.spendPerPoint + ' 元 1 點）</div><div class="amt" id="amt"><small>NT$</small>0</div><div class="gets" id="gets"></div>' +
      '<div class="pad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(function (k) { return '<button type="button" data-k="' + k + '"' + (k === 'C' ? ' class="c"' : '') + '>' + k + '</button>'; }).join('') + '</div>' +
      '<button class="btn full" id="mk" style="margin-top:12px;min-height:56px;font-size:18px" disabled>產生集點 QR</button></div>' +
      '<div class="card"><h2>這台最近發出的</h2><ul class="list" id="recent"></ul><p class="note" id="sync"></p></div>' +
      '<button class="btn alt full" id="out">登出</button>';
    app.querySelectorAll('.pad button').forEach(function (b) { b.onclick = function () { var k = b.dataset.k; if (k === 'C') amount = ''; else if (k === '⌫') amount = amount.slice(0, -1); else if (amount.length < 6) amount = (amount + k).replace(/^0+/, ''); showAmt(); }; });
    $('mk').onclick = function () { var a = +amount; if (!a) return; var r = K.makeEarnCode(s.id, a); storeQR(s, a, r); };
    $('out').onclick = function () { setSess(null); storeLogin(); };
    renderRecent(s);
  }
  function showAmt() { var a = +amount || 0, p = K.pointsForSpend(a); $('amt').innerHTML = '<small>NT$</small>' + a.toLocaleString(); $('gets').textContent = a ? '預計可得 ' + p + ' 點' + (p === 0 ? '（未滿 ' + K.cfg().minSpend + ' 元不集點）' : '') : ''; $('mk').disabled = !a || !p; }
  function renderRecent(s) {
    var log = K.storeLog().filter(function (x) { return x.store === s.id; }), today = K.dayKey();
    var tl = log.filter(function (x) { return K.dayKey(x.t) === today; }), sum = tl.reduce(function (a, x) { return a + x.amount; }, 0), pts = tl.reduce(function (a, x) { return a + x.pts; }, 0);
    $('recent').innerHTML = log.slice(0, 6).map(function (x) { return '<li><span class="grow"><b>NT$ ' + x.amount.toLocaleString() + '・' + x.pts + ' 點</b><span class="muted">' + t2(x.t) + '・編號 ' + x.nonce + (x.reissue ? '・重出 ' + x.reissue + ' 次' : '') + '</span></span>' + (x.void ? '<span class="pill r">作廢</span>' : '') + '</li>'; }).join('') || '<li class="muted">還沒有</li>';
    $('sync').textContent = '今天 ' + tl.length + ' 筆、消費 NT$ ' + sum.toLocaleString() + '、發出 ' + pts + ' 點。上傳雲端：待接（原型先存在這台）。';
  }
  function storeQR(s, a, r) {
    stopAll(); var c = K.cfg(), end = Date.now() + c.qrExpireMin * 60000;
    app.innerHTML = '<div class="card qrCard"><div class="muted">' + esc(s.name) + '</div><div class="big">NT$ ' + a.toLocaleString() + '</div><div style="font-weight:800;color:var(--teal)">QR 已產生，尚未入帳。預計可得 ' + r.pts + ' 點</div><div class="muted">實際點數依入帳結果</div>' +
      '<div class="qrBox" id="qr" style="margin:12px 0"></div><div>請客人用「小鳶來港」官方 LINE 的 <b>掃碼集點</b> 掃這個 QR</div>' + (r.short ? '<div class="shortCode" id="short">手動代碼 <b>' + r.short.slice(0, 4) + ' ' + r.short.slice(4) + '</b></div>' : '') + '<div class="muted" style="margin-top:6px">有效時間還剩 <span class="count" id="cd"></span>・只能用一次</div></div>' +
      '<div class="row"><button class="btn alt" id="cp">複製代碼</button><button class="btn" id="nx">下一位</button></div><div class="row" style="margin-top:8px"><button class="btn alt" id="re">重新出碼（同一筆）</button><button class="btn alt" id="vd" style="color:var(--red)">作廢這筆</button></div><p class="note">客人掃到後要按「領取」才算數。逾時就按「重新出碼」：金額不變、還是同一筆，舊 QR 失效（最多 ' + c.reissueMax + ' 次）。沒有網路也能產生；正式版會在連線後由中央確認只入帳一次。</p>';
    KiteScan.drawQR($('qr'), r.code, Math.min(260, innerWidth - 90));
    $('cp').onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(r.code) : Promise.reject()).then(function () { toast('已複製代碼'); }, function () { prompt('長按複製代碼', r.code); }); };
    $('nx').onclick = storeHome;
    $('re').onclick = function () { if (!confirm('重新出碼後，舊 QR 和舊領取連結將失效；金額維持 ' + a.toLocaleString() + ' 元。')) return; var x = K.reissueEarn(r.nonce); if (!x.ok) return toast(x.msg); toast('已重新出碼，還能重出 ' + x.left + ' 次'); storeQR(s, a, x); };
    $('vd').onclick = function () { if (!confirm('作廢這筆？客人掃了也不會入點。')) return; K.voidEarn(r.nonce); toast('已作廢'); storeHome(); };
    var tick = function () { var left = Math.max(0, end - Date.now()), m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60; $('cd').textContent = m + ' 分 ' + String(sec).padStart(2, '0') + ' 秒'; if (!left) { clearInterval(timer); $('qr').style.opacity = .2; $('cd').textContent = '已逾時，請按「重新出碼」'; } };
    tick(); timer = setInterval(tick, 1000);
  }

  /* ====== 服務台 ====== */
  function deskLogin() {
    stopAll(); $('title').textContent = '服務台贈品兌換';
    app.innerHTML = '<div class="card"><h2>服務台登入</h2><label class="f">服務台人員（填名字，會記在發放紀錄）<input id="who" autocomplete="off" placeholder="例如：小美"></label><label class="f">服務台密碼<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label><button class="btn warn full" id="go">登入</button><p class="note">測試用密碼 0000（後台可改）。</p></div>';
    $('go').onclick = function () { if ($('pin').value === K.cfg().deskPin) { setSess({ desk: true, who: $('who').value.trim() || '服務台' }); deskHome(); } else toast('密碼不對'); };
  }
  function deskHome() {
    stopAll(); var se = sess(); if (!se || !se.desk) return deskLogin(); $('title').textContent = '服務台・' + se.who;
    app.innerHTML = '<div class="card"><h2>掃客人的兌換 QR</h2><p class="muted" style="margin:0 0 8px">掃碼只查詢，尚未發放。請核對贈品、數量及狀態；交付後按「確認已交付」。</p><div class="scanBox" id="scan"></div><p class="muted" id="smsg" style="margin:8px 0 0"></p>' +
      '<label class="muted" for="rc" style="display:block;margin-top:10px">QR 掃不到？請客人唸兌換單上的 6 碼兌換碼</label><div class="rcIn"><input id="rc" maxlength="7" autocomplete="off" autocapitalize="characters" placeholder="例：AB3K7Q"><button class="btn warn" id="rcGo">查詢</button></div>' +
      '<details style="margin-top:8px"><summary class="muted">貼上完整代碼（客人按「複製代碼」傳來的）</summary><textarea id="manual" rows="3" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:8px"></textarea><button class="btn alt full" id="chk">查詢</button></details></div>' +
      '<div id="res"></div><div class="card"><h2>待領取 <span class="muted" id="wn" style="font-size:14px;font-weight:400"></span></h2><ul class="list wl" id="wait"></ul><p class="note">只列得出這台看得到的兌換單（原型資料存在各自手機，D72）；接雲端後就是全館。</p></div>' + bfCard() + '<div class="card"><h2>今天發出的</h2><p class="muted" id="tsum" style="margin:-4px 0 6px"></p><ul class="list" id="today"></ul></div><div class="card"><h2>贈品庫存</h2><ul class="list" id="stock"></ul></div><button class="btn alt full" id="out">登出</button>';
    scanner = new KiteScan.Scanner($('scan'), function (code) { /* G60-03：核對卡或完成卡還在時不讀下一張碼 */ if ($('res').innerHTML) return; check(code); }, function (m) { $('smsg').textContent = m; }); scanner.start();
    $('chk').onclick = function () { var v = $('manual').value.trim(); if (/^[A-Za-z0-9]{6}$/.test(v)) byShort(v); else check(v); };
    $('rcGo').onclick = function () { byShort($('rc').value); };
    $('rc').onkeydown = function (e) { if (e.key === 'Enter') byShort($('rc').value); };
    $('rc').oninput = function () { var v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v !== this.value) this.value = v; };
    $('out').onclick = function () { setSess(null); deskLogin(); };
    renderDesk(); bindBf();
  }
  /* C-192：服務台手機頁的「補登」入口（D54：兩種都只限當天；經手人自動帶登入名字） */
  function bfCard() {
    return '<div class="card"><details id="bfBox"><summary><b>🧾 補登／交易恢復</b> <span class="muted">客人說沒集到點</span></summary>' +
      '<p class="muted" style="margin:8px 0">僅受理消費當天的交易恢復與一般補登。請核對消費日期及憑證。</p>' +
      '<label class="f">店家給的交易／QR 編號（有就先查）<input id="bfNo" autocomplete="off"></label><button class="btn alt full" id="bfLk">查詢原交易</button><div id="bfOut" class="muted" style="margin:6px 0"></div>' +
      '<label class="f">店家<select id="bfSt">' + K.cfg().stores.map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="f">合格金額（沒有原交易時）<input id="bfAmt" type="number" inputmode="numeric" min="1"></label><label class="f">收據／發票號碼<input id="bfRc" autocomplete="off"></label>' +
      '<label class="f">會員編號（客人「我的點數」上方）<input id="bfMem" autocomplete="off"></label><label class="f">理由<input id="bfWhy" placeholder="例：客人手機沒電"></label>' +
      '<button class="btn warn full" id="bfGo">送出補登</button><p class="note">有原交易編號 → 恢復原交易（不改金額）；沒有 → 憑收據一般補登。會員不在這支手機時只建案「待人工核對」，不會入帳。</p><ul class="list" id="bfList"></ul></details></div>';
  }
  function bindBf() {
    var no = function () { return $('bfNo').value.trim().toUpperCase(); };
    $('bfLk').onclick = function () { var x = K.lookupTx(no()); $('bfOut').innerHTML = !x ? '查無此交易，可改用收據一般補登。' : esc(x.store) + '・' + x.amount + ' 元・' + x.pts + ' 點・' + t2(x.t) + '・<b>' + x.status + '</b>' + (x.today ? '' : '・<b style="color:var(--red)">非當天，不能恢復</b>'); };
    $('bfGo').onclick = function () { var who = (sess() || {}).who || '服務台', o = no() ? { type: 'recover', nonce: no() } : { type: 'manual', store: $('bfSt').value, date: K.dayKey(), amount: $('bfAmt').value, receipt: $('bfRc').value.trim() };
      o.member = $('bfMem').value.trim(); o.by = who; o.reason = $('bfWhy').value.trim(); if (!o.member) return toast('請填會員編號');
      var r = K.backfill(o); if (!r.ok) return toast(r.msg); toast(r.case.status === 'done' ? '已入帳 ' + r.case.pts + ' 點' : '案件 ' + r.case.id + ' 已儲存，尚未入帳（待人工核對）'); ['bfNo', 'bfAmt', 'bfRc', 'bfWhy'].forEach(function (k) { $(k).value = ''; }); $('bfOut').textContent = ''; listBf(); };
    listBf();
  }
  function listBf() { var d = K.dayKey(), L = K.list('kiteBackfill1').filter(function (x) { return K.dayKey(x.t) === d; }); $('bfList').innerHTML = L.slice(0, 10).map(function (x) { return '<li><span class="grow"><b>' + (x.type === 'recover' ? '交易恢復' : '一般補登') + '・' + x.pts + ' 點</b><span class="muted">' + t2(x.t) + '・' + x.id + '・' + esc(x.by || '') + '</span></span><span class="pill' + (x.status === 'done' ? '' : ' r') + '">' + (x.status === 'done' ? '已入帳' : '待人工核對') + '</span></li>'; }).join(''); }
  /* D84：用 6 碼兌換碼查。查到就走同一個核對畫面；查不到說清楚原因 */
  function byShort(v) {
    v = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); var box = $('res');
    if (v.length !== 6) return toast('兌換碼是 6 碼英文和數字');
    var h = K.findRedeem(v), msg = '';
    if (!h) msg = '這台查不到兌換碼 ' + v + '。原型的兌換單存在客人自己的手機（D72），請改掃客人手機上的 QR。';
    else if (h.r.status === 'cancel') msg = '兌換碼 ' + v + ' 已被客人取消，點數已退回，不能發放';
    else if (h.r.status === 'expired') msg = '兌換碼 ' + v + ' 已逾期自動取消，點數已退回，不能發放';
    else if (!h.r.code) msg = '兌換碼 ' + v + ' 是匯入的資料，缺少驗證碼，請改掃客人手機上的 QR';
    if (msg) { box.innerHTML = '<div class="card res bad"><h2>⚠️ 不能發放</h2><p style="margin:0">' + esc(msg) + '</p><button class="btn alt full" id="again" style="margin-top:10px">繼續</button></div>'; $('again').onclick = function () { box.innerHTML = ''; }; box.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    $('rc').value = ''; check(h.r.code);
  }
  /* D98：小鳶旅行帶回的券（KITE1|C|…）——核對後按「確認使用」核銷，同一張不能用兩次 */
  function checkCoupon(code) {
    var r = K.couponCheck(code), box = $('res');
    box.innerHTML = r.ok ? '<div class="card res"><div class="muted">這是客人的優惠券</div><h2>🎟️ ' + esc(r.name) + '</h2><p style="margin:0">' + esc(r.desc || '') + '</p><p class="muted" style="margin:4px 0 10px">券號 ' + r.id + '・會員 ' + esc(r.member) + '・有效到 ' + t2(r.exp) + '</p><div class="row"><button class="btn alt" id="again">返回掃碼</button><button class="btn warn" id="use">確認使用</button></div></div>'
      : '<div class="card res bad"><h2>⚠️ 不能使用</h2><p style="margin:0">' + esc(r.msg) + '</p><button class="btn alt full" id="again" style="margin-top:10px">繼續掃</button></div>';
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('again').onclick = function () { box.innerHTML = ''; if (scanner) scanner.reset(); };
    if ($('use')) $('use').onclick = function () { var u = K.couponUse(code, sess().who); if (!u.ok) return toast(u.msg); box.innerHTML = '<div class="card ok"><div class="big">✅</div><h2>券已使用</h2><p style="margin:8px 0 2px;font-size:18px;font-weight:800">' + esc(u.name) + '</p><p class="muted" style="margin:0">券號 ' + u.id + '・' + t2(Date.now()) + '・經手 ' + esc(sess().who) + '</p><button class="btn warn full" id="next" style="margin-top:12px">下一位</button></div>'; $('next').onclick = function () { box.innerHTML = ''; if (scanner) scanner.reset(); }; };
  }
  function check(code) {
    if (String(code || '').indexOf('KITE1|C|') === 0) return checkCoupon(code);
    var r = K.deskCheck(code), box = $('res');
    if (!r.ok) { box.innerHTML = '<div class="card res bad"><h2>⚠️ 不能發放</h2><p style="margin:0">' + esc(r.msg) + '</p><button class="btn alt full" id="again" style="margin-top:10px">繼續掃</button></div>'; }
    else { var nm = K.memberName(r.member); box.innerHTML = '<div class="card res"><div class="pz"><img src="' + K.prizeImg(r.prize.id) + '" alt=""><div><div class="muted">請交付這個贈品 1 份</div><h2>🎁 ' + esc(r.prize.name) + '</h2></div></div><p class="who">' + (nm ? esc(nm) + ' <span class="muted" style="font-weight:400">' + esc(r.member) + '</span>' : '會員 ' + esc(r.member)) + '</p><p style="margin:0">兌換碼 <b style="letter-spacing:2px">' + r.rcode + '</b>・已扣 ' + r.pts + ' 點</p><p class="muted" style="margin:4px 0 10px">客人產生時間 ' + t2(r.t) + (r.late ? ' <span class="pill o">超過 ' + K.cfg().redeemExpireMin + ' 分鐘，請確認是本人</span>' : '') + '・實物現存 ' + r.stock + '（其中已保留 ' + r.reserved + '）' + '</p>' +
      '<div class="row"><button class="btn alt" id="again">返回掃碼</button><button class="btn warn" id="give"' + (r.stock <= 0 ? ' disabled' : '') + '>確認已交付</button></div></div>'; }
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('again').onclick = function () { box.innerHTML = ''; if (scanner) scanner.reset(); };
    if ($('give')) $('give').onclick = function () { var g = K.deskGive(code, sess().who); if (!g.ok) return toast(g.msg);
      box.innerHTML = '<div class="card ok" id="okCard"><div class="big">✅</div><h2>已交付</h2><img src="' + K.prizeImg(g.prize.id) + '" alt=""><p style="margin:8px 0 2px;font-size:18px;font-weight:800">' + esc(g.prize.name) + '</p><p class="muted" style="margin:0">兌換碼 ' + g.rcode + '・' + t2(Date.now()) + '・經手 ' + esc(sess().who) + '<br>這個贈品還可換 ' + K.stockLeft(g.prize.id) + ' 個</p><button class="btn warn full" id="next" style="margin-top:12px">下一位</button></div>';
      box.scrollIntoView({ behavior: 'smooth', block: 'start' }); renderDesk();
      $('next').onclick = function () { box.innerHTML = ''; if (scanner) scanner.reset(); window.scrollTo({ top: 0, behavior: 'smooth' }); }; };
  }
  function renderDesk() {
    var today = K.dayKey(), log = K.deskLog().filter(function (x) { return K.dayKey(x.t) === today; });
    var W = K.pendingRedeems(), hd = K.cfg().redeemHoldDays; $('wn').textContent = W.length ? W.length + ' 張・由舊到新' + (W.length > 15 ? '（只列最早 15 張，其他請用兌換碼查）' : '') : '';
    $('wait').innerHTML = W.slice(0, 15).map(function (x, i) { var nm = x.m.name || '', dl = hd ? x.r.t + hd * 86400000 : 0, soon = dl && dl - Date.now() < 3 * 86400000; return '<li data-w="' + x.r.id + '"><img src="' + K.prizeImg(x.r.prize) + '" alt="" style="width:40px;height:40px;border-radius:8px;object-fit:contain;background:#F4EEE2"><span class="grow"><b>' + esc(x.r.name) + '</b><span class="muted">' + x.r.id + '・' + (nm ? esc(nm) : esc(x.m.id)) + '・' + t2(x.r.t) + '</span></span>' + (soon ? '<span class="pill r">' + (dl <= Date.now() ? '已過期限' : '快到期') + '</span>' : '<span class="pill o">待領</span>') + '</li>'; }).join('') || '<li class="muted">目前沒有待領取的兌換單</li>';
    $('wait').querySelectorAll('[data-w]').forEach(function (li) { li.onclick = function () { byShort(li.dataset.w); }; });
    var sub = {}; log.forEach(function (x) { sub[x.prizeName] = (sub[x.prizeName] || 0) + 1; });
    $('tsum').textContent = log.length ? '共 ' + log.length + ' 份：' + Object.keys(sub).map(function (k) { return k + ' ' + sub[k]; }).join('、') : '';
    $('today').innerHTML = log.slice(0, 20).map(function (x) { return '<li><span class="grow"><b>' + esc(x.prizeName) + '</b><span class="muted">' + t2(x.t) + '・' + x.rcode + '・' + esc(x.staff) + (x.manual ? '（後台手動）' : '') + '</span></span></li>'; }).join('') || '<li class="muted">今天還沒有</li>';
    $('stock').innerHTML = K.cfg().prizes.map(function (p) { var l = K.stockLeft(p.id); return '<li><span class="grow"><b>' + esc(p.name) + '</b><span class="muted">' + p.points + ' 點</span></span><span class="muted" style="margin-right:6px">現存 ' + K.onHand(p.id) + '・保留 ' + K.reservedCount(p.id) + '</span><span class="pill' + (l <= 5 ? ' r' : '') + '">可換 ' + l + '</span></li>'; }).join('');
  }

  if (mode === 'store') { var s0 = sess(); if (s0 && s0.store) storeHome(); else storeLogin(); }
  else if (mode === 'desk') { var d0 = sess(); if (d0 && d0.desk) deskHome(); else deskLogin(); }
  else choose();
  window.__store = { storeHome: storeHome, deskHome: deskHome };
})();
</script>
</body>
</html>
