<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小鳶來港・後台管理</title>
<style>
/* 後台管理 桌面網頁版 v0.2（工作單 24，D73）——給電腦大螢幕用；手機能開但不特別設計 */
:root{--ink:#1F3A42;--muted:#6B7F86;--line:#E1E6E8;--bg:#F4F6F7;--card:#fff;--teal:#2F7F86;--teal2:#E6F1F1;--orange:#E2702A;--red:#C8442F;--green:#1E8A4C;--gold:#E8A93B;--side:#1F3A42}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px}
.login h1{margin:0 0 4px;font-size:22px}.login p{color:var(--muted);margin:0 0 18px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);color:#DDE8EA;padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font-weight:800;font-size:16px;color:#fff}.side .brand img{width:30px;height:30px;border-radius:50%;background:#fff}
.side .grp{font-size:11px;letter-spacing:1px;color:#8FA8AE;margin:14px 8px 4px}
.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:#DDE8EA;padding:8px 10px;border-radius:8px;cursor:pointer}
.side button:hover{background:rgba(255,255,255,.08)}.side button.on{background:var(--teal);color:#fff;font-weight:700}
.side .badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.main{min-width:0}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:10px 22px}
.bar h1{margin:0;font-size:18px;flex:0 0 auto}.bar .sp{flex:1}
.bar input{width:280px;padding:7px 12px;border:1px solid var(--line);border-radius:8px}
.bar .who{color:var(--muted)}
.content{padding:20px 22px 60px}
.test{background:#FFF4D9;border:1px solid #F1D79A;color:#7A5410;border-radius:10px;padding:8px 12px;margin:0 0 14px;font-size:13px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g21{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.card h2 .sp{flex:1}
.kpi b{display:block;font-size:26px;font-weight:800;margin-top:2px}.kpi span{color:var(--muted);font-size:12px}.kpi small{color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn.alt{background:#fff;color:var(--teal)}.btn.red{background:var(--red);border-color:var(--red)}.btn.sm{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:default}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;background:#FAFBFB;position:sticky;top:0;cursor:pointer;user-select:none}.tbl th.sorted::after{content:' ▾'}.tbl th.sorted.asc::after{content:' ▴'}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F6FAFA}.tbl td.num,.tbl th.num{text-align:right}
.tbl input,.tbl select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;width:100%;min-width:60px}
.scroll{overflow:auto;max-height:560px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form{display:grid;grid-template-columns:260px 1fr;gap:10px 14px;align-items:center}
.form label{color:var(--muted)}.form input,.form select,.form textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;max-width:360px;width:100%}
.form .hint{grid-column:2;margin-top:-6px;font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--teal2);color:var(--teal)}
.pill.o{background:#FCE8D9;color:#B4531A}.pill.r{background:#F8DCD6;color:var(--red)}.pill.g{background:#DDF3E5;color:var(--green)}.pill.gr{background:#ECEFF0;color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,96vw);background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);z-index:20;overflow-y:auto;padding:18px 20px;transform:translateX(105%);transition:transform .2s}
.drawer.on{transform:none}.drawer .x{float:right}
.heat{display:grid;grid-template-columns:28px repeat(24,1fr);gap:2px;font-size:10px;color:var(--muted)}.heat i{display:block;height:18px;border-radius:3px;background:#EEF3F3}
.alert{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.alert:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;z-index:50;display:none}
.days label{display:inline-flex;gap:2px;align-items:center;margin-right:6px}
svg text{font-family:inherit}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:sticky;z-index:6;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px}.side .grp,.side .brand{display:none}.side button{width:auto;flex:0 0 auto;white-space:nowrap}.bar{position:static;flex-wrap:wrap}.bar input{width:100%}.form{grid-template-columns:1fr}.form .hint{grid-column:1}.content{padding:12px}.g4{grid-template-columns:1fr 1fr}}      /* 手機能開、不特別設計（D73） */
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="../shared/kite_core.js"></script>
<script>
/* 小鳶來港 後台管理 桌面網頁版 v0.2（工作單 24 規格第 4 節；D71、D73、D74）
   帳號 dari／1677。資料先存在這台電腦的瀏覽器（D72），之後接雲端資料庫時改共用資料層即可。
   主頁不放這個連結（D73）；網址：…/kite-fishing/admin/ */
(function () {
  'use strict';
  var K = KiteCore, root = document.getElementById('root'), SK = 'kiteAdminSession2', view = 'dash', q = '';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 2200); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dt(t) { if (!t) return ''; var d = new Date(t); return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dd(t) { var d = new Date(t); return pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
  function mins(s) { s = s || 0; return s >= 3600 ? (s / 3600).toFixed(1) + ' 小時' : Math.round(s / 60) + ' 分鐘'; }
  function num(n) { return (n || 0).toLocaleString(); }
  function GN(g) { return K.GAMES[g] ? K.GAMES[g].name : g; }
  function LN(g, l) { return (K.GAMES[g] && K.GAMES[g].levels[l]) || l; }
  var TYPE = { store: '店家集點', backfill: '補登入點', game: '遊戲換點', travel: '旅行帶回', redeem: '兌換', refund: '退點', adjust: '手動調整', expire: '到期' };
  function TL(r) { return r.type === 'redeem' && r.virtual ? '兌換便當' : (TYPE[r.type] || r.type); }      // C-205：便當（虛擬商品）和實體贈品分開標

  /* ====== 登入（8 小時自動登出） ====== */
  function sess() { try { var s = JSON.parse(localStorage.getItem(SK) || 'null'); return s && Date.now() - s.t < 8 * 3600000 ? s : null; } catch (e) { return null; } }
  function login() {
    root.innerHTML = '<div class="login"><h1>小鳶來港 後台</h1><p>東三東四・官方 LINE 會員服務</p><div class="form" style="grid-template-columns:70px 1fr"><label>帳號</label><input id="u" autocomplete="username"><label>密碼</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn" id="go" style="margin-top:16px;width:100%;justify-content:center">登入</button><p class="small" style="margin:14px 0 0">原型：帳號密碼寫在網頁裡，不安全；正式版改雲端登入（工作單 24 第 4-1 節）。</p></div>';
    var go = function () { var a = K.cfg().admin, fail = +(localStorage.getItem('kiteAdminFail') || 0), lock = +(localStorage.getItem('kiteAdminLock') || 0);
      if (Date.now() < lock) return toast('登入失敗太多次，請 ' + Math.ceil((lock - Date.now()) / 60000) + ' 分鐘後再試');
      if ($('u').value.trim() === a.user && $('p').value === a.pass) { localStorage.setItem(SK, JSON.stringify({ u: a.user, t: Date.now() })); localStorage.removeItem('kiteAdminFail'); K.audit(a.user + ' 登入後台'); app(); }
      else { fail++; localStorage.setItem('kiteAdminFail', fail); if (fail >= 5) { localStorage.setItem('kiteAdminLock', Date.now() + 15 * 60000); localStorage.removeItem('kiteAdminFail'); } toast('帳號或密碼不對'); } };
    $('go').onclick = go; $('p').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }

  /* ====== 資料整理 ====== */
  function data() {
    var ms = K.allMembers(), plays = [], led = [], red = [];
    ms.forEach(function (m) { (m.plays || []).forEach(function (p) { plays.push(Object.assign({ mid: m.id }, p)); }); (m.ledger || []).forEach(function (e) { led.push(Object.assign({ mid: m.id }, e)); }); (m.redeems || []).forEach(function (r) { red.push(Object.assign({ mid: m.id }, r)); }); });
    led.sort(function (a, b) { return b.t - a.t; }); plays.sort(function (a, b) { return b.t - a.t; });
    return { ms: ms, plays: plays, led: led, red: red, desk: K.deskLog(), tx: K.storeLog(), cfg: K.cfg() };
  }
  function alerts(D) {
    var a = [], c = D.cfg, al = c.alerts || {};
    c.prizes.forEach(function (p) { var l = K.stockLeft(p.id); if (p.on !== false && l <= (p.warn != null ? p.warn : c.lowStockWarn)) a.push(['o', '庫存偏低：' + p.name + ' 剩 ' + l, 'prize']); });
    var seen = {}; D.tx.forEach(function (x) { seen[x.nonce] = (seen[x.nonce] || 0); });
    var byRef = {}; D.led.filter(function (e) { return e.type === 'store' && e.ref; }).forEach(function (e) { (byRef[e.ref] = byRef[e.ref] || {})[e.mid] = 1; }); Object.keys(byRef).forEach(function (r) { var ids = Object.keys(byRef[r]); if (ids.length > 1) a.push(['r', '同一張集點 QR 被 ' + ids.length + ' 個帳號領走：' + r + '（' + ids.join('、') + '）', 'points']); });      // D100
    var byM = {}; D.led.filter(function (e) { return e.type === 'store'; }).forEach(function (e) { (byM[e.mid] = byM[e.mid] || []).push(e.t); });
    Object.keys(byM).forEach(function (mid) { var ts = byM[mid].sort(); for (var i = 0; i + (al.burstCount || 5) - 1 < ts.length; i++) if (ts[i + (al.burstCount || 5) - 1] - ts[i] < (al.burstMin || 10) * 60000) { a.push(['r', '集點異常：會員 ' + mid + ' 在 ' + (al.burstMin || 10) + ' 分鐘內集點 ' + (al.burstCount || 5) + ' 次以上', 'points']); break; } });
    D.led.filter(function (e) { return e.type === 'store' && e.amount >= (al.bigAmount || 5000); }).slice(0, 3).forEach(function (e) { a.push(['o', '大額消費：' + e.storeName + ' NT$' + num(e.amount) + '（' + e.mid + '）', 'points']); });
    c.prizes.forEach(function (p) { var g0 = K.gap(p.id); if (g0) a.push(['r', '保留缺口：' + p.name + ' 實物比已保留少 ' + g0 + ' 個，已暫停新兌換', 'stock']); });
    var cf = K.list('kiteImportConflicts1').filter(function (x) { return x.status === 'open'; }).length; if (cf) a.push(['r', '匯入衝突待處理：' + cf + ' 筆（已隔離，沒有入帳）', 'system']);
    var bfp = K.list('kiteBackfill1').filter(function (x) { return x.status === 'pending' || x.status === 'check'; }).length; if (bfp) a.push(['o', '補登待人工核對：' + bfp + ' 筆（資料未齊，不算可用點數）', 'backfill']);
    var exp = D.ms.reduce(function (n, m) { return n + K.expiring(m, 30).due; }, 0); if (exp) a.push(['o', '30 天內會到期的點數：' + num(exp) + ' 點', 'points']);
    var noImg = c.prizes.filter(function (p) { return p.on !== false && !K.hasPrizeImg(p.id); }); if (noImg.length) a.push(['', '贈品還沒上傳實物照片：' + noImg.map(function (p) { return p.name; }).join('、') + '（客人看到的是暫用圖）', 'prize']);      // C-201
    var wait = D.red.filter(function (r) { return r.status === 'wait'; }).length; if (wait) a.push(['', '還沒領取的兌換單：' + wait + ' 張', 'prize']);
    var dw = new Date().getDay(); c.events.filter(function (e) { return e.on && e.days.indexOf(dw) >= 0; }).forEach(function (e) { a.push(['g', '今天的活動：' + e.title + '（' + (e.game === 'all' ? '全部遊戲' : GN(e.game)) + ' ×' + e.mult + '，' + e.from + '～' + e.to + '）', 'events']); });
    return a;
  }

  /* ====== 小圖表 ====== */
  function lineChart(series, labels, colors) {      // series: [[...],[...]]
    var W = 640, H = 180, P = 28, mx = Math.max(1, Math.max.apply(null, series.reduce(function (a, s) { return a.concat(s); }, []))), n = labels.length;
    var x = function (i) { return P + (W - P - 8) * (n <= 1 ? 0.5 : i / (n - 1)); }, y = function (v) { return H - 22 - (H - 40) * v / mx; };
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">';
    for (var k = 0; k <= 4; k++) { var yy = 18 + (H - 40) * k / 4; g += '<line x1="' + P + '" x2="' + (W - 8) + '" y1="' + yy + '" y2="' + yy + '" stroke="#EEF1F2"/><text x="' + (P - 4) + '" y="' + (yy + 4) + '" font-size="10" text-anchor="end" fill="#8A9AA0">' + Math.round(mx * (4 - k) / 4) + '</text>'; }
    labels.forEach(function (l, i) { if (n <= 10 || i % Math.ceil(n / 8) === 0) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="#8A9AA0">' + l + '</text>'; });
    series.forEach(function (s, si) { g += '<polyline fill="none" stroke="' + colors[si] + '" stroke-width="2.2" points="' + s.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ') + '"/>' + s.map(function (v, i) { return '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.5" fill="' + colors[si] + '"><title>' + labels[i] + '：' + v + '</title></circle>'; }).join(''); });
    return g + '</svg>';
  }
  function heat(times) {
    var h = []; for (var d = 0; d < 7; d++) h.push(new Array(24).fill(0)); times.forEach(function (t) { var x = new Date(t); h[x.getDay()][x.getHours()]++; });
    var mx = Math.max(1, Math.max.apply(null, h.map(function (r) { return Math.max.apply(null, r); }))), D = '日一二三四五六';
    var s = '<div class="heat"><span></span>' + Array.from({ length: 24 }, function (_, i) { return '<span style="text-align:center">' + (i % 3 ? '' : i) + '</span>'; }).join('');
    for (d = 1; d <= 7; d++) { var di = d % 7; s += '<span>' + D[di] + '</span>' + h[di].map(function (v, i) { return '<i title="星期' + D[di] + ' ' + i + ' 點：' + v + '" style="background:' + (v ? 'rgba(47,127,134,' + (0.15 + 0.85 * v / mx) + ')' : '#EEF3F3') + '"></i>'; }).join(''); }
    return s + '</div><div class="small muted" style="margin-top:6px">顏色越深越多人用（橫軸：幾點；直軸：星期幾）</div>';
  }
  function bars(vals, labels) {
    var mx = Math.max(1, Math.max.apply(null, vals)), W = 640, H = 160, bw = (W - 30) / vals.length;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' + vals.map(function (v, i) { var h = (H - 30) * v / mx; return '<rect x="' + (24 + i * bw + 2) + '" y="' + (H - 20 - h) + '" width="' + (bw - 4) + '" height="' + h + '" rx="3" fill="#2F7F86"><title>' + labels[i] + '：' + v + '</title></rect><text x="' + (24 + i * bw + bw / 2) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="#8A9AA0">' + labels[i] + '</text>'; }).join('') + '</svg>';
  }
  function median(a) { var n = a.length, h = Math.floor(n / 2); return n % 2 ? a[h] : (a[h - 1] + a[h]) / 2; }      // G60-10：偶數筆取中間兩筆平均（a 要先排序）
  function lastDays(n) { var a = []; for (var i = n - 1; i >= 0; i--) a.push(K.dayKey(Date.now() - i * 86400000)); return a; }

  /* ====== 表格（排序、CSV） ====== */
  function table(id, cols, rows, opt) {      // cols: [{k,t,num,f}]; rows: objects
    opt = opt || {}; var st = table.sort[id] || {};
    if (st.k) rows = rows.slice().sort(function (a, b) { var x = a[st.k], y = b[st.k]; return (x > y ? 1 : x < y ? -1 : 0) * (st.asc ? 1 : -1); });
    var h = '<div class="scroll"><table class="tbl" id="' + id + '"><tr>' + cols.map(function (c) { return '<th data-k="' + c.k + '" class="' + (c.num ? 'num ' : '') + (st.k === c.k ? 'sorted' + (st.asc ? ' asc' : '') : '') + '">' + c.t + '</th>'; }).join('') + '</tr>';
    h += rows.slice(0, opt.limit || 500).map(function (r, i) { return '<tr' + (opt.click ? ' class="click" data-i="' + i + '"' : '') + '>' + cols.map(function (c) { return '<td' + (c.num ? ' class="num"' : '') + '>' + (c.f ? c.f(r) : esc(r[c.k])) + '</td>'; }).join('') + '</tr>'; }).join('');
    if (!rows.length) h += '<tr><td colspan="' + cols.length + '" class="muted">沒有資料</td></tr>';
    h += '</table></div>'; if (rows.length > (opt.limit || 500)) h += '<div class="small muted">只顯示前 ' + (opt.limit || 500) + ' 筆（匯出 CSV 可以拿到全部）</div>';
    table.last[id] = { cols: cols, rows: rows, click: opt.click };
    return h;
  }
  table.sort = {}; table.last = {};
  function wireTable(id, rerender) {
    var el = $(id); if (!el) return; var L = table.last[id];
    el.querySelectorAll('th').forEach(function (th) { th.onclick = function () { var s = table.sort[id] || {}; table.sort[id] = { k: th.dataset.k, asc: s.k === th.dataset.k ? !s.asc : false }; rerender(); }; });
    if (L.click) el.querySelectorAll('tr.click').forEach(function (tr) { tr.onclick = function () { L.click(L.rows[+tr.dataset.i]); }; });
  }
  function csv(name, cols, rows) {
    var s = '﻿' + cols.map(function (c) { return '"' + c.t + '"'; }).join(',') + '\n' + rows.map(function (r) { return cols.map(function (c) { var v = c.csv ? c.csv(r) : r[c.k]; return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var b = new Blob([s], { type: 'text/csv;charset=utf-8' }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = name + '_' + K.dayKey() + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
    K.audit('匯出 ' + name + '（' + rows.length + ' 筆）');
  }
  function drawer(html) { var d = $('drawer'); d.innerHTML = '<button class="btn alt sm x" id="dx">✕ 關閉</button>' + html; d.classList.add('on'); $('dx').onclick = function () { d.classList.remove('on'); }; }

  /* ====== 主框架 ====== */

      '<div class="card" style="margin-top:14px"><h2>實物點交</h2><div class="filters">交班人 <input id="ho"> 接班人 <input id="hi"> 服務台 <input id="hd" value="服務台"></div><div class="scroll"><table class="tbl" id="shT"><tr><th>贈品</th><th class="num">系統應有（現存）</th><th>實際清點件數</th><th class="num">差異</th><th>原因</th></tr>' + g.prizes.map(function (p) { var oh = K.onHand(p.id); return '<tr data-pid="' + p.id + '" data-sys="' + oh + '"><td>' + esc(p.name) + '</td><td class="num">' + oh + '</td><td><input type="number" data-k="cnt" value="' + oh + '" style="width:90px"></td><td class="num" data-diff>0</td><td><input data-k="why"></td></tr>'; }).join('') + '</table></div><button class="btn" id="sv" style="margin-top:10px">送接班確認</button><p class="small muted">有差異會列「待追查」，交接完成不等於差異已結案；要調整庫存請走「庫存盤點」。</p></div>' +
      '<div class="card" style="margin-top:14px"><h2>交班單</h2>' + table('t_sh', [{ k: 't', t: '時間', f: function (r) { return dt(r.t); } }, { k: 'id', t: '單號' }, { k: 'out', t: '交班' }, { k: 'in', t: '接班' }, { k: 'range', t: '期間', f: function (r) { return esc(r.from.replace('T', ' ') + ' ～ ' + r.to.slice(11)); } }, { k: 'd', t: '差異品項', num: 1, f: function (r) { return r.items.filter(function (i) { return i.diff; }).length; } }, { k: 'status', t: '狀態', f: function (r) { return r.status === 'done' ? '<span class="pill g">已交接</span>' + (r.items.some(function (i) { return i.diff; }) ? ' <span class="pill r">差異待追查</span>' : '') : '<span class="pill o">待接班確認</span> <button class="btn sm" data-cf="' + r.id + '">接班人確認</button>'; } }], sh) + '</div>';
    $('rf').onclick = function () { V.shift.from = $('sf').value; V.shift.to = $('stt').value; app(); };
    $('shT').querySelectorAll('[data-k="cnt"]').forEach(function (i) { i.oninput = function () { var tr = i.closest('tr'), d = (+i.value || 0) - (+tr.dataset.sys); tr.querySelector('[data-diff]').textContent = (d > 0 ? '+' : '') + d; tr.querySelector('[data-diff]').style.color = d ? 'var(--red)' : ''; }; });
    $('sv').onclick = function () { var o = $('ho').value.trim(), i2 = $('hi').value.trim(); if (!o || !i2) return toast('請填交班人和接班人'); var items = [].map.call($('shT').querySelectorAll('tr[data-pid]'), function (tr) { var cnt = +tr.querySelector('[data-k="cnt"]').value; return { pid: tr.dataset.pid, sys: +tr.dataset.sys, cnt: cnt, diff: cnt - (+tr.dataset.sys), why: tr.querySelector('[data-k="why"]').value }; });
      var l = K.list('kiteShift1'); l.unshift({ id: 'SH' + K.rid(5), t: Date.now(), out: o, in: i2, desk: $('hd').value, from: from, to: to, sum: sum, items: items, status: 'wait' }); K.saveList('kiteShift1', l); K.audit('交班單（' + o + ' → ' + i2 + '）'); toast('已送接班確認'); app(); };
    c.querySelectorAll('[data-cf]').forEach(function (b) { b.onclick = function () { var l = K.list('kiteShift1'), s = l.filter(function (x) { return x.id === b.dataset.cf; })[0]; s.status = 'done'; s.doneT = Date.now(); K.saveList('kiteShift1', l); K.audit('接班確認 ' + s.id + '（' + s.in + '）'); app(); }; });
    wireTable('t_sh', app);
  };

  app();
  window.__admin = { go: function (v) { view = v; app(); }, member: memberDrawer };
})();
