<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖文選單原稿 2500×1200（C-194，D75）</title>
<style>
/* 官方 LINE 圖文選單原稿：用瀏覽器開這頁、截圖 2500×1200 就是可以上傳 LINE 的圖（LINE 限制：2500 寬、JPG/PNG、1MB 內）。
   版型照 Dari 10/15 附圖：上面一整條＋下面三格。正式插畫等 ChatGPT 畫好再換。 */
html,body{margin:0;padding:0}
body{width:2500px;height:1200px;overflow:hidden;font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;background:#FBF3E4;color:#4A3426;position:relative}
.paper{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(226,112,42,.06),transparent 40%),radial-gradient(circle at 85% 90%,rgba(47,127,134,.07),transparent 40%),#FBF3E4}
/* 上：小鳶樂園 */
.top{position:absolute;left:0;top:0;width:2500px;height:600px;overflow:hidden}
.top .bg{position:absolute;inset:0;background:url(../assets/bg_v2.jpg) center -860px/2500px auto no-repeat}
.top .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(251,243,228,.96) 0,rgba(251,243,228,.86) 34%,rgba(251,243,228,0) 62%)}
.top .kite{position:absolute;right:560px;top:150px;width:430px;transform:rotate(-6deg);filter:drop-shadow(0 18px 14px rgba(0,0,0,.18))}
.top .t{position:absolute;left:170px;top:120px}
.top .en{font-size:44px;letter-spacing:14px;color:#2F7F86;font-weight:700}
.top h1{margin:6px 0 0;font-size:176px;line-height:1.05;font-weight:900;letter-spacing:12px;color:#4A3426;text-shadow:0 4px 0 #fff}
.top .sub{margin-top:22px;display:inline-flex;align-items:center;gap:18px;background:#E2702A;color:#fff;font-size:52px;font-weight:800;padding:14px 46px;border-radius:999px;box-shadow:0 8px 0 #B4531A}
.top .sub b{font-size:58px}
/* 分隔線（虛線，跟附圖一樣的手作感） */
.hline{position:absolute;left:60px;right:60px;top:600px;border-top:6px dashed #D9B98F}
.vline{position:absolute;top:660px;bottom:60px;border-left:6px dashed #D9B98F}
/* 下：三格 */
.cell{position:absolute;top:600px;width:833px;height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.badge{position:relative;width:330px;height:330px;display:flex;align-items:center;justify-content:center}
.badge svg.sc{position:absolute;inset:0}
.badge svg.ic{position:relative;width:190px;height:190px}
.cell .lb{font-size:84px;font-weight:900;letter-spacing:10px}
.cell .ds{font-size:40px;color:#8A6E58;margin-top:-18px;letter-spacing:4px}
</style>
</head>
<body>
<div class="paper"></div>
<div class="top">
  <div class="bg"></div><div class="fade"></div>
  <img class="kite" src="../photo/assets/stk_kite_fly.png" alt="">

</div>
