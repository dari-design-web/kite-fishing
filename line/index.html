<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鳶來港・官方 LINE（示意）</title>
<link rel="stylesheet" href="../shared/sys.css">
<style>
/* 官方 LINE 示意 v2（C-194，D75）：上面是聊天室、下面是四格圖文選單（2500×1200 一張圖＋四個點擊區，跟真的 LINE 一樣）；
   點選單打開的頁面像 LIFF 一樣從下面蓋上來。 */
[hidden]{display:none!important}
body{background:#8DA7CF;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
/* LINE 聊天室頁首（白底） */
.lhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:#fff;color:#111;border-bottom:1px solid #E5E5E5}
.lhead a.bk{color:#111;text-decoration:none;font-size:26px;padding:0 6px;min-height:40px;display:flex;align-items:center}
.lhead .nm{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.lhead .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .vf{flex:0 0 auto;width:18px;height:18px}
.lhead .ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#333}
.testbar{flex:0 0 auto;background:#FFF4D6;color:#7A5A00;font-size:12px;text-align:center;padding:3px 8px}
/* 聊天室 */
.chat{flex:1;overflow-y:auto;padding:10px 10px 8px;scroll-behavior:smooth}
.day{display:table;margin:4px auto 12px;background:rgba(0,0,0,.18);color:#fff;font-size:11.5px;padding:2px 10px;border-radius:999px}
.msg{display:flex;gap:8px;align-items:flex-end;margin:0 0 10px}
.msg .av{width:36px;height:36px;border-radius:50%;background:#fff;flex:0 0 36px;align-self:flex-start;object-fit:cover}
.msg .col{max-width:80%;display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11.5px;color:#fff;opacity:.9;margin-left:2px}
.msg .row2{display:flex;align-items:flex-end;gap:5px}
.msg .b{background:#fff;border-radius:18px;padding:9px 13px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg .tm{font-size:10px;color:rgba(255,255,255,.95);white-space:nowrap}
.msg.me{justify-content:flex-end}.msg.me .b{background:#8DE055}
.msg .b a{color:var(--teal);font-weight:700}
.msg .stk{width:120px;height:120px;object-fit:contain}
/* Flex 訊息卡（LINE 的 Flex Message 樣子） */
.flex{background:#fff;border-radius:18px;overflow:hidden;width:260px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flex .hero{height:120px;background:#CFE8F0 url(../assets/bg_v2.jpg) center 30%/cover;position:relative}
.flex .hero img{position:absolute;right:8px;bottom:-6px;width:84px}
.flex .bd{padding:12px 14px 6px}.flex .bd h3{margin:0 0 4px;font-size:16px}.flex .bd p{margin:0;font-size:13px;color:#555}
.flex .ft{display:flex;flex-direction:column;gap:6px;padding:8px 12px 12px}
.flex .ft button{border:0;border-radius:10px;min-height:38px;font-weight:800;font-size:14px;background:#E9F2F1;color:var(--teal)}
.flex .ft button.p{background:var(--teal);color:#fff}
.flex .pts{display:flex;align-items:baseline;gap:4px}.flex .pts b{font-size:32px;color:var(--teal)}
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 2px 4px;scrollbar-width:none;max-width:calc(100vw - 64px)}
.carousel::-webkit-scrollbar{display:none}
.carousel .flex{flex:0 0 210px;scroll-snap-align:start}
.carousel .flex .hero{height:90px}
/* 圖文選單：一張 2500×1200 的圖＋四個點擊區 */
.rich{flex:0 0 auto;position:relative;background:#FBF3E4;line-height:0;transition:max-height .25s ease;max-height:60vh;overflow:hidden}
.rich img{width:100%;height:auto;display:block}
.rich button{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.rich button:active{background:rgba(47,127,134,.14)}
.rich .a1{left:0;top:0;width:100%;height:50%}.rich .a2{left:0;top:50%;width:33.32%;height:50%}.rich .a3{left:33.32%;top:50%;width:33.36%;height:50%}.rich .a4{left:66.68%;top:50%;width:33.32%;height:50%}
.rich.off{max-height:0}
.cbar{flex:0 0 auto;display:flex;align-items:center;background:#fff;border-top:1px solid #E5E5E5;padding:0 6px env(safe-area-inset-bottom,0px)}
.cbar .kb{width:44px;height:40px;display:flex;align-items:center;justify-content:center;color:#666}
.cbar button{flex:1;border:0;background:none;min-height:40px;font-size:13.5px;font-weight:700;color:#333}
/* LIFF 頁 */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:0 auto}
.sheet.on{display:flex;animation:up .22s ease-out}
/* D100：在官方 LINE 裡（LIFF）打開時，不顯示示意用的聊天室與圖文選單，直接是那一頁 */
body.inliff .lhead,body.inliff .chat,body.inliff .rich,body.inliff .cbar,body.inliff .testbar{display:none!important}body.inliff .sheet.on{animation:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .top{flex:0 0 auto}.sheet .wrap{flex:1;overflow-y:auto}
.sheet.park .top{background:#163F57;color:#fff;border-bottom:0}.sheet.park .top .lk,.sheet.park .top h1{color:#fff}
.sheet.park .wrap{padding:0;background:#163F57}
.ptsCard{background:linear-gradient(135deg,#2F7F86,#4FA9B8);color:#fff;border-radius:20px;padding:18px;margin:0 0 12px;position:relative;overflow:hidden}
.ptsCard .big{font-size:44px}.ptsCard small{opacity:.85}
.ptsCard img{position:absolute;right:8px;bottom:0;width:86px;opacity:.95}
.ev{border-left:4px solid var(--orange)}
.sub{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.sub button{border:0;background:#E9F2F1;color:var(--teal);font-weight:800;border-radius:999px;padding:6px 12px}
/* 手動代碼：一位數一格 */
.digits{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.digits input{width:34px;height:46px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:22px;font-weight:800;background:#fff;color:var(--ink);padding:0}
.digits input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,127,134,.15)}
.digits .gap{width:8px}
/* ====== 小鳶樂園（遊戲大廳） ====== */
.lobby{position:relative;min-height:100%;background:radial-gradient(circle at 15% 40%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/38px 38px,linear-gradient(#1C5470,#123447 70%,#0E2A3A);color:#fff;overflow:hidden}
.lb-hero{position:relative;height:270px;overflow:hidden}
.lb-hero .sky{position:absolute;inset:-6px;background:url(assets/lobby_hero_g57.jpg) center 40%/cover;animation:pan 18s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.04) translateX(-6px)}to{transform:scale(1.1) translateX(6px)}}
.lb-hero .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFF6C8;box-shadow:0 0 8px 3px rgba(255,236,160,.8);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.lb-hero .shade{position:absolute;inset:0;background:linear-gradient(rgba(22,63,87,0) 45%,rgba(28,84,112,.75) 80%,#1C5470)}
.lb-hero .cloud{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.75;filter:blur(1px);animation:drift 26s linear infinite}
.lb-hero .cloud:before,.lb-hero .cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.lb-hero .cloud:before{width:50px;height:50px;left:18px;top:-22px}.lb-hero .cloud:after{width:38px;height:38px;left:58px;top:-14px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.lb-hero .kite{position:absolute;width:118px;left:58%;top:26px;animation:soar 6s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
@keyframes soar{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(-18px,-10px) rotate(-12deg)}50%{transform:translate(-4px,8px) rotate(-2deg)}75%{transform:translate(14px,-4px) rotate(4deg)}}
.lb-hero .wave{position:absolute;left:0;bottom:-2px;width:200%;height:46px;animation:wave 7s linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.lb-title{position:absolute;left:16px;bottom:34px}
.lb-title small{display:block;letter-spacing:4px;font-size:12px;font-weight:800;color:#FFE3A3}
.lb-title b{display:block;font-size:30px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lb-player{position:relative;margin:-22px 12px 0;background:#fff;color:var(--ink);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.lb-player img{width:44px;height:44px;border-radius:50%;background:#FFF1CC}
.lb-player .s{flex:1;min-width:0}.lb-player .s b{display:block;font-size:15px}.lb-player .s span{font-size:12px;color:var(--muted)}
.lb-player .bank{text-align:right;font-size:11px;color:var(--muted)}.lb-player .bank b{display:block;font-size:18px;color:var(--orange)}
.lb-ev{margin:12px 12px 0;border-radius:14px;background:linear-gradient(90deg,#E2702A,#F2A33A);padding:9px 12px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;overflow:hidden;position:relative}
.lb-ev:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:110%}}
.lb-sec{margin:18px 12px 8px;color:#FFE3A3;font-weight:900;font-size:15px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.lb-sec:before{content:"";width:6px;height:16px;border-radius:3px;background:var(--orange)}
.lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.booth{position:relative;display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:20px;padding:8px 8px 10px;box-shadow:0 3px 0 #E3D9C8,0 6px 14px rgba(0,0,0,.06);animation:pop .45s ease-out both}
.booth:active{transform:translateY(2px);box-shadow:0 1px 0 #E3D9C8}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.booth .ic{display:block;width:100%;aspect-ratio:1/1;border-radius:16px;object-fit:cover;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.booth b{display:block;font-size:15px;margin:8px 2px 2px}
.booth .tip{display:block;font-size:11.5px;color:var(--muted);margin:0 2px;line-height:1.35;min-height:31px}
.booth .chip{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--teal)}
.booth .chip.o{background:var(--orange);color:#fff}.booth .chip.gr{background:rgba(0,0,0,.55);color:#fff}
.booth .bar{display:block;height:6px;border-radius:3px;background:#EFE6D6;margin:6px 2px 0;overflow:hidden}.booth .bar i{display:block;height:100%;background:linear-gradient(90deg,#2F7F86,#55B5B0);border-radius:3px}
.booth .pg{display:block;font-size:11px;color:var(--muted);margin:3px 2px 0}
.booth.feat{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:10px;background:linear-gradient(135deg,#FFF6E0,#FFE7C2)}
.booth.feat .ic{width:112px;flex:0 0 112px}
.booth.feat .tx{flex:1;min-width:0}
.booth.off{opacity:.6}
/* D102：今日積分條（分數到了那一格發亮，點一下領點數） */
.trk{position:relative;margin:12px 12px 0;background:#fff;color:var(--ink);border-radius:18px;padding:12px 10px 10px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.trk-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px}.trk-h b{font-size:15px}.trk-h .sp{flex:1}.trk-h .tot{font-size:12px;color:var(--muted)}.trk-h .tot b{font-size:15px;color:var(--orange)}
.trk-row{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);align-items:end}
.trk-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0;font:inherit;color:inherit;min-height:44px;justify-content:flex-end;cursor:default}

.trk-node img{width:30px;height:30px;display:block;object-fit:contain}.trk-node.lit img{animation:litp 1.6s ease-in-out infinite}
.trk-node .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:#EFE8DA;color:#A99B86;border:2px solid #E3D9C8;transition:transform .2s}
.trk-node.lit{cursor:pointer}.trk-node.lit .c{background:radial-gradient(circle at 35% 30%,#FFF6C8,#FFC531 55%,#E79A12);color:#7A4A00;border-color:#fff;box-shadow:0 0 0 3px rgba(255,197,49,.35),0 0 14px 4px rgba(255,197,49,.65);animation:litp 1.1s ease-in-out infinite}
@keyframes litp{50%{transform:scale(1.06) translateY(-1px)}}
.trk-node.got .c{background:#2F7F86;color:#fff;border-color:#2F7F86}
.trk-node.ev .c{width:34px;height:34px;font-size:16px}.trk-node.ev:not(.lit):not(.got) .c{border-style:dashed}
.trk-node .pop{position:absolute;top:-6px;font-weight:900;color:var(--orange);font-size:15px;animation:popup .9s ease-out forwards;pointer-events:none}
@keyframes popup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.trk-bar{position:relative;height:10px;border-radius:5px;background:#EFE8DA;margin:6px 0 4px;overflow:hidden}
.trk-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#2F7F86,#58B7A0);transition:width .6s ease-out}
.trk-bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);background-size:60px 100%;animation:barsh 1.6s linear infinite}
@keyframes barsh{from{background-position:-60px 0}to{background-position:200px 0}}
.trk-lab{display:grid;grid-template-columns:repeat(var(--n),1fr);font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.trk-lab span.on{color:#2F7F86;font-weight:800}
.trk-f{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}.trk-f .sp{flex:1}
.trk-f .btn{min-height:36px;padding:6px 12px;font-size:13px}
.trk-f .trk-go{min-height:44px;padding:6px 16px;font-size:15px;font-weight:900;display:flex;flex-direction:column;align-items:center;line-height:1.15;flex:none}.trk-f .trk-go small{font-size:12px;font-weight:700;opacity:.85}
.trk-f>span{flex:1}
.trk-ev{display:flex;align-items:center;gap:6px;margin-top:8px;border-radius:999px;background:#FFF3DA;padding:4px 12px 4px 4px;font-size:12.5px;width:max-content;max-width:100%}.trk-ev img{width:26px;height:26px}.trk-ev.lit{background:linear-gradient(90deg,#FFE3A3,#FFF3DA);font-weight:700}.trk-ev b{color:var(--orange)}
.st-note{margin:10px 12px 0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;padding:8px 12px}
.trk details{margin-top:6px;font-size:12px;color:var(--muted)}.trk summary{cursor:pointer;color:#2F7F86;font-weight:700}
.lb-player .mg{border:1px solid #E3D9C8;background:#FFF8EA;color:var(--ink);border-radius:12px;padding:6px 9px;font:inherit;font-size:12px;font-weight:800;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.trk-node.lit .c,.trk-node.lit img,.trk-bar i:after{animation:none}}
.lb-foot{padding:18px 12px calc(28px + env(safe-area-inset-bottom,0px));color:var(--ink)}
.lb-hero .sky{will-change:transform}
@media (prefers-reduced-motion:reduce){.lb-hero .sky,.lb-hero .spark,.lb-hero .cloud,.lb-hero .kite,.lb-hero .wave,.booth .ic,.lb-ev:after{animation:none}}
/* ====== 港口換禮 ====== */
.shopBan{margin:-14px -14px 0;aspect-ratio:3/1;background:url(assets/shop_header_g57.jpg) center/cover}
.shopHead{background:linear-gradient(135deg,#E2702A,#F2A33A);color:#fff;border-radius:20px;padding:14px 16px;margin:-26px 4px 12px;box-shadow:0 6px 14px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.shopHead .n{flex:1}.shopHead small{opacity:.9;font-size:12px}.shopHead .big{font-size:34px;line-height:1.1}
.shopHead button{border:0;background:rgba(255,255,255,.22);color:#fff;font-weight:800;border-radius:999px;padding:6px 12px}
.shopHead .warn{display:block;margin-top:4px;font-size:12px;font-weight:700;background:rgba(0,0,0,.18);border-radius:8px;padding:2px 8px}
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.good{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer}
.good .im{position:relative;aspect-ratio:1/1;background:#F4EEE2}
.good .im img{width:100%;height:100%;object-fit:contain;display:block}
.good .im .so{position:absolute;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted)}
.good .im .hot{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px}
.good .tx{padding:8px 10px 10px}.good .tx b{display:block;font-size:14px;line-height:1.35;min-height:38px}
.good .pp{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.good .pp .p{font-weight:900;color:var(--orange);font-size:16px}.good .pp .l{font-size:12px;color:var(--muted)}
.good.no .pp .p{color:var(--muted)}
.topPop{position:fixed;left:0;right:0;top:0;z-index:300;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;transform:translateY(-120%);transition:transform .35s cubic-bezier(.2,1.2,.4,1);pointer-events:none}.topPop.on{transform:none;pointer-events:auto}
.tpX{position:absolute;right:8px;top:6px;width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--muted)}
.topPop .tp{position:relative;max-width:480px;margin:0 auto;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:2px solid var(--teal);text-align:center}
.tpH{font-size:12.5px;color:var(--muted);font-weight:700}.tpS{font-weight:800;font-size:15px;margin-top:2px}.tpA{font-size:32px;font-weight:900;color:var(--ink);line-height:1.2}.tpM{font-size:12.5px;color:var(--muted)}.tpP{margin:6px 0 10px}.tpP b{color:var(--orange);font-size:18px}.tpP small{display:block;color:var(--muted);font-size:11.5px}.tpOk{font-size:34px}.topPop .row{gap:8px}
.lbrow{display:flex;align-items:center;gap:6px;margin:12px 12px 0}.lbrow span{color:#FFE3A3;font-weight:900;font-size:14px;margin-right:2px;white-space:nowrap}.lbrow button{flex:1;min-height:44px;border-radius:14px;border:0;background:#FFF6DE;color:#7A4A00;font:inherit;font-weight:800;font-size:14px}
.mtabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}.mtabs button{flex:1;white-space:nowrap;border:1px solid #E3D9C8;background:#fff;border-radius:999px;padding:9px 10px;font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);min-height:40px}.mtabs button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}.mtabs i{font-style:normal;background:var(--orange);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;font-size:11px}
.usedcp{opacity:.45;filter:grayscale(1)}
.qty{display:flex;align-items:center;gap:10px;margin:10px 2px}.qty span{font-weight:800;flex:1}.qty button{width:44px;height:44px;border-radius:12px;border:1px solid #E3D9C8;background:#fff;font-size:22px;font-weight:900;color:var(--ink)}.qty button:disabled{opacity:.35}.qty b{min-width:30px;text-align:center;font-size:22px}.qty small{color:var(--muted);font-size:12px}
.detail .im{border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:#F4EEE2;margin:0 0 12px}.detail .im img{width:100%;height:100%;object-fit:contain}
/* 底部確認框（取代瀏覽器的 confirm，比較像 LINE 裡的樣子） */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.modal h3{margin:0 0 6px;font-size:17px}.modal p{margin:0 0 14px;color:#444}
/* ====== 我的 ====== */
.meHead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px}
.meHead img{width:56px;height:56px;border-radius:50%;background:#FFF1CC}
.meHead .n{flex:1}.meHead .n b{display:block;font-size:17px}
.meHead .pt{text-align:right}.meHead .pt b{display:block;font-size:26px;color:var(--teal);line-height:1.1}
.meGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.meGrid button{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink)}
.meGrid button span{font-size:24px;line-height:1}
.meGrid .cnt{position:absolute;top:4px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
.gcard{display:flex;gap:12px;align-items:flex-start}
.gcard img{width:64px;height:64px;border-radius:14px;flex:0 0 64px;object-fit:cover}
.gcard .g{flex:1;min-width:0}.gcard .g b{display:block;font-size:15.5px}
.gbar{height:8px;border-radius:4px;background:#EFE6D6;overflow:hidden;margin:6px 0 2px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,#2F7F86,#55B5B0)}
.kv{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);margin-top:6px}.gcard .kv b{display:inline;color:var(--ink);font-size:12.5px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}.stat3 b{display:block;font-size:20px;color:var(--ink)}
/* G59 T04：還沒上傳實物照片的贈品標「示意圖」 */
.good .im .demo,.detail .im .demo{position:absolute;left:6px;bottom:6px;background:rgba(43,38,32,.72);color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;line-height:1.5}.detail .im{position:relative}

/* UX 走查（10/17）：可以點的地方至少 44px、字至少 12px */
#close,#back,#toMG,#toPts,.mtabs button,.tabs .pill,#toProf{min-height:44px!important}
.trk-lab{font-size:12px}.booth .tip{font-size:12.5px}.booth .chip{font-size:12px}.booth .pg{font-size:12px}.trk-node{position:relative}.trk-node::after{content:'';position:absolute;inset:-6px -2px}
/* G77：GPT 小圖示取代 emoji */
.gi{width:20px;height:20px;vertical-align:-4px;margin-right:4px;flex:none}.lbrow button{display:inline-flex;align-items:center;justify-content:center;gap:2px}.lbrow .gi{margin-right:0}.mtabs button .gi{width:18px;height:18px}
</style>

<script>
/* 客戶官方 LINE 系統（示意）v2（工作單 25，D75）。正式版：選單是 LINE 圖文選單（一張圖＋點擊區），點進去的頁面是 LIFF。
   原型：點數存在這支手機（D72），「我的」最下面可以清除資料重新開始。 */
(function () {
  var $ = function (id) { return document.getElementById(id); }, K = KiteCore, scanner = null;
  var KITE = '../travel/assets/kite_hello.png';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 2400); }
  function hm(t) { var d = new Date(t), h = d.getHours(); return (h < 12 ? '上午 ' : '下午 ') + ((h + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0'); }

  /* D82：活動今天的狀態（進行中／幾點開始／已結束），不要整天都寫「今天有」 */
  function evNow(e) { var d = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); return hm < e.from ? '今天 ' + e.from + ' 開始' : hm > e.to ? '今天已結束' : '進行中'; }
  /* ====== 聊天室開場（像官方帳號的歡迎訊息：文字＋Flex 卡片＋活動輪播） ====== */
  function waitCount() { return K.member().redeems.filter(function (r) { return r.status === 'wait'; }).length; }

    var m = K.member(), c = $('chat'), h = new Date().getHours(); c.innerHTML = '<div class="day">今天</div>';
    say((h < 11 ? '早安' : h < 17 ? '午安' : '晚上好') + (m.name ? '，' + esc(m.name) : '') + '！我是小鳶 🪶 歡迎來到東三東四～');
    if (m.status === 'frozen') say('⚠️ 你的會員帳號目前<b>暫停使用</b>，暫時不能集點和兌換。請到東三東四一樓服務台詢問。');      // D82 C4：凍結時先講清楚，不要等按了才跳錯
    var due = K.expiring(m, 30).due, wc = waitCount();

  }

  /* C-203：依情境的小鳶提醒（最多兩則；只看這支手機的資料） */

    else { var nx = c.prizes.filter(function (p) { return p.on !== false && p.points > m.points && K.stockLeft(p.id) > 0; }).sort(function (a, b) { return a.points - b.points; })[0]; if (nx && nx.points - m.points <= 10) say('✨ 再集 ' + (nx.points - m.points) + ' 點，就到「' + esc(nx.name) + '」的兌換點數囉！遊戲分數累積夠了，也能換點數喔。<br><a href="#" data-open="park">去小鳶樂園 ›</a>'); }
  }

  var stack = [];
  function open(p, arg, keep) { if (scanner) { scanner.stop(); scanner = null; } if (!keep) stack = []; stack.push([p, arg]); $('stitle').textContent = PAGES[p] || ''; if (INLIFF) document.title = (PAGES[p] || '') + '｜' + (K.cfg().site.name || '東三東四'); var sh = $('sheet'); sh.className = 'sheet on' + (p === 'park' ? ' park' : ''); $('back').hidden = stack.length < 2; $('sbody').scrollTop = 0; R[p](arg); }
  function go(p, arg) { open(p, arg, true); }
  /* D100：雲端同步回來（服務台發放、券核銷、後台調整、新設定）就重畫目前這頁；後台清空測試資料時整頁重新載入 */
  K.onCloud(function (e) { if (e && e.wiped) return location.reload(); if (scanner || document.querySelector('.modal')) return; var t = stack[stack.length - 1]; if (t && $('sheet').classList.contains('on') && ['points', 'mine', 'coupon', 'ticket', 'shop', 'item', 'park', 'mygames', 'me'].indexOf(t[0]) >= 0) { var y = $('sbody').scrollTop; R[t[0]](t[1]); $('sbody').scrollTop = y; } });

  function close() { if (scanner) { scanner.stop(); scanner = null; } if (INLIFF) { if (window.liff && liff.isInClient && liff.isInClient()) return liff.closeWindow(); stack = []; return open('park'); } $('sheet').className = 'sheet'; stack = []; }
  function back() { stack.pop(); var t = stack.pop(); if (t) open(t[0], t[1], true); else close(); }
  $('close').onclick = close; $('back').onclick = back;
  $('rich').querySelectorAll('button').forEach(function (b) { b.onclick = function () { if (b.dataset.p === 'shop') shopF = 'all'; open(b.dataset.p); }; });      // UX 走查：從選單進港口換禮回到「全部禮物」
  $('mtg').onclick = function () { var r = $('rich'), off = r.classList.toggle('off'); this.textContent = '小鳶選單 ' + (off ? '▴' : '▾'); };

  var R = {};

    { id: 'stack', href: '../games/stack/index.html', icon: '../hub/btn/m/btn_stack.webp', tip: '小鳶抓著貨櫃，對準了再放下' }

    var booth = function (g, i, big) {

      return gc.maint ? '<div class="booth off' + (big ? ' feat' : '') + '" style="animation-delay:' + (i * .06) + 's">' + inner + '</div>' : '<a class="booth' + (big ? ' feat' : '') + '" data-g="' + g.id + '" href="' + gameLink(g) + '" style="animation-delay:' + (i * .06) + 's">' + inner + '</a>';

    $('sbody').innerHTML = '<div class="lobby">' +

      '<label class="f">Email（選填）<input id="pfE" type="email" inputmode="email" value="' + esc(m.email || '') + '" placeholder="例：kite@example.com" autocomplete="email"></label>' +

  function batchCard(m) {      // C-191：每批點數與到期日（先到期的先用）

  R.mine = function (arg) {
    var rs = K.member().redeems; if (arg) R.mine.tab = arg; var TAB = R.mine.tab || 'gift';      // D103（Dari 10/17）：分成我的贈品／我的折價券／小鳶便當三頁
    var W = rs.filter(function (r) { return r.status === 'wait'; }), hd = K.cfg().redeemHoldDays, first = W.reduce(function (a, r) { return Math.min(a, r.t); }, Infinity);

    $('sbody').innerHTML = tabs + (TAB === 'coupon' ? mineCoupons() : TAB === 'bento' ? mineBento() : tip + '<div class="card"><ul class="list">' + (rs.map(function (r, i) { return '<li><img src="' + K.prizeImg(r.prize) + '" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover;background:#F4EEE2"><span class="grow"><b>' + esc(r.name) + ((r.qty || 1) > 1 ? ' ×' + r.qty : '') + '</b><span class="muted">' + t2(r.t) + '・' + r.id + '・' + r.pts + ' 點</span></span>' + (r.status === 'done' ? '<span class="pill g">已領取</span>' : r.status === 'cancel' || r.status === 'expired' ? '<span class="pill r">' + (r.status === 'expired' ? '已逾期（已退點）' : '已取消') + '</span>' : '<button class="btn warn" data-i="' + i + '">出示 QR</button>') + '</li>'; }).join('') || '<li class="muted">還沒有兌換，去「港口換禮」看看吧</li>') + '</ul></div>' + (K.cloudStatus().url ? '<p class="note">服務台發放後，這張會更新為「已領取」。如果還沒更新，請先問服務台，不要重複領取。</p>' : '<p class="note">原型：服務台在別支手機發放時，這裡要等接上雲端才會自動變「已領取」。</p>'));
    $('sbody').querySelectorAll('[data-mt]').forEach(function (b) { b.onclick = function () { R.mine.tab = b.dataset.mt; R.mine(); }; });
    $('sbody').querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { go('coupon', b.dataset.cp); }; });
    $('sbody').querySelectorAll('[data-i]').forEach(function (b) { b.onclick = function () { go('ticket', rs[+b.dataset.i].id); }; });
    $('sbody').querySelectorAll('[data-open]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go(a.dataset.open, a.dataset.arg); }; });
    if (TAB === 'gift') Array.prototype.slice.call($('sbody').querySelectorAll('.list > li')).forEach(function (li, i) { if (rs[i]) li.insertAdjacentHTML('afterend', steps(rs[i])); });
  };
  /* D98：小鳶旅行帶回的券（折扣券、抵用券），到店出示 QR 給店員核銷 */
  function mineCoupons() {
    var L = K.myCoupons(), st = function (x) { return x.status === 'used' ? '<span class="pill g">已使用</span>' : x.status === 'expired' ? '<span class="pill r">已過期</span>' : '<button class="btn warn" data-cp="' + x.id + '">出示 QR</button>'; };
    return '<p class="muted" style="margin:4px 4px 8px;font-size:13px">小鳶旅行帶回來的店家折價券。每張只能用一次，而且只能在券上寫的那間店使用；結帳前先看店家和期限，按「出示 QR」給店員掃，用過會標示「已使用」。</p><div class="card"><ul class="list">' + (L.map(function (x) { return '<li' + (x.status === 'ok' ? '' : ' class="usedcp"') + '>' + K.couponFaceHTML(x, 48) + '<span class="grow"><b>' + esc(x.name) + '</b><span class="muted">' + (x.store ? '適用：' + esc(x.store) + '・' : '') + (x.desc ? esc(x.desc) + '・' : '') + t2(x.exp) + ' 前有效</span></span>' + st(x) + '</li>'; }).join('') || '<li class="muted">還沒有券。小鳶去旅行時偶爾會帶回來</li>') + '</ul></div>';
  }
  R.coupon = function (id) {
    var x = K.myCoupons().filter(function (q) { return q.id === id; })[0]; if (!x) return back();
    $('sbody').innerHTML = '<div class="card" style="text-align:center"><div class="muted">' + (x.status === 'ok' ? '請在結帳時把這個 QR 給店員掃' : x.status === 'used' ? '這張券已經用過了' : '這張券已經過期') + '</div><div style="margin:8px 0 4px">' + K.couponFaceHTML(x, 180) + '</div><h2 style="font-size:20px;margin:6px 0">' + esc(x.name) + '</h2>' + (x.store ? '<div class="muted">適用專櫃：<b>' + esc(x.store) + '</b></div>' : '') + (x.status === 'ok' ? '<div class="qrBox" id="cq"></div>' : '<div style="font-size:48px;margin:6px 0">' + (x.status === 'used' ? '✅' : '⌛') + '</div>') + '<p style="margin:8px 0 0">券號 <b style="font-size:22px;letter-spacing:3px">' + x.id.slice(0, 3) + ' ' + x.id.slice(3) + '</b></p><p class="muted">' + (x.desc ? esc(x.desc) + '<br>' : '') + '有效到 ' + t2(x.exp) + '</p></div><button class="btn alt full" id="bk">看我的兌換</button>';
    if ($('cq')) KiteScan.drawQR($('cq'), x.code, Math.min(240, innerWidth - 100));
    $('bk').onclick = function () { go('mine', 'coupon'); };
    clearInterval(window.__cpWatch);      // UX 走查：出示 QR 時每 4 秒跟雲端對一次，店員一核銷就換成「已使用」，QR 不會一直留著
    if (x.status === 'ok' && K.cloudStatus().url) window.__cpWatch = setInterval(function () {
      var t = stack[stack.length - 1]; if (!t || t[0] !== 'coupon' || t[1] !== id || !$('sheet').classList.contains('on')) return clearInterval(window.__cpWatch);
      K.cloudPull(true).then(function () { var y = K.myCoupons().filter(function (q) { return q.id === id; })[0]; if (y && y.status !== 'ok') { clearInterval(window.__cpWatch); R.coupon(id); toast('這張券已經核銷完成 ✅'); } });
    }, 4000);
  };
  /* C-207：我的兌換也列出便當（虛擬商品，直接進便當盒，不用到服務台） */
  function mineBento() {
    var L = (K.member().ledger || []).filter(function (e) { return e.type === 'redeem' && e.virtual; }).slice(0, 30);
    return '<div class="card"><ul class="list">' + (L.map(function (e) { return '<li><img src="../travel/assets/bento_' + esc(e.bento) + '.png" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:contain;background:#FFF4DC"><span class="grow"><b>' + esc(e.prizeName || '便當') + '</b><span class="muted">' + t2(e.t) + '・' + (-e.pts) + ' 點</span></span><span class="pill g">已放進便當盒</span></li>'; }).join('') || '<li class="muted">還沒有換過便當</li>') + '</ul></div>' +
      (L.length ? '<a class="btn alt full" style="margin-top:10px" href="../travel/index.html?from=line">去「小鳶去旅行」打開便當盒 ›</a>' : '<button class="btn alt full" style="margin-top:10px" data-open="shop" data-arg="bento">去港口換禮看便當 ›</button>');
  }
  /* C-192：兌換單進度（扣點保留 → 待領取 → 已領取；取消／逾期 → 本機測試已退點） */
  function steps(r) {
    var hd = K.cfg().redeemHoldDays, dl = hd ? t2(r.t + hd * 86400000) : '';
    var S = r.status === 'done' ? [['已扣點保留', 1], ['待領取', 1], ['已領取', 1]] : r.status === 'wait' ? [['已扣點保留', 1], ['待領取' + (dl ? '（' + dl + ' 前）' : ''), 2], ['已領取', 0]] : [['已扣點保留', 1], [r.status === 'expired' ? '逾期未領' : '已取消', 1], ['已退回 ' + r.pts + ' 點', 1]];
    return '<li class="stepRow" style="display:flex;gap:4px;padding:2px 0 10px;border-top:0">' + S.map(function (s) { var c = s[1] === 1 ? 'var(--teal)' : s[1] === 2 ? '#E8833A' : 'var(--line)'; return '<span style="flex:1;font-size:11px;text-align:center;border-top:4px solid ' + c + ';padding-top:3px;color:' + (s[1] ? 'inherit' : 'var(--muted)') + '">' + esc(s[0]) + '</span>'; }).join('') + '</li>';
  }
  R.news = function () {
    var D = '日一二三四五六', ev = K.cfg().events.filter(function (e) { return e.on; }), today = new Date().getDay();
    var NS = K.notices(); $('sbody').innerHTML = NS.map(function (n) { return '<div class="card" style="border-left:4px solid var(--teal)">' + (n.pin ? '📌 ' : '') + '<b>' + esc(n.title) + '</b><p style="margin:4px 0 0">' + esc(n.body) + '</p></div>'; }).join('') + (ev.map(function (e) { var on = e.days.indexOf(today) >= 0; return '<div class="card ev"><b>' + esc(e.title) + '</b>' + (on ? ' <span class="pill o">' + evNow(e) + '</span>' : '') + '<p class="muted" style="margin:4px 0 0">' + esc(e.game === 'all' ? '全部遊戲' : K.GAMES[e.game] ? K.GAMES[e.game].name : e.game) + '・' + (K.cfg().gamePointMode === 'tier' ? '點數' : '分數') + ' ×' + e.mult + (e.dateFrom || e.dateTo ? '・' + (e.dateFrom || '') + '～' + (e.dateTo || '') : '') + '・' + (e.days.length === 7 ? '每天' : '星期' + e.days.slice().sort(function (a, b) { return (a || 7) - (b || 7); }).map(function (d) { return D[d]; }).join('、')) + '・' + e.from + '～' + e.to + '</p></div>'; }).join('') || '<div class="card muted">目前沒有活動</div>');
  };

  hello();
  /* D100：在官方 LINE 裡打開時用 LINE 帳號登入（LIFF_ID 設好之後才會動作）；換手機時從雲端找回點數 */
  K.liffStart({ login: true }).then(function (m) { if (!m) return; hello && hello(); var t = stack[stack.length - 1]; if (t && $('sheet').classList.contains('on')) R[t[0]](t[1]); });
  var p0 = new URLSearchParams(location.search).get('p'); if (!p0) { var ls0 = new URLSearchParams(location.search).get('liff.state'); if (ls0) { try { p0 = new URLSearchParams(ls0.replace(/^[^?]*\?/, '')).get('p'); } catch (e) {} } }  /* 從 liff.line.me 進來時頁面在 liff.state 裡 */  p0 = { card: 'points', prize: 'shop', games: 'park', events: 'news' }[p0] || p0; if (new URLSearchParams(location.search).get('tab') === 'bento') shopF = 'bento'; if (p0 && R[p0]) open(p0); else if (INLIFF) open('park');      // 舊連結（v1 選單名稱）也能開
  window.__line = { open: open, go: go, claim: claim, close: close };
})();
