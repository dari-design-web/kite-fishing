<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小鳶來港・官方 LINE（示意）</title>
<link rel="stylesheet" href="../shared/sys.css">
<style>
/* 官方 LINE 示意 v2（C-194，D75）：上面是聊天室、下面是四格圖文選單（2500×1200 一張圖＋四個點擊區，跟真的 LINE 一樣）；
   點選單打開的頁面像 LIFF 一樣從下面蓋上來。 */
[hidden]{display:none!important}
body{background:#8DA7CF;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
/* LINE 聊天室頁首（白底） */
.lhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:#fff;color:#111;border-bottom:1px solid #E5E5E5}
.lhead a.bk{color:#111;text-decoration:none;font-size:26px;padding:0 6px;min-height:40px;display:flex;align-items:center}
.lhead .nm{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.lhead .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .vf{flex:0 0 auto;width:18px;height:18px}
.lhead .ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#333}
.testbar{flex:0 0 auto;background:#FFF4D6;color:#7A5A00;font-size:12px;text-align:center;padding:3px 8px}
/* 聊天室 */
.chat{flex:1;overflow-y:auto;padding:10px 10px 8px;scroll-behavior:smooth}
.day{display:table;margin:4px auto 12px;background:rgba(0,0,0,.18);color:#fff;font-size:11.5px;padding:2px 10px;border-radius:999px}
.msg{display:flex;gap:8px;align-items:flex-end;margin:0 0 10px}
.msg .av{width:36px;height:36px;border-radius:50%;background:#fff;flex:0 0 36px;align-self:flex-start;object-fit:cover}
.msg .col{max-width:80%;display:flex;flex-direction:column;gap:2px}
.msg .who{font-size:11.5px;color:#fff;opacity:.9;margin-left:2px}
.msg .row2{display:flex;align-items:flex-end;gap:5px}
.msg .b{background:#fff;border-radius:18px;padding:9px 13px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg .tm{font-size:10px;color:rgba(255,255,255,.95);white-space:nowrap}
.msg.me{justify-content:flex-end}.msg.me .b{background:#8DE055}
.msg .b a{color:var(--teal);font-weight:700}
.msg .stk{width:120px;height:120px;object-fit:contain}
/* Flex 訊息卡（LINE 的 Flex Message 樣子） */
.flex{background:#fff;border-radius:18px;overflow:hidden;width:260px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flex .hero{height:120px;background:#CFE8F0 url(../assets/bg_v2.jpg) center 30%/cover;position:relative}
.flex .hero img{position:absolute;right:8px;bottom:-6px;width:84px}
.flex .bd{padding:12px 14px 6px}.flex .bd h3{margin:0 0 4px;font-size:16px}.flex .bd p{margin:0;font-size:13px;color:#555}
.flex .ft{display:flex;flex-direction:column;gap:6px;padding:8px 12px 12px}
.flex .ft button{border:0;border-radius:10px;min-height:38px;font-weight:800;font-size:14px;background:#E9F2F1;color:var(--teal)}
.flex .ft button.p{background:var(--teal);color:#fff}
.flex .pts{display:flex;align-items:baseline;gap:4px}.flex .pts b{font-size:32px;color:var(--teal)}
.carousel{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 2px 4px;scrollbar-width:none;max-width:calc(100vw - 64px)}
.carousel::-webkit-scrollbar{display:none}
.carousel .flex{flex:0 0 210px;scroll-snap-align:start}
.carousel .flex .hero{height:90px}
/* 圖文選單：一張 2500×1200 的圖＋四個點擊區 */
.rich{flex:0 0 auto;position:relative;background:#FBF3E4;line-height:0;transition:max-height .25s ease;max-height:60vh;overflow:hidden}
.rich img{width:100%;height:auto;display:block}
.rich button{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.rich button:active{background:rgba(47,127,134,.14)}
.rich .a1{left:0;top:0;width:100%;height:50%}.rich .a2{left:0;top:50%;width:33.32%;height:50%}.rich .a3{left:33.32%;top:50%;width:33.36%;height:50%}.rich .a4{left:66.68%;top:50%;width:33.32%;height:50%}
.rich.off{max-height:0}
.cbar{flex:0 0 auto;display:flex;align-items:center;background:#fff;border-top:1px solid #E5E5E5;padding:0 6px env(safe-area-inset-bottom,0px)}
.cbar .kb{width:44px;height:40px;display:flex;align-items:center;justify-content:center;color:#666}
.cbar button{flex:1;border:0;background:none;min-height:40px;font-size:13.5px;font-weight:700;color:#333}
/* LIFF 頁 */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:0 auto}
.sheet.on{display:flex;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .top{flex:0 0 auto}.sheet .wrap{flex:1;overflow-y:auto}
.sheet.park .top{background:#163F57;color:#fff;border-bottom:0}.sheet.park .top .lk,.sheet.park .top h1{color:#fff}
.sheet.park .wrap{padding:0;background:#163F57}
.ptsCard{background:linear-gradient(135deg,#2F7F86,#4FA9B8);color:#fff;border-radius:20px;padding:18px;margin:0 0 12px;position:relative;overflow:hidden}
.ptsCard .big{font-size:44px}.ptsCard small{opacity:.85}
.ptsCard img{position:absolute;right:8px;bottom:0;width:86px;opacity:.95}
.ev{border-left:4px solid var(--orange)}
.sub{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.sub button{border:0;background:#E9F2F1;color:var(--teal);font-weight:800;border-radius:999px;padding:6px 12px}
/* 手動代碼：一位數一格 */
.digits{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.digits input{width:34px;height:46px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:22px;font-weight:800;background:#fff;color:var(--ink);padding:0}
.digits input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,127,134,.15)}
.digits .gap{width:8px}
/* ====== 小鳶樂園（遊戲大廳） ====== */
.lobby{position:relative;min-height:100%;background:radial-gradient(circle at 15% 40%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/38px 38px,linear-gradient(#1C5470,#123447 70%,#0E2A3A);color:#fff;overflow:hidden}
.lb-hero{position:relative;height:270px;overflow:hidden}
.lb-hero .sky{position:absolute;inset:-6px;background:url(assets/lobby_hero_g57.jpg) center 40%/cover;animation:pan 18s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.04) translateX(-6px)}to{transform:scale(1.1) translateX(6px)}}
.lb-hero .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFF6C8;box-shadow:0 0 8px 3px rgba(255,236,160,.8);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.lb-hero .shade{position:absolute;inset:0;background:linear-gradient(rgba(22,63,87,0) 45%,rgba(28,84,112,.75) 80%,#1C5470)}
.lb-hero .cloud{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.75;filter:blur(1px);animation:drift 26s linear infinite}
.lb-hero .cloud:before,.lb-hero .cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.lb-hero .cloud:before{width:50px;height:50px;left:18px;top:-22px}.lb-hero .cloud:after{width:38px;height:38px;left:58px;top:-14px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.lb-hero .kite{position:absolute;width:118px;left:58%;top:26px;animation:soar 6s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
@keyframes soar{0%,100%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(-18px,-10px) rotate(-12deg)}50%{transform:translate(-4px,8px) rotate(-2deg)}75%{transform:translate(14px,-4px) rotate(4deg)}}
.lb-hero .wave{position:absolute;left:0;bottom:-2px;width:200%;height:46px;animation:wave 7s linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.lb-title{position:absolute;left:16px;bottom:34px}
.lb-title small{display:block;letter-spacing:4px;font-size:11px;font-weight:800;color:#FFE3A3}
.lb-title b{display:block;font-size:30px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lb-player{position:relative;margin:-22px 12px 0;background:#fff;color:var(--ink);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.lb-player img{width:44px;height:44px;border-radius:50%;background:#FFF1CC}
.lb-player .s{flex:1;min-width:0}.lb-player .s b{display:block;font-size:15px}.lb-player .s span{font-size:12px;color:var(--muted)}
.lb-player .bank{text-align:right;font-size:11px;color:var(--muted)}.lb-player .bank b{display:block;font-size:18px;color:var(--orange)}
.lb-ev{margin:12px 12px 0;border-radius:14px;background:linear-gradient(90deg,#E2702A,#F2A33A);padding:9px 12px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;overflow:hidden;position:relative}
.lb-ev:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:110%}}
.lb-sec{margin:18px 12px 8px;color:#FFE3A3;font-weight:900;font-size:15px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.lb-sec:before{content:"";width:6px;height:16px;border-radius:3px;background:var(--orange)}
.lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.booth{position:relative;display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:20px;padding:8px 8px 10px;box-shadow:0 3px 0 #E3D9C8,0 6px 14px rgba(0,0,0,.06);animation:pop .45s ease-out both}
.booth:active{transform:translateY(2px);box-shadow:0 1px 0 #E3D9C8}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.booth .ic{display:block;width:100%;aspect-ratio:1/1;border-radius:16px;object-fit:cover;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.booth b{display:block;font-size:15px;margin:8px 2px 2px}
.booth .tip{display:block;font-size:11.5px;color:var(--muted);margin:0 2px;line-height:1.35;min-height:31px}
.booth .chip{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--teal)}
.booth .chip.o{background:var(--orange);color:#fff}.booth .chip.gr{background:rgba(0,0,0,.55);color:#fff}
.booth .bar{display:block;height:6px;border-radius:3px;background:#EFE6D6;margin:6px 2px 0;overflow:hidden}.booth .bar i{display:block;height:100%;background:linear-gradient(90deg,#2F7F86,#55B5B0);border-radius:3px}
.booth .pg{display:block;font-size:11px;color:var(--muted);margin:3px 2px 0}
.booth.feat{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:10px;background:linear-gradient(135deg,#FFF6E0,#FFE7C2)}
.booth.feat .ic{width:112px;flex:0 0 112px}
.booth.feat .tx{flex:1;min-width:0}
.booth.off{opacity:.6}
.lb-foot{padding:18px 12px calc(28px + env(safe-area-inset-bottom,0px));color:var(--ink)}
.lb-hero .sky{will-change:transform}
@media (prefers-reduced-motion:reduce){.lb-hero .sky,.lb-hero .spark,.lb-hero .cloud,.lb-hero .kite,.lb-hero .wave,.booth .ic,.lb-ev:after{animation:none}}
/* ====== 港口換禮 ====== */
.shopBan{margin:-14px -14px 0;aspect-ratio:3/1;background:url(assets/shop_header_g57.jpg) center/cover}
.shopHead{background:linear-gradient(135deg,#E2702A,#F2A33A);color:#fff;border-radius:20px;padding:14px 16px;margin:-26px 4px 12px;box-shadow:0 6px 14px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.shopHead .n{flex:1}.shopHead small{opacity:.9;font-size:12px}.shopHead .big{font-size:34px;line-height:1.1}
.shopHead button{border:0;background:rgba(255,255,255,.22);color:#fff;font-weight:800;border-radius:999px;padding:6px 12px}
.shopHead .warn{display:block;margin-top:4px;font-size:12px;font-weight:700;background:rgba(0,0,0,.18);border-radius:8px;padding:2px 8px}
.goods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.good{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer}
.good .im{position:relative;aspect-ratio:1/1;background:#F4EEE2}
.good .im img{width:100%;height:100%;object-fit:contain;display:block}
.good .im .so{position:absolute;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted)}
.good .im .hot{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px}
.good .tx{padding:8px 10px 10px}.good .tx b{display:block;font-size:14px;line-height:1.35;min-height:38px}
.good .pp{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.good .pp .p{font-weight:900;color:var(--orange);font-size:16px}.good .pp .l{font-size:11px;color:var(--muted)}
.good.no .pp .p{color:var(--muted)}
.detail .im{border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:#F4EEE2;margin:0 0 12px}.detail .im img{width:100%;height:100%;object-fit:contain}
/* 底部確認框（取代瀏覽器的 confirm，比較像 LINE 裡的樣子） */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.modal h3{margin:0 0 6px;font-size:17px}.modal p{margin:0 0 14px;color:#444}
/* ====== 我的 ====== */
.meHead{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px}
.meHead img{width:56px;height:56px;border-radius:50%;background:#FFF1CC}
.meHead .n{flex:1}.meHead .n b{display:block;font-size:17px}
.meHead .pt{text-align:right}.meHead .pt b{display:block;font-size:26px;color:var(--teal);line-height:1.1}
.meGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.meGrid button{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink)}
.meGrid button span{font-size:24px;line-height:1}
.meGrid .cnt{position:absolute;top:4px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#fff;font-style:normal;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
.gcard{display:flex;gap:12px;align-items:flex-start}
.gcard img{width:64px;height:64px;border-radius:14px;flex:0 0 64px;object-fit:cover}
.gcard .g{flex:1;min-width:0}.gcard .g b{display:block;font-size:15.5px}
.gbar{height:8px;border-radius:4px;background:#EFE6D6;overflow:hidden;margin:6px 0 2px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,#2F7F86,#55B5B0)}
.kv{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);margin-top:6px}.gcard .kv b{display:inline;color:var(--ink);font-size:12.5px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}.stat3 b{display:block;font-size:20px;color:var(--ink)}
</style>
</head>
<body>
<header class="lhead"><a class="bk" href="../portal/index.html" aria-label="回主頁">‹</a>
  <div class="nm"><span>小鳶來港｜東三東四</span><svg class="vf" viewBox="0 0 20 20" aria-label="官方帳號"><path fill="#06C755" d="M10 1l2.3 1.7 2.8-.2.9 2.7 2.4 1.5-.9 2.7.9 2.7-2.4 1.5-.9 2.7-2.8-.2L10 19l-2.3-1.7-2.8.2-.9-2.7-2.4-1.5.9-2.7-.9-2.7 2.4-1.5.9-2.7 2.8.2z"/><path d="M6.5 10.2l2.3 2.3 4.7-4.7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <span class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
  <span class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
</header>
<div class="testbar">本機測試資料。換手機或瀏覽器不會自動帶過去</div>
<div class="chat" id="chat"></div>
<nav class="rich" id="rich" aria-label="圖文選單">
  <img src="assets/richmenu_v3.jpg" alt="圖文選單：小鳶樂園、掃碼集點、港口換禮、我的資訊" width="2500" height="1200">
  <button type="button" class="a1" data-p="park" aria-label="小鳶樂園"></button>
  <button type="button" class="a2" data-p="scan" aria-label="掃碼集點"></button>
  <button type="button" class="a3" data-p="shop" aria-label="港口換禮"></button>
  <button type="button" class="a4" data-p="me" aria-label="我的資訊"></button>
</nav>
<div class="cbar"><span class="kb" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h1M11 10h1M15 10h1M7 14h10" stroke-linecap="round"/></svg></span><button type="button" id="mtg">小鳶選單 ▾</button><span class="kb"></span></div>

<section class="sheet" id="sheet"><header class="top"><button class="lk" type="button" id="close">✕ 關閉</button><h1 id="stitle"></h1><button class="lk" type="button" id="back" hidden>‹ 返回</button></header><div class="wrap" id="sbody"></div></section>
<div class="toast" id="toast"></div>
<script src="../shared/vendor/qrcode.js"></script>
<script src="../shared/vendor/jsQR.js"></script>
<script src="../shared/kite_core.js"></script>
<script src="../shared/kite_scan.js"></script>
<script>
/* 客戶官方 LINE 系統（示意）v2（工作單 25，D75）。正式版：選單是 LINE 圖文選單（一張圖＋點擊區），點進去的頁面是 LIFF。
   原型：點數存在這支手機（D72），「我的」最下面可以清除資料重新開始。 */
(function () {
  var $ = function (id) { return document.getElementById(id); }, K = KiteCore, scanner = null;
  var KITE = '../travel/assets/kite_hello.png';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 2400); }
  function hm(t) { var d = new Date(t), h = d.getHours(); return (h < 12 ? '上午 ' : '下午 ') + ((h + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function t2(t) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function ymd(x) { var d = new Date(x); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); }
  function rd(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function bubble(inner, me, raw) { var c = $('chat'), d = document.createElement('div'); d.className = 'msg' + (me ? ' me' : ''); var tm = '<span class="tm">' + hm(Date.now()) + '</span>';
    d.innerHTML = me ? '<div class="row2">' + tm + '<div class="b">' + inner + '</div></div>' : '<img class="av" src="' + KITE + '" alt=""><div class="col"><span class="who">小鳶來港</span><div class="row2">' + (raw ? inner : '<div class="b">' + inner + '</div>') + tm + '</div></div>';
    c.appendChild(d); bindOpen(d); c.scrollTop = c.scrollHeight; return d; }
  function say(html) { return bubble(html); }

    $('sbody').innerHTML = '<div class="shopBan" role="img" aria-label="港口換禮"></div><div class="shopHead"><div class="n"><small>我的點數</small><div class="big">' + m.points + ' <span style="font-size:15px">點</span></div>' + dueText(m) + '</div><button id="toPts">點數明細 ›</button></div>' +
      '<div class="tabs">' + [['all', '全部'], ['can', '我換得到'], ['few', '快換完了']].map(function (t) { return '<button class="pill' + (shopF === t[0] ? ' o' : '') + '" data-f="' + t[0] + '" style="border:0;padding:6px 14px;font-size:13px">' + t[1] + '</button>'; }).join('') + '</div>' +
      (list.length ? '<div class="goods">' + list.map(function (p) { var l = K.stockLeft(p.id), can = m.points >= p.points && l > 0; return '<button class="good' + (can ? '' : ' no') + '" data-item="' + p.id + '"><span class="im"><img src="' + K.prizeImg(p.id) + '" alt="" loading="lazy">' + (l <= 0 ? '<span class="so">已換完</span>' : l <= 10 ? '<span class="hot">剩 ' + l + '</span>' : '') + '</span><span class="tx"><b>' + esc(p.name) + '</b><span class="pp"><span class="p">' + p.points + ' 點</span><span class="l">' + (l > 0 ? (can ? '可兌換' : '還差 ' + (p.points - m.points) + ' 點') : '補貨中') + '</span></span></span></button>'; }).join('') + '</div>' : '<div class="card muted">這個分類目前沒有贈品</div>') +
      '<p class="note">兌換後到服務台出示兌換 QR 領取' + (K.cfg().redeemHoldDays ? '，' + K.cfg().redeemHoldDays + ' 天內沒領會自動取消並退點' : '') + '。</p>';
    $('toPts').onclick = function () { go('points'); };
    $('sbody').querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { shopF = b.dataset.f; R.shop(); }; });
    $('sbody').querySelectorAll('[data-item]').forEach(function (b) { b.onclick = function () { go('item', b.dataset.item); }; });
  };
  R.item = function (pid) {
    var p = K.prizeById(pid), m = K.member(); if (!p) return back(); var l = K.stockLeft(p.id), can = m.points >= p.points && l > 0, hd = K.cfg().redeemHoldDays;
    $('stitle').textContent = p.name;
    $('sbody').innerHTML = '<div class="detail"><div class="im"><img src="' + K.prizeImg(p.id) + '" alt=""></div><h2 style="margin:0 0 4px;font-size:20px">' + esc(p.name) + '</h2><div style="font-size:24px;font-weight:900;color:var(--orange)">' + p.points + ' 點</div>' + (p.desc ? '<p style="margin:8px 0">' + esc(p.desc) + '</p>' : '') +
      '<div class="card" style="margin-top:10px"><ul class="list"><li><span class="grow">還可以換</span><b>' + l + ' 個</b></li><li><span class="grow">領取地點</span><b>服務台</b></li>' + (hd ? '<li><span class="grow">領取期限</span><b>兌換後 ' + hd + ' 天內</b></li>' : '') + '<li><span class="grow">我的點數</span><b>' + m.points + ' 點</b></li></ul></div>' +
      '<button class="btn warn full" id="rd"' + (can ? '' : ' disabled') + '>' + (l <= 0 ? '已換完' : can ? '用 ' + p.points + ' 點兌換' : '點數還差 ' + (p.points - m.points) + ' 點') + '</button></div>';
    $('rd').onclick = function () { var q = 1, dl = hd ? t2(Date.now() + hd * 86400000) : ''; ask2('確認兌換', '使用 <b>' + p.points * q + ' 點</b>，保留 ' + q + ' 份「' + esc(p.name) + '」。' + (dl ? '<br>請於 <b>' + dl + '</b> 前到服務台領取。' : '') + '<br><span class="muted">還沒領之前可以取消，點數會退回。</span>', '確認扣點並保留').then(function (ok) { if (!ok) return; var r = K.makeRedeem(p.id); if (!r.ok) return toast(r.msg); go('ticket', K.member().redeems[0].id); hello(); }); };
  };
  R.ticket = function (id) {
    var r = K.member().redeems.filter(function (x) { return x.id === id; })[0]; if (!r) return back();
    $('sbody').innerHTML = '<div class="card" style="text-align:center"><div class="muted">請到服務台出示這個 QR</div><h2 style="font-size:20px;margin:6px 0">🎁 ' + esc(r.name) + '</h2><div class="qrBox" id="tq"></div><p style="margin:8px 0 0">兌換碼 <b style="font-size:20px;letter-spacing:2px">' + r.id + '</b></p><p class="muted">' + t2(r.t) + '・已扣 ' + r.pts + ' 點' + (r.status === 'wait' && K.cfg().redeemHoldDays ? '<br>請於 <b>' + t2(r.t + K.cfg().redeemHoldDays * 86400000) + '</b> 前到服務台領取' : '') + '・' + (r.status === 'done' ? '<span class="pill g">已領取</span>' : r.status === 'cancel' || r.status === 'expired' ? '<span class="pill r">' + (r.status === 'expired' ? '已逾期（已退點）' : '已取消') + '</span>' : '<span class="pill o">待領取</span>') + '</p></div>' +
      (r.status === 'wait' ? '<div class="row"><button class="btn alt" id="cp">複製代碼</button><button class="btn red" id="cx">取消並退點</button></div>' : '') + '<button class="btn alt full" id="bk" style="margin-top:10px">看我的兌換</button>';
    KiteScan.drawQR($('tq'), r.code, Math.min(240, innerWidth - 100));
    if ($('cp')) $('cp').onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(r.code) : Promise.reject()).then(function () { toast('已複製代碼'); }, function () { prompt('長按複製代碼', r.code); }); };
    if ($('cx')) $('cx').onclick = function () { ask2('取消兌換單', '取消「' + esc(r.name) + '」，退回 ' + r.pts + ' 點？', '取消並退點', '不要取消').then(function (ok) { if (!ok) return; K.cancelRedeem(r.id); toast('本機測試點數已退回 ' + r.pts + ' 點；此為示範，不代表正式退點完成'); go('mine'); hello(); }); };
    $('bk').onclick = function () { go('mine'); };
  };

  /* ---------- 我的 ---------- */
  R.me = function () {
    var m = K.member(), wc = waitCount(), due = K.expiring(m, 30).due;
    $('sbody').innerHTML = '<div class="meHead"><img src="' + KITE + '" alt=""><div class="n"><b>' + esc(K.displayName(m)) + '</b><span class="muted">會員編號 ' + esc(m.id) + '</span><button class="pill" id="toProf" style="border:0;margin-top:4px">✏️ 修改名稱／聯絡方式</button></div><div class="pt"><b>' + m.points + '</b><span class="muted">點</span></div></div>' +
      (due ? '<div class="card" style="border-color:#F2C2B8;background:#FFF4F1;color:var(--red);font-weight:700;padding:10px 14px">⏳ 有 ' + due + ' 點將在 30 天內到期</div>' : '') +
      '<div class="meGrid"><button data-to="points"><span>🪙</span>我的點數</button><button data-to="mine"><span>🎫</span>我的兌換' + (wc ? '<i class="cnt">' + wc + '</i>' : '') + '</button><button data-to="mygames"><span>🎮</span>我的遊戲</button><button data-to="news"><span>📣</span>港口消息</button></div>' +
      '<div class="card"><ul class="list"><li><span class="grow"><b>我的資料</b><span class="muted">' + (m.email || m.phone ? esc([m.email, m.phone].filter(Boolean).join('・')) : '還沒填 email／手機（選填）') + '</span></span><button class="btn alt" id="toProf2" style="min-height:36px;padding:4px 12px">修改</button></li><li><span class="grow"><b>點數規則</b><span class="muted">消費每 ' + K.cfg().spendPerPoint + ' 元 1 點（未滿 ' + K.cfg().minSpend + ' 元不集點）・遊戲每 ' + K.cfg().scorePerPoint.toLocaleString() + ' 分 1 點</span></span></li><li><span class="grow"><b>服務台</b><span class="muted">東三東四 一樓（領贈品、補登點數）</span></span></li></ul></div>' +
      '<div class="card"><h2>測試工具</h2><p class="muted" style="margin:0 0 8px">原型的點數只存在這支手機。測試完可以清掉重來（只清客人的點數、紀錄、兌換單）。</p><button class="btn red full" id="wipe">清除我的資料，重新開始</button></div>';
    $('sbody').querySelectorAll('[data-to]').forEach(function (b) { b.onclick = function () { go(b.dataset.to); }; }); $('toProf').onclick = $('toProf2').onclick = function () { go('profile'); };
    $('wipe').onclick = function () { ask2('清除測試資料', '確定清除這支手機的點數與紀錄？', '清除', '取消').then(function (ok) { if (!ok) return; try { localStorage.removeItem('kiteMember1'); } catch (e) {} toast('已清除，重新開始'); R.me(); hello(); }); };
  };
  /* ---------- 修改我的資料（D77）：名稱 16 字內、email／手機選填 ---------- */
  R.profile = function () {
    var m = K.member();
    $('sbody').innerHTML = '<div class="card"><label class="f">顯示名稱（16 個字內，不填就用會員編號）<input id="pfN" maxlength="32" value="' + esc(m.name || '') + '" placeholder="會員 ' + esc(m.id) + '" autocomplete="nickname"></label><div class="muted" id="pfC" style="margin:-6px 0 10px;text-align:right"></div>' +
      '<label class="f">Email（選填）<input id="pfE" type="email" inputmode="email" value="' + esc(m.email || '') + '" placeholder="例：kite@example.com" autocomplete="email"></label>' +
      '<label class="f">手機（選填）<input id="pfP" type="tel" inputmode="tel" value="' + esc(m.phone || '') + '" placeholder="09xxxxxxxx" autocomplete="tel"></label>' +
      '<p class="muted" id="pfMsg" style="margin:0 0 10px;color:var(--red)"></p><button class="btn full" id="pfOk">儲存</button></div>' +
      '<div class="card"><p class="muted" style="margin:0">會員編號 <b>' + esc(m.id) + '</b> 不會變，服務台查詢、補登都用這個。<br>email 和手機不是必填，只用來找回帳號或通知兌換（正式版會先請你同意會員條款與個資告知）。<br>原型：資料只存在這支手機。</p></div>';
    var cnt = function () { var n = Array.from($('pfN').value.trim()).length; $('pfC').textContent = n + '／16'; $('pfC').style.color = n > 16 ? 'var(--red)' : ''; }; $('pfN').oninput = cnt; cnt();
    $('pfOk').onclick = function () { var r = K.setProfile({ name: $('pfN').value, email: $('pfE').value, phone: $('pfP').value }); if (!r.ok) { $('pfMsg').textContent = r.msg; var el = { name: 'pfN', email: 'pfE', phone: 'pfP' }[r.field]; if (el) $(el).focus(); return; } toast('已儲存'); back(); hello(); };
  };
  function batchCard(m) {      // C-191：每批點數與到期日（先到期的先用）
    var B = K.batches(m), soon = Date.now() + 30 * 86400000; if (!B.length) return '';
    var due = B.filter(function (g) { return g.end && g.end <= soon; }).reduce(function (s, g) { return s + g.left; }, 0);
    return '<div class="card"><h2>⏳ 點數有效期限</h2>' + (due ? '<p style="margin:0 0 6px;color:var(--red);font-weight:700">有 ' + due + ' 點將在 30 天內到期，記得先換小禮物！</p>' : '') + '<p class="muted" style="margin:0 0 6px">換禮物時會先用最早到期的點數。</p><ul class="list">' +
      B.slice(0, 12).map(function (g) { var near = g.end && g.end <= soon; return '<li><span class="grow"><b>' + g.left + ' 點</b>' + (g.left < g.pts ? '<span class="muted">（原 ' + g.pts + ' 點，已用 ' + (g.pts - g.left) + '）</span>' : '') + '<span class="muted">' + ymd(g.t) + ' 取得' + (g.src ? '・' + esc(g.src) : '') + '</span></span><b style="color:' + (near ? 'var(--red)' : 'var(--muted)') + ';font-size:13px;white-space:nowrap;margin-left:6px">' + (g.end ? ymd(g.end) + ' 到期' : '不會到期') + '</b></li>'; }).join('') + (B.length > 12 ? '<li class="muted">還有 ' + (B.length - 12) + ' 批…</li>' : '') + '</ul><p class="muted" style="margin:6px 0 0;font-size:12px">測試版：取得日加 ' + K.cfg().pointsExpireMonths + ' 個月。正式上線的期限規則還在確認中。</p></div>';
  }
  R.points = function () {
    var m = K.member(), GN = K.GAMES;
    $('sbody').innerHTML = '<div class="ptsCard"><small>目前點數</small><div class="big">' + m.points + ' <span style="font-size:18px">點</span></div><small>會員編號 ' + m.id + '</small><img src="../travel/assets/kite_wave.png" alt=""></div>' + batchCard(m) +
      '<div class="card"><h2>點數紀錄</h2><ul class="list">' + (m.ledger.slice(0, 30).map(function (e) {
        var what = e.type === 'store' ? '🧾 ' + esc(e.storeName) + ' 消費 NT$' + e.amount : e.type === 'game' ? '🎮 ' + esc(GN[e.game] ? GN[e.game].name : e.game) + ' 分數換點' : e.type === 'redeem' ? '🎁 兌換 ' + esc(e.prizeName) : e.type === 'refund' ? '↩️ ' + (e.note ? esc(e.note) + ' ' : '取消兌換 ') + esc(e.prizeName) : e.type === 'expire' ? '⌛ 點數到期' : e.type === 'backfill' ? '🧾 補登' + (e.storeName ? ' ' + esc(e.storeName) : '') : e.type === 'adjust' ? '✏️ 調整' + (e.note ? '（' + esc(e.note) + '）' : '') : '調整';
        return '<li><span class="grow"><b>' + what + '</b><span class="muted">' + t2(e.t) + '</span></span><b style="color:' + (e.pts >= 0 ? 'var(--teal)' : 'var(--red)') + '">' + (e.pts >= 0 ? '+' : '') + e.pts + '</b></li>';
      }).join('') || '<li class="muted">還沒有紀錄</li>') + '</ul></div><button class="btn alt full" id="toMG2">遊戲分數存摺在「我的遊戲」 ›</button>';
    $('toMG2').onclick = function () { go('mygames'); };
  };
  R.mine = function () {
    var rs = K.member().redeems;
    $('sbody').innerHTML = '<div class="card"><ul class="list">' + (rs.map(function (r, i) { return '<li><img src="' + K.prizeImg(r.prize) + '" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover;background:#F4EEE2"><span class="grow"><b>' + esc(r.name) + '</b><span class="muted">' + t2(r.t) + '・' + r.id + '・' + r.pts + ' 點</span></span>' + (r.status === 'done' ? '<span class="pill g">已領取</span>' : r.status === 'cancel' || r.status === 'expired' ? '<span class="pill r">' + (r.status === 'expired' ? '已逾期（已退點）' : '已取消') + '</span>' : '<button class="btn warn" data-i="' + i + '">出示 QR</button>') + '</li>'; }).join('') || '<li class="muted">還沒有兌換，去「港口換禮」看看吧</li>') + '</ul></div><p class="note">原型：服務台在別支手機發放時，這裡要等接上雲端才會自動變「已領取」。</p>';
    $('sbody').querySelectorAll('[data-i]').forEach(function (b) { b.onclick = function () { go('ticket', rs[+b.dataset.i].id); }; });
    Array.prototype.slice.call($('sbody').querySelectorAll('.list > li')).forEach(function (li, i) { if (rs[i]) li.insertAdjacentHTML('afterend', steps(rs[i])); });
  };
  /* C-192：兌換單進度（扣點保留 → 待領取 → 已領取；取消／逾期 → 本機測試已退點） */
  function steps(r) {
    var hd = K.cfg().redeemHoldDays, dl = hd ? t2(r.t + hd * 86400000) : '';
    var S = r.status === 'done' ? [['已扣點保留', 1], ['待領取', 1], ['已領取', 1]] : r.status === 'wait' ? [['已扣點保留', 1], ['待領取' + (dl ? '（' + dl + ' 前）' : ''), 2], ['已領取', 0]] : [['已扣點保留', 1], [r.status === 'expired' ? '逾期未領' : '已取消', 1], ['本機測試已退回 ' + r.pts + ' 點', 1]];
    return '<li class="stepRow" style="display:flex;gap:4px;padding:2px 0 10px;border-top:0">' + S.map(function (s) { var c = s[1] === 1 ? 'var(--teal)' : s[1] === 2 ? '#E8833A' : 'var(--line)'; return '<span style="flex:1;font-size:11px;text-align:center;border-top:4px solid ' + c + ';padding-top:3px;color:' + (s[1] ? 'inherit' : 'var(--muted)') + '">' + esc(s[0]) + '</span>'; }).join('') + '</li>';
  }
  R.news = function () {
    var D = '日一二三四五六', ev = K.cfg().events.filter(function (e) { return e.on; }), today = new Date().getDay();
    var NS = K.notices(); $('sbody').innerHTML = NS.map(function (n) { return '<div class="card" style="border-left:4px solid var(--teal)">' + (n.pin ? '📌 ' : '') + '<b>' + esc(n.title) + '</b><p style="margin:4px 0 0">' + esc(n.body) + '</p></div>'; }).join('') + (ev.map(function (e) { var on = e.days.indexOf(today) >= 0; return '<div class="card ev"><b>' + esc(e.title) + '</b>' + (on ? ' <span class="pill o">今天有</span>' : '') + '<p class="muted" style="margin:4px 0 0">' + esc(K.GAMES[e.game] ? K.GAMES[e.game].name : e.game) + '・分數 ×' + e.mult + '・星期' + e.days.map(function (d) { return D[d]; }).join('、') + '・' + e.from + '～' + e.to + '</p></div>'; }).join('') || '<div class="card muted">目前沒有活動</div>');
  };

  hello();
  var p0 = new URLSearchParams(location.search).get('p'); p0 = { card: 'points', prize: 'shop', games: 'park', events: 'news' }[p0] || p0; if (p0 && R[p0]) open(p0);      // 舊連結（v1 選單名稱）也能開
  window.__line = { open: open, go: go, claim: claim, close: close };
})();
</script>
</body>
