<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港灣蓋章散步原型</title>
<style>
/* P3 港灣蓋章散步 原型 v0.1（工作單 11 v4 第三節，C-83）。只做手機版（D55）。章與護照頁是程式畫的暫用圖，等 ChatGPT 正式圖 */
:root{--paper:#F4EFE6;--card:#FFFDF8;--ink:#3E2B1D;--muted:#8A7565;--teal:#2F7F86;--teal-d:#1F5A5F;--red:#C9473A;--line:#E2D6C6;--gold:#E8B879;
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1D2F36;color:var(--ink);font-family:var(--f)}
#app{max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--paper) linear-gradient(180deg,#DCEFF0 0,#F4EFE6 220px);padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
header img{width:64px;height:64px;object-fit:contain;flex:none}
header h1{margin:0;font-size:24px;letter-spacing:.04em}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.bar{height:12px;border-radius:999px;background:#E4D8C6;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#E8A33A,#C9473A);border-radius:999px;transition:width .5s}
.book{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(62,43,29,.12);border:1px solid var(--line);
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(226,214,198,.35) 27px 28px)}
.book h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.book h2 small{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* v0.2：護照頁換上 G-49 底圖（1080×1350），六個章照圓框位置 JSON 對位（2 欄 × 3 列） */
.passport{position:relative;width:100%;aspect-ratio:1080/1350;background:url(assets/passport_page.jpg) center/100% 100%;border-radius:14px;box-shadow:0 6px 18px rgba(62,43,29,.15);overflow:hidden}
.passport .ttl{position:absolute;left:0;right:0;top:5%;text-align:center}
.passport .ttl b{display:block;font-size:22px;letter-spacing:.12em;color:#5A3A24}
.passport .ttl span{font-size:13px;color:#8A7565}
.pcell{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;font:inherit;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#A08A72}
.pcell img{width:100%;height:100%;object-fit:contain;transform:rotate(-8deg);mix-blend-mode:multiply}
.pcell .n{font-size:26px;font-weight:700;color:#C8B79F;line-height:1}
.pcell small{font-size:11px;line-height:1.35;text-align:center;padding:0 12%;margin-top:4px}
.pcell .dt{position:absolute;bottom:-4%;font-size:10.5px;font-weight:700;color:#B4483C;background:rgba(255,250,240,.85);border-radius:999px;padding:0 6px}
.passport .foot{position:absolute;left:0;right:0;bottom:3.2%;text-align:center;font-size:12px;color:#8A7565}
.big img{width:100%;height:100%;object-fit:contain;animation:slam .45s cubic-bezier(.3,1.6,.6,1) both}
.cell{border:0;background:none;font:inherit;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.slot{width:100%;aspect-ratio:1;border-radius:50%;border:2.5px dashed #CDBDA6;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,.5)}
.slot .n{font-size:22px;font-weight:700;color:#CDBDA6}
.cell small{font-size:11px;line-height:1.35;color:var(--muted);text-align:center;min-height:30px}
.cell b{font-size:12.5px}
.stamp{width:100%;height:100%;border-radius:50%;border:4px double var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);background:rgba(201,71,58,.04);position:relative}
.stamp svg{width:52%;height:52%}
.stamp span{font-size:10px;font-weight:700;letter-spacing:.06em;margin-top:2px}
.slot.done{border:0}
.reward{display:flex;gap:12px;align-items:center;background:#FFF3DA;border:1.5px solid #E8C98A;border-radius:16px;padding:12px}
.reward[hidden]{display:none}
.reward img{width:56px;height:56px;object-fit:contain}
.reward p{margin:0;font-size:13.5px;line-height:1.55}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:700;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);text-align:center;text-decoration:none}
.btn.light{background:#FFF7EA;color:var(--ink);box-shadow:0 4px 0 #C9A57E}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{font-weight:700;font-size:14px;cursor:pointer}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tools button{font:inherit;font-size:13px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 0}
/* 蓋章畫面 */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,30,36,.72);padding:18px}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sheet .big{width:150px;height:150px;position:relative}
.sheet .big .stamp{animation:slam .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes slam{0%{transform:scale(2.2) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.sheet h3{margin:0;font-size:20px}
.say{display:flex;gap:10px;align-items:flex-end;text-align:left;width:100%}
.say img{width:64px;flex:none}
.say p{margin:0;background:#EAF5F4;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15px;line-height:1.6}
.rec{width:100%;font-size:13px;background:#FFF3DA;border-radius:12px;padding:8px 10px;text-align:left}
.again{font-size:12px;color:var(--muted)}
/* v0.4（C-87）：動畫與配樂 */
header img{animation:hover 3.2s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-5px) rotate(-3deg)}}
.snd{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--teal-d);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(62,43,29,.18)}
.pcell.new img{animation:pslam .55s cubic-bezier(.3,1.6,.6,1) both}
.pcell.new::after{content:'';position:absolute;inset:6%;border-radius:50%;border:3px solid rgba(201,71,58,.55);animation:ink .7s ease-out .25s both;pointer-events:none}
@keyframes pslam{0%{transform:scale(2.4) rotate(-24deg);opacity:0}55%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
@keyframes ink{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.pcell:not(.done) .n{animation:breathe 2.6s ease-in-out infinite}
.pcell:not(.done):nth-child(2n) .n{animation-delay:.8s}
@keyframes breathe{50%{opacity:.45}}
.passport.full{animation:glow 1.6s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(232,184,121,.7),0 6px 18px rgba(62,43,29,.15)}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));}}
.sheet{animation:sheetin .35s cubic-bezier(.2,1.3,.5,1) both}
@keyframes sheetin{from{transform:translateY(40px) scale(.94);opacity:0}}
.say img{animation:hover 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="../travel/assets/kite_wave.png" alt="">
    <div><h1>港灣蓋章散步</h1><p>在東三東四走一圈，掃 QR 蓋章、聽小鳶說故事</p></div>
    <button class="snd" id="snd" type="button"></button>
  </header>
  <div>
    <div class="bar"><i id="prog" style="width:0"></i></div>
    <p class="note" id="progTxt" style="margin-top:6px"></p>
  </div>
  <section class="passport" id="passport">
    <div class="ttl"><b>港灣探險護照</b><span id="count"></span></div>
    <div id="grid"></div>
    <div class="foot">點蓋好的章，可以再聽一次小鳶的故事</div>
  </section>
  <div class="reward" id="reward" hidden></div>
  <a class="btn light" href="../travel/" id="toTravel">回小鳶的小屋</a>
  <details>
    <summary>測試：模擬掃 QR</summary>
    <div class="tools" id="tools"></div>
    <p class="note">正式版是在現場掃 QR，網址會帶點的編號（例如 <code>?spot=3</code>）。原型 <span id="ver"></span>：章與護照頁是暫用圖；蓋章只存在這支手機。</p>
  </details>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<script>
/* BGM-START｜配樂 v3（C-87，Dari 10/13 09:39：主動加強畫面、配樂、動畫）
   每個場景一首不同的曲子：捕魚三場、飛行地圖與四關、去旅行五個房間、蓋章散步、合照館。
   v3：加空間殘響（比較不像電子琴）、每首多一段 B 段（A→B 輪流，不會一直重複同 8 小節）、
       強弱拍力度、海浪／雨聲／蟲鳴環境音，以及共用音效 BGM.sfx（蓋章、叮咚、快門、啵）。
   有音樂檔就播檔案：assets/bgm/<場景>.mp3（例如 assets/bgm/fly_2.mp3）；沒有檔案就用程式即時合成。
   這份是原始檔（shared/bgm.js），各頁面內嵌的是同一份內容。 */
const BGM = (() => {
  const BASE = 'assets/bgm/';
  const ALIAS = { fish: 'fish_noon', fly: 'fly_1', travel: 'travel_living' };
  const SC = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], penta: [0, 2, 4, 7, 9], mixo: [0, 2, 4, 5, 7, 9, 10] };
  /* key：主音（MIDI）；prog：每小節和弦的級數（0＝I）；meter：一小節幾個八分音符；lead／bass／arp／pad：樂器；drum：每小節的鼓點（x＝打）；g：音量校正（離線量過，讓每首差不多大聲） */
  const TR = {
    fish_noon:     { key: 60, scale: 'major', bpm: 108, prog: [0, 4, 5, 3, 0, 4, 3, 4], lead: 'pluck', bass: 'oompah', bw: 'triangle', drum: { k: 'x...x...', s: '....x...', h: '.x.x.x.x' }, amb: 'sea', dens: 0.75, seed: 11, g: 1.21 },
    fish_dusk:     { key: 65, scale: 'major', bpm: 86, prog: [0, 3, 5, 4, 0, 3, 4, 0], lead: 'flute', bass: 'long', bw: 'sine', pad: 1, drum: { h: '..x...x.' }, amb: 'sea', dens: 0.55, seed: 23, g: 1.3 },
    fish_night:    { key: 62, scale: 'dorian', bpm: 72, prog: [0, 0, 3, 3, 0, 0, 6, 4], lead: 'bell', bass: 'long', bw: 'sine', pad: 1, arp: 8, amb: 'night', dens: 0.42, seed: 37, g: 1.35 },
    fly_map:       { key: 55, scale: 'major', bpm: 112, prog: [0, 3, 4, 0, 5, 3, 4, 4], lead: 'chip', bass: 'root', bw: 'triangle', drum: { k: 'x...x...', s: '..x...xx' }, dens: 0.8, seed: 41, g: 1.28 },
    fly_1:         { key: 60, scale: 'major', bpm: 136, prog: [0, 5, 3, 4, 0, 5, 3, 4], lead: 'chip', bass: 'oct', bw: 'triangle', arp: 16, drum: { k: 'x..x..x.', s: '....x...', h: 'xxxxxxxx' }, dens: 0.85, seed: 53, g: 0.98 },
    fly_2:         { key: 62, scale: 'major', mscale: 'penta', bpm: 120, prog: [0, 0, 3, 4, 0, 0, 4, 0], lead: 'pluck', bass: 'oompah', bw: 'triangle', drum: { k: 'x...x...', w: 'x.x.xx.x' }, amb: 'rain', dens: 0.8, seed: 67, g: 1.11 },
    fly_3:         { key: 65, scale: 'major', bpm: 124, swing: 0.18, prog: [0, 3, 0, 4, 0, 3, 4, 0], lead: 'reed', bass: 'walk', bw: 'triangle', drum: { k: 'x...x...', s: '..x...x.', h: '.x.x.x.x' }, amb: 'sea', dens: 0.8, seed: 79, g: 1.24 },
    fly_4:         { key: 64, scale: 'minor', bpm: 144, prog: [0, 5, 2, 6, 0, 5, 6, 4], lead: 'chip', bass: 'root', bw: 'sawtooth', drum: { k: 'x.x.x.x.', s: '....x..x', h: 'xxxxxxxx' }, dens: 0.85, seed: 97, g: 0.89 },
    travel_living: { key: 60, scale: 'major', bpm: 84, prog: [0, 3, 4, 0, 5, 3, 4, 0], lead: 'pluck', bass: 'long', bw: 'sine', pad: 1, dens: 0.6, seed: 101, g: 1.6 },
    travel_bed:    { key: 65, scale: 'major', bpm: 66, meter: 6, prog: [0, 3, 0, 4, 0, 3, 4, 0], lead: 'bell', bass: 'long', bw: 'sine', pad: 1, dens: 0.5, seed: 113, g: 1.35 },
    travel_kitchen:{ key: 67, scale: 'major', bpm: 108, swing: 0.12, prog: [0, 4, 0, 4, 3, 0, 4, 0], lead: 'pluck', bass: 'oompah', bw: 'triangle', drum: { k: 'x...x...', w: '..x...x.' }, dens: 0.7, seed: 127, g: 1.17 },
    travel_garden: { key: 62, scale: 'major', bpm: 96, prog: [0, 3, 0, 4, 5, 3, 4, 0], lead: 'flute', bass: 'long', bw: 'sine', arp: 8, birds: 1, drum: { h: '..x...x.' }, dens: 0.6, seed: 139, g: 1.28 },
    travel_school: { key: 64, scale: 'major', bpm: 116, prog: [0, 3, 4, 0, 0, 3, 4, 0], lead: 'bell', bass: 'root', bw: 'triangle', drum: { k: 'x...x...', c: '..x...x.' }, dens: 0.75, seed: 151, g: 0.91 },
    stamp_walk:    { key: 62, scale: 'major', bpm: 100, prog: [0, 4, 3, 0, 5, 3, 4, 0], lead: 'flute', bass: 'walk', bw: 'triangle', drum: { k: 'x...x...', h: '..x...x.' }, birds: 1, amb: 'sea', dens: 0.65, seed: 163, g: 1.2 },
    photo_room:    { key: 67, scale: 'major', bpm: 92, prog: [0, 5, 3, 4, 0, 5, 3, 4], lead: 'pluck', bass: 'long', bw: 'sine', pad: 1, arp: 8, drum: { c: '....x...' }, dens: 0.7, seed: 179, g: 1.5 }
  };
  const FILE = {};      // 場景 → false（確定沒有音樂檔）
  let ac = null, out = null, bus = null, timer = null, cur = null, step = 0, next = 0, audio = null, song = null, noise = null, amb = [];
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function rng(s) { return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; }
  /* ====== 作曲：同一個種子每次寫出一樣的曲子。前四小節是 A 句，後四小節重複 A 句、最後一小節回到主音 ====== */
  function compose(T0, part) {
    const T = part ? Object.assign({}, T0, { seed: T0.seed + 1000, prog: T0.progB || [3, 0, 4, 5, 3, 0, 4, 0].slice(0, T0.prog.length) }) : T0;      // v3：B 段換和弦進行與旋律
    const r = rng(T.seed), sc = SC[T.scale], ms = SC[T.mscale || T.scale], bpb = T.meter || 8, bars = T.prog.length;
    const deg = (d, base) => base + sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
    const pool = []; for (let o = -1; o < 3; o++) for (const s of ms) { const m = T.key + s + 12 * o; if (m >= T.key - 3 && m <= T.key + 17) pool.push(m); }
    pool.sort((a, b) => a - b);
    const chordPc = (b) => [0, 2, 4].map((k) => deg(T.prog[b] + k, T.key) % 12);
    let at = pool.indexOf(pool.reduce((p, m) => (Math.abs(m - (T.key + 7)) < Math.abs(p - (T.key + 7)) ? m : p), pool[0]));
    const near = (pcs) => { let best = at, bd = 99; pool.forEach((m, i) => { if (pcs.includes(m % 12) && Math.abs(i - at) < bd) { bd = Math.abs(i - at); best = i; } }); return best; };
    const barMel = (b, end) => {
      const a = [];
      for (let s = 0; s < bpb; s++) {
        const strong = s % (bpb === 6 ? 3 : 4) === 0;
        if (end && s >= bpb - 2) { a.push(s === bpb - 2 ? null : null); continue; }
        if (end && s === bpb - 4) { at = near([T.key % 12]); a.push(pool[at]); continue; }
        if (strong || r() < T.dens * 0.8) {
          if (strong) at = near(chordPc(b));
          else { const mv = [-2, -1, -1, 1, 1, 2][Math.floor(r() * 6)]; at = Math.max(0, Math.min(pool.length - 1, at + mv)); }
          a.push(pool[at]);
        } else a.push(null);
      }
      return a;
    };
    const A = []; for (let b = 0; b < 4; b++) A.push(barMel(b, false));
    const mel = [];
    for (let b = 0; b < bars; b++) {
      if (b < 4) mel.push(A[b]);
      else if (b === bars - 1) mel.push(barMel(b, true));
      else if (b === 5) { const v = A[1].slice(); for (let s = 1; s < bpb; s += 2) if (v[s] && r() < 0.5) v[s] = null; mel.push(v); }
      else mel.push(A[b - 4]);
    }
    const flat = [].concat(...mel), dur = flat.map((m, i) => { if (!m) return 0; let d = 1; while (d < 4 && !flat[(i + d) % flat.length]) d++; return d; });
    const roots = T.prog.map((d) => deg(d, T.key - 24)), triads = T.prog.map((d) => [0, 2, 4].map((k) => deg(d + k, T.key - 12)));
    return { flat, dur, roots, triads, bpb, bars, len: bpb * bars };
  }
  /* ====== 樂器 ====== */
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d); }
  function osc(c, type, f, t, d, dest, v, a, detune) { const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune; env(g, t, a || 0.01, v, d); o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + 0.05); return o; }
  function voice(c, dest, kind, m, t, d, v) {
    const f = hz(m);
    if (kind === 'chip') { const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(dest); osc(c, 'square', f, t, d * 0.9, lp, v * 0.55, 0.005); }
    else if (kind === 'pluck') { osc(c, 'triangle', f, t, Math.min(d, 0.45) + 0.15, dest, v, 0.004); osc(c, 'sine', f * 2, t, 0.18, dest, v * 0.25, 0.003); }
    else if (kind === 'bell') { osc(c, 'sine', f, t, 1.1, dest, v * 0.9, 0.003); osc(c, 'sine', f * 2, t, 0.6, dest, v * 0.3, 0.003); osc(c, 'sine', f * 3.01, t, 0.25, dest, v * 0.12, 0.002); }
    else if (kind === 'flute') { const o = osc(c, 'sine', f, t, d + 0.1, dest, v, 0.06); osc(c, 'triangle', f, t, d + 0.1, dest, v * 0.18, 0.06); const lf = c.createOscillator(), lg = c.createGain(); lf.frequency.value = 5; lg.gain.value = f * 0.006; lf.connect(lg); lg.connect(o.frequency); lf.start(t + 0.12); lf.stop(t + d + 0.15); }
    else if (kind === 'reed') { const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700; lp.connect(dest); osc(c, 'sawtooth', f, t, d * 0.95, lp, v * 0.5, 0.02); osc(c, 'sawtooth', f, t, d * 0.95, lp, v * 0.3, 0.02, 9); }
    else osc(c, kind, f, t, d, dest, v, 0.01);
  }

  $('sheet').innerHTML = '<div class="big">' + stampImg(s) + '</div><h3>' + (first ? '蓋到「' + s.name + '」章了！' : '這個章已經收下囉') + '</h3>' +
    '<div class="say"><img src="../travel/assets/' + (first ? 'kite_happy' : 'kite_home') + '.png" alt=""><p>' + s.lines.join('<br>') + '</p></div>' +
    (s.rec ? '<div class="rec">' + s.rec + '</div>' : '') +
    '<p class="again">' + (n() < 6 ? '還差 ' + (6 - n()) + ' 個：' + SPOTS.filter((x) => !P.spots[x.id]).map((x) => x.hint).join('、') : '6 個都蓋好了！') + '</p>' +
    '<button class="btn" type="button" id="ovOk">看護照</button>';
  $('ov').hidden = false; if (first) setTimeout(thump, 180);
  $('ovOk').onclick = () => { $('ov').hidden = true; render(); checkDone(); };
}
function checkDone() {
  if (n() < 6 || P.rewarded) return;
  P.complete = true; P.rewarded = true; save(); confetti(); sfx('chime');
  $('sheet').innerHTML = '<img src="assets/pc_passport.jpg" alt="港灣探險護照紀念明信片" style="width:100%;border-radius:8px;border:5px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:rotate(-2deg)"><h3>港灣探險護照集滿了！</h3>' +
    '<div class="say"><img src="../travel/assets/item_umbrella.png" alt=""><p>謝謝你陪我走完一圈！<br>這把雨傘送給你，<br>下雨天也可以帶我去旅行喔～</p></div>' +
    '<p class="again">拿到：護照紀念明信片（在小屋收藏冊「港灣護照」）、小鳶的雨傘（已放進小屋背包）</p><button class="btn" type="button" id="ovOk">好耶！</button>';
  $('ov').hidden = false; $('ovOk').onclick = () => { $('ov').hidden = true; render(); };
}
render(); drawSnd();
$('snd').onclick = (e) => { e.stopPropagation(); sndOn = !sndOn; SND_ICON.save(sndOn); bgmSync(); drawSnd(); };
document.addEventListener('pointerdown', () => { if (sndOn && !BGM.on) bgmSync(); }, { passive: true });      // 手機要先點一下才能出聲
const m = /[?&](?:spot|s)=(\d)/.exec(location.search);
if (m) { scan(+m[1]); history.replaceState(null, '', location.pathname); }
window.__stamp = { P: () => P, scan };
</script>
