<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港灣蓋章散步原型</title>
<style>
/* P3 港灣蓋章散步 原型 v0.7（v0.7：G-50 正式彩色章、存檔失敗提示、中途離開補發集滿、壓印說明改成章已收好；v0.6：先存進度再演出、集滿等最後一章落下、港口札記；工作單 18 港灣護照升級提案 v1，D62，C-89）。只做手機版（D55）。
   v0.5：彩色墨水（每站一色，正式彩色章等 ChatGPT）、章＋稱號、組合稱號、按住蓋章、稀有章（金／彩虹）、夜間章、
   回訪升級（銅→銀→金框）、護照上畫出散步路線、第 7 個祕密章、存成「我的港灣護照」圖片。稱號名稱與機率都是建議，等 Dari */
:root{--paper:#F4EFE6;--card:#FFFDF8;--ink:#3E2B1D;--muted:#8A7565;--teal:#2F7F86;--teal-d:#1F5A5F;--red:#C9473A;--line:#E2D6C6;--gold:#E8B879;
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1D2F36;color:var(--ink);font-family:var(--f)}
#app{max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--paper) linear-gradient(180deg,#DCEFF0 0,#F4EFE6 220px);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:10px}
header img{width:58px;height:58px;object-fit:contain;flex:none;animation:hover 3.2s ease-in-out infinite}
header h1{margin:0;font-size:23px;letter-spacing:.04em}
header p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
@keyframes hover{50%{transform:translateY(-5px) rotate(-3deg)}}
.snd{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--teal-d);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(62,43,29,.18)}
/* 稱號列 */
.titlebar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#2B3A40,#3E5560);color:#FFF4E2;border-radius:16px;padding:9px 12px;border:0;font:inherit;text-align:left;box-shadow:0 4px 10px rgba(30,40,46,.25)}
.titlebar .medal{width:40px;height:40px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2B8,#E8B879 45%,#B9852F);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.titlebar small{display:block;font-size:11px;opacity:.75}
.titlebar b{font-size:17px;letter-spacing:.06em}
.titlebar .cnt{margin-left:auto;font-size:12px;background:rgba(255,244,226,.16);border-radius:999px;padding:3px 9px;white-space:nowrap}
.bar{height:10px;border-radius:999px;background:#E4D8C6;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#E8A33A,#E0662F,#C9473A,#8A5BC2,#2F6DB5,#1E9E9A);border-radius:999px;transition:width .6s}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
/* 護照頁：G-49 底圖＋圓框對位 */
.passport{position:relative;width:100%;aspect-ratio:1080/1350;background:url(assets/passport_page.jpg) center/100% 100%;border-radius:14px;box-shadow:0 6px 18px rgba(62,43,29,.15);overflow:hidden}
.passport.full{animation:glow 1.6s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(232,184,121,.7),0 6px 18px rgba(62,43,29,.15)}}
.passport .ttl{position:absolute;left:0;right:0;top:5%;text-align:center}
.passport .ttl b{display:block;font-size:22px;letter-spacing:.12em;color:#5A3A24}
.passport .ttl span{font-size:13px;color:#8A7565}
.passport svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route path{fill:none;stroke:#B98A5A;stroke-width:.9;stroke-linecap:round;stroke-dasharray:.1 2.4}
.route path.newest{stroke:#C9473A;animation:draw 1.2s ease-out both}
@keyframes draw{from{stroke-dashoffset:40;opacity:0}to{opacity:1}}
.route circle{fill:#B98A5A}
.pcell{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;font:inherit;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#A08A72}
.pcell .q{font-size:30px;font-weight:700;color:#C8B79F;line-height:1}
.pcell small{font-size:10.5px;line-height:1.35;text-align:center;padding:0 10%;margin-top:3px}
.pcell .tag{position:absolute;bottom:-9%;max-width:120%;white-space:nowrap;font-size:10.5px;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pcell .lv{position:absolute;right:-2%;top:-2%;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;color:#5A3A24;background:#E2E2E2;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pcell .lv.l3{background:linear-gradient(135deg,#F7E08A,#D9A93A)}
.pcell .rare{position:absolute;left:-4%;top:-2%;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;color:#fff;background:#C9971C}
.pcell .rare.rainbow{background:linear-gradient(90deg,#E5484D,#F2A33A,#E8D33A,#3EAE5B,#2F6DB5,#8A5BC2)}
.pcell .rare.night{background:#2B3A6B}
.pcell.new .stampv{animation:pslam .55s cubic-bezier(.3,1.6,.6,1) both}
.pcell.new::after{content:'';position:absolute;inset:6%;border-radius:50%;border:3px solid var(--c,#C9473A);opacity:.55;animation:ink .7s ease-out .25s both;pointer-events:none}
.pcell.ring2 .stampv{box-shadow:0 0 0 3px #C9CED3}
.pcell.ring3 .stampv{box-shadow:0 0 0 3px #E2B54A,0 0 10px rgba(226,181,74,.7)}
@keyframes pslam{0%{transform:scale(2.4) rotate(-24deg);opacity:0}55%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
@keyframes ink{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.pcell:not(.done) .q{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7}}
/* v0.7：G-50 正式彩色插畫章（暫用）原色顯示；稀有／夜間的效果放在章外面的光圈，不改圖的顏色（ChatGPT C-92 意見） */
.stampv{display:block;position:relative;width:100%;height:100%;border-radius:50%;transform:rotate(-4deg)}
.stampv img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stampv.gold{box-shadow:0 0 0 3px #E2B54A,0 0 14px 3px rgba(247,215,116,.85)}
.stampv.gold::after{content:'';position:absolute;inset:4%;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,250,220,.75) 48%,transparent 60%);background-size:260% 100%;animation:shine 2.6s linear infinite;mix-blend-mode:screen;pointer-events:none}
.stampv.rainbow{box-shadow:0 0 16px 4px rgba(160,120,255,.55)}
.stampv.rainbow::before{content:'';position:absolute;inset:-5%;border-radius:50%;background:conic-gradient(#E5484D,#F2A33A,#E8D33A,#3EAE5B,#2F9FB5,#2F6DB5,#8A5BC2,#E5484D);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%);animation:spin 6s linear infinite}
.stampv.night{box-shadow:0 0 0 3px #2B3A6B,0 0 12px 2px rgba(80,100,200,.6)}
.stampv.night img{filter:brightness(.82) saturate(.9) hue-rotate(-8deg)}
.stampv.night::after{content:'✦ ✧ ✦';position:absolute;left:0;right:0;top:-12%;text-align:center;font-size:11px;color:#F2C14E;letter-spacing:4px;text-shadow:0 0 4px #FFE9A0}
@keyframes shine{to{background-position:-220% 0}}
@keyframes spin{to{filter:hue-rotate(360deg)}}
/* 祕密章 */
.secret{display:flex;align-items:center;gap:12px;background:#2B3A40;color:#FFF4E2;border-radius:16px;padding:10px 12px}
.secret .sv{width:62px;height:62px;flex:none}
.secret .lock{width:62px;height:62px;flex:none;border-radius:50%;border:2.5px dashed rgba(255,244,226,.45);display:flex;align-items:center;justify-content:center;font-size:24px;color:rgba(255,244,226,.6)}
.secret p{margin:0;font-size:13px;line-height:1.55}
.reward{display:flex;gap:12px;align-items:center;background:#FFF3DA;border:1.5px solid #E8C98A;border-radius:16px;padding:12px}
.reward[hidden]{display:none}
.reward p{margin:0;font-size:13.5px;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:700;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);text-align:center;text-decoration:none}
.btn.light{background:#FFF7EA;color:var(--ink);box-shadow:0 4px 0 #C9A57E}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
summary{font-weight:700;font-size:14px;cursor:pointer}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tools button{font:inherit;font-size:12.5px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.tools button[aria-pressed="true"]{background:#2B3A40;color:#fff}
/* 跳出畫面 */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,30,36,.72);padding:18px}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:400px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:sheetin .35s cubic-bezier(.2,1.3,.5,1) both}
@keyframes sheetin{from{transform:translateY(40px) scale(.94);opacity:0}}
.sheet h3{margin:0;font-size:20px}
.sheet .big{width:150px;height:150px;position:relative}
.sheet .big .stampv{animation:pslam .45s cubic-bezier(.3,1.6,.6,1) both}
.say{display:flex;gap:10px;align-items:flex-end;text-align:left;width:100%}
.say img{width:64px;flex:none;animation:hover 2.4s ease-in-out infinite}
.say p{margin:0;background:#EAF5F4;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15px;line-height:1.6}
.rec{width:100%;font-size:13px;background:#FFF3DA;border-radius:12px;padding:8px 10px;text-align:left}
.again{font-size:12px;color:var(--muted);margin:0}
.gotT{display:flex;flex-direction:column;gap:6px;width:100%}
.gotT div{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#2B3A40,#3E5560);color:#FFF4E2;border-radius:12px;padding:8px 12px;font-size:14px;text-align:left;animation:sheetin .4s cubic-bezier(.2,1.3,.5,1) both}
.gotT div:nth-child(2){animation-delay:.15s}.gotT div:nth-child(3){animation-delay:.3s}
.gotT b{font-size:16px;letter-spacing:.05em}
.gotT i{font-style:normal;font-size:11px;background:#E8B879;color:#3E2B1D;border-radius:999px;padding:1px 7px;margin-left:auto}
/* 按住蓋章 */
.press{position:relative;width:220px;height:230px;touch-action:none;user-select:none;-webkit-user-select:none;border:0;background:none;padding:0;font:inherit}
.press .paperx{position:absolute;left:10px;right:10px;bottom:0;height:120px;border-radius:12px;background:#FFFDF8 repeating-linear-gradient(0deg,transparent 0 19px,rgba(226,214,198,.5) 19px 20px);box-shadow:inset 0 0 0 1px var(--line),0 4px 10px rgba(0,0,0,.08)}
.press .mark{position:absolute;left:50%;bottom:10px;width:110px;height:110px;margin-left:-55px;opacity:0}
.press .handle{position:absolute;left:50%;top:0;width:120px;margin-left:-60px;transition:transform .25s cubic-bezier(.3,1.5,.6,1)}
.press .handle,.press .grip,.press .base,.press .mark,.secret .sv{display:block}
.press .handle .grip{width:44px;height:58px;margin:0 auto;border-radius:22px 22px 8px 8px;background:linear-gradient(90deg,#7A4A2A,#A86B3E 45%,#7A4A2A)}
.press .handle .base{width:120px;height:26px;border-radius:8px;background:linear-gradient(#5A3A24,#3E2B1D);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.press .ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;pointer-events:none}
.press .ring circle{fill:none;stroke:var(--c,#C9473A);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:597;stroke-dashoffset:597}
.press.done .mark{opacity:1;animation:pslam .45s cubic-bezier(.3,1.6,.6,1) both}
.press.done .handle{transform:translateY(-30px)!important;opacity:.0;transition:transform .35s,opacity .35s .1s}
.hold{font-size:16px;font-weight:700;color:var(--ink);margin:0}
.skip{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline}
.tlist{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.tlist button{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font:inherit;font-size:14px}
.tlist button[aria-pressed="true"]{border-color:#2B3A40;background:#2B3A40;color:#FFF4E2}
.tlist button:disabled{opacity:.6;background:var(--paper)}
.tlist small{margin-left:auto;font-size:11px;color:inherit;opacity:.7;text-align:right}
.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.notes h2{margin:0;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.notes h2 button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:var(--teal);color:#fff}
.notes .nt{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5}
.notes .nt span{font-size:22px;line-height:1}
.notes .nt small{display:block;color:var(--muted);font-size:11.5px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.moods button{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.moods button span{font-size:24px}
.moods button[aria-pressed="true"]{border-color:var(--teal);background:#EAF5F4}
.nin{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="../travel/assets/kite_wave.png" alt="">
    <div><h1>港灣蓋章散步</h1><p>走一圈、蓋彩色章、收集小鳶給你的稱號</p></div>
    <button class="snd" id="snd" type="button"></button>
  </header>
  <button class="titlebar" id="titleBar" type="button"></button>
  <div>
    <div class="bar"><i id="prog" style="width:0"></i></div>
    <p class="note" id="progTxt" style="margin-top:6px"></p>
  </div>
  <section class="passport" id="passport">
    <div class="ttl"><b>港灣探險護照</b><span id="count"></span></div>
    <svg class="route" id="route" viewBox="0 0 100 125" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="grid"></div>
  </section>
  <div class="secret" id="secret"></div>
  <section class="notes" id="notes"></section>
  <div class="reward" id="reward" hidden></div>
  <div class="row2">
    <button class="btn" type="button" id="shareBtn">存成護照圖片</button>
    <a class="btn light" href="../travel/" id="toTravel">回小鳶的小屋</a>
  </div>
  <details>
    <summary>測試：模擬掃 QR</summary>
    <div class="tools" id="tools"></div>
    <p class="note" style="margin-top:8px">正式版是在現場掃 QR，網址會帶點的編號（例如 <code>?spot=3</code>）。原型 <span id="ver"></span>：章先用每站不同顏色的墨水，正式彩色插畫章等 ChatGPT（G-50）；稱號名稱、稀有機率、夜間時間、祕密章條件都是建議，等 Dari 決定。蓋章只存在這支手機。</p>
  </details>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<script>
/* BGM-START｜配樂 v3（C-87，Dari 10/13 09:39：主動加強畫面、配樂、動畫）
   每個場景一首不同的曲子：捕魚三場、飛行地圖與四關、去旅行五個房間、蓋章散步、合照館。
   v3：加空間殘響（比較不像電子琴）、每首多一段 B 段（A→B 輪流，不會一直重複同 8 小節）、
       強弱拍力度、海浪／雨聲／蟲鳴環境音，以及共用音效 BGM.sfx（蓋章、叮咚、快門、啵）。
   有音樂檔就播檔案：assets/bgm/<場景>.mp3（例如 assets/bgm/fly_2.mp3）；沒有檔案就用程式即時合成。
   這份是原始檔（shared/bgm.js），各頁面內嵌的是同一份內容。 */
const BGM = (() => {
  const BASE = 'assets/bgm/';
  const ALIAS = { fish: 'fish_noon', fly: 'fly_1', travel: 'travel_living' };
  const SC = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], penta: [0, 2, 4, 7, 9], mixo: [0, 2, 4, 5, 7, 9, 10] };
  /* key：主音（MIDI）；prog：每小節和弦的級數（0＝I）；meter：一小節幾個八分音符；lead／bass／arp／pad：樂器；drum：每小節的鼓點（x＝打）；g：音量校正（離線量過，讓每首差不多大聲） */
  const TR = {
    fish_noon:     { key: 60, scale: 'major', bpm: 108, prog: [0, 4, 5, 3, 0, 4, 3, 4], lead: 'pluck', bass: 'oompah', bw: 'triangle', drum: { k: 'x...x...', s: '....x...', h: '.x.x.x.x' }, amb: 'sea', dens: 0.75, seed: 11, g: 1.21 },
    fish_dusk:     { key: 65, scale: 'major', bpm: 86, prog: [0, 3, 5, 4, 0, 3, 4, 0], lead: 'flute', bass: 'long', bw: 'sine', pad: 1, drum: { h: '..x...x.' }, amb: 'sea', dens: 0.55, seed: 23, g: 1.3 },
    fish_night:    { key: 62, scale: 'dorian', bpm: 72, prog: [0, 0, 3, 3, 0, 0, 6, 4], lead: 'bell', bass: 'long', bw: 'sine', pad: 1, arp: 8, amb: 'night', dens: 0.42, seed: 37, g: 1.35 },
    fly_map:       { key: 55, scale: 'major', bpm: 112, prog: [0, 3, 4, 0, 5, 3, 4, 4], lead: 'chip', bass: 'root', bw: 'triangle', drum: { k: 'x...x...', s: '..x...xx' }, dens: 0.8, seed: 41, g: 1.28 },
    fly_1:         { key: 60, scale: 'major', bpm: 136, prog: [0, 5, 3, 4, 0, 5, 3, 4], lead: 'chip', bass: 'oct', bw: 'triangle', arp: 16, drum: { k: 'x..x..x.', s: '....x...', h: 'xxxxxxxx' }, dens: 0.85, seed: 53, g: 0.98 },
    fly_2:         { key: 62, scale: 'major', mscale: 'penta', bpm: 120, prog: [0, 0, 3, 4, 0, 0, 4, 0], lead: 'pluck', bass: 'oompah', bw: 'triangle', drum: { k: 'x...x...', w: 'x.x.xx.x' }, amb: 'rain', dens: 0.8, seed: 67, g: 1.11 },

    g.fillStyle = v === 'night' ? '#2B3A6B' : s.color; g.font = '700 30px ' + getComputedStyle(document.body).fontFamily;
    const w = g.measureText(s.title).width + 36; g.beginPath(); g.roundRect ? g.roundRect(cx - w / 2, cy + R * 0.92, w, 46, 23) : g.rect(cx - w / 2, cy + R * 0.92, w, 46); g.fill();
    g.fillStyle = '#fff'; g.fillText(s.title, cx, cy + R * 0.92 + 33);
  }
  g.fillStyle = '#8A7565'; g.font = '30px ' + getComputedStyle(document.body).fontFamily; const d = new Date(); g.fillText('基隆・東三東四　' + d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate() + (P.secret ? '　★ 祕密章' : ''), W / 2, H - 40);
  cv.toBlob(async (blob) => {
    const f = new File([blob], '我的港灣護照.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: '我的港灣護照' }); return; } catch (e) {} }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '我的港灣護照.png'; document.body.appendChild(a); a.click(); a.remove();
  }, 'image/png');
}
/* ===== v0.6 留給下次的我（ChatGPT G-50 創意 B）：選一個心情、寫一句下次還想看什麼；只存在這支手機，不用寫也能集滿 ===== */
const MOODS = [['😊', '好開心'], ['🌊', '看海'], ['🍤', '好好吃'], ['🐋', '鯨鯊'], ['☔', '下雨天'], ['😴', '走累了']];
function renderNotes() {
  const L = P.notes || [], last = L[L.length - 1];
  $('notes').innerHTML = '<h2>港口札記<button type="button" id="noteBtn">留一句給下次的我</button></h2>' +
    (L.length ? L.slice(-3).reverse().map((x) => '<div class="nt"><span>' + x.m + '</span><div>' + x.ml + (x.t ? '・下次還想看：' + x.t.replace(/[<>&]/g, '') : '') + '<small>' + x.d + (x === last ? '・最近一筆' : '') + '</small></div></div>').join('') : '<p class="note">走完、要離開的時候，可以留一句話。下次打開護照就會看到上次的你。</p>');
  $('noteBtn').onclick = noteSheet;
}
function noteSheet() {
  let pick = 0;
  $('sheet').innerHTML = '<h3>留給下次的我</h3><p class="again">今天最記得什麼？</p><div class="moods">' + MOODS.map((m, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '"><span>' + m[0] + '</span>' + m[1] + '</button>').join('') + '</div>' +
    '<input class="nin" id="nin" maxlength="20" placeholder="下次還想看＿＿"><p class="again" id="ncnt" style="align-self:flex-end;margin-top:-6px">最多 20 字，可以不寫・0 / 20</p><p class="again" id="nerr" style="color:#C9473A" hidden></p><p class="again">札記保存在這支手機的瀏覽器，換手機就看不到。</p><div class="row2" style="width:100%"><button class="btn light" type="button" id="ovNo">先不要</button><button class="btn" type="button" id="ovOk">留下來</button></div>';
  $('ov').hidden = false;
  $('sheet').querySelectorAll('.moods button').forEach((b) => (b.onclick = () => { pick = +b.dataset.i; $('sheet').querySelectorAll('.moods button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
  $('nin').oninput = () => { $('ncnt').textContent = '最多 20 字，可以不寫・' + [...$('nin').value].length + ' / 20'; };
  $('ovNo').onclick = () => { $('ov').hidden = true; };
  $('ovOk').onclick = () => {
    const d = new Date(), old = P.notes || []; P.notes = old.concat([{ d: d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(), m: MOODS[pick][0], ml: MOODS[pick][1], t: $('nin').value.trim().slice(0, 20) }]).slice(-10);
    if (!save()) { P.notes = old; $('nerr').hidden = false; $('nerr').textContent = '沒有存成功（這個瀏覽器不能存資料），文字還在，等一下再試試'; return; }      // v0.7：存失敗就留在表單，不假裝存好了
    $('ov').hidden = true; renderNotes(); sfx('pop');
  };
}
/* ===== 測試工具 ===== */
function renderTools() {
  $('tools').innerHTML = SPOTS.map((s) => '<button type="button" data-s="' + s.id + '">掃第 ' + s.id + ' 點</button>').join('') +
    ['gold', 'rainbow', 'night'].map((v) => '<button type="button" data-f="' + v + '" aria-pressed="' + (forceVar === v) + '">下次蓋' + VAR_NAME[v] + '</button>').join('') +
    '<button type="button" data-s="day">模擬隔天（可再蓋）</button><button type="button" data-s="all">全部蓋好</button><button type="button" data-s="clear">清除紀錄</button>';
  $('tools').querySelectorAll('button').forEach((b) => (b.onclick = () => {
    if (b.dataset.f) { forceVar = forceVar === b.dataset.f ? '' : b.dataset.f; renderTools(); return; }
    const v = b.dataset.s;
    if (v === 'clear') { P = blank(); save(); render(); return; }
    if (v === 'day') { for (const id in P.days) P.days[id] = P.days[id].map((x) => x === today() ? 'old-' + Math.random() : x); save(); render(); return; }
    if (v === 'all') { SPOTS.forEach((s) => { if (!P.spots[s.id]) { P.spots[s.id] = Date.now(); P.order.push(s.id); P.days[s.id] = [today()]; } }); syncTitles(); save(); render(); checkDone(); return; }
    scan(+v);
  }));
}
/* ===== 配樂與音效（和其他遊戲共用開關） ===== */
let sndOn = SND_ICON.saved;
function bgmSync() { if (sndOn) BGM.play('stamp_walk'); else BGM.stop(); }
function drawSnd() { const b = $('snd'); b.innerHTML = SND_ICON[sndOn ? 'on' : 'off']; b.setAttribute('aria-label', sndOn ? '聲音開著，點一下關掉' : '聲音關著，點一下打開'); }
function sfx(k) { if (sndOn) BGM.sfx(k); }
function confetti() {
  const box = document.createElement('div'), C = SPOTS.map((s) => s.color).concat(['#F4D35E', '#E8B879']); box.className = 'conf';
  for (let i = 0; i < 70; i++) { const e = document.createElement('i'); e.style.left = (i % 2 ? 75 + Math.random() * 25 : Math.random() * 25) + '%'; /* 彩紙集中兩側，中間留給明信片和按鈕 */ e.style.background = C[i % C.length]; e.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); e.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg'); e.style.animationDuration = (1.8 + Math.random() * 1.6) + 's'; e.style.animationDelay = Math.random() * 0.5 + 's'; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}
if (n() === 6 && Object.values(P.var).includes('night')) P.secret = P.secret || Date.now();
syncTitles(); save(); render(); drawSnd();
if (n() === 6 && !P.rewarded) setTimeout(() => { if ($('ov').hidden) checkDone(); }, 400);      // v0.7：第 6 章蓋完卻沒看到集滿就離開，下次打開補發（ChatGPT C-92 意見）
$('titleBar').onclick = openTitles;
$('shareBtn').onclick = sharePassport;
$('snd').onclick = (e) => { e.stopPropagation(); sndOn = !sndOn; SND_ICON.save(sndOn); bgmSync(); drawSnd(); };
document.addEventListener('pointerdown', () => { if (sndOn && !BGM.on) bgmSync(); }, { passive: true });      // 手機要先點一下才能出聲
const m = /[?&](?:spot|s)=(\d)/.exec(location.search);
if (m) { scan(+m[1]); history.replaceState(null, '', location.pathname); }
window.__stamp = { P: () => P, scan, force: (v) => { forceVar = v; }, share: sharePassport };
</script>
