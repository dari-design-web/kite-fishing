<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>港灣蓋章 QR 立牌版面</title>
<style>
/* 港灣蓋章散步 QR 立牌版面 v0.1（工作單 11 v4 第三節第 6 小節）。只是版面檔：A5 直式 6 張，用瀏覽器「列印 → 存成 PDF」即可。
   位置、材質、數量、要不要印都等 Dari（要花錢）。QR 指向線上原型網址，正式版換成 LIFF 網址 */
@page{size:A5 portrait;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E3D8;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color:#3E2B1D}
.bar{position:sticky;top:0;z-index:5;background:#2B3A40;color:#fff;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar button{font:inherit;border:0;border-radius:999px;padding:6px 14px;background:#E8B879;color:#3E2B1D;font-weight:700}
.sheet{width:148mm;height:210mm;margin:12px auto;background:#FFFDF8 radial-gradient(circle at 50% 0,#DCEFF0 0,#FFFDF8 60%);position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.15);page-break-after:always;display:flex;flex-direction:column;align-items:center;padding:12mm 10mm 10mm}
.sheet .no{position:absolute;left:8mm;top:8mm;width:13mm;height:13mm;border-radius:50%;background:#C9473A;color:#fff;font-weight:700;font-size:7mm;display:flex;align-items:center;justify-content:center}
.sheet h1{margin:2mm 0 0;font-size:9mm;letter-spacing:.12em}
.sheet .sub{font-size:4mm;color:#8A7565;margin:1mm 0 0}
.top{display:flex;align-items:center;gap:4mm;margin-top:5mm}
.top .stamp{width:42mm;height:42mm;object-fit:contain;transform:rotate(-8deg)}
.top .kite{width:34mm;height:34mm;object-fit:contain}
.say{margin-top:3mm;background:#EAF5F4;border-radius:5mm;padding:2.5mm 4mm;font-size:4.2mm;line-height:1.5;text-align:center;max-width:110mm}
.qrbox{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2mm}
.qr{width:52mm;height:52mm;padding:3mm;background:#fff;border-radius:3mm;border:1.2mm solid #3E2B1D}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.cta{font-size:7mm;font-weight:700;letter-spacing:.15em;color:#C9473A}
.foot{font-size:3mm;color:#A08A72;margin-top:2mm}
@media print{.bar{display:none}html,body{background:#fff}.sheet{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><span>港灣蓋章 QR 立牌版面（A5 直式 6 張，暫用圖）</span><button type="button" onclick="print()">列印／存成 PDF</button></div>
<div id="pages"></div>
<script src="qrcode.min.js"></script><!-- qrcodejs 1.0.0（MIT，davidshimjs），放在本機不靠外部網路 -->
<script>
const BASE = 'https://dari-design-web.github.io/kite-fishing/stamp/?spot=';
const SPOTS = [
  [1, '小鳶', 'kite', '旅客服務中心入口', '歡迎來到港口！我是小鳶～'],
  [2, '郵輪', 'ship', '看得到郵輪的碼頭邊', '你看你看，大船來了！'],
  [3, '鯨鯊', 'shark', '鯨鯊拍照點', '這裡是我跟鯨鯊好朋友拍照的地方。'],
  [4, '碗筷', 'bowl', '美食區', '肚子咕嚕咕嚕叫了嗎？'],
  [5, '椅子', 'chair', '室內休息區', '坐一下，休息一下下吧。'],
  [6, '小車', 'car', '停車場出口', '下次再來找我玩喔！']
];
const box = document.getElementById('pages');
for (const [n, name, icon, where, line] of SPOTS) {
  const s = document.createElement('section'); s.className = 'sheet';
  s.innerHTML = '<span class="no">' + n + '</span><h1>港灣蓋章散步</h1><p class="sub">第 ' + n + ' 站・' + where + '（位置待現勘）</p>' +
    '<div class="top"><img class="stamp" src="assets/stamp_' + icon + '.png" alt="' + name + '章"><img class="kite" src="../travel/assets/kite_wave.png" alt=""></div>' +
    '<div class="say">' + line + '<br>掃一下，蓋「' + name + '」章！</div>' +
    '<div class="qrbox"><div class="qr" id="qr' + n + '"></div><div class="cta">掃我蓋章</div><div class="foot">集滿 6 個章，拿港灣探險護照紀念明信片和小鳶的雨傘</div></div>';
  box.appendChild(s);
  try { new QRCode(document.getElementById('qr' + n), { text: BASE + n, width: 256, height: 256, colorDark: '#3E2B1D', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { document.getElementById('qr' + n).textContent = BASE + n; }
}
</script>
</body>
</html>
